          const fl = k(1600, 1680, u) * (1 - k(1800, 2600, u)); S.cards[0].flare.alpha = 0.45 * fl;

          const gr = fx.createRadialGradient(c[0], c[1], 0, c[0], c[1], 220); gr.addColorStop(0, 'rgba(255,230,170,' + 0.3 * fl + ')'); gr.addColorStop(1, 'rgba(255,200,120,0)'); fx.fillStyle = gr; fx.fillRect(c[0] - 220, c[1] - 220, 440, 440);

            bk.save(); bk.translate(mc[0], mc[1]); bk.rotate(u * 0.0004);
            for (let i = 0; i < 14; i++) {
              const a0 = i * Math.PI * 2 / 14, gr = bk.createRadialGradient(0, 0, 10, 0, 0, 250);
              gr.addColorStop(0, 'rgba(255,240,200,' + 0.42 * ray + ')'); gr.addColorStop(1, 'rgba(255,220,150,0)');
              bk.fillStyle = gr; bk.beginPath(); bk.moveTo(0, 0); bk.arc(0, 0, 250, a0 - 0.09, a0 + 0.09); bk.closePath(); bk.fill();
            }
            const halo = bk.createRadialGradient(0, 0, 0, 0, 0, 150); halo.addColorStop(0, 'rgba(255,245,220,' + 0.4 * ray + ')'); halo.addColorStop(1, 'rgba(255,230,180,0)');

            const tt = (u - C0) / 1000, fade = 1 - k(C0 + life * 0.7, C0 + life, u), cols = ['#FFD36B', '#FFFFFF', '#6F86FF', '#FF9EC4', '#9FE3FF'];
            for (let i = 0; i < 70; i++) {
              const x0 = 150 + 180 * rnd(i, 71), vx = (rnd(i, 72) - 0.5) * 560, vy = -(560 + 480 * rnd(i, 73));
              const x = x0 + vx * tt + 16 * Math.sin(tt * 7 + i), y = S.top + 24 + vy * tt + 0.5 * 1100 * tt * tt;
              if (i % 4 === 0) { sparkle(x, y, 0.3 + 0.25 * rnd(i, 74), fade); continue; }
              pop.save(); pop.translate(x, y); pop.rotate(tt * (4 + 6 * rnd(i, 75)) + i); pop.scale(1, Math.abs(Math.cos(tt * 9 + i)) + 0.15);

          if (sh > 0 && sh < 1) { const x = lerp(40, 440, io(sh)), y0 = S.top + 8, gr = fx.createLinearGradient(x - 40, 0, x + 40, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); fx.fillStyle = gr; fx.beginPath(); fx.moveTo(x - 30, y0); fx.lineTo(x + 50, y0); fx.lineTo(x + 30, y0 + 64); fx.lineTo(x - 50, y0 + 64); fx.closePath(); fx.fill(); }
          const ring = k(950, 1150, u) * (1 - k(1500, 1750, u));

    //   9 s and fainter), their glow spilling a little past the edge.
    // - Face: two broad soft lights in the card's colour drift slowly under the glass.
    // - Sheen: a wide band led by a sharp line sweeps across the card (1st every 5 s, 2nd and 3rd every 10 s).
    // A row that climbs into the top three floods its card: the whole rim lights up and fades back to the arcs, a bright

      const rimBox = i => { const c = D.CARDS[i]; return [L.CX + 1.2, S.top + L.CARDS_Y + c.y + 1.2, L.CW - 2.4, c.h - 2.4]; };
