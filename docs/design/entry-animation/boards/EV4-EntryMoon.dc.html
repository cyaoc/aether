<script type="text/x-dc" data-dc-script data-props='{"pause":{"editor":"enum","options":["播放","开界","冲天","回旋","车轮","贯日","螺旋","齐斩","滞空","法相","鲤口","贯穿","冲击帧","急停","甩刀","拍刀","炸开","现实世界"],"default":"播放"},"speed":{"editor":"enum","options":["1 倍","0.5 倍","0.25 倍"],"default":"1 倍"},"room":{"editor":"enum","options":["示意画面","浅色房间","深色房间","透明"],"default":"示意画面"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  componentDidMount() {
    if (this.loopFn) return;
    this.loopFn = () => { this.tick(); requestAnimationFrame(this.loopFn); };
    requestAnimationFrame(this.loopFn);
  }

  // Boots Pixi on the board's canvas and re-binds the clock whenever the markup or the props change.
  tick() {
    const canvas = document.getElementById('ev4-gl'), root = document.getElementById('ev4-root');
    if (!canvas || !root || !this.cfg || !window.PIXI) return;
    if (canvas !== this.canvas && !this.booting) { this.booting = true; this.boot(canvas).finally(() => { this.booting = false; }); }
    if (!this.S || this.S.canvas !== canvas) return;
    if (root !== this.root || this.cfg !== this.boundCfg) {
      this.root = root; this.boundCfg = this.cfg;
      for (const a of root.getAnimations()) a.cancel();
      const span = this.cfg.cycle / this.cfg.speed;
      this.master = root.animate([{ outlineColor: 'transparent' }, { outlineColor: 'transparent' }], { duration: span, iterations: Infinity });
      if (this.cfg.pauseAt != null) { this.master.pause(); this.master.currentTime = this.cfg.pauseAt / this.cfg.speed; }
    }
  }

  async boot(canvas) {
    const P = PIXI, F = PIXI.filters;
    this.canvas = canvas;
    if (this.S) { this.S.app.destroy(); this.S = null; }
    const app = new P.Application();
    await app.init({ canvas, width: 1920, height: 1080, backgroundAlpha: 0, antialias: true, preference: 'webgl', resolution: 1 });
    const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
    // The chain (pose-60–79; the level sweep and the corkscrew use one pose each for both beats), the oni (oni-7–10), then the
    // moon, the impact lines, the blood moon and the daylit real world.
    const names = ['d0359dc65ca061d145812c9f4b4b2cbc', '7cd5c16f7733133441f95c55ca3519f9', '24efa26641d9ca79eed553776958f813', 'bfbe367e51733e4a85bf82034251e1e4', 'bfbe367e51733e4a85bf82034251e1e4', 'a438b14796a16ccc43c760e168e9af35', '132fd0fe53b97e720f00cb59768a763a', '2f247fffb727a95a0be1750ed4ef06d8', '78ce776182a4bdb85218278daecbcc49', '9dd3d8b4d2da03a762b2aef2fa7202a9', '9dd3d8b4d2da03a762b2aef2fa7202a9', 'ffa358bb157d5ebaccd23e01a5b8d942', '4a657d141dd4306066775d6798991479', '1cec957b141a0e1d44d54f351c86eb51', '501c27b63ac5b5d19636a682ec92a92a', '9d9c38110d4b9ea9aa7c1be1883f41ec', '9e1972ff430bae6ec1a5e4228b1656e5', '92404073cd999b785f76bc4c6993b6ae', '315be0e37e0edfa9139a6b88b3ae32ec', '02cd0cd746f5d5e37c870805dbfa2684',
      '3974abd25daf1769db78cbedb0cf3b62', '41c2310a98847b77f678a271e9bc9e30', '3f4225e61dfa870a66c51b8e487cb4de', '81a09675202a614673ec19203a1cff4f',
      '38b992f980c338671fb008bf5ccdaefb', '1b89f838e16a1aae41ef0adb6e836e22', '3d7a08e31609fe87cb25219c91012aae', '552189aaefafefb9ecabdea565a88ccf'];
    const imgs = await Promise.all(names.map(n => load('/_blob/' + n)));
    await document.fonts.load('132px "LXGW WenKai"');
    const [oni1Img, oni2Img, oni3Img, oni4Img, moon, impact, moonRed, day] = imgs.slice(20);
    const tex = img => P.Texture.from(img);
    const canvasOf = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d')); return c; };
    const silhouette = (img, color) => tex(canvasOf(img.width, img.height, g => { g.drawImage(img, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, img.width, img.height); }));
    const radial = (stops) => tex(canvasOf(512, 512, g => { const r = g.createRadialGradient(256, 256, 0, 256, 256, 256); for (const [o, c] of stops) r.addColorStop(o, c); g.fillStyle = r; g.fillRect(0, 0, 512, 512); }));

    // The action chain. Every pose is placed by its hips (hip, in its own image's pixels) at the scale s that makes the blade
    // the same length, and may be turned by rot. AT is where the hips sit in the world (the ground is y = 1180, the moon hangs
    // high on the right). The images hold the figure only: the light is drawn here, along the path of the blade tip. He
    // starts on the left facing the moon, bursts up off the ground and climbs the sky left of the moon in four more cuts, all
    // five afterimages strike at once, he hangs at the top and sheathes, then dives through the moon with the oni.
    const keys = ['charge', 'smear1', 'cut1', 'smear2', 'cut2', 'smear3', 'cut3', 'smear4', 'cut4', 'smear5', 'cut5', 'noto', 'iai', 'cutin', 'smear6', 'cut6', 'turn', 'slam', 'fall', 'slamin'];
    // MEASURED: points on the poses and the oni, in their own image pixels.
    const THR = -0.6, DIVE = 0.3;
    const M = {
      charge: { hip: [880, 520], s: 0.66, sole: 993, tsuba: [1145, 550] },
      smear1: { hip: [430, 660], s: 0.78, tip: [1078, 43], mouth: [343, 685] },
      cut1: { hip: [450, 720], s: 0.8, tip: [1086, 28] },
      smear2: { hip: [640, 420], s: 0.654, tip: [1574, 250], ring: [640, 250, 934, 62] },
      cut2: { hip: [640, 420], s: 0.654, tip: [1574, 250] },
      smear3: { hip: [720, 870], s: 0.92, tip: [760, 30], ring: [730, 600, 570] },
      cut3: { hip: [420, 400], s: 0.855, tip: [996, 778] },
      smear4: { hip: [600, 540], s: 0.694, rot: THR, tip: [1409, 395] },
      cut4: { hip: [640, 450], s: 0.705, rot: THR, tip: [1597, 390] },
      smear5: { hip: [545, 740], s: 0.737, tip: [946, 28], helix: [500, 330, 740, 110, 3] },
      cut5: { hip: [545, 740], s: 0.737, tip: [946, 28] },
      noto: { hip: [820, 560], s: 0.7, tsuba: [1122, 465], mouth: [790, 462] },
      iai: { hip: [770, 520], s: 0.7, tsuba: [1115, 450], mouth: [1040, 455] },
      cutin: { hip: [0, 0], s: 1, glint: [[740, 565], [860, 565]] },
      smear6: { hip: [600, 500], s: 0.787, rot: 0.45 },
      cut6: { hip: [520, 480], s: 0.648, tip: [1392, 536], boot: [1290, 740] },
      turn: { hip: [560, 470], s: 0.71, tip: [1424, 416] },
      slam: { hip: [620, 620], s: 0.7, mouth: [740, 592] },
      fall: { hip: [590, 620], s: 0.62 },
      slamin: { hip: [0, 0], s: 1, tsuba: [875, 530] },
      oni1: { tsuba: [1135, 445], horn: [1150, 10], head: [1040, 190], bottom: 1016 },
      oni2: { tip: [1783, 91] },
      oni3: { tip: [1496, 543], head: [462, 160] },
      oni4: { head: [740, 185] }
    };
    const PO = {};
    keys.forEach((key, i) => { PO[key] = { img: imgs[i], tex: tex(imgs[i]), hip: M[key].hip, s: M[key].s, rot: M[key].rot || 0 }; });
    const GROUND = 1180, onGround = (key, x) => [x, GROUND - (M[key].sole - M[key].hip[1]) * M[key].s];
    const SKY = 2, MR = 192, MOON_R = MR * SKY, MC = [1006, 292], MOON = [2000, -280];
    // The moon cut's line runs through the moon's centre, from the hover at the upper left to the exit at the lower right.
    const U6 = [Math.cos(DIVE), Math.sin(DIVE)], N6 = [U6[1], -U6[0]], ANG6 = Math.atan2(U6[1], U6[0]);
    const onCut = d => [MOON[0] + U6[0] * d, MOON[1] + U6[1] * d];
    const AT = { charge: onGround('charge', 720), cut1: [770, 640], cut2: [860, 470], cut3: [800, -20], cut4: [860, -240], cut5: [860, -480], noto: [840, -605], iai: [840, -605] };
    const W = (key, q, hip = AT[key]) => { const p = PO[key], x = (q[0] - p.hip[0]) * p.s, y = (q[1] - p.hip[1]) * p.s, c = Math.cos(p.rot), n = Math.sin(p.rot); return [hip[0] + x * c - y * n, hip[1] + x * n + y * c]; };
    const onto = (key, q, tip) => { const a = W(key, q, [0, 0]); return [tip[0] - a[0], tip[1] - a[1]]; };
    // A mid-cut pose and the pose that finishes its cut share the blade tip, except the wheel and the gathered thrust, whose
    // blades are elsewhere: those two are placed by hand.
    const [TIP1, TIP2, TIP3, TIP4, TIP5] = [1, 2, 3, 4, 5].map(i => { const tip = W('cut' + i, M['cut' + i].tip); AT['smear' + i] = onto('smear' + i, M['smear' + i].tip, tip); return tip; });
    Object.assign(AT, { smear3: [800, 40], smear4: [860, -60] });
    // He leaves the moon with his blade tip on the moon cut.
    const T6 = onCut(MOON_R + 800); AT.cut6 = onto('cut6', M.cut6.tip, T6);
    // He stays where the dash ended: the flick, the slam and the fall all start from there.
    Object.assign(AT, { turn: [AT.cut6[0] + 10, AT.cut6[1] + 10], slam: [AT.cut6[0] + 10, AT.cut6[1] - 20], fall: [AT.cut6[0] + 40, AT.cut6[1] - 20] });
    const MOUTH0 = W('iai', M.iai.mouth), TIP8 = W('turn', M.turn.tip);
    const ringOf = (key, [cx, cy, a, b], from, to, n = 70) => Array.from({ length: n + 1 }, (_, i) => { const th = from + (to - from) * i / n; return { p: W(key, [cx + a * Math.cos(th), cy + (b ?? a) * Math.sin(th)]), th }; });
    // Catmull-Rom through the measured points, about every 10 px; seg says which span each point came from.
    const spline = pts => {
      const out = [], seg = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
        const n = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 10));
        for (let j = 0; j < n; j++) { const t = j / n, t2 = t * t, t3 = t2 * t; out.push([0, 1].map(d => 0.5 * (2 * p1[d] + (p2[d] - p0[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (3 * p1[d] - p0[d] - 3 * p2[d] + p3[d]) * t3))); seg.push(i); }
      }
      out.push(pts[pts.length - 1]); seg.push(pts.length - 2); return { pts: out, seg };
    };
    // A polyline walked by arc length: at(u) gives the point, the normal and whether that stretch passes behind the hero.
    const pathOf = (pts, back) => {
      if (pts.length < 2) pts = [[960, 540], [961, 540]];
      const n = pts.length, L = [0], N = [];
      for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      for (let i = 0; i < n; i++) { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1; N.push([-dy / m, dx / m]); }
      const tot = L[n - 1];
      const at = u => {
        const s = Math.min(1, Math.max(0, u)) * tot; let lo = 0, hi = n - 1;
        while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (L[mid] <= s) lo = mid; else hi = mid; }
        const f = (s - L[lo]) / ((L[hi] - L[lo]) || 1), p = pts[lo], q = pts[hi];
        return [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f, N[lo][0] + (N[hi][0] - N[lo][0]) * f, N[lo][1] + (N[hi][1] - N[lo][1]) * f, back ? back[lo] : false];
      };
      return { pts, at };
    };
    const slashPath = (pts, behind = []) => { const s = spline(pts); return pathOf(s.pts, s.seg.map(i => behind.includes(i))); };
    const at = (key, list) => list.map(q => W(key, q));

    // 1 the rising draw, out of the scabbard mouth, forward and then steeply up. 2 the level ring, whose far half passes behind
    // him. 3 the wheel: the blade goes straight on down from the ring, right round him and over to the lower right. 4 the
    // straight thrust out of the gathered stance. 5 the corkscrew, which starts at the thrust's tip and winds up round his
    // body. 6 and 7 the moon cut, his and the oni's, along the dive. 8 the flick. 9 the thin line as the blade drops from the
    // top of the climb to his hip for the sheathing.
    const ring2 = ringOf('smear2', M.smear2.ring, 0, 2 * Math.PI), ring3 = ringOf('smear3', M.smear3.ring, 0.2, 6.98);
    const [hx0, ha, hy0, hy1, turns] = M.smear5.helix;
    const helix = Array.from({ length: 121 }, (_, i) => { const f = i / 120, th = f * turns * 2 * Math.PI; return { p: W('smear5', [hx0 + ha * (0.7 + 0.3 * f) * Math.cos(th), hy0 + (hy1 - hy0) * f]), back: Math.sin(th) < 0 }; });
    const M1 = W('smear1', M.smear1.mouth);
    const blades = [
      slashPath([M1, [M1[0] + 270, M1[1] + 24], [TIP1[0] - 60, TIP1[1] + 330], TIP1]),
      pathOf([...ring2.map(q => q.p), TIP2], [...ring2.map(q => Math.sin(q.th) < 0), false]),
      pathOf([...ring3.map(q => q.p), TIP3], [...ring3.map(q => q.th > 1.6 && q.th < 5), false]),
      slashPath([W('smear4', M.smear4.tip), TIP4]),
      pathOf([TIP4, ...helix.map(q => q.p), TIP5], [false, ...helix.map(q => q.back), false]),
      slashPath([MOUTH0, onCut(-MOON_R - 260), onCut(-MOON_R), MOON, onCut(MOON_R), T6])
    ];

    // The cuts a straight blade leaves are straight: each is the chord of the stretch of its slash still lit on the frame
    // it lands (from the slash's tail to the blade tip), run right across the sky.
    const C0 = [960, 540], RR = 6000;
    const reach = (p, q) => { const d = [p[0] - q[0], p[1] - q[1]], m = Math.hypot(d[0], d[1]), u = [d[0] / m, d[1] / m], w = [p[0] - C0[0], p[1] - C0[1]], b = w[0] * u[0] + w[1] * u[1], t = -b + Math.sqrt(b * b - (w[0] * w[0] + w[1] * w[1] - RR * RR)); return [p[0] + u[0] * t, p[1] + u[1] * t]; };
    const inside = (poly, x, y) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], b = poly[j]; if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; };
    const TAILS = [0.45, 0.76, 0.6, 0.2, 0.86, 0.5];
    const chordOf = (Pth, u0) => { const a = Pth.at(u0), b = Pth.at(1); return [reach([a[0], a[1]], [b[0], b[1]]), reach([b[0], b[1]], [a[0], a[1]])]; };
    const scars = [0, 1, 2, 3, 4].map(i => chordOf(blades[i], TAILS[i]));
    scars.push([reach(onCut(-100), onCut(100)), reach(onCut(100), onCut(-100))]);

    // The oni mirrors the hero about twice as large. In the stance its hands are on his. Its dash runs along the moon cut,
    // its tip beyond his, and it stops past the moon with the hero in front of it; it slams the sword home where it stopped.
    const SO = 1.26;
    const rotv = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a)];
    const OTIP = onCut(MOON_R + 960), ROT_O = 0.5;
    const ONI = {
      oni1: { img: oni1Img, anchor: M.oni1.tsuba, at: W('iai', M.iai.tsuba), rot: 0 },
      oni2: { img: oni2Img, anchor: M.oni2.tip, at: OTIP, rot: ROT_O },
      oni3: { img: oni3Img, anchor: M.oni3.tip, at: OTIP, rot: 0 }
    };
    const OW = (o, q) => { const v = rotv([(q[0] - o.anchor[0]) * SO, (q[1] - o.anchor[1]) * SO], o.rot); return [o.at[0] + v[0], o.at[1] + v[1]]; };
    ONI.oni4 = { img: oni4Img, anchor: M.oni4.head, at: [AT.slam[0] - 340, AT.slam[1] - 470], rot: 0 };
    for (const o of Object.values(ONI)) o.tex = tex(o.img);
    blades.push(slashPath([[MOUTH0[0] + N6[0] * 300, MOUTH0[1] + N6[1] * 300], (d => [d[0] + N6[0] * 140, d[1] + N6[1] * 140])(onCut(-MOON_R - 320)), (d => [d[0] + N6[0] * 50, d[1] + N6[1] * 50])(onCut(-MOON_R)), MOON, onCut(MOON_R + 300), OTIP]));
    blades.push(slashPath([T6, [T6[0] + 40, T6[1] - 150], TIP8]));
    blades.push(slashPath([TIP5, [TIP5[0] - 30, TIP5[1] + 240], W('noto', M.noto.tsuba)]));
    // The afterimages strike together from where they hang: the impact lines burst from their middle.
    const SC = [860, 40];

    // The six cuts run right across the sky, so it breaks along the very lines the viewer saw land. Each cell is a big
    // disc clipped by one side of each line; every cell the wide shot can see is kept, however thin.
    const clipHalf = (poly, [a, b], sgn) => {
      const side = p => sgn * ((b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0])), out = [];
      for (let i = 0; i < poly.length; i++) {
        const p = poly[i], q = poly[(i + 1) % poly.length], sp = side(p), sq = side(q);
        if (sp >= 0) out.push(p);
        if ((sp >= 0) !== (sq >= 0)) { const t = sp / (sp - sq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); }
      }
      return out;
    };
    const disc = Array.from({ length: 96 }, (_, i) => [C0[0] + RR * Math.cos(i / 96 * 2 * Math.PI), C0[1] + RR * Math.sin(i / 96 * 2 * Math.PI)]);
    const VIEW = [-800, -1500, 3700, 1500];
    const cells = [];
    for (let m = 0; m < 1 << scars.length; m++) {
      let poly = disc;
      scars.forEach((line, i) => { if (poly.length >= 3) poly = clipHalf(poly, line, m >> i & 1 ? 1 : -1); });
      if (poly.length < 3) continue;
      const xs = poly.map(q => q[0]), ys = poly.map(q => q[1]);
      if (Math.max(...xs) < VIEW[0] || Math.min(...xs) > VIEW[2] || Math.max(...ys) < VIEW[1] || Math.min(...ys) > VIEW[3]) continue;
      let n = 0, cx = 0, cy = 0;
      for (let x = VIEW[0]; x <= VIEW[2]; x += 25) for (let y = VIEW[1]; y <= VIEW[3]; y += 25) if (inside(poly, x, y)) { n++; cx += x; cy += y; }
      cells.push({ poly, n, c: n ? [cx / n, cy / n] : poly.reduce((a, q) => [a[0] + q[0] / poly.length, a[1] + q[1] / poly.length], [0, 0]) });
    }

    // The sky is the moonlit night, scaled so the moon sits at MOON, high on the right. The moon is lifted out into two
    // halves split along the moon cut (the sky under it is painted dark), so the halves can part. The sky is padded for
    // the wide shots and swings: to the left by tiling its moonless left strip, to the right by a mirror
    // (the mirrored moon stays outside the pad), above and below by its edge strips flipped and stretched.
    const PADL = 2100, PADR = 300, PADV = 340, STRIP = 620, OV = 200;
    const noMoon = (img, rgb) => canvasOf(img.width, img.height, g => {
      g.drawImage(img, 0, 0);
      const r = g.createRadialGradient(MC[0], MC[1], 0, MC[0], MC[1], MR + 44); r.addColorStop(0, 'rgba(' + rgb + ',1)'); r.addColorStop((MR + 8) / (MR + 44), 'rgba(' + rgb + ',1)'); r.addColorStop(1, 'rgba(' + rgb + ',0)');
      g.fillStyle = r; g.fillRect(MC[0] - MR - 44, MC[1] - MR - 44, 2 * MR + 88, 2 * MR + 88);
    });

    for (const c of [g, gb]) c.globalCompositeOperation = 'source-over';
  }

  renderVals() {
    const room = this.props.room ?? '示意画面';
    const pause = this.props.pause ?? '播放';
    const speed = { '1 倍': 1, '0.5 倍': 0.5, '0.25 倍': 0.25 }[this.props.speed ?? '1 倍'];
    const pauseAt = { '播放': null, '开界': 1100, '冲天': 1540, '回旋': 1820, '车轮': 2030, '贯日': 2190, '螺旋': 2330, '齐斩': 2610, '滞空': 2900, '法相': 3540, '鲤口': 3790, '贯穿': 4080, '冲击帧': 4160, '急停': 4500, '甩刀': 5140, '拍刀': 5400, '炸开': 5700, '现实世界': 7000 }[pause];
    this.cfg = { cycle: 10000, speed, pauseAt };
    return {
      bg: room === '透明' ? 'transparent' : room === '浅色房间' ? '#B9A27F' : room === '深色房间' ? '#0C0D10' : '#2C3644',
      mock: room !== '透明',
      mockBg: room === '浅色房间' ? 'linear-gradient(180deg, #F4EFE7 0%, #EAE2D5 56%, #CDB89A 57%, #B9A27F 100%)' : room === '深色房间' ? 'linear-gradient(180deg, #16181D 0%, #23262E 56%, #121317 57%, #0C0D10 100%)' : 'linear-gradient(180deg, #3D4C66 0%, #536585 56%, #3A4658 57%, #2C3644 100%)',
      mockBox: room === '浅色房间' ? '#D9CCB8' : room === '深色房间' ? '#2F333C' : '#63769A',
      mockInk: room === '浅色房间' ? 'rgba(60, 40, 20, 0.55)' : 'rgba(255, 255, 255, 0.55)'
    };
  }
}
</script>
</body>
</html>
