  // Boots Pixi on the board's canvas and re-binds the clock whenever the markup or the props change.

    const tex = img => P.Texture.from(img);

    dim.anchor.set(0.5); dim.position.set(960, 540); dim.width = 3000; dim.height = 2000; world.addChild(dim);

    const red = new P.Container(); red.pivot.set(960, 540); red.position.set(960, 540);

    const redShade = new P.Sprite(shadeTex); redShade.anchor.set(0.5); redShade.position.set(960, 540); redShade.width = 2600; redShade.height = 1700; red.addChild(redShade);

    const fxTex = tex(fx), fxSprite = new P.Sprite(fxTex); fxSprite.blendMode = 'add'; world.addChild(fxSprite);

    const nameG = new P.Container(); nameG.position.set(1010, 700); nameG.rotation = -0.12; ui.addChild(nameG);
    const nameStyle = { fontFamily: 'Noto Serif SC', fontWeight: '900', fontSize: 132, fill: 0xffffff, letterSpacing: 26 };
    const nameGhosts = [0, 1].map(() => { const t = new P.Text({ text: '柚子不酸', style: { ...nameStyle, fill: 0xff4d5e } }); t.anchor.set(0, 0.5); nameG.addChild(t); return t; });

    const lv = new P.Text({ text: 'LV.30', style: { fontFamily: 'Barlow Condensed', fontWeight: '500', fontSize: 40, fill: 0xff5a68, letterSpacing: 6 } });

  frame() {

    const shakeAt = (t0, amp, dur) => { const p = k(t0, t0 + dur, t); if (p <= 0 || p >= 1) return; const a = amp * (1 - p) * (1 - p); sx += Math.sin(t * 0.21) * a; sy += Math.cos(t * 0.17) * a * 0.6; };
    shakeAt(1950, 8, 140); shakeAt(HS1, 30, 520); shakeAt(SPLIT + 120, 5, 160);
    for (const c of [S.world, S.ui]) { c.scale.set(cam); c.rotation = rot; c.position.set(960 + sx, 540 + sy); }

    // Strike effects.
    S.flash.alpha = t >= 2034 && t < 2080 ? 0.85 : 0;
    const impA = t >= HS0 && t < 2120, impB = t >= 2120 && t < 2160;
    S.imp.visible = impA || impB;
    if (S.imp.visible) {
      S.impBg.tint = impA ? 0xffffff : 0x000000;
      S.impLines.tint = impA ? 0x000000 : 0xffffff; S.impLines.position.set(S.H[0], S.H[1]);
      const [h4, p4] = S.fit[3];
      for (const s of [S.silB, S.silW]) { s.height = h4; s.scale.x = s.scale.y; s.position.set(420 + 48 - p4 * s.width, 1080); }
      S.silB.visible = impA; S.silW.visible = impB;
    }
    const released = t >= HS1, sw = released && l < HS0 + 520;
    S.shock.time = (l - HS0) / 1000; S.shock.amplitude = 46 * (1 - k(HS0, HS0 + 520, l));
    S.zoom.strength = 0.15 * (1 - out(k(HS0, HS0 + 300, l)));
    const rs = 11 * (1 - out(k(HS0, HS0 + 480, l)));
    S.rgb.red = { x: -rs, y: 0 }; S.rgb.blue = { x: rs, y: 0 };
    const filters = [S.bloom];
    if (sw) filters.push(S.shock);
    if (released && S.zoom.strength > 0.005) filters.push(S.zoom);
    if (released && rs > 0.5) filters.push(S.rgb);
    S.world.filters = S.imp.visible ? null : filters;

    // Name: cut out along the slash, with red afterimages, then the thin rule and the level label.
    const reveal = out(k(2380, 2640, l));
    const nw = S.nameT.width + 40;
    S.nameMask.clear().rect(-20, -120, nw * reveal, 240).fill(0xffffff);
    S.nameGhosts.forEach((g, i) => { g.position.set(36 * (i + 1), -8 * (i + 1)); g.alpha = (i ? 0.22 : 0.45) * k(2380, 2430, l) * (1 - k(2560, 2950, l)); });
    const rw = (nw - 20) * out(k(2520, 2860, l));
    S.rule.clear().rect(0, -98, rw, 2).fill({ color: 0xffffff, alpha: 0.85 }).rect(0, -104, 22 * k(2520, 2620, l), 14).fill(0xff3b4e);
    S.tag.alpha = S.lv.alpha = out(k(2640, 2920, l));
    S.nameG.alpha = 1 - k(EXIT, END - 120, l);
    S.nameG.position.set(1010 + 80 * inq(k(EXIT, END, l)), 700);

    // Entry caption: a rule slides out from the hero's feet, the name wipes in on it; the strike's wind sweeps it off.
    const cr = quint(k(420, 720, l)), cw = 420 * cr, gone = k(1950, 2060, l);
    S.capRule.clear().rect(0, 0, cw, 2).fill({ color: 0xffffff, alpha: 0.85 }).rect(0, -6, 14 * cr, 14).fill(0xff3b4e);
    S.capMask.clear().rect(20, -90, 400 * out(k(560, 860, l)), 100).fill(0xffffff);
    S.capLv.alpha = S.capLvN.alpha = out(k(760, 1000, l));
    S.cap.alpha = (l >= 420 ? 1 : 0) * (1 - gone); S.cap.position.set(600 + 260 * gone * gone, 900 - 30 * gone);

    this.drawFx(t, l, k, out, inq);
    S.fxTex.source.update();
  }

  // The straight cut hangs in the sky behind the hero; when the sky gives way each piece carries a lit edge and the seam flares.
  drawSeam(l, k, out, cut) {
    const S = this.S, g = S.seamC.getContext('2d');
    g.clearRect(0, 0, 1920, 1080);
    if (l >= 2080 && l < 3950) {
      g.globalCompositeOperation = 'lighter'; g.lineCap = 'round'; g.lineJoin = 'round';
      const path = (pts, dx, dy, rot) => { const c = Math.cos(rot), s = Math.sin(rot), [hx, hy] = S.H; g.beginPath(); pts.forEach((p, i) => { const x = p[0] - hx, y = p[1] - hy, X = hx + x * c - y * s + dx, Y = hy + x * s + y * c + dy; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); };
      const stroke = (w, color) => { g.lineWidth = w; g.strokeStyle = color; g.stroke(); };
      const open = out(k(3000, 3260, l)), a = k(2080, 2200, l) * (1 - k(3450, 3950, l)), flick = 0.8 + 0.2 * Math.sin(l * 0.045);
      path(S.cutLine, cut.drift, 0, 0);
      stroke(12 + 40 * open, 'rgba(255,40,70,' + 0.2 * a * flick + ')');
      stroke(3 + 10 * open, 'rgba(255,150,160,' + 0.6 * a + ')');
      stroke(1.4 + 3 * open, 'rgba(255,255,255,' + a * (1 - 0.6 * open) + ')');
      if (l >= 3000) for (const [d, r] of [[cut.up, cut.upRot], [cut.dn, cut.dnRot]]) {
        path(S.cutLine, d[0] + cut.drift, d[1], r);
        stroke(10, 'rgba(255,60,80,' + 0.35 * cut.fade * open + ')');
        stroke(2, 'rgba(255,235,235,' + 0.9 * cut.fade * open + ')');
      }
      g.globalCompositeOperation = 'source-over';
    }
    S.seamTex.source.update();
  }

  // Slash ribbon, charge particles, sparks and embers, drawn additively each frame.
  drawFx(t, l, k, out, inq) {
    const S = this.S, g = S.fx.getContext('2d');
    g.clearRect(0, 0, 1920, 1080);
    g.globalCompositeOperation = 'lighter';
    const rnd = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
    const Q = u => S.slash.at(u).slice(0, 2), D = u => S.slash.at(u).slice(2, 4);
    const band = (u0, u1, w, inner, rgb, alpha, P = S.slash) => {
      if (u1 - u0 < 0.002) return;
      const N = 70;
      let prev = null;
      for (let i = 0; i <= N; i++) {
        const f = i / N, u = u0 + (u1 - u0) * f, r = P.at(u), p = r, nm = [r[2], r[3]];
        const ww = w * Math.pow(Math.sin(Math.PI * Math.min(1, f * 1.08)), 0.5) * (0.25 + 0.75 * f);
        const o = [p[0] - nm[0] * ww, p[1] - nm[1] * ww], q = [p[0] + nm[0] * ww * inner, p[1] + nm[1] * ww * inner];
        if (prev) {
          g.fillStyle = 'rgba(' + rgb + ',' + (alpha * Math.pow(f, 0.9)) + ')';
          g.beginPath(); g.moveTo(prev[0][0], prev[0][1]); g.lineTo(o[0], o[1]); g.lineTo(q[0], q[1]); g.lineTo(prev[1][0], prev[1][1]); g.closePath(); g.fill();
        }
        prev = [o, q];
      }
    };
    const arcLine = (u0, u1, off, width, color) => {
      if (u1 - u0 < 0.002) return;
      g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round'; g.beginPath();
      for (let i = 0; i <= 40; i++) { const u = u0 + (u1 - u0) * i / 40, p = Q(u), nm = D(u); i ? g.lineTo(p[0] - nm[0] * off, p[1] - nm[1] * off) : g.moveTo(p[0] - nm[0] * off, p[1] - nm[1] * off); }
      g.stroke();
    };

    // Charge: sparks are pulled into the hilt while the hero holds the stance.
    const hilt = [660, 735];
    if (l > 650 && l < 1960) {
      g.lineCap = 'round';
      for (let i = 0; i < 110; i++) {
        const s0 = 650 + rnd(i, 1) * 1150, dur = 380 + rnd(i, 2) * 260, p = (l - s0) / dur;
        if (p < 0 || p > 1) continue;
        const ang = rnd(i, 3) * Math.PI * 2, r0 = 360 + rnd(i, 4) * 420, r = r0 * (1 - p * p), r2 = r0 * (1 - Math.max(0, p - 0.12) ** 2);
        g.strokeStyle = i % 3 ? 'rgba(255,120,130,' + (0.9 * Math.sin(p * Math.PI)) + ')' : 'rgba(255,255,255,' + Math.sin(p * Math.PI) + ')';
        g.lineWidth = 1.5 + rnd(i, 5) * 2;
        g.beginPath(); g.moveTo(hilt[0] + Math.cos(ang) * r, hilt[1] + Math.sin(ang) * r); g.lineTo(hilt[0] + Math.cos(ang) * r2, hilt[1] + Math.sin(ang) * r2); g.stroke();
      }
      // A glint runs up the scabbard just before the draw.
      const gl = k(1780, 1940, l);
      if (gl > 0) {
        const a = Math.sin(gl * Math.PI);
        g.strokeStyle = 'rgba(255,255,255,' + a + ')'; g.lineWidth = 3;
        g.beginPath(); g.moveTo(hilt[0] - 60, hilt[1]); g.lineTo(hilt[0] + 60, hilt[1]); g.moveTo(hilt[0], hilt[1] - 120 * a); g.lineTo(hilt[0], hilt[1] + 120 * a); g.stroke();
      }
    }

    // The slash: a sharp crescent sweeps out, holds bright through the hit stop, then frays into strands.
    if (l >= 1960 && l < 2700) {
      const head = out(k(1960, 2060, l)), tail = 0.12 * out(k(2000, 2120, l)), fray = k(2080, 2600, l);
      const w = 78 * (1 - 0.55 * fray), a = 1 - fray;
      band(tail, head, w * 2.6, 0.25, '255,30,60', 0.16 * a);
      band(tail, head, w, 0.08, '255,58,80', 0.8 * a);
      band(tail, head, w * 0.34, 0.03, '255,240,240', a);
      for (let s = 0; s < 7; s++) {
        const off = 10 + s * w * 0.12, len = 0.55 + rnd(s, 21) * 0.4;
        arcLine(Math.max(tail, head - len), head - rnd(s, 22) * 0.08, off, 1 + (s % 2), 'rgba(255,' + (200 - s * 18) + ',' + (210 - s * 18) + ',' + (0.55 * a) + ')');
      }
      const head2 = out(k(1985, 2085, l));
      arcLine(Math.max(tail, head2 - 0.7), head2, w * 1.35, 2, 'rgba(255,255,255,' + 0.8 * a + ')');
      if (fray > 0) {
        for (let s = 0; s < 9; s++) {
          const off = (s / 8 - 0.3) * 90 + fray * 50 * (s - 3), u0 = 0.08 + fray * (0.2 + rnd(s, 7) * 0.5), u1 = 1 - fray * (0.1 + rnd(s, 8) * 0.6);
          if (u1 > u0) arcLine(u0, u1, off, 1 + rnd(s, 9) * 1.6, 'rgba(255,' + (120 + s * 12) + ',140,' + (0.6 * (1 - fray)) + ')');
        }
      }
    }
    // The zanshin flick: the blade swings down from the raised follow-through into the closing stance, leaving a thin
    // crescent that fades at once.
    if (l >= 2700 && l < 2960) {
      const head = out(k(2700, 2760, l)), tail = out(k(2720, 2860, l)), a = 0.7 * (1 - k(2780, 2960, l));
      band(tail, head, 26 * 2.6, 0.25, '255,30,60', 0.16 * a, S.flick);
      band(tail, head, 26, 0.08, '255,58,80', 0.8 * a, S.flick);
      band(tail, head, 26 * 0.34, 0.03, '255,240,240', a, S.flick);
    }
    // Then a short glint on the blade right before the sky gives way.
    const fl = k(2930, 3130, l);
    if (fl > 0 && fl < 1) {
      const a = Math.sin(fl * Math.PI), [gx, gy] = [612, 922];
      g.strokeStyle = 'rgba(255,255,255,' + a + ')'; g.lineWidth = 2.5; g.lineCap = 'round';
      g.beginPath(); g.moveTo(gx - 90 * a, gy); g.lineTo(gx + 90 * a, gy); g.moveTo(gx, gy - 50 * a); g.lineTo(gx, gy + 50 * a); g.stroke();
    }
    // Embers peel off both lips of the seam as it opens.
    if (l >= 3000 && l < 4300) {
      const e = l - 3000;
      for (let i = 0; i < 130; i++) {
        const t0 = rnd(i, 30) * 520, life = 600 + rnd(i, 31) * 700, q = (e - t0) / life;
        if (q <= 0 || q >= 1) continue;
        const [x0, y0, nx, ny] = S.seamPath.at(rnd(i, 32)), side = i % 2 ? 1 : -1, v = 30 + rnd(i, 33) * 110;
        const px = x0 + (nx * v * 1.4 + ny * 50) * side * q, py = y0 + (ny * v * 1.4 - nx * 50) * side * q - 40 * q;
        g.fillStyle = 'rgba(255,' + (120 + (i % 3) * 50) + ',125,' + Math.sin(q * Math.PI) * 0.9 + ')';
        g.beginPath(); g.arc(px, py, 1.2 + rnd(i, 34) * 2.2, 0, Math.PI * 2); g.fill();
      }
    }
    // Sparks thrown off the hit, mostly across the cut.
    const sp = l - 2080;
    if (sp > 0 && sp < 1000) {
      g.lineCap = 'round';
      for (let i = 0; i < 160; i++) {
        const life = 420 + rnd(i, 10) * 560; if (sp > life) continue;
        const along = rnd(i, 11), p0 = Q(0.2 + along * 0.7), nm = D(0.2 + along * 0.7), side = rnd(i, 12) < 0.5 ? -1 : 1;
        const v = 300 + rnd(i, 13) * 1300, s = sp / 1000, spread = (rnd(i, 14) - 0.5) * 0.9;
        const dx = nm[0] * side + spread, dy = nm[1] * side + spread * 0.3;
        const px = p0[0] + dx * v * s, py = p0[1] + dy * v * s + 500 * s * s, q = 1 - sp / life;
        g.strokeStyle = i % 4 ? 'rgba(255,110,120,' + q + ')' : 'rgba(255,255,255,' + q + ')'; g.lineWidth = 1.5 + rnd(i, 15) * 2.5;
        g.beginPath(); g.moveTo(px, py); g.lineTo(px - dx * v * 0.03, py - dy * v * 0.03); g.stroke();
      }
    }
    // Embers rise during the zanshin hold.
    if (l > 2300 && l < 6600) {
      const fade = k(2300, 2800, l) * (1 - k(6200, 6600, l));
      for (let i = 0; i < 46; i++) {
        const life = 2200 + rnd(i, 16) * 1800, ph = ((l + rnd(i, 17) * life) % life) / life;
        const px = 200 + rnd(i, 18) * 1700 + Math.sin(ph * 6 + i) * 20, py = 1000 - ph * 520 - rnd(i, 19) * 200;
        g.fillStyle = 'rgba(255,' + (90 + (i % 3) * 50) + ',100,' + (Math.sin(ph * Math.PI) * fade * 0.8) + ')';
        g.beginPath(); g.arc(px, py, 1.5 + rnd(i, 20) * 2.5, 0, Math.PI * 2); g.fill();
      }
    }
    g.globalCompositeOperation = 'source-over';
  }

  renderVals() {
    const room = this.props.room ?? '示意画面';
    const pause = this.props.pause ?? '播放';
    const speed = { '1 倍': 1, '0.5 倍': 0.5, '0.25 倍': 0.25 }[this.props.speed ?? '1 倍'];
    const pauseAt = { '播放': null, '蓄力': 1500, '出招': 1990, '冲击帧': 2100, '余波': 2420, '亮名': 3300, '残心': 4800 }[pause];
    this.cfg = { cycle: 7600, speed, pauseAt };
    return {
      bg: room === '透明' ? 'transparent' : room === '浅色房间' ? '#B9A27F' : room === '深色房间' ? '#0C0D10' : '#2C3644',
      mock: room !== '透明',
      mockBg: room === '浅色房间' ? 'linear-gradient(180deg, #F4EFE7 0%, #EAE2D5 56%, #CDB89A 57%, #B9A27F 100%)' : room === '深色房间' ? 'linear-gradient(180deg, #16181D 0%, #23262E 56%, #121317 57%, #0C0D10 100%)' : 'linear-gradient(180deg, #3D4C66 0%, #536585 56%, #3A4658 57%, #2C3644 100%)',
      mockBox: room === '浅色房间' ? '#D9CCB8' : room === '深色房间' ? '#2F333C' : '#63769A',
      mockInk: room === '浅色房间' ? 'rgba(60, 40, 20, 0.55)' : 'rgba(255, 255, 255, 0.55)'
    };
  }
}
</script>
