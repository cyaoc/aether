class Component extends DCLogic {
  componentDidMount() {
    if (this.loopFn) return;

  // Boots Pixi on the board's canvas and re-binds the clock whenever the markup or the props change.
  tick() {
    const canvas = document.getElementById('ev2-gl'), root = document.getElementById('ev2-root');

      if (this.cfg.pauseAt != null) { this.master.pause(); this.master.currentTime = this.cfg.pauseAt / this.cfg.speed; }

  async boot(canvas) {

    const app = new P.Application();
    await app.init({ canvas, width: 1920, height: 1080, backgroundAlpha: 0, antialias: true, preference: 'webgl', resolution: 1 });
    const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
    const names = ['115e75bc617f8d5fd7fb14fbefd1be6a', '1c7a70bfab754681aee2ffeb917ac339', '50c3749ffd1d4751683421a32c66fcff', 'b612d7f6d7de096f347399c9117de8f7', '3faeaf56aa91c083f3f7aa9c275fbf63', 'bf29b43f32599957781aa3a541f4f0df', '29e10238d4580ab3bd147434f8165b26', 'e137dd02705aa8b8d9487ad3f2a7aecf', '8a8f2e02185cf263966cda96a7401785', '082ab954667f7cf75e403f0dfb59d960', '37a5b192bf014dc81fa423d2e1d45f6c', '38b992f980c338671fb008bf5ccdaefb', '1b89f838e16a1aae41ef0adb6e836e22', '3d7a08e31609fe87cb25219c91012aae'];

    await Promise.all([document.fonts.load('900 132px "Noto Serif SC"'), document.fonts.load('500 40px "Barlow Condensed"')]);

    const tex = img => P.Texture.from(img);
    const canvasOf = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d')); return c; };

    const faded = img => canvasOf(img.width, img.height, g => { g.drawImage(img, 0, 0); const r = g.createLinearGradient(0, img.height - 120, 0, img.height); r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(0,0,0,1)'); g.globalCompositeOperation = 'destination-out'; g.fillStyle = r; g.fillRect(0, img.height - 120, img.width, 120); });

    const radial = (stops) => tex(canvasOf(512, 512, g => { const r = g.createRadialGradient(256, 256, 0, 256, 256, 256); for (const [o, c] of stops) r.addColorStop(o, c); g.fillStyle = r; g.fillRect(0, 0, 512, 512); }));

    // The action chain. Every pose is placed by its hips (hip, in its own image's pixels) at a scale s that keeps the
    // figure about the same size; the slashes are built from points measured in the same images, so each slash runs
    // along the smear painted in its smear frame and ends exactly at the blade tip of the pose that finishes the cut.
    const keys = ['charge', 'dash', 'draw', 'drawEnd', 'wind', 'smear2', 'cut2', 'spin', 'smear3', 'cut3', 'zan'];
    const anchors = [[[520, 720], 0.731], [[880, 720], 0.682], [[700, 700], 0.684], [[700, 700], 0.684], [[520, 850], 0.889], [[780, 820], 0.848], [[440, 640], 0.733], [[760, 780], 0.666], [[430, 800], 0.9], [[460, 880], 0.812], [[330, 680], 0.771]];
    const PO = {};
    keys.forEach((key, i) => { const c = faded(imgs[i]); PO[key] = { img: c, tex: tex(c), hip: anchors[i][0], s: anchors[i][1] }; });
    const HIP = [720, 760];
    const W = (p, q, hip = HIP) => [hip[0] + (q[0] - p.hip[0]) * p.s, hip[1] + (q[1] - p.hip[1]) * p.s];
    // Catmull-Rom through the measured points, about every 10 px.
    const spline = pts => {
      const out = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
        const n = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 10));
        for (let j = 0; j < n; j++) { const t = j / n, t2 = t * t, t3 = t2 * t; out.push([0, 1].map(d => 0.5 * (2 * p1[d] + (p2[d] - p0[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (3 * p1[d] - p0[d] - 3 * p2[d] + p3[d]) * t3))); }
      }
      out.push(pts[pts.length - 1]); return out;
    };
    // A polyline walked by arc length: at(u) gives the point, the normal and whether that stretch passes behind the hero.
    const pathOf = (pts, back) => {
      if (pts.length < 2) pts = [[960, 540], [961, 540]];
      const n = pts.length, L = [0], N = [];
      for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      for (let i = 0; i < n; i++) { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1; N.push([-dy / m, dx / m]); }
      const tot = L[n - 1];
      const at = u => {
        const s = Math.min(1, Math.max(0, u)) * tot; let lo = 0, hi = n - 1;
        while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (L[mid] <= s) lo = mid; else hi = mid; }
        const f = (s - L[lo]) / ((L[hi] - L[lo]) || 1), p = pts[lo], q = pts[hi];
        return [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f, N[lo][0] + (N[hi][0] - N[lo][0]) * f, N[lo][1] + (N[hi][1] - N[lo][1]) * f, back ? back[lo] : false];
      };

    };

    // Cut 1, the draw: from the scabbard mouth at the hip, low across the front and curling up round the hand into the
    // tip of the follow-through (the draw smear without its smear).
    const t1 = spline([W(PO.draw, [600, 660]), W(PO.draw, [900, 820]), W(PO.draw, [1200, 850]), W(PO.draw, [1500, 800]), W(PO.draw, [1750, 650]), W(PO.draw, [1880, 450]), W(PO.drawEnd, [1910, 160])]);
    // Cut 2: from the raised blade's tip, along the overhead smear, down into the low tip of the finished cut.
    const t2 = spline([W(PO.wind, [10, 5]), W(PO.smear2, [500, 60]), W(PO.smear2, [1000, 110]), W(PO.smear2, [1300, 260]), W(PO.smear2, [1550, 500]), W(PO.smear2, [1700, 800]), W(PO.smear2, [1760, 1050]), W(PO.cut2, [1765, 1155])]);
    // Cut 3: the spin smear's loop round the waist (its far half behind the hero), then the rising smear up to the raised tip.
    const loop = [], loopBack = [];
    for (let i = 0; i <= 50; i++) {
      const th = -(Math.PI + 0.5) * i / 50, x = 880 * Math.cos(th), y = 125 * Math.sin(th);
      loop.push(W(PO.spin, [880 + x * Math.cos(0.09) - y * Math.sin(0.09), 680 + x * Math.sin(0.09) + y * Math.cos(0.09)])); loopBack.push(Math.sin(th) < 0);
    }
    const rise = [W(PO.smear3, [20, 975]), W(PO.smear3, [250, 1000]), W(PO.smear3, [450, 930]), W(PO.smear3, [600, 820]), W(PO.smear3, [700, 650]), W(PO.smear3, [760, 450]), W(PO.smear3, [770, 250]), W(PO.smear3, [750, 100]), W(PO.cut3, [775, 15])];
    const t3rise = spline([loop[loop.length - 1], ...rise]).slice(1);
    // The zanshin flick: down the right side from the raised tip into the low blade of the closing stance.
    const t4 = spline([W(PO.cut3, [775, 15]), [1240, 380], [1250, 760], W(PO.zan, [780, 1120])]);
    const front = (pts, u) => pts.map((_, i) => i / (pts.length - 1) < u);
    const blades = [pathOf(t1, front(t1, 0.05)), pathOf(t2), pathOf([...loop, ...t3rise], [...loopBack, ...t3rise.map(() => false)]), pathOf(t4)];
    const H3 = t3rise[t3rise.length - 1];

    // The cuts a straight blade leaves are straight: each is the chord of the stretch of its slash still lit on the frame
    // it lands (from the slash's tail to the blade tip), run right across the sky. Each slash's tail catches up as it
    // swings, so what is lit at the hit is nearly straight and the cut lies along it. The sky breaks along all three, full
    // length, so it opens along the very lines the viewer saw land; the moon sits whole in one piece. Each side of a line
    // is a polygon closed round a big circle, and each piece is one side of every line.
    const C0 = [960, 540], RR = 5000;
    const reach = (p, q) => { const d = [p[0] - q[0], p[1] - q[1]], m = Math.hypot(d[0], d[1]), u = [d[0] / m, d[1] / m], w = [p[0] - C0[0], p[1] - C0[1]], b = w[0] * u[0] + w[1] * u[1], t = -b + Math.sqrt(b * b - (w[0] * w[0] + w[1] * w[1] - RR * RR)); return [p[0] + u[0] * t, p[1] + u[1] * t]; };
    const sides = line => [1, -1].map(dir => {
      const ang = p => Math.atan2(p[1] - C0[1], p[0] - C0[0]), a0 = ang(line[0]), a1 = ang(line[line.length - 1]);
      let da = a0 - a1; if (dir > 0) while (da <= 0) da += 2 * Math.PI; else while (da >= 0) da -= 2 * Math.PI;
      return [...line, ...Array.from({ length: 65 }, (_, i) => [C0[0] + RR * Math.cos(a1 + da * i / 64), C0[1] + RR * Math.sin(a1 + da * i / 64)])];
    });
    const inside = (poly, x, y) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], b = poly[j]; if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; };
    // TAILS: how much of each slash has already drawn in by the frame it lands (the slashes below use the same values).
    const TAILS = [0.15, 0.5, 0.68];
    const chordOf = (P, u0) => { const a = P.at(u0), b = P.at(1); return [reach([a[0], a[1]], [b[0], b[1]]), reach([b[0], b[1]], [a[0], a[1]])]; };

    const dense = ([a, b]) => Array.from({ length: 1001 }, (_, i) => [a[0] + (b[0] - a[0]) * i / 1000, a[1] + (b[1] - a[1]) * i / 1000]);
    const [s1, s2, s3] = scars.map(sides);
    const cells = [];
    for (const r1 of s1) for (const r2 of s2) for (const r3 of s3) {

      for (let x = -60; x <= 1980; x += 30) for (let y = -60; y <= 1140; y += 30) if (regions.every(r => inside(r, x, y))) { n++; cx += x; cy += y; }
      if (n >= 12) cells.push({ regions, c: [cx / n, cy / n], n });
    }

    const stage = app.stage;
    const world = new P.Container(); world.pivot.set(960, 540); world.position.set(960, 540); stage.addChild(world);
    const dim = new P.Sprite(radial([[0, 'rgba(6,6,12,0.55)'], [0.6, 'rgba(4,4,8,0.85)'], [1, 'rgba(0,0,0,1)']]));
    dim.anchor.set(0.5); dim.position.set(960, 540); dim.width = 3400; dim.height = 2400; world.addChild(dim);

    // The sky is mirrored for 40 档 so the moon sits up and left behind the hero, clear of every cut (splitting the moon is 60 档's).
    const shadeTex = radial([[0, 'rgba(0,0,0,0)'], [0.7, 'rgba(0,0,0,0.35)'], [1, 'rgba(0,0,0,0.8)']]);
    const skyOf = (img, parent) => {
      const sky = new P.Sprite(tex(img)); sky.width = 2400; sky.height = 1600; sky.scale.x *= -1; sky.position.set(2160, -260); parent.addChild(sky);
      const shade = new P.Sprite(shadeTex); shade.anchor.set(0.5); shade.position.set(960, 540); shade.width = 2800; shade.height = 1900; parent.addChild(shade);
    };
    const red = new P.Container(); red.pivot.set(960, 540); red.position.set(960, 540); skyOf(moonRed, red); world.addChild(red);
    const pieces = cells.map(cell => {
      const c = new P.Container(); let host = c;
      for (const r of cell.regions) { const m = new P.Graphics().poly(r.flat()).fill(0xffffff); c.addChild(m); const inner = new P.Container(); inner.mask = m; host.addChild(inner); host = inner; }
      skyOf(moon, host);
      c.pivot.set(cell.c[0], cell.c[1]); c.position.set(cell.c[0], cell.c[1]);
      const d = [cell.c[0] - 760, cell.c[1] - 560], m = Math.hypot(d[0], d[1]) || 1, dir = [d[0] / m, d[1] / m];
      world.addChild(c);
      return { ...cell, c, dir, dist: 240 + Math.min(120, cell.n * 0.25), rot: 0.03 * Math.sign(dir[0] || 1) * (dir[1] < 0 ? 1 : 0.5) };

    const OX = 300, OY = 400;
    const backC = document.createElement('canvas'); backC.width = 1920 + 2 * OX; backC.height = 1080 + 2 * OY;
    const backTex = tex(backC), backSprite = new P.Sprite(backTex); backSprite.blendMode = 'add'; backSprite.position.set(-OX, -OY); world.addChild(backSprite);

    const rim = new P.Sprite(radial([[0, 'rgba(255,60,70,0.55)'], [0.45, 'rgba(200,20,40,0.18)'], [1, 'rgba(0,0,0,0)']]));
    rim.anchor.set(0.5); rim.width = 1100; rim.height = 1100; world.addChild(rim);
    const ghosts = [0, 1].map(() => { const s = new P.Sprite(PO.charge.tex); s.alpha = 0; world.addChild(s); return s; });
    const hero = new P.Sprite(PO.charge.tex); world.addChild(hero);

    const fx = document.createElement('canvas'); fx.width = backC.width; fx.height = backC.height;
    const fxTex = tex(fx), fxSprite = new P.Sprite(fxTex); fxSprite.blendMode = 'add'; fxSprite.position.set(-OX, -OY); world.addChild(fxSprite);

    const ui = new P.Container(); ui.pivot.set(960, 540); stage.addChild(ui);
    const nameG = new P.Container(); nameG.position.set(1000, 860); nameG.rotation = -0.06; ui.addChild(nameG);
    const nameStyle = { fontFamily: 'Noto Serif SC', fontWeight: '900', fontSize: 132, fill: 0xffffff, letterSpacing: 26 };
    const nameGhosts = [0, 1].map(() => { const t = new P.Text({ text: '柚子不酸', style: { ...nameStyle, fill: 0xff4d5e } }); t.anchor.set(0, 0.5); nameG.addChild(t); return t; });
    const nameT = new P.Text({ text: '柚子不酸', style: nameStyle }); nameT.anchor.set(0, 0.5); nameG.addChild(nameT);
    const nameMask = new P.Graphics(); nameG.addChild(nameMask); nameT.mask = nameMask;
    const rule = new P.Graphics(); nameG.addChild(rule);
    const tag = new P.Text({ text: '粉丝团', style: { fontFamily: 'Noto Serif SC', fontWeight: '900', fontSize: 30, fill: 0xffffff, letterSpacing: 6 } });
    const lv = new P.Text({ text: 'LV.40', style: { fontFamily: 'Barlow Condensed', fontWeight: '500', fontSize: 40, fill: 0xff5a68, letterSpacing: 6 } });
    tag.position.set(34, -142); lv.position.set(150, -150); nameG.addChild(tag, lv);

    const cap = new P.Container(); cap.position.set(600, 900); ui.addChild(cap);
    const capRule = new P.Graphics(); cap.addChild(capRule);
    const capName = new P.Text({ text: '柚子不酸', style: { fontFamily: 'Noto Serif SC', fontWeight: '900', fontSize: 50, fill: 0xffffff, letterSpacing: 12 } });
    capName.anchor.set(0, 1); capName.position.set(30, -10); cap.addChild(capName);
    const capLv = new P.Text({ text: '粉丝团', style: { fontFamily: 'Noto Serif SC', fontWeight: '900', fontSize: 22, fill: 0xffffff, letterSpacing: 4 } });
    const capLvN = new P.Text({ text: 'LV.40', style: { fontFamily: 'Barlow Condensed', fontWeight: '500', fontSize: 28, fill: 0xff5a68, letterSpacing: 4 } });
    capLv.position.set(32, 12); capLvN.position.set(112, 6); cap.addChild(capLv, capLvN);
    const capMask = new P.Graphics(); cap.addChild(capMask); capName.mask = capMask;

    const imp = new P.Container(); world.addChild(imp);
    const impBg = new P.Graphics().rect(-1200, -1200, 4320, 3480).fill(0xffffff); imp.addChild(impBg);
    const impLines = new P.Sprite(tex(impact)); impLines.anchor.set(0.5); impLines.width = impLines.height = 3000; imp.addChild(impLines);
    const silB = new P.Sprite(silhouette(PO.cut3.img, '#000')), silW = new P.Sprite(silhouette(PO.cut3.img, '#fff'));
    for (const s of [silB, silW]) { s.scale.set(PO.cut3.s); s.position.set(HIP[0] - PO.cut3.hip[0] * PO.cut3.s, HIP[1] - PO.cut3.hip[1] * PO.cut3.s); imp.addChild(s); }

  frame() {
    const S = this.S, C = this.cfg;
    if (!S || !this.master || !C) return;
    const span = C.cycle / C.speed;
    const t = ((this.master.currentTime || 0) % span) * C.speed;
    // Three hit stops, at logical times L1–L3 for 70, 70 and 160 ms of real time: real time keeps running (shake,
    // impact frames) while everything else holds. HR are the real times they start.
    const L1 = 1624, L2 = 1875, L3 = 2127, HS = [[L1, 70], [L2, 70], [L3, 160]], HR = [1624, 1945, 2267], REL3 = 2427;
    let l = null, acc = 0;

        const life = 2200 + rnd(i, 16) * 1800, ph = ((l + rnd(i, 17) * life) % life) / life;
        const px = 200 + rnd(i, 18) * 1700 + Math.sin(ph * 6 + i) * 20, py = 1000 - ph * 520 - rnd(i, 19) * 200;
        g.fillStyle = 'rgba(255,' + (90 + (i % 3) * 50) + ',100,' + (Math.sin(ph * Math.PI) * fade * 0.8) + ')';
        g.beginPath(); g.arc(px, py, 1.5 + rnd(i, 20) * 2.5, 0, Math.PI * 2); g.fill();
      }
    }
    for (const c of [g, gb]) c.globalCompositeOperation = 'source-over';
  }

  renderVals() {
    const room = this.props.room ?? '示意画面';
    const pause = this.props.pause ?? '播放';
    const speed = { '1 倍': 1, '0.5 倍': 0.5, '0.25 倍': 0.25 }[this.props.speed ?? '1 倍'];
    const pauseAt = { '播放': null, '蓄力': 1200, '冲刺': 1470, '第一刀': 1650, '举刀': 1760, '第二刀': 1960, '回身': 2100, '上撩': 2185, '冲击帧': 2275, '余波': 2560, '亮名': 3150, '斩铁': 3700, '里世界': 4800 }[pause];
    this.cfg = { cycle: 8500, speed, pauseAt };
    return {
      bg: room === '透明' ? 'transparent' : room === '浅色房间' ? '#B9A27F' : room === '深色房间' ? '#0C0D10' : '#2C3644',
      mock: room !== '透明',
      mockBg: room === '浅色房间' ? 'linear-gradient(180deg, #F4EFE7 0%, #EAE2D5 56%, #CDB89A 57%, #B9A27F 100%)' : room === '深色房间' ? 'linear-gradient(180deg, #16181D 0%, #23262E 56%, #121317 57%, #0C0D10 100%)' : 'linear-gradient(180deg, #3D4C66 0%, #536585 56%, #3A4658 57%, #2C3644 100%)',
      mockBox: room === '浅色房间' ? '#D9CCB8' : room === '深色房间' ? '#2F333C' : '#63769A',
      mockInk: room === '浅色房间' ? 'rgba(60, 40, 20, 0.55)' : 'rgba(255, 255, 255, 0.55)'
    };
  }
}
</script>
