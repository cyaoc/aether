<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OR5 欢迎动画观众从在线榜选</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.orRow[aria-selected="false"]:hover{background:var(--or-hover) !important}
</style>
</helmet>
<div style="width: 1440px; height: 600px; display: flex; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', 'Segoe UI', sans-serif; font-size: 14px">
  <sc-for list="{{bands}}" as="b" hint-placeholder-count="2">
    <div style="position: relative; flex: 1; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 24px; background: {{b.t.content}}; color: {{b.t.primary}}; border-right: 1px solid {{b.t.border}}; --or-hover: {{b.t.subtle}}">
      <span style="font-size: 12px; color: {{b.t.muted}}; white-space: nowrap">{{b.caption}}</span>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-weight: 600">观众</span>
        <span style="font-size: 13px; color: {{b.t.muted}}; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">进场时在直播画面上播放各自的视频</span>
        <span style="flex: 1"></span>
        <span style="font-size: 12px; color: {{b.t.muted}}; font-variant-numeric: tabular-nums">3 位</span>
      </div>

      <div style="display: flex; flex-direction: column; border: 1px solid {{b.t.border}}; border-radius: 8px">
        <sc-for list="{{b.rows}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 8px; padding: 8px 6px 8px 12px; border-top: {{r.divider}}">
            <input aria-label="{{r.label}}" inputmode="numeric" placeholder="输入 UID" value="{{r.uid}}" onChange="{{r.onValue}}" style="width: 104px; flex-shrink: 0; height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid {{b.t.control}}; border-radius: 6px; background: {{b.t.content}}; color: {{b.t.primary}}; font: inherit; font-size: 13px; font-variant-numeric: tabular-nums">

            <span style="position: relative; flex-shrink: 0; display: inline-flex">
              <button type="button" aria-label="{{r.pickLabel}}" title="从在线榜选" aria-haspopup="listbox" aria-expanded="{{r.expanded}}" onClick="{{r.toggle}}" style="width: 32px; height: 32px; padding: 0; border: 1px solid {{r.pickBorder}}; border-radius: 6px; background: {{b.t.card}}; color: {{r.pickColor}}; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              </button>

              <sc-if value="{{r.open}}" hint-placeholder-val="{{false}}">
                <div role="dialog" aria-label="在线榜" style="position: absolute; left: 0; top: 38px; z-index: 5; width: 340px; box-sizing: border-box; display: flex; flex-direction: column; padding: 4px; border: 1px solid {{b.t.border}}; border-radius: 8px; background: {{b.t.card}}; box-shadow: {{b.t.shadow}}">
                  <div style="display: flex; align-items: baseline; gap: 8px; padding: 8px 10px 6px">
                    <span style="font-size: 13px; font-weight: 600; white-space: nowrap">在线榜</span>
                    <span style="font-size: 12px; color: {{b.t.muted}}; white-space: nowrap; font-variant-numeric: tabular-nums">前 100 位 · 在线 430 人</span>
                  </div>
                  <div role="listbox" aria-label="在线榜上的观众" style="max-height: 256px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px">
                    <sc-for list="{{r.viewers}}" as="v" hint-placeholder-count="8">
                      <button type="button" role="option" class="orRow" aria-selected="{{v.sel}}" onClick="{{v.pick}}" style="height: 32px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; border: 0; border-radius: 6px; background: {{v.bg}}; color: {{v.color}}; font: inherit; font-size: 13px; text-align: left; cursor: pointer">
                        <span style="width: 24px; flex-shrink: 0; text-align: right; font-size: 12px; color: {{b.t.muted}}; font-variant-numeric: tabular-nums">{{v.rank}}</span>
                        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: {{v.weight}}">{{v.name}}</span>
                        <span style="flex-shrink: 0; font-size: 12px; color: {{b.t.muted}}; font-variant-numeric: tabular-nums">{{v.uid}}</span>
                      </button>
                    </sc-for>
                  </div>
                  <span style="margin-top: 2px; padding: 8px 10px 6px; border-top: 1px solid {{b.t.subtle}}; font-size: 12px; color: {{b.t.muted}}; white-space: nowrap">每次打开都重新读；点一位观众，把 UID 填到这一行</span>
                </div>
              </sc-if>
            </span>

            <button type="button" aria-label="{{r.fileLabel}}" style="white-space: nowrap; flex: 1; min-width: 0; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: {{r.fileColor}}; font: inherit; font-size: 13px; text-align: left">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 4h16v16H4zM8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4"></path></svg>
              <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.file}}</span>
            </button>
            <button type="button" aria-label="{{r.playLabel}}" disabled="{{r.playDisabled}}" style="white-space: nowrap; height: 30px; flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px 0 8px; border: 1px solid {{r.playBorder}}; border-radius: 6px; background: {{b.t.card}}; color: {{r.playColor}}; font: inherit; font-size: 13px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg>
              试播
            </button>
            <button type="button" aria-label="{{r.removeLabel}}" style="white-space: nowrap; width: 30px; height: 30px; flex-shrink: 0; border: 0; border-radius: 6px; background: transparent; color: {{b.t.muted}}; display: inline-flex; align-items: center; justify-content: center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
            </button>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <button type="button" style="white-space: nowrap; height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border: 1px solid {{b.t.control}}; border-radius: 6px; background: {{b.t.card}}; color: {{b.t.primary}}; font: inherit; font-size: 13px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          添加观众
        </button>
        <span style="font-size: 12px; color: {{b.t.muted}}; white-space: nowrap">选 MP4 或 WebM，保存时复制到 data/videos/</span>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":600}}'>
class Component extends DCLogic {
  // Same made-up top 100 as OR1.
  viewers() {
    const fixed = [['柚子不酸', '12345'], ['一只小鹿', '3494000012300417'], ['晚风', '28816620'], ['阿狸', '3546771908471926'], ['橘猫不吃鱼', '3493118594861092'], ['今天也要努力学习不然就要挂科了啊', '402377711']];
    const a = ['布丁', '咸鱼', '奶盖', '月亮', '星星', '竹子', '汽水', '团子', '饼干', '海盐', '芋圆', '可乐'];
    const b = ['不睡觉', '路过', '一号', '酱', '呀', '本人', '在摸鱼', '爱吃糖', '超快乐', '想下班', '在线', '冲鸭'];
    const list = fixed.slice();
    for (let i = 0; list.length < 100; i++) {
      const x = i % 12, y = Math.floor(i / 12);
      const n = (i + 7) * 7919351 * 1013;
      const uid = i % 4 === 0 ? String(10000 + (n % 899990000)) : String(3490000000000000 + (n % 9999999999999));
      list.push([a[x] + b[(x + y * 5) % 12], uid]);
    }
    return list;
  }

  renderVals() {
    const s = this.state || {};
    const all = this.viewers();
    // Shipped Theme.axaml tokens, same as OR1.
    const light = {
      content: '#FFFFFF', card: '#FFFFFF', border: '#E3E6EB', subtle: '#EEF0F3', control: '#D5D9E0',
      primary: '#16181D', secondary: '#3D4350', muted: '#5B6270', disabled: '#B4BAC4',
      accent: '#3358D4', accentText: '#2A47B0', accentTint: '#E6EBFA',
      shadow: '0 8px 24px rgba(22, 24, 29, 0.12), 0 1px 2px rgba(22, 24, 29, 0.08)'
    };
    const dark = {
      content: '#1B1C1F', card: '#222428', border: '#2E3136', subtle: '#26282C', control: '#3A3E45',
      primary: '#E8EAED', secondary: '#C2C6CE', muted: '#9097A3', disabled: '#4A4F57',
      accent: '#8DA2FB', accentText: '#B4C3FF', accentTint: '#262F52',
      shadow: '0 8px 24px rgba(0, 0, 0, 0.45)'
    };
    const files = ['柚子不酸.mp4', '晚风进场.webm', ''];
    const band = (t, k, caption) => {
      const uids = s['uids' + k] || ['12345', '28816620', ''];
      // The new empty row starts with its picker open: add a viewer, then pick.
      const open = s['open' + k] !== undefined ? s['open' + k] : 2;
      const set = (patch) => this.setState(Object.fromEntries(Object.entries(patch).map(([key, v]) => [key + k, v])));
      return {
        t, caption,
        rows: uids.map((uid, n) => {
          const file = files[n];
          return {
            uid, divider: n === 0 ? '0' : '1px solid ' + t.subtle,
            label: '观众 UID 第 ' + (n + 1) + ' 位',
            pickLabel: '从在线榜选第 ' + (n + 1) + ' 位观众',
            onValue: (e) => set({ uids: uids.map((x, i) => (i === n ? e.target.value : x)) }),
            open: open === n, expanded: open === n ? 'true' : 'false',
            pickBorder: open === n ? t.accent : t.control,
            pickColor: open === n ? t.accentText : t.secondary,
            toggle: () => set({ open: open === n ? -1 : n }),
            file: file || '选一个视频', fileColor: file ? t.accentText : t.muted,
            fileLabel: file ? '更换视频：' + file : '选一个视频',
            playLabel: '试播第 ' + (n + 1) + ' 位观众的视频',
            playDisabled: file ? 'false' : 'true',
            playBorder: file ? t.control : t.border, playColor: file ? t.primary : t.disabled,
            removeLabel: '删除这位观众：' + (uid || '空 UID'),
            viewers: all.map(([name, id], i) => {
              const on = id === uid.trim();
              return {
                rank: String(i + 1), name, uid: id, sel: on ? 'true' : 'false',
                bg: on ? t.accentTint : 'transparent', color: on ? t.accentText : t.primary, weight: on ? 600 : 400,
                pick: () => set({ uids: uids.map((x, j) => (j === n ? id : x)), open: -1 })
              };
            })
          };
        })
      };
    };
    return { bands: [band(light, 'L', '浅色 · 刚加的第 3 行，点图标打开在线榜'), band(dark, 'D', '深色 · 同一个浮层，和 OR1 一样')] };
  }
}
</script>
</body>
</html>
