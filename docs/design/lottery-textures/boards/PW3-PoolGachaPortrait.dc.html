<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: {{bg}}; color: #4B2A4F; font-family: 'ZCOOL KuaiLe', 'Smiley Sans', 'PingFang SC', sans-serif">

          <span style="position: absolute; left: 86px; top: 38px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; border: 5px solid #4B2A4F; background: #FF7AAE"></span>
        </div>
        <span style="position: absolute; left: 226px; top: 140px; width: 18px; height: 56px; border-radius: 9px; background: #4B2A4F"></span>

    const caps = ['#FF7AAE', '#5FD3B0', '#A991FF', '#FFD45E', '#7CCBFF'];
    const latest = [0, 1, 2].map((k) => ({ name: tagNames[(n + tagNames.length - k) % tagNames.length], bg: tints[(n + k) % 5], cap: caps[(n + k) % 5], fade: String(1 - k * 0.2), cls: k === 0 ? (s.flip ? 'pw3-in-a' : 'pw3-in-b') : '' }));
    const prizeRows = [['一等奖', '机械键盘', 1, '大奖'], ['二等奖', '周边抱枕', 2, '二奖'], ['三等奖', '签名照', 3, '三奖']].map(([tr, p, quota, look]) => ({ tier: tr, prize: p, quota, color: looks[look].color, ink: looks[look].ink }));
    const resultRows = [['一等奖', '机械键盘', '大奖', '#FFF2C9', ['柚子不酸']], ['二等奖', '周边抱枕', '二奖', '#FFE3EE', ['桃桃乌龙', '南巷']], ['三等奖', '签名照', '三奖', '#DDF7EE', ['番茄炒蛋', '青柠', '星河入梦']]]
      .map(([tr, p, look, tint, list], row) => ({ tier: tr, prize: p, color: looks[look].color, tex, flat: !tex, pos: capPos[looks[look].color], tint, people: (partial ? (row === 2 ? list.slice(0, 2) : []) : list).map((name, k) => ({ name, delay: (row * 0.3 + k * 0.12).toFixed(2) + 's' })) }))
      .filter((r) => r.people.length > 0);
    return {
      stream, showSafe,
      bg: !stream ? 'repeating-conic-gradient(#D5D9E0 0% 25%, #FFFFFF 0% 50%) 50% / 48px 48px' : room === '透明' ? 'transparent' : room === '浅色房间' ? '#B9A27F' : room === '深色房间' ? '#0C0D10' : '#8FA88A',
      mock: stream && room !== '透明',
      mockBg: room === '浅色房间' ? 'linear-gradient(180deg, #F4EFE7 0%, #EAE2D5 60%, #CDB89A 61%, #B9A27F 100%)' : room === '深色房间' ? 'linear-gradient(180deg, #16181D 0%, #23262E 60%, #121317 61%, #0C0D10 100%)' : 'linear-gradient(180deg, #A9C9E6 0%, #C2DCEE 50%, #8FA88A 100%)',
      mockPerson: room === '浅色房间' ? '#D9CCB8' : room === '深色房间' ? '#2F333C' : 'rgba(255, 255, 255, 0.25)',
      boost: boost && isReveal, oldSky: isReveal && !boost, hasRing2: power > 1,
      tex: tex && isReveal, noTex: !tex, texFrame: tex && isReveal, tierN: 4 - power, bodyCls: tex ? 'pw3t-body' : '', tagTop: tex && power === 3 ? '296px' : '-34px',
      frameIn: ['left: -34px; top: -34px; right: -34px; bottom: -34px;', 'left: -38px; top: -38px; right: -38px; bottom: -38px;', 'left: -33px; top: -33px; right: -33px; bottom: -33px;'][3 - power],
      capPos: { 3: '0% 0', 2: '50% 0', 1: '100% 0' }[power], halfX: { 3: '0', 2: '-110px', 1: '-220px' }[power],
      shift: boost ? 'translate(81px, 200px)' : 'none',
      sun: power === 3 ? { size: '1000px', pos: '-500px', a: '#FFE27A', b: '#FFF6D6' } : power === 2 ? { size: '900px', pos: '-450px', a: '#FFB3CF', b: '#FFE6F0' } : { size: '720px', pos: '-360px', a: '#A8EBD6', b: '#E6FAF3' },
      burstBox: power === 3 ? { x: '590px', y: '335px', w: '380px', h: '270px' } : power === 2 ? { x: '605px', y: '343px', w: '320px', h: '230px' } : { x: '585px', y: '357px', w: '230px', h: '170px' },
      burstFill: power === 3 ? '#FFF3B0' : power === 2 ? '#FFE3EE' : '#E6FAF3',
      sparkles: [['100px', '420px', 60, '0s'], ['740px', '780px', 52, '.4s'], ['180px', '840px', 42, '.7s'], ['740px', '330px', 38, '.2s'], ['80px', '640px', 34, '.9s']].slice(0, power + 2).map(([x, y, s, d]) => ({ x, y, s, d })),
      isIdle, isReveal, isReg, isDone, showStage: isIdle || isReveal,
      count: (isReg ? 109 : 128) + n, latest, prizeRows, resultRows, partial,
      doneTitle: partial ? '已经扭出来的' : '中奖啦！',
      remainText: '报名截止啦 · 还剩 4 个名额',
      dropCls: isReg ? (s.flip ? 'pw3-drop-a' : 'pw3-drop-b') : '',
      dropColor: caps[n % 5],
      popClass: isReg ? (s.flip ? 'pw3-pop-a' : 'pw3-pop-b') : '',
      bannerText: isEntry ? '扭出 ' + entryTier + ' 中奖者！' : '柚子不酸 来扭蛋啦！',
      stickerTier: isEntry ? entryTier : tier,
      stickerMain: isEntry ? '柚子不酸' : prize,
      stickerSub: isEntry ? '抽中 ' + prize : '柚子不酸 扭到了', isBig: isReveal && power === 3,
      tc, tier, prize, capsules, legend, viewer: '柚子不酸',
      lcd: isReveal ? '扭扭扭…' : '等你来扭',
      crankCls: isReveal ? 'pw3-crank' : 'pw3-wiggle',
      squashCls: isReveal ? 'pw3-squash' : '',
      jiggleCls: isReveal ? 'pw3-jiggle' : 'pw3-bob',
      burstSize: ['260px', '360px', '480px'][power - 1],
      popWord: ['pop', 'POP!', '大奖!!'][power - 1],
      popSize: ['54px', '80px', '96px'][power - 1],
      popX: power === 3 ? '600px' : '640px',
      setCanvas: (el) => { if (el) this.canvas = el; }
    };
  }
}
</script>
