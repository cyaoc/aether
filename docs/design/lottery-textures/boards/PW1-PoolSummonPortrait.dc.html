<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: {{bg}}; color: #F3F1FF; font-family: 'Smiley Sans', 'PingFang SC', 'Microsoft YaHei UI', sans-serif">

  <sc-if value="{{mock}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; background: {{mockBg}}"></div>
    <span style="position: absolute; left: 340px; top: 560px; width: 400px; height: 600px; border-radius: 200px 200px 40px 40px; background: {{mockPerson}}"></span>
  </sc-if>
  <sc-if value="{{showSafe}}" hint-placeholder-val="{{false}}">
    <span style="position: absolute; left: 54px; top: 288px; width: 810px; height: 960px; box-sizing: border-box; border: 4px dashed rgba(57, 255, 136, 0.8)"></span>
  </sc-if>
  <div style="position: absolute; inset: 0; transform: {{shift}}">
  <div class="{{shakeCls}}" style="position: absolute; inset: 0">

  <sc-if value="{{texIdle}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 24px; top: 380px; width: 870px; height: 900px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(14, 10, 44, 0.92) 0%, rgba(14, 10, 44, 0.86) 45%, rgba(14, 10, 44, 0) 70%)"></div>
  </sc-if>
  <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 24px; top: 380px; width: 870px; height: 900px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(30, 20, 90, 0.72) 0%, rgba(20, 14, 64, 0.45) 45%, rgba(20, 14, 64, 0) 70%)"></div>
  </sc-if>

  <sc-if value="{{isReg}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 54px; top: 300px; width: 810px; display: flex; flex-direction: column; align-items: center; gap: 18px">
      <span style="height: 90px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 16px; padding: 0 30px; border-radius: 45px; border: 2px solid rgba(255, 211, 107, 0.8); background: rgba(14, 12, 44, 0.92)">
        <span class="pw1-gold" style="font-size: 60px">星辰召唤</span>
        <span style="height: 44px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 22px; background: rgba(197, 155, 255, 0.22); color: #E7D9FF; font-size: 30px">报名中</span>
      </span>
      <div style="width: 760px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px 24px; border-radius: 22px; border: 2px solid rgba(197, 155, 255, 0.7); background: rgba(14, 12, 44, 0.92)">
        <span style="font-family: 'PingFang SC', sans-serif; font-size: 28px; letter-spacing: 6px; color: #B9B4E0">召唤条件</span>
        <span style="font-size: 58px; color: #FFFFFF">发弹幕「抽奖」</span>
      </div>
      <span style="display: flex; align-items: baseline; gap: 12px; padding: 4px 30px; border-radius: 24px; background: rgba(14, 12, 44, 0.85)">
        <span class="pw1-gold {{popClass}}" style="display: inline-block; font-size: 116px; line-height: 1.05; font-variant-numeric: tabular-nums">{{count}}</span>
        <span style="font-size: 38px; color: #E7D9FF">位召唤师已报名</span>
      </span>
      <div style="width: 760px; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{latest}}" as="f" hint-placeholder-count="3">
          <span class="{{f.cls}}" style="height: 70px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 22px; border-radius: 35px; background: rgba(14, 12, 44, 0.9); border: 1px solid rgba(197, 155, 255, 0.5); opacity: {{f.fade}}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="{{f.color}}" aria-hidden="true"><path d="M12 1.5l2.2 8.3 8.3 2.2-8.3 2.2-2.2 8.3-2.2-8.3-8.3-2.2 8.3-2.2z"></path></svg>
            <span style="flex: 1; font-size: 48px; color: #FFFFFF">{{f.name}}</span>
            <span style="font-family: 'PingFang SC', sans-serif; font-size: 28px; color: #B9B4E0">{{f.via}}</span>
          </span>
        </sc-for>
      </div>
      <div style="width: 760px; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{prizeRows}}" as="p" hint-placeholder-count="3">
          <span style="height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 22px; border-radius: 14px; border: 2px solid transparent; background: linear-gradient(120deg, {{p.deep}}, rgba(12, 10, 38, 0.94) 70%) padding-box, {{p.frame}} border-box">
            <span style="width: 84px; font-size: 40px; background: {{p.frame}}; -webkit-background-clip: text; background-clip: text; color: transparent">{{p.rank}}</span>
            <span style="font-family: 'PingFang SC', sans-serif; font-size: 30px; font-weight: 700; color: {{p.star}}">{{p.tier}}</span>
            <span style="flex: 1; font-size: 40px; color: #FFFFFF">{{p.prize}}</span>
            <span style="font-family: 'PingFang SC', sans-serif; font-size: 30px; color: #B9B4E0">× {{p.quota}}</span>
          </span>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 54px; top: 300px; width: 810px; display: flex; flex-direction: column; align-items: center; gap: 26px">
      <span class="pw1-gold" style="font-size: 76px; filter: drop-shadow(0 0 18px rgba(255, 211, 107, 0.5))">{{doneTitle}}</span>
      <span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; width: 756px; perspective: 1200px">
        <sc-for list="{{results}}" as="r" hint-placeholder-count="6">
          <span class="pw1-deal" style="height: 330px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px 10px; border-radius: 16px; border: 3px solid transparent; background: linear-gradient(170deg, {{r.deep}}, #0C0A26 75%) padding-box, {{r.frame}} border-box; box-shadow: 0 0 30px {{r.glow}}; animation-delay: {{r.delay}}; isolation: isolate">
            <sc-if value="{{r.tex}}" hint-placeholder-val="{{false}}">
              <span class="pw1t-face{{r.n}}" style="position: absolute; inset: 0; z-index: -1; border-radius: 13px"></span>
            </sc-if>
            <span style="font-size: 50px; line-height: 1; background: {{r.ink}}; -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8))">{{r.rank}}</span>
            <span style="font-size: 48px; color: #FFFFFF; text-align: center; line-height: 1.15; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7)">{{r.name}}</span>
            <span style="font-family: 'PingFang SC', sans-serif; font-size: 28px; font-weight: 700; color: {{r.star}}; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8)">{{r.tier}}</span>
            <sc-if value="{{r.tex}}" hint-placeholder-val="{{false}}">
              <span class="pw1t-frame{{r.n}}" style="position: absolute; left: -7px; top: -9px; right: -7px; bottom: -9px; pointer-events: none"></span>
            </sc-if>
          </span>
        </sc-for>
      </span>
      <sc-if value="{{partial}}" hint-placeholder-val="{{false}}">
        <span style="padding: 10px 30px; border-radius: 30px; background: rgba(14, 12, 44, 0.9); border: 1px solid rgba(197, 155, 255, 0.6); font-size: 40px; color: #E7D9FF">{{remainText}}</span>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{oldSky}}" hint-placeholder-val="{{false}}">
    <div class="pw1-sky" style="position: absolute; inset: 0; background: {{skyBg}}"></div>
  </sc-if>
  <sc-if value="{{boostReveal}}" hint-placeholder-val="{{false}}">
    <div class="pw1b-portal" style="position: absolute; left: 459px; top: 760px; width: {{portal.w}}; height: {{portal.h}}; border-radius: 50%; background: {{portal.bg}}"></div>
    <sc-if value="{{tex}}" hint-placeholder-val="{{false}}">
      <div class="pw1t-portal" style="position: absolute; left: 459px; top: 760px; width: {{portal.w}}; height: {{portal.h}}; border-radius: 50%; background: radial-gradient(ellipse closest-side, rgba(10, 6, 34, 0.94) 0%, rgba(10, 6, 34, 0.9) 60%, rgba(10, 6, 34, 0) 82%)"></div>
      <div class="pw1t-portal" style="position: absolute; left: 459px; top: 760px; width: {{portal.w}}; height: {{portal.h}}; -webkit-mask-image: radial-gradient(ellipse closest-side, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse closest-side, #000 55%, transparent 100%)">
        <div style="position: absolute; left: 50%; top: 50%; width: {{portal.h}}; height: {{portal.w}}; transform: translate(-50%, -50%) rotate(90deg)">
          <div class="pw1t-neb" style="position: absolute; inset: -6%; opacity: {{portal.neb}}"></div>
        </div>
      </div>
