<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: {{bg}}; color: #F3F1FF; font-family: 'Smiley Sans', 'PingFang SC', 'Microsoft YaHei UI', sans-serif">

  </sc-if>

        <span style="font-family: 'PingFang SC', sans-serif; font-size: 32px; letter-spacing: 6px; color: #B9B4E0">召唤条件</span>
        <span style="font-size: 76px; line-height: 1.1; color: #FFFFFF">发弹幕「抽奖」</span>

        <span class="w1-gold {{popClass}}" style="display: inline-block; font-size: 130px; line-height: 1; font-variant-numeric: tabular-nums">{{count}}</span>
        <span style="font-size: 44px; color: #E7D9FF">位召唤师已报名</span>
      </span>
      <span style="width: 2px; height: 150px; flex-shrink: 0; background: rgba(197, 155, 255, 0.5)"></span>

          <span class="{{f.cls}}" style="font-size: 62px; line-height: 1.1; color: #FFFFFF; opacity: {{f.fade}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span>

      </span>
    </div>

              <span class="w1t-frame{{r.n}}" style="position: absolute; left: -8px; top: -10px; right: -8px; bottom: -10px; pointer-events: none"></span>

          </span>
        </sc-for>
      </span>
      <sc-if value="{{partial}}" hint-placeholder-val="{{false}}">

      </sc-if>
