.b1{left:-10px;top:-10px;border-width:7px 0 0 7px;--bx:-40px;--by:-30px}.b2{right:-10px;top:-10px;border-width:7px 7px 0 0;--bx:40px;--by:-30px}

/* 星辰召唤：深色卡片 + 渐变描边，档次 SSR/SR/R。 */
.th-summon{color:#f3f1ff}
.th-summon .g-Grand{--main:#ffd36b;--light:#ffe7a8;--deep:rgba(110,78,14,.95);--glow:rgba(255,211,107,.5);--sweep:rgba(255,241,194,.6);--frame:linear-gradient(160deg,#fff,#ffe7a8 25%,#e8a93a 55%,#fff1c2 80%,#c98a1b)}
.th-summon .g-Second{--main:#c59bff;--light:#e3d2ff;--deep:rgba(70,40,140,.95);--glow:rgba(197,155,255,.4);--sweep:rgba(227,210,255,.38);--frame:linear-gradient(160deg,#f5eeff,#c59bff 35%,#7c4dff 65%,#e3d2ff)}
.th-summon .g-Third{--main:#7cc4ff;--light:#cdebff;--deep:rgba(24,60,120,.95);--glow:rgba(124,196,255,0);--sweep:rgba(205,235,255,.3);--frame:linear-gradient(160deg,#f0faff,#7cc4ff 35%,#2f7fe0 65%,#cdebff)}
.th-summon .rb-head{padding:4px 30px;border-radius:48px;border:2px solid #ffd36bb3;background:rgba(14,12,44,.92);box-shadow:0 0 30px #7c5cff59}
.th-summon .rb-title{background:linear-gradient(180deg,#fff,#fff1c2 40%,#ffd36b 70%,#e8a93a);-webkit-background-clip:text;background-clip:text;color:transparent}
.th-summon .rb-count{font-family:'PingFang SC','Microsoft YaHei UI',sans-serif;font-size:32px;color:#b9b4e0}
.th-summon .rb-row{border-radius:18px;border:3px solid transparent;background:linear-gradient(120deg,var(--deep),#0c0a26f0 70%) padding-box,var(--frame) border-box;box-shadow:0 0 24px var(--glow)}
.th-summon .rb-row.g-Third{border-width:2px}
.th-summon .rb-badge{width:96px;font-size:58px;line-height:1;background:var(--frame);-webkit-background-clip:text;background-clip:text;color:var(--light);-webkit-text-fill-color:transparent}
.th-summon .rb-who{color:#e7d9ff}
.th-summon .rb-name{border-radius:12px;background:rgba(255,255,255,.1)}
.th-summon .fx-star svg,.th-summon .fx-tw svg{fill:var(--light);filter:drop-shadow(0 0 8px var(--main))}

/* 机甲锁定：直角黑底、左侧色条、警戒条，档次 S/A/B。 */
.th-mecha{color:#f2f4f7;--condensed:'Bahnschrift SemiCondensed','Bahnschrift','DIN Condensed','Avenir Next Condensed',sans-serif}
.th-mecha .g-Grand{--main:#ff7a1a;--light:#ff7a1a;--a:rgba(255,122,26,.35)}
.th-mecha .g-Second{--main:#ffb067;--light:#ffb067;--a:rgba(255,176,103,.28)}
.th-mecha .g-Third{--main:#c9d0d8;--light:#c9d0d8;--a:rgba(201,208,216,.22)}
.th-mecha .rb-head{padding:24px 24px 10px;background:#0a0c10f0;border:2px solid #ff7a1a;border-top:0}
.th-mecha .rb-head::before{content:'';position:absolute;left:-2px;right:-2px;top:0;height:12px;background:repeating-linear-gradient(-45deg,#ff7a1a 0 18px,#0a0c10 18px 36px)}
.th-mecha .rb-title{font-size:56px}
.th-mecha .rb-tag{display:inline;font:700 28px var(--condensed);letter-spacing:4px;color:#ff7a1a}
.th-mecha .rb-count{font:700 40px var(--condensed);color:#9aa3ae}
.th-mecha .rb-row{padding-left:16px;border-left:10px solid var(--main);background:#0a0c10eb}
.th-mecha .rb-row.g-Grand{box-shadow:inset 0 0 0 2px rgba(255,122,26,.55)}
.th-mecha .rb-badge{width:72px;height:72px;background:var(--main);color:#0a0c10;font:700 50px var(--condensed)}
.th-mecha .rb-who{color:#9aa3ae}
.th-mecha .rb-name{border-left:5px solid var(--main);background:rgba(255,255,255,.08)}
.th-mecha .fx-new{background:var(--main);color:#0a0c10;font:700 30px/40px var(--condensed);letter-spacing:3px}
.th-mecha .fx-haz{background:repeating-linear-gradient(-45deg,var(--main) 0 14px,#0a0c10 14px 28px)}
.th-mecha .fx-flash{background:var(--main)}
.th-mecha .fx-ring,.th-mecha .fx-star,.th-mecha .fx-tw{display:none}

/* 萌系扭蛋：奶油底、粗描边、硬投影，档次看扭蛋颜色。 */
.th-gacha{color:#4b2a4f;font-family:'ZCOOL KuaiLe','Smiley Sans','PingFang SC',sans-serif;--ink:#4b2a4f}
.th-gacha .g-Grand{--main:#ffd45e;--light:#ffd45e;--tint:#fff2c9}
.th-gacha .g-Second{--main:#ff7aae;--light:#ff7aae;--tint:#ffe3ee}
.th-gacha .g-Third{--main:#5fd3b0;--light:#5fd3b0;--tint:#ddf7ee}
.th-gacha .rb-head{padding:4px 28px;border:5px solid var(--ink);border-radius:40px;background:#fff8ee;box-shadow:6px 6px var(--ink)}
.th-gacha .rb-title{color:#ff7aae;text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink),6px 6px var(--ink)}
.th-gacha .rb-count{font-size:36px;color:#7a5a7e}
.th-gacha .rb-row{border:4px solid var(--ink);border-radius:32px;background:var(--tint);box-shadow:5px 5px var(--ink)}
.th-gacha .rb-badge{width:68px;height:68px;border:4px solid var(--ink);border-radius:50%;background:linear-gradient(var(--main) 46%,var(--ink) 46% 54%,#fff 54%)}
.th-gacha .rb-who{color:#7a5a7e}
.th-gacha .rb-name{border:3px solid var(--ink);border-radius:999px;background:#fff}
.th-gacha .fx-ring{border:7px solid var(--main);box-shadow:0 0 0 4px var(--ink)}
.th-gacha .fx-flash{background:#fff}
.th-gacha .fx-star svg,.th-gacha .fx-tw svg{fill:var(--main);stroke:#4b2a4f;stroke-width:1.6;stroke-linejoin:round}
.th-gacha .fx-tw{left:96px;top:6px;margin:0}

/* 贴图版：只把档位标记换成和开奖同一套的小图（小卡、徽章、扭蛋），不加特效。 */
.tex.th-summon .rb-badge{position:relative;width:72px;height:96px;border-radius:9px;font-size:30px;-webkit-text-fill-color:#fff;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.85)}
.tex.th-summon .rb-badge::after{content:'';position:absolute;inset:-7px -6px;border:1px solid transparent}
.tex.th-summon .g-Grand .rb-badge{background:linear-gradient(rgba(10,8,30,.25),rgba(10,8,30,.45)),url('/_blob/ede9c84d6c23f72b21f8d36bedfa561f') center/cover}
.tex.th-summon .g-Second .rb-badge{background:linear-gradient(rgba(10,8,30,.2),rgba(10,8,30,.4)),url('/_blob/a601c504ed25007c1b77557e51e6aebe') center/cover}
.tex.th-summon .g-Third .rb-badge{background:linear-gradient(rgba(10,8,30,.15),rgba(10,8,30,.35)),url('/_blob/c06e1ec4b376d39c94accf9760cbf700') center/cover}
.tex.th-summon .g-Grand .rb-badge::after{border-image:url('/_blob/ff4118322d49fe8300c50fb6327511c8') 139 75 143 75 / 13% 9.7% 13.3% 9.7% stretch}
.tex.th-summon .g-Second .rb-badge::after{border-image:url('/_blob/3a688e981bd9edbf39ee18a5f062fd35') 113 75 75 75 / 11.6% 9.77% 7.7% 9.77% stretch}
.tex.th-summon .g-Third .rb-badge::after{border-image:url('/_blob/a2b43dbfa0aa9a6b1d5a5bea1e6787cb') 53 / 5.47% 6.84% stretch}
.tex.th-mecha .rb-row{isolation:isolate}
.tex.th-mecha .rb-row::before{content:'';position:absolute;inset:0;z-index:-1;border:1px solid transparent;border-image:url('/_blob/738b9000eb14ae7d66b0a905b46de0be') 60 fill / 18px stretch}
.tex.th-mecha .rb-badge{width:80px;height:80px;background:url('/_blob/bee40ce1b25dfcf3ec229d07c7d5ca0f') 0 0/300% 100% no-repeat;color:transparent}
.tex.th-mecha .g-Second .rb-badge{background-position:50% 0}
.tex.th-mecha .g-Third .rb-badge{background-position:100% 0}
.tex.th-gacha .rb-badge{width:72px;height:72px;border:0;border-radius:0;background:url('/_blob/e825b3005b75f824d7baf657775c2b91') 0 0/300% 100% no-repeat}
.tex.th-gacha .g-Second .rb-badge{background-position:50% 0}
.tex.th-gacha .g-Third .rb-badge{background-position:100% 0}

/* 常驻动效：8 秒一轮，每行错开；只动一小会儿，其余时间静止。 */
.rb-row.amb .fx-sweep{animation:rbSweep 8s infinite;animation-delay:var(--d)}
.th-summon .g-Grand.amb .fx-tw.t1{left:112px;top:14px;margin:0;width:34px;height:34px;animation:rbTwinkle 8s infinite;animation-delay:var(--d)}
.th-summon .g-Grand.amb .fx-tw.t2{left:18px;top:62px;margin:0;width:26px;height:26px;animation:rbTwinkle 8s infinite;animation-delay:calc(var(--d) + .5s)}
.th-mecha .fx-sweep{display:none}
.th-mecha .rb-row.amb .fx-scan{animation:rbScan 8s infinite;animation-delay:var(--d)}
.th-mecha .g-Grand.amb .rb-badge{animation:rbBlink 8s infinite;animation-delay:var(--d)}
.th-gacha .fx-sweep{display:none}
.th-gacha .rb-row.amb .rb-badge{animation:rbWiggle 8s infinite;animation-delay:var(--d)}
.th-gacha .g-Grand.amb .fx-tw.t1{animation:rbSticker 8s infinite;animation-delay:var(--d)}
.th-gacha .g-Second.amb .fx-heart.h1{animation:rbHeart 8s infinite;animation-delay:var(--d)}
@keyframes rbSweep{0%{opacity:0;transform:translateX(-80%)}2%{opacity:1}15%{opacity:1;transform:translateX(260%)}16%,100%{opacity:0;transform:translateX(260%)}}
@keyframes rbTwinkle{0%,6%{opacity:0;transform:scale(0) rotate(0deg)}12%{opacity:1;transform:scale(1) rotate(45deg)}20%,100%{opacity:0;transform:scale(0) rotate(90deg)}}
@keyframes rbScan{0%{opacity:0;top:-48px}2%{opacity:1}13%{opacity:1;top:100%}14%,100%{opacity:0;top:100%}}
@keyframes rbBlink{0%,14%{opacity:1}15%{opacity:.25}16%{opacity:1}17%{opacity:.25}18%,100%{opacity:1}}
@keyframes rbWiggle{0%,100%{transform:none}2%{transform:rotate(-16deg)}4%{transform:rotate(14deg)}6%{transform:rotate(-8deg)}8%{transform:rotate(4deg)}10%{transform:none}}
@keyframes rbSticker{0%,3%{opacity:0;transform:scale(0) rotate(-30deg)}7%{opacity:1;transform:scale(1.15) rotate(8deg)}9%{transform:scale(1) rotate(0deg)}22%{opacity:1;transform:scale(1)}26%,100%{opacity:0;transform:scale(.6)}}
@keyframes rbHeart{0%,2%{opacity:0;transform:translateY(0) scale(.6)}6%{opacity:1;transform:translateY(-20px) scale(1)}20%,100%{opacity:0;transform:translateY(-90px) scale(1)}}

/* 新结果进来：揭晓播完后结果栏淡入，新的一行按档次进场，6 秒一轮。 */
.st-arrive{animation:rbBoard 6s infinite}
.st-arrive.m-pool .rb-row:not(.is-new){animation:rbShift 6s infinite}
.st-arrive .is-new.g-Grand{animation:rbInBig 6s infinite}
.st-arrive .is-new.g-Second{animation:rbInMid 6s infinite}
.st-arrive .is-new.g-Third{animation:rbInSmall 6s infinite}
.st-arrive.m-entry .rb-group.is-new{animation:none}
.st-arrive.m-entry .is-new .rb-name.fresh{animation:rbChip 6s infinite}
.st-arrive .is-new.g-Grand .fx-flash{animation:rbFlash 6s infinite}
.st-arrive .is-new.g-Second .fx-flash{animation:rbFlashSoft 6s infinite}
.st-arrive .is-new .fx-sweep{animation:rbSweepOnce 6s infinite}
.st-arrive .is-new.g-Grand .fx-ring{--ring:4.4;animation:rbRing 6s infinite}
.st-arrive .is-new.g-Second .fx-ring{--ring:3;animation:rbRing 6s infinite}
.st-arrive .is-new.g-Grand .fx-star{animation:rbBurst 6s infinite}
.st-arrive .is-new.g-Second .fx-star.s1,.st-arrive .is-new.g-Second .fx-star.s3,.st-arrive .is-new.g-Second .fx-star.s6{animation:rbBurst 6s infinite}
.th-mecha.st-arrive .is-new .fx-new{animation:rbTag 6s infinite}
.th-mecha.st-arrive .is-new .fx-scan{animation:rbScanOnce 6s infinite}
.th-mecha.st-arrive .is-new.g-Grand .fx-br,.th-mecha.st-arrive .is-new.g-Second .fx-br{animation:rbClamp 6s infinite}
.th-mecha.st-arrive .is-new.g-Grand .fx-haz{animation:rbHaz 6s infinite}
.th-gacha.st-arrive .is-new.g-Grand{animation:rbPopBig 6s infinite}
.th-gacha.st-arrive .is-new.g-Second{animation:rbPopMid 6s infinite}
.th-gacha.st-arrive .is-new.g-Third{animation:rbPopSmall 6s infinite}
.th-gacha.st-arrive.m-entry .rb-group.is-new{animation:none}
.th-gacha.st-arrive .is-new.g-Grand .rb-badge,.th-gacha.st-arrive .is-new.g-Second .rb-badge{animation:rbDrop 6s infinite}
.th-gacha.st-arrive .is-new.g-Grand .fx-conf{animation:rbBurst 6s infinite}
.th-gacha.st-arrive .is-new.g-Second .fx-heart{animation:rbHeartOnce 6s infinite}
.th-gacha.st-arrive .is-new.g-Second .fx-heart.h2{animation-delay:.25s}

/* 藏掉一条：主播在 GUI 点了“不挂出”，这一行淡出收起，下面的上移，最底下补一条；不播档次特效。 */
.st-hide{animation:rbBoard 6s infinite}
.st-hide .is-gone,.st-hide .is-fill{overflow:hidden}
.st-hide .is-gone{animation:rbGone 6s infinite}
.st-hide .is-fill{animation:rbFill 6s infinite}
.st-hide .rb-name.gone{animation:rbChipGone 6s infinite}
@keyframes rbGone{0%,24%{opacity:1;height:100px;margin-bottom:0;transform:none}34%{opacity:0;height:100px;margin-bottom:0;transform:translateX(60px)}46%,100%{opacity:0;height:0;margin-bottom:-12px;transform:translateX(60px)}}
@keyframes rbFill{0%,46%{opacity:0;height:0;margin-top:-12px}58%,100%{opacity:1;height:100px;margin-top:0}}
@keyframes rbChipGone{0%,24%{opacity:1;max-width:400px;transform:none}34%{opacity:0;max-width:400px;transform:scale(.6)}44%,100%{opacity:0;max-width:0;padding:0;border-width:0;margin-left:-10px;transform:scale(.6)}}
/* 翻页：放不下时自动翻，一页停 8 秒，整页淡出淡入；只有页在动，不重播档次特效。 */
.rb-pgs{display:grid;flex-shrink:0}
.rb-pgs>span{grid-area:1/1;white-space:nowrap;font-variant-numeric:tabular-nums}
.th-summon .rb-pgs>span{font:32px 'PingFang SC','Microsoft YaHei UI',sans-serif;color:#e7d9ff}
.th-mecha .rb-pgs>span{padding:0 10px;background:#ff7a1a;color:#0a0c10;font:700 34px/44px var(--condensed)}
.th-mecha.st-page .rb-tag{display:none}
.th-gacha .rb-pgs>span{padding:0 12px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-size:30px;line-height:40px}
.st-page .p1,.st-page .pn1{animation:rbPageA 16s infinite}
.st-page .p2,.st-page .pn2{animation:rbPageB 16s infinite}
@keyframes rbPageA{0%,46%{opacity:1;transform:none}50%{opacity:0;transform:translateY(-16px)}51%,96%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
@keyframes rbPageB{0%,46%{opacity:0;transform:translateY(16px)}50%,96%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-16px)}}
</style>
</helmet>
<div style="position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; background: {{roomFloor}}">
  <sc-if value="{{hasRoom}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; background: {{roomWall}}"></div>
    <sc-for list="{{shapes}}" as="sh" hint-placeholder-count="6">
      <div style="position: absolute; left: {{sh.x}}px; top: {{sh.y}}px; width: {{sh.w}}px; height: {{sh.h}}px; box-sizing: border-box; border-radius: {{sh.r}}; border: {{sh.bd}}; background: {{sh.bg}}"></div>
    </sc-for>
    <span style="position: absolute; left: 48px; bottom: 12px; font: 18px 'PingFang SC', sans-serif; color: {{roomInk}}">直播画面（示意）</span>
  </sc-if>

  <div style="position: absolute; left: {{srcX}}px; top: {{srcY}}px; width: {{W}}px; height: {{H}}px; transform: scale({{scale}}); transform-origin: 0 0">
    <div class="{{boardClass}}">
      <div class="rb-head">
        <span class="rb-title">{{title}}</span><span class="rb-tag">MISSION LOG</span><span class="rb-count">{{count}}</span>
        <sc-if value="{{isPaging}}" hint-placeholder-val="{{false}}"><span class="rb-pgs"><sc-for list="{{pageNos}}" as="pn" hint-placeholder-count="2"><span class="{{pn.cls}}">{{pn.label}}</span></sc-for></span></sc-if>
      </div>
      <div class="rb-pages">
        <sc-for list="{{pages}}" as="pg" hint-placeholder-count="1">
        <div class="{{pg.cls}}">
        <sc-for list="{{pg.rows}}" as="r" hint-placeholder-count="5">
          <div class="{{r.cls}}" style="--d: {{r.delay}}">
            <span class="rb-badge">{{r.badge}}</span>
            <sc-if value="{{isPool}}" hint-placeholder-val="{{true}}">
              <span class="rb-text"><span class="rb-prize">{{r.prize}}</span><span class="rb-who">{{r.who}}</span></span>
            </sc-if>
            <sc-if value="{{isEntry}}" hint-placeholder-val="{{false}}">
              <span class="rb-text">
                <span class="rb-prize">{{r.head}}</span>
                <span class="rb-names">
                  <sc-for list="{{r.names}}" as="n" hint-placeholder-count="2">
                    <span class="{{n.cls}}">{{n.name}}</span>
                  </sc-for>
                </span>
              </span>
            </sc-if>
            <span class="rb-fx" aria-hidden="true">
              <span class="fx-clip"><i class="fx-sweep"></i><i class="fx-scan"></i><i class="fx-flash"></i><i class="fx-haz"></i></span>
              <i class="fx-ring"></i>
              <sc-for list="{{stars}}" as="st" hint-placeholder-count="6">
                <span class="{{st}}">
                  <svg class="shape-sum" viewBox="0 0 24 24"><path d="M12 1.5c.9 5.3 3.2 7.6 8.5 8.5-5.3.9-7.6 3.2-8.5 8.5-.9-5.3-3.2-7.6-8.5-8.5 5.3-.9 7.6-3.2 8.5-8.5z"></path></svg>
                  <svg class="shape-gacha" viewBox="0 0 24 24"><path d="M12 2l2.6 6.2 6.7.6-5.1 4.4 1.6 6.6L12 16.3l-5.8 3.5 1.6-6.6-5.1-4.4 6.7-.6z"></path></svg>
                </span>
              </sc-for>
              <sc-for list="{{twinkles}}" as="tw" hint-placeholder-count="2">
                <span class="{{tw}}">
                  <svg class="shape-sum" viewBox="0 0 24 24"><path d="M12 1.5c.9 5.3 3.2 7.6 8.5 8.5-5.3.9-7.6 3.2-8.5 8.5-.9-5.3-3.2-7.6-8.5-8.5 5.3-.9 7.6-3.2 8.5-8.5z"></path></svg>
                  <svg class="shape-gacha" viewBox="0 0 24 24"><path d="M12 2l2.6 6.2 6.7.6-5.1 4.4 1.6 6.6L12 16.3l-5.8 3.5 1.6-6.6-5.1-4.4 6.7-.6z"></path></svg>
                </span>
              </sc-for>
              <sc-for list="{{hearts}}" as="h" hint-placeholder-count="2">
                <svg class="{{h}}" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.7 3 5 6.6 5c2.2 0 3.6 1.3 5.4 3.3C13.8 6.3 15.2 5 17.4 5 21 5 22.8 8.7 21.5 11.8 19.5 16.4 12 21 12 21z" fill="#ff7aae" stroke="#4b2a4f" stroke-width="1.6"></path></svg>
              </sc-for>
              <sc-for list="{{confetti}}" as="c" hint-placeholder-count="4">
                <i class="{{c}}"></i>
              </sc-for>
              <i class="fx-br b1"></i><i class="fx-br b2"></i><i class="fx-br b3"></i><i class="fx-br b4"></i>
              <i class="fx-new">{{r.newTag}}</i>
            </span>
          </div>
        </sc-for>
        </div>
        </sc-for>
      </div>
    </div>
  </div>

  <sc-if value="{{scaled}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: {{srcX}}px; top: {{srcY}}px; width: {{frameW}}px; height: {{frameH}}px; box-sizing: border-box; border: 2px solid #FF4D4D; pointer-events: none">
      <span style="position: absolute; left: -2px; top: -40px; height: 34px; display: inline-flex; align-items: center; padding: 0 12px; background: #FF4D4D; font: 20px 'PingFang SC', sans-serif; color: #FFFFFF; white-space: nowrap">{{frameLabel}}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["星辰召唤","机甲锁定","萌系扭蛋"],"default":"星辰召唤"},"orient":{"editor":"enum","options":["横屏","竖屏"],"default":"横屏"},"mode":{"editor":"enum","options":["奖池","报名"],"default":"奖池"},"stage":{"editor":"enum","options":["常挂","新结果进来","藏掉一条","翻页"],"default":"常挂"},"tier":{"editor":"enum","options":["大奖","二奖","三奖"],"default":"大奖"},"ambient":{"editor":"enum","options":["只有大奖","每档都有","关"],"default":"只有大奖"},"room":{"editor":"enum","options":["浅色房间","深色房间","透明"],"default":"浅色房间"},"scale":{"editor":"enum","options":["100%","75%","55%","50%"],"default":"100%"},"fx":{"editor":"enum","options":["现在","贴图"],"default":"现在"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const th = { '星辰召唤': 'summon', '机甲锁定': 'mecha', '萌系扭蛋': 'gacha' }[p.theme ?? '星辰召唤'] || 'summon';
    const port = (p.orient ?? '横屏') === '竖屏';
    const W = port ? 1080 : 1920, H = port ? 1920 : 1080;
    const entry = (p.mode ?? '奖池') === '报名';
    const arrive = (p.stage ?? '常挂') === '新结果进来';
    const hide = p.stage === '藏掉一条';
    const paging = p.stage === '翻页';
    const newest = { '大奖': 'Grand', '二奖': 'Second', '三奖': 'Third' }[p.tier ?? '大奖'] || 'Grand';
    const amb = p.ambient ?? '只有大奖';
    const room = p.room ?? '浅色房间';
    const scale = parseFloat(p.scale ?? '100%') / 100 || 1;

    const words = {
      summon: { title: '召唤结果', badge: { Grand: 'SSR', Second: 'SR', Third: 'R' }, count: entry ? (paging ? '11 人中奖' : hide ? '5 人中奖' : '6 人中奖') : (paging ? '共 9 次' : hide ? '共 11 次' : '共 12 次') },
      mecha: { title: '作战结果', badge: { Grand: 'S', Second: 'A', Third: 'B' }, count: entry ? (paging ? '11 人' : hide ? '5 人' : '6 人') : (paging ? '9 次' : hide ? '11 次' : '12 次') },
      gacha: { title: '中奖啦！', badge: { Grand: '', Second: '', Third: '' }, count: entry ? (paging ? '11 人中奖' : hide ? '5 人中奖' : '6 人中奖') : (paging ? '共 9 颗' : hide ? '共 11 颗' : '共 12 颗') }
    }[th];
    const ambOn = (g) => amb === '每档都有' || (amb === '只有大奖' && g === 'Grand');
    const base = (g, i, isNew) => ({
      cls: ['rb-row', 'g-' + g, entry ? 'rb-group' : '', ambOn(g) && !(arrive && isNew) ? 'amb' : '', arrive && isNew ? 'is-new' : ''].join(' '),
      badge: words.badge[g],
      // Rows share one 8 s loop, offset so two rows never move at the same moment.
      delay: (-(i * 2.6) % 8).toFixed(1) + 's',
      newTag: 'NEW · ' + { Grand: 'S', Second: 'A', Third: 'B' }[g]
    });
    const prizeOf = { Grand: '机械键盘', Second: '周边抱枕', Third: '签名照' };
    const rows = entry
      ? [['Grand', '一等奖', '机械键盘', ['柚子不酸']], ['Second', '二等奖', '周边抱枕', ['一只小鹿', '晚风']], ['Third', '三等奖', '签名照', ['阿狸', 'Momo', '小鱼干']]]
        .map(([g, award, prize, names], i) => Object.assign(base(g, i, g === newest), {
          head: award + ' · ' + prize,
          names: names.map((name, k) => ({ name, cls: 'rb-name' + (arrive && g === newest && k === names.length - 1 ? ' fresh' : '') + (hide && name === '晚风' ? ' gone' : '') }))
        }))
      : [[newest, prizeOf[newest], '柚子不酸'], ['Third', '贴纸套装', '一只小鹿'], ['Second', '周边抱枕', '主播点停'], ['Grand', '机械键盘', '晚风'], ['Third', '签名照', '阿狸']]
        // 藏掉第 3 条时，第 6 条（原本挤出去的）补到最下面。
        .concat(hide ? [['Third', '贴纸套装', 'Momo']] : [])
        .map(([g, prize, who], i) => {
          const r = Object.assign(base(g, i, i === 0), { prize, who });
          if (hide) r.cls += i === 2 ? ' is-gone' : i === 5 ? ' is-fill' : '';
          return r;
        });
    // 翻页：第 2 页是更早的结果，奖池 4 条、报名抽奖接着第 1 页的三等奖往下排。
    const page2 = entry
      ? [['Third', '三等奖', '签名照', ['橘子汽水', '夜猫', '星星']], ['Third', '参与奖', '贴纸套装', ['Kiki', '豆包']]]
        .map(([g, award, prize, names], i) => Object.assign(base(g, i + 3, false), { head: award + ' · ' + prize, names: names.map((name) => ({ name, cls: 'rb-name' })) }))
      : [['Third', '贴纸套装', 'Momo'], ['Second', '周边抱枕', '小鱼干'], ['Third', '签名照', '橘子汽水'], ['Grand', '机械键盘', '夜猫']]
        .map(([g, prize, who], i) => Object.assign(base(g, i + 5, false), { prize, who }));
    const pages = paging ? [{ cls: 'rb-page p1', rows }, { cls: 'rb-page p2', rows: page2 }] : [{ cls: 'rb-page', rows }];

    const light = room === '浅色房间';
    const pal = light
      ? { wall: 'linear-gradient(180deg, #F6F1EA 0%, #EDE5D9 100%)', floor: '#C9B497', window: 'linear-gradient(160deg, #DDEFFC 0%, #BFDDF3 100%)', frame: '#C8B79F', prop1: '#9CC5A1', prop2: '#E8A6A0', prop3: '#E9CF8B', person: '#B79F86', desk: '#D4C0A3', ink: 'rgba(60, 40, 20, 0.55)' }
      : { wall: 'linear-gradient(180deg, #1B1E25 0%, #242833 100%)', floor: '#111318', window: 'linear-gradient(160deg, #2C3A5A 0%, #1E2740 100%)', frame: '#353A46', prop1: '#2F6B5A', prop2: '#7A3B5C', prop3: '#6B5A2F', person: '#3A3F4C', desk: '#191B21', ink: 'rgba(255, 255, 255, 0.55)' };
    const box = (x, y, w, h, bg, r, bd) => ({ x, y, w, h, bg, r: r || '10px', bd: bd || '0' });
    const shapes = port ? [
      box(90, 260, 380, 300, pal.window, '10px', '14px solid ' + pal.frame),
      box(620, 420, 360, 16, pal.frame, '8px'), box(660, 340, 80, 80, pal.prop1, '12px'), box(780, 316, 56, 104, pal.prop2, '10px'),
      box(390, 640, 300, 300, pal.person, '50%'), box(240, 900, 600, 1100, pal.person, '300px 300px 0 0'),
      box(0, 1580, 1080, 340, pal.desk, '0')
    ] : [
      box(120, 110, 420, 300, pal.window, '10px', '14px solid ' + pal.frame),
      box(1260, 150, 460, 18, pal.frame, '9px'), box(1300, 70, 90, 80, pal.prop1, '12px'), box(1420, 40, 60, 110, pal.prop2, '10px'), box(1560, 92, 110, 58, pal.prop3, '29px'),
      box(420, 330, 300, 300, pal.person, '50%'), box(280, 600, 580, 520, pal.person, '260px 260px 0 0'),
      box(0, 860, 1920, 220, pal.desk, '0')
    ];
    const scaled = scale < 1;
    const srcX = !scaled ? 0 : port ? 40 : Math.round(W - W * scale - 80);
    const srcY = !scaled ? 0 : port ? 360 : Math.round(H - H * scale - 70);
    const prizePx = (entry ? 52 : port ? 52 : 56);

    return {
      W, H, scale, srcX, srcY, scaled,
      frameW: Math.round(W * scale), frameH: Math.round(H * scale),
      frameLabel: '浏览器素材 ' + W + '×' + H + ' · 缩小到 ' + Math.round(scale * 100) + '% · 奖品字实际 ' + Math.round(prizePx * scale) + 'px',
      hasRoom: room !== '透明',
      roomWall: pal.wall, roomFloor: room === '透明' ? 'transparent' : pal.floor, roomInk: pal.ink, shapes,
      boardClass: ['rb', 'th-' + th, (p.fx ?? '现在') === '贴图' ? 'tex' : '', port ? 'o-port' : 'o-land', entry ? 'm-entry' : 'm-pool', arrive ? 'st-arrive' : hide ? 'st-hide' : paging ? 'st-page' : 'st-pinned'].join(' '),
      title: words.title, count: words.count,
      isPool: !entry, isEntry: entry,
      pages, isPaging: paging,
      pageNos: [{ cls: 'pn1', label: '1 / 2' }, { cls: 'pn2', label: '2 / 2' }],
      stars: ['fx-star s1', 'fx-star s2', 'fx-star s3', 'fx-star s4', 'fx-star s5', 'fx-star s6'],
      twinkles: ['fx-tw t1', 'fx-tw t2'],
      hearts: ['fx-heart h1', 'fx-heart h2'],
      confetti: ['fx-conf c1', 'fx-conf c2', 'fx-conf c3', 'fx-conf c4']
    };
  }
}
</script>
</body>
</html>
