<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SP1 启动页 · 看板娘主视觉 1200×720</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: {{width}}px; height: {{height}}px; overflow: hidden; background: #0F1550; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', 'Segoe UI', sans-serif">
  <img src="/_blob/070323ec5f79aecdb3017a06b45b4a43" alt="Aether 看板娘在星空下挥手，手心托着气泡精灵" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover">
  <span style="position: absolute; left: 44px; top: 56px; font-size: 30px; line-height: 36px; font-weight: 700; color: #FFFFFF">Aether</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"width":{"editor":null,"default":1200},"height":{"editor":null,"default":720},"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      width: this.props.width ?? 1200,
      height: this.props.height ?? 720
    };
  }
}
</script>
</body>
</html>
