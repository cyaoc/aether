      }
    }
    v.pos = { x: pk.x, y: pk.y, a: pk.a, flip: pk.flip };
    if (cx != null) { v.chest = { x: cx }; L.chest = { x: cx, y: CHEST.y }; }
    else if (L.chest?.hang && !gm.out) v.chest = {};   // hanging in the air
    if (v.landed != null && now - v.landed < 260 && free) st.shake = [[v.landed, 3, 260]];   // the chest thuds down
    if (free && gm.say && now - gm.say.at < 2600) st.bubble = { text: gm.say.text, t: now - gm.say.at };
    return st;
  }

  // The chest on a rope len long swings like a weight from pivot: it lags when what carries it starts off and swings on
  // when that stops, and settles. Returns the rope's angle from straight down.
  swing(pivot, len) {
    const rt = performance.now(), s = this.sw ??= { a: 0, w: 0, x: pivot.x, vx: 0, rt };
    const dt = Math.min(40, (rt - s.rt) * this.cfg.speed);
    s.rt = rt;
    if (dt > 0) {
      const vx = clamp((pivot.x - s.x) / dt, -0.6, 0.6), ax = clamp((vx - s.vx) / dt, -0.004, 0.004);
      s.w += (-1.6e-5 * Math.sin(s.a) - 0.3 * ax / len * Math.cos(s.a) - 0.0016 * s.w) * dt;
      Object.assign(s, { a: clamp(s.a + s.w * dt, -0.5, 0.5), vx, x: pivot.x });
    }
    return s.a;
  }

  pkCell(pose) { const [k, i] = PKPOSE[pose]; return this.cells[k][i]; }

  // The drawing of it to show now: a loop's frame (PKSTRIP) or its cell. Where its rope ends is the cell's (pkCell): a
  // loop keeps its fists and rope still.
  pkFrame(pose) { const f = this.pkstrips?.[pose]; return f ? f[Math.floor(this.clock / PKSTRIP[pose].ms) % 4] : this.pkCell(pose); }

  // The in-betweens from one of its poses to another: drawn for the two (PKTRANS, the other way round backwards), or
  // else by way of pulling its rope (tug), the in-betweens to it, its drawing and those on, as she goes by her standing
  // (route): a gift landing just after another, or the fight won while it laughs, chains what is drawn. None: a switch.
  pkRoute(a, b) {
    const tw = (x, y) => this.pkTweens[`${x}>${y}`] || this.pkTweens[`${y}>${x}`]?.slice().reverse();
    if (tw(a, b)) return tw(a, b);
    return a !== 'tug' && b !== 'tug' && tw(a, 'tug') && tw('tug', b) ? [...tw(a, 'tug'), this.pkCell('tug'), ...tw('tug', b)] : null;
  }

  // The prankster at p, its drawing's centre: every sheet's first cell is its idle drawing, the ruler that brings its
  // sheets to one size.
  drawPk(g, p) {
    // A change of its pose plays its in-betweens (pkRoute), 90 ms each, as hers do, and the lean it pulls at (rot) goes
    // over to the new one with them.
    // Turning round (its flip changes) it changes at once: the in-betweens are drawn facing one way.
    const rt = performance.now(), pv = this.pv ??= { pose: p.pose, at: -1e9, tween: null, rot: p.rot, flip: p.flip };
    if (p.pose !== pv.pose) Object.assign(pv, { tween: !!pv.flip === !!p.flip && this.pkRoute(pv.pose, p.pose) || null, pose: p.pose, at: rt, from: pv.rot });
    pv.flip = p.flip;
    const i = Math.floor((rt - pv.at) * this.cfg.speed / 90), tw = pv.tween?.[i];
    const c = tw || this.pkFrame(p.pose), rot = tw ? pv.from + (p.rot - pv.from) * (i + 1) / (pv.tween.length + 1) : p.rot;
    const s = PK_H / c.ruler * p.scale, t = p.trim || 0;   // trim: that much of the rope it holds, at the drawing's left, is left off
    pv.rot = rot;
    g.save(); g.globalAlpha = p.a; g.translate(p.x, p.y); g.rotate(rot); g.scale(p.flip ? -s : s, s);
    g.drawImage(c.im, c.x + t, c.y, c.w - t, c.h, c.x + t - c.cx, c.y - c.cy, c.w - t, c.h); g.restore();
  }

  // A little gift box, b its half side.
  giftIcon(g, x, y, b, rot = 0) {
    g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = '#FF9EB8'; g.strokeStyle = '#4A2E2A'; g.lineWidth = 1.5; g.beginPath(); g.roundRect(-b, -b, 2 * b, 2 * b, b * 0.3); g.fill(); g.stroke();
    g.fillStyle = '#E8454F'; g.fillRect(-b * 0.2, -b, b * 0.4, 2 * b); g.fillRect(-b, -b * 0.2, 2 * b, b * 0.4); g.beginPath(); g.ellipse(-b * 0.45, -b - b * 0.28, b * 0.42, b * 0.28, -0.5, 0, Math.PI * 2); g.ellipse(b * 0.45, -b - b * 0.28, b * 0.42, b * 0.28, 0.5, 0, Math.PI * 2); g.fill(); g.restore();
  }

  // The chest game's drawings, over her and everything of hers: the chest (standing, or hanging by the handle the hook
  // rope is in, that end up), the prankster and its rope, what drops, the numbers, the fight's board along the top of the
  // page, and what the prankster says. Nothing of it passes behind her: it flies over her head or stays on her right.
  drawGame(g, st, now, her, bub) {
    const gm = this.gm, L = this.gl, v = gm.visit, box = this.chestBox;
    if (!L) return;
    const c = L.chest, pk = L.pk, top = CHEST.y - box.h, sv = this.sv;
    const text = (str, x, y, font, fill) => { g.font = font; g.lineJoin = 'round'; g.lineWidth = 4; g.strokeStyle = 'rgba(40,26,54,0.88)'; g.strokeText(str, x, y); g.fillStyle = fill; g.fillText(str, x, y); };
    // A rope from a to the ring that hangs from the link at p: a pull on the rope, or the chest's own weight on it, swings
    // the ring out toward a, and a slack rope leaves it hanging; the rope ends in a hook round the far side of the ring.
    // It sags by sag of its length, trembles when it is pulled taut, and shows its twist all along.
    const rope = (a, p, sag = 0, taut = false, pull = taut) => {
      const far = RING.reach * K, d0 = Math.hypot(a.x - p.x, a.y - p.y) || 1, u = pull ? { x: (a.x - p.x) / d0, y: (a.y - p.y) / d0 } : { x: 0, y: 1 };
      this.drawRing(g, p, u.x, u.y);
      const h = { x: p.x + u.x * far, y: p.y + u.y * far };   // the middle of the ring's band on its far side: the hook is round it
      // the hook's shank lies the way the rope leaves it (w), the rope's end b tied to it
      const dh = Math.hypot(a.x - h.x, a.y - h.y) || 1, wx = (a.x - h.x) / dh, wy = (a.y - h.y) / dh + 2 * sag, dw = Math.hypot(wx, wy), w = { x: wx / dw, y: wy / dw };
      const b = { x: h.x + w.x * HOOK, y: h.y + w.y * HOOK };
      const d = Math.hypot(b.x - a.x, b.y - a.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 + sag * d + (taut ? 0.9 * Math.sin(now / 31) : 0) };
      const on = q => ({ x: (1 - q) * (1 - q) * a.x + 2 * q * (1 - q) * m.x + q * q * b.x, y: (1 - q) * (1 - q) * a.y + 2 * q * (1 - q) * m.y + q * q * b.y });
      g.save(); g.lineCap = 'round';
      for (const [lw, col] of [[7, '#6B4A2A'], [4.5, '#D9AE72']]) { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.moveTo(a.x, a.y); g.quadraticCurveTo(m.x, m.y, b.x, b.y); g.stroke(); }
      g.strokeStyle = 'rgba(107,74,42,0.8)'; g.lineWidth = 1.2;
      for (let s = 5; s < d - 2; s += 6) {
        const q = on(s / d), n = on(Math.min(1, (s + 1) / d)), ang = Math.atan2(n.y - q.y, n.x - q.x) + 1;
        g.beginPath(); g.moveTo(q.x - 2.6 * Math.cos(ang), q.y - 2.6 * Math.sin(ang)); g.lineTo(q.x + 2.6 * Math.cos(ang), q.y + 2.6 * Math.sin(ang)); g.stroke();
      }
      // the hook: steel, its shank from the rope's end, its bend round the ring's band, its point coming back
      const th = Math.atan2(w.x, -w.y);
      for (const [lw, col] of [[4.6, '#3B4050'], [2.4, '#D7DCE6']]) {
        g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.moveTo(b.x, b.y);
        g.lineTo(h.x - w.y * 2.8 + w.x, h.y + w.x * 2.8 + w.y); g.arc(h.x, h.y, 2.8, th, th + Math.PI);
        g.lineTo(h.x + w.y * 2.8 + w.x * 2.4, h.y - w.x * 2.8 + w.y * 2.4); g.stroke();
      }

    };

    g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(x + w / 2 - 1, y + 2, 2, h - 4);   // the middle, where it started
    if (gu < 700) { const from = at(gh.lead), gx = from + (lx - from) * k01(gu, 400, 700); seg(Math.min(gx, lx), Math.max(gx, lx), '#fff', 0.92); }
    if (v.result) { const f = now - v.resultAt; seg(v.result > 0 ? x + 2 : lx, v.result > 0 ? lx : x + w - 2, '#fff', 0.7 * Math.abs(Math.sin(f / GAME.flash * Math.PI * 2))); }
    const lu = v.luck && now - v.luck.at >= DOUBLE.fly ? now - v.luck.at - DOUBLE.fly : null;
    if (lu != null) {
      const sd = v.luck.side, [a, b] = sd > 0 ? [x + 2, lx] : [lx, x + w - 2];
      if (b - a > 4) {
        g.save(); g.beginPath(); g.roundRect(a, y + 2, b - a, h - 4, (h - 4) / 2); g.clip();
        g.fillStyle = `rgba(255,255,255,${0.32 * this.hurry(v, now)})`;
        for (let sx = a - 48 + (now / 14) % 24 * sd; sx < b + 24; sx += 24) { g.beginPath(); g.moveTo(sx, y + h - 2); g.lineTo(sx + 9, y + h - 2); g.lineTo(sx + 19, y + 2); g.lineTo(sx + 10, y + 2); g.fill(); }
        g.restore();
      }
      if (lu < DOUBLE.flash) seg(a, b, '#fff', 0.85 * (1 - lu / DOUBLE.flash));
    }
    const cb = this.props.chest, chh = 32, chw = cb.width / cb.height * chh, hop = v.judge != null && !v.result ? 4 * Math.abs(Math.sin((now - v.judge) / 110)) : 0;
    g.drawImage(cb, lx - chw / 2, y + h / 2 - chh * 0.6 - hop, chw, chh);
    g.restore();
    if (v.phase !== 'tug') return g.restore();   // still in the air: no rows yet, it flies right through where they go
    // Under the bar, each side from its end inward. The first row: its gift's icon on a disc, then a paper ball and 发「1」 /
    // 发「2」 (the danmaku throws balls; the 1 in quotes, what to send); while that side's gift counts twice the icon glows pink and beats in a pink ring
    // running down the window (DOUBLE). The second: the avatars of whoever joined it by gift, the newest first, five at
    // most and +N for the rest; a new one pops in.
    for (const side of [1, -1]) {
      const end = side > 0 ? x : x + w, at2 = d => end + side * d, icon = this.sideIcon[side], [r1, r2] = ROW, c = this.iconAt(side), disc = ICON / 2 + 4;
      const on = v.luck?.side === side && now - v.luck.at >= DOUBLE.fly, out = !v.luck && v.luckOut?.side === side && now - v.luckOut.at < DOUBLE.out;
      if (on || out) {
        const pop = on ? 1 + 0.5 * (1 - ease(k01(now - v.luck.at - DOUBLE.fly, 0, DOUBLE.pop))) : 1, R = (disc + 18) * pop;
        const gr = g.createRadialGradient(c.x, c.y, disc * 0.6, c.x, c.y, R); gr.addColorStop(0, 'rgba(255,150,195,0.9)'); gr.addColorStop(1, 'rgba(255,150,195,0)');
        g.save(); g.globalAlpha = out ? 1 - (now - v.luckOut.at) / DOUBLE.out : this.hurry(v, now); g.fillStyle = gr; g.beginPath(); g.arc(c.x, c.y, R, 0, Math.PI * 2); g.fill(); g.restore();
      }
      const beat = on ? 1 + 0.14 * Math.max(0, Math.sin((now - v.luck.at) / 1000 * Math.PI * 2 * (v.luck.until - now < DOUBLE.hurry ? 3 : 1.4))) : 1;
      g.save(); g.translate(c.x, c.y); g.scale(beat, beat);
      g.beginPath(); g.arc(0, 0, disc, 0, Math.PI * 2); g.fillStyle = 'rgba(40,26,54,0.85)'; g.fill(); g.lineWidth = 3; g.strokeStyle = SIDE_COL[side]; g.stroke();
      if (icon) g.drawImage(icon, -ICON / 2, -ICON / 2, ICON, ICON); else this.giftIcon(g, 0, 0, 18);
      g.restore();
      if (on) {
        const k = clamp((v.luck.until - now) / LUCK.ms, 0, 1);
        g.save(); g.globalAlpha = this.hurry(v, now); g.strokeStyle = '#FF96C3'; g.lineWidth = 4; g.lineCap = 'round'; g.beginPath(); g.arc(c.x, c.y, disc + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); g.stroke(); g.restore();
      }
      const ball = this.ball.plain, bh = 30, bw = ball.width / ball.height * bh, bx = at2(disc * 2 + 14 + bw / 2);
      g.drawImage(ball, bx - bw / 2, r1 - bh / 2, bw, bh);
      g.save(); g.textAlign = side > 0 ? 'left' : 'right'; g.textBaseline = 'middle'; text(`发「${side > 0 ? 1 : 2}」`, at2(disc * 2 + 14 + bw + 6), r1 + 1, `800 24px ${SANS}`, SIDE_LIGHT[side]); g.restore();
      const joined = [...v.sides.values()].filter(m => m.side === side && m.by === 'gift').reverse();
      joined.slice(0, 5).forEach((m, i) => {
        const cx = at2(16 + i * 26), pop = 0.6 + 0.4 * ease(k01(now - m.at, 0, 220)), r = 16 * pop, im = this.avatars[m.av];
        g.save(); g.beginPath(); g.arc(cx, r2, r + 2, 0, Math.PI * 2); g.fillStyle = SIDE_COL[side]; g.fill();
        g.beginPath(); g.arc(cx, r2, r, 0, Math.PI * 2); g.clip(); if (im) g.drawImage(im, cx - r, r2 - r, 2 * r, 2 * r); g.restore();
      });
      if (joined.length > 5) { g.save(); g.textAlign = 'center'; g.textBaseline = 'middle'; text(`+${joined.length - 5}`, at2(16 + 4 * 26 + 46), r2 + 1, `800 24px ${SANS}`, '#fff'); g.restore(); }
    }
    g.restore();
  }

  // A 绝杀 (gm.buzzer) for GAME.buzzer once the fight is decided and the bar has flashed, where the fight's board was (it
  // is gone by then, and all eyes were on it). It is gone again before the sprite flies the chest home across the top of
  // the page (2.4 s after: it went right through it when it stayed 3 s); her 守住了 line says the name once more: 绝杀！ large in the winners' colour, under it the avatar of whoever scored it, if they joined by a
  // gift, and their name.
  drawBuzzer(g, now) {
    const b = this.gm.buzzer, u = b ? now - b.at : Infinity;
    if (u < 0 || u >= GAME.buzzer) return;   // (it waits for the bar's flash)
    const a = k01(u, 0, 150) * (1 - k01(u, GAME.buzzer - 400, GAME.buzzer)), pop = 1 + 0.35 * (1 - ease(k01(u, 0, 260)));
    const text = (str, x, y, font, fill, lw = 4) => { g.font = font; g.lineJoin = 'round'; g.lineWidth = lw; g.strokeStyle = 'rgba(40,26,54,0.88)'; g.strokeText(str, x, y); g.fillStyle = fill; g.fillText(str, x, y); };
    g.save(); g.globalAlpha = a; g.textAlign = 'center'; g.textBaseline = 'middle';
    const glow = g.createRadialGradient(PAGE.w / 2, 60, 10, PAGE.w / 2, 60, 150);
    glow.addColorStop(0, SIDE_COL[b.side] + '66'); glow.addColorStop(1, SIDE_COL[b.side] + '00');
    g.fillStyle = glow; g.fillRect(0, 0, PAGE.w, 160);
    g.save(); g.translate(PAGE.w / 2, 60); g.scale(pop, pop); text('绝杀！', 0, 0, `900 56px ${SANS}`, SIDE_COL[b.side], 7); g.restore();
    const im = b.w?.av && this.avatars[b.w.av], name = b.w?.name ?? '', nw = (g.font = `800 28px ${SANS}`, g.measureText(name).width), full = (im ? 44 : 0) + nw;
    let nx = PAGE.w / 2 - full / 2;
    if (im) { g.save(); g.beginPath(); g.arc(nx + 18, 118, 20, 0, Math.PI * 2); g.fillStyle = SIDE_COL[b.side]; g.fill(); g.beginPath(); g.arc(nx + 18, 118, 18, 0, Math.PI * 2); g.clip(); g.drawImage(im, nx, 100, 36, 36); g.restore(); nx += 44; }
    g.textAlign = 'left'; text(name, nx, 119, `800 28px ${SANS}`, '#fff');
    g.restore();
  }

  gameCaption(now) {
    const gm = this.gm, v = gm.visit;
    return `小游戏：家里的宝箱 ${gm.chest} 电池` + (gm.aside ? `（它走了再加 ${gm.aside}）` : '') + ` · 连守 ${gm.streak} · 被偷 ${gm.steals} · ` + (gm.pk ? 'PK 中 · ' : '') + (v ? `捣蛋鬼 ${v.phase}` + (v.phase === 'tug' ? `，红 ${v.red} : 蓝 ${v.blue}，线 ${v.net} / ±${v.span}，剩 ${Math.ceil(v.left / 1000)} 秒` + (v.judge != null ? '，判定中' : '') : '') + (v.sides.size ? ` · 站队 ${[...v.sides.values()].map(m => m.name + (m.side > 0 ? '→她' : '→它') + (m.by === 'gift' ? '（礼物）' : '')).join('、')}` : '') + (v.luck ? ` · ${v.luck.side > 0 ? '人气票' : '小花花'}双倍中` : '')
      : gm.due ? '捣蛋鬼等她演完就来' : `上次走后 ${Math.floor((now - gm.last) / 60000)} 分`);
  }

  // ---- what she is doing at a moment --------------------------------------------------------------------------------
  base() { return { pose: 'idle', x: FOOT.x, y: FOOT.y, s: 1, sx: 1, sprite: 'sIdle', sp: null, sBehind: false, sScale: 1, sAlpha: 1, fx: [], bubble: null, hide: false }; }

  // since: how long she has been in this mood (or lottery wait) without an event.
  idleState(now, mood, since = now) {
    const st = this.base();
    if (this.lot && (this.lot.phase === '等待' || this.lot.phase === '转动')) { st.pose = 'hope'; st.fx.push(['sweat', 0, 2400]); this.talk(st, '等开奖', now, since); return st; }
    if (mood === '开心') { st.y -= 6 * Math.abs(Math.sin(now / 380)); st.orbit = now; }
    if (mood === '平静' && now % 7000 > 5800) st.sprite = 'sLook';  // now and then it looks up at her
    if (mood === '无聊') { st.fx.push(['dots', 0, 6000], ['sigh', 0, 7000]); }
    if (mood === '沮丧') st.fx.push(['gloom', 0]);
    if (mood === '无聊') { st.pose = 'bored'; st.sprite = now % 8000 < 2600 ? 'yawn' : 'sIdle'; st.sp = ['home', 10 * Math.sin(now / 1800), 6 * Math.sin(now / 1300)]; }
    if (mood === '沮丧') { st.pose = 'gloomy'; st.sprite = 'pat'; st.sp = 'head'; }
    if (mood === '犯困') { st.pose = 'doze'; st.sprite = 'sleep'; st.sp = 'knee'; }
    this.talk(st, this.lot?.phase === '报名中' ? '报名中' : this.moodHold?.mood === mood && this.moodHold.lines || mood, now, since);
    if (mood === '犯困') {
      // every other half minute her head drops onto her knees: she jolts awake, insists she wasn't asleep, and dozes off again
      const u = since % 30000;
      if (u >= 23000 && u < 24400) { st.pose = 'awake'; st.y -= 10 * bump(u, 23000, 23300); st.sprite = 'surprised'; st.bubble = { text: this.saying('打瞌睡惊醒', now - u + 23000), t: u - 23000 }; st.fx.push(['bang', now - (u - 23000)], ['shock', now - (u - 23000)]); }
      else st.fx.push(['z', now]);
    }
    return st;
  }

  // A mood or a lottery wait says a line 0.6 s in and another every 15 s after (平静 and 开心 say nothing).
  talk(st, key, now, since) {
    const u = since % 15000;
    if (LINES[key] && u >= 600 && u < 4600) st.bubble = { text: this.fill(this.saying(key, now - u + 600)), t: u - 600 };
  }

  eventState(name, t, opts, line) {
    const st = this.base();
    st._t = t; st.glow = GLOW[EVENTS[name]?.glow || EVENTS[name]?.tier || 'D'];
    const say = (from, text = line) => { if (t >= from && text) st.bubble = { text, t: t - from }; };
    const hop = (a, h = 10) => { st.y -= h * bump(t, a, a + 320); if (h >= 10) st.fx.push(['dust', a + 300]); };  // a puff where she lands
    switch (name) {
      // it looks up at her first, then waves its flag with her
      case '进场': st.pose = 'wave'; hop(0, 8); st.sprite = t < 350 ? 'sLook' : 'flag'; say(100); break;
      case '盲盒查询': this.queryShow(t, st, opts, line, hop); break;
      case 'PK·双倍条件': case 'PK·2倍': case 'PK·双倍还剩10秒': case 'PK·最后10秒': this.signShow(name, t, st, opts, say); break;
      case 'PK·对手': this.intelShow(t, st, opts); break;
      case 'PK·结果': this.pkEndShow(t, st, opts, say, hop); break;
      case 'PK·比分': this.pkGapShow(t, st, opts, say, hop); break;
      case 'PK·挑战': this.pkChallengeShow(t, st, opts, say); break;
      // they bow together
      case '普通礼物': st.pose = t < 1500 ? 'bow' : 'idle'; st.sprite = t < 1500 ? 'nod' : 'sHappy'; st.fx.push(['hearts', 200, 3]); say(150); break;
      // it copies her: up beside her shoulder, hiding its face too
      // little boxes fly in from both sides one after another; at the fifth she hides her face
      case '连着送':
        st.pose = t < 1250 ? 'idle' : 'shy'; if (t >= 1250) { st.sprite = 'hide'; st.sp = ['rel', -0.04, 0.42]; } else st.sprite = 'sLook';
        if (t >= 1250) st.fx.push(['hearts', 1250, 7]); say(1250); break;
      // the box drops from above her head into her hands; she cheers and tosses the sprite
      case '中礼物':
        st.pose = at(t, [[0, 'idle'], [1100, 'giftBox'], [2000, 'cheer']]); hop(1200, 6); hop(2000, 14);
        if (t < 2000) { st.sprite = 'sLook'; st.sp = ['rel', 0.04, 0.52]; } else this.toss(st, t, 2000);
        say(1200); break;
      case '大礼物': this.bigGift(t, st, say); break;
      case '新的第一名':
        st.pose = t < 1300 ? 'idle' : 'crownV';
        st.sprite = t < 1600 ? 'crown' : 'sHappy';
        st.sp = t < 1600 ? ['crown', ease(k01(t, 0, 900)), ease(k01(t, 900, 1300))] : ['home-from-top', ease(k01(t, 1600, 2400))];
        st.fx.push(['ring', 1300], ['sparkles', 1300]); say(1300); break;
      // it listens at the box with her (its seams glowing in the tier's colour first) and is blown back when it opens; then
      // the round's ending: a win cheers (a big one sends a beam to the top of the page and a star that bursts over it),
      // breaking even she smiles and nods, a loss pouts and stamps and then bows her thanks while it pats her head
      case '盲盒·小': case '盲盒·中': case '盲盒·大': {
        const size = ['盲盒·小', '盲盒·中', '盲盒·大'].indexOf(name), r = opts.result || '赚', win = r === '赚' || r === '大奖', loss = r === '亏';
        // the light is the tier's (中 sea blue, 大 purple); a jackpot shines gold, the top colour, like the lottery's 大奖
        if (r === '大奖') st.glow = GLOW.SS;
        const o = BOX_OPEN[name], wow = [0, 2000, 2600][size];
        const steps = size === 0 ? [[0, 'shakeBox'], [o, 'openBox'], [1500, loss ? 'pout' : 'nod']]
          : loss ? [[0, 'shakeBox'], [o, 'openBox'], [[0, 2000, 3500][size], 'pout'], [[0, 3000, 4700][size], 'bow']]
          : [[0, 'shakeBox'], [o, 'openBox'], [wow, 'surprised'], [[0, 2600, 3500][size], win ? 'cheer' : 'nod']];
        const react = steps[size === 0 ? 2 : loss ? 2 : 3][0], thanks = loss && size ? steps[3][0] : Infinity;
        st.pose = at(t, steps);
        if (win && size) hop(react, 14); else if (win) hop(react, 8);
        if (loss && t >= react && t < thanks) st.y -= 4 * Math.abs(Math.sin((t - react) / 90));
        if (t < o) { st.sprite = 'sLook'; st.sFlip = true; st.sp = BOX_EAR; }
        else if (t < react) { if (loss && !size) { st.sprite = 'hide'; st.sp = ['rel', 1.1, 0.3]; } else { st.sprite = 'surprised'; st.sp = ['rel', 1.12, 0.02]; } }
        else if (win) { st.sprite = 'sHappy'; st.sp = ['home', 0, -14 * bump(t, react, react + 320)]; }
        else if (loss && t < thanks) { st.sprite = 'pat'; st.sp = 'head'; }
        else st.sprite = 'nod';
        if (size && !loss) st.fx.push(['bang', wow], ['shock', wow]);
        if (size === 2) st.fx.push(['pillar', o, 1100, null, 'box'], ['bigStar', o], ['fountain', 2500, 1800, { x: FOOT.x, y: 200 }]);
        if (size === 1) st.fx.push(['beam', o], ['fountain', o + 50, 1300, { x: FOOT.x, y: 500 }]);
        if (win) st.fx.push(['sparkles', react], ...(size ? [['confetti', react]] : []));
        if (loss) st.fx.push(...(size ? [] : [['puff', o]]), ['sweat', react - 550], ['gloom', react - 500, 450], ['anger', react, 900]);
        say(o + 100); break;
      }
      // the sprite dresses her, salutes beside her in its sailor collar, and dresses her back
      case '舰长':
        if (t < 600) this.dress(st, t, 0, 600);
        else { st.pose = 'capSalute'; hop(600, 8); st.sprite = 'sailor'; st.sp = ['rel', -0.1, 0.42]; }
        if (t >= 3700) { st.pose = t < 4300 ? 'capSalute' : 'idle'; if (t < 4300) this.dress(st, t, 3700, 4300); else st.sprite = 'sHappy'; }
        st.fx.push(['flash', 600, 0.6], ['seaBubbles', 600], ['flash', 4300, 0.6]); say(800); break;
      case '提督': this.admiral(t, st, say); break;
      case '总督': this.governor(t, st, say); break;
      case '城堡': this.castleShow(t, st, say); break;
      // it flies up beside her raised fist with its flag
      case '报名开场': case '奖池开场': st.pose = 'announce'; hop(0, 12); st.sprite = 'flag'; st.sp = ['rel', -0.18, 0.05]; st.fx.push(['sparkles', 0]); say(150); break;
      // both hold their breath: it looks up at her, trembling
      case '报名截止': case '奖池转动': st.pose = 'hope'; st.sprite = 'sLook'; st.sp = ['home', 1.5 * Math.sin(t / 30), 0]; say(150); break;
      // it dashes out the way she points, toward the viewer, waving its flag
      case '奖池点名': st.pose = 'point'; st.sprite = 'flag'; st.sp = ['rel', 1.0, 0.32]; st.sScale = 1 + 0.3 * bump(t, 200, 1600); say(150); break;
      case '揭晓·大奖': case '揭晓·二奖': case '揭晓·三奖': {
        const react = 2500;
        st.pose = t < react ? 'hope' : { '揭晓·大奖': 'cheer', '揭晓·二奖': 'clap', '揭晓·三奖': 'nod' }[name];
        if (t < react) { st.sprite = 'sLook'; st.sp = ['home', 1.5 * Math.sin(t / 30), 0]; }
        else if (name === '揭晓·大奖') { hop(react, 14); st.fx.push(['confetti', react]); this.toss(st, t, react); }
        else if (name === '揭晓·二奖') { st.sprite = 'sHappy'; st.sp = ['home', 0, -8 * Math.abs(Math.sin(Math.PI * (t - react) / 440))]; st.fx.push(['sparkles', react]); }
        else st.sprite = 'nod';
        say(react); break;
      }
      // she bows her thanks with the sprite, straightens up and waves goodbye while it waves its flag
      case '抽奖结束': st.pose = at(t, [[0, 'bow'], [1200, 'idle'], [1450, 'wave']]); st.sprite = t < 1200 ? 'nod' : 'flag'; say(150); break;
      case '没人报名': st.pose = 'dejected'; st.sprite = 'pat'; st.sp = 'head'; say(200); break;
      // the chest game: the prankster knocked off the page; beaten off, and she tosses the sprite; gone with the chest, and the sprite pats her head
      case '打跑了': st.pose = t < 400 ? 'surprised' : t < 3700 ? 'cheer' : 'idle'; hop(450, 12); st.sprite = 'sHappy'; say(this.chestUp(t, opts)); break;   // (her line waits for the chest, as in 守住了)
      // (she says her line once the sprite has lifted the chest higher than where her bubble comes, not to have it rise
      // through it; after the lightning she cheers on with her hair frizzed until the sprite is back from taking the chest
      // home and has patted it smooth (smooth), and the show is longer for it)
      case '守住了': {
        const dur = opts.zap ? EVENTS[name].zapDur : EVENTS[name].dur, fixed = !opts.zap || this.smooth(st, t, opts, 'cheerZap', 'cheer', 0, dur, 'sHappy');
        st.pose = t >= dur - 700 ? 'idle' : fixed ? 'cheer' : 'cheerZap'; hop(300, 12); hop(1100, 14); say(this.chestUp(t, opts));
        if (!opts.zap) { if (t >= 900) this.toss(st, t, 900); else st.sprite = 'sHappy'; }
        break;
      }
      // She cries kneeling on the ground with her line up (ROB.quiet: at 2.7 s it was gone before anyone had read it),
      // and once it is gone curls up into the squat of the 沮丧 that follows (ROB.curl; she stood up only to crouch again a
      // moment later, and before that with her line still over her head), frizzed or not, the same.
      // After the lightning she cries frizzed until the sprite patting her head has smoothed it, 3.2 s at the soonest.
      // The sprite on her head follows it as she kneels up and her hair settles, patting, never turning to fly (sStay).
      case '被偷了': {
        const fixed = !opts.zap || this.smooth(st, t, opts, 'robbedZap', 'robbed', 3200, EVENTS[name].dur, 'pat');
        st.pose = t >= ROB.curl ? 'gloomy' : fixed ? 'robbed' : 'robbedZap';
        if (!opts.zap) { st.sprite = 'pat'; st.sp = 'head'; }
        st.sStay = true;
        if (t < ROB.quiet) say(500);
        break;
      }
      case '日常': return this.daily(t, st, opts, line);
    }
    const extra = EVENT_FX[name];
    if (extra) { st.fx.push(...extra.fx); st.shake = extra.shake; }
    return st;
  }

  // line: the show's own line; what she says as it goes wrong is a line of its kind (key).
  daily(t, st, o, line) {
    if (SPORTS[o.kind]) return this.sport(t, st, o, line);
    if (o.kind === '扭蛋') return this.gacha(t, st, o, line);
    if (o.kind === '火锅') return this.hotpot(t, st, o, line);
    if (o.kind === '手游') return this.mobile(t, st, o, line);
    if (o.kind === 'cos') return this.cos(t, st, o, line);
    // humming: the sprite sways along; when her voice cracks it hides its head
    const main = DAILY[o.kind][0];
    st._t = t;
    const say = (from, key) => { if (t >= from) st.bubble = { text: key ? this.saying(key, o.seed + from) : line, t: t - from }; };
    if (t < main) { st.pose = 'hum'; st.fx.push(['notes', 0]); st.sprite = 'sHappy'; st.sp = ['home', 6 * Math.sin(2 * Math.PI * t / 1280), 0]; say(200); return st; }
    st.pose = 'crack'; st.sprite = 'hide'; st.fx.push(['brokenNote', main], ['shock', main], ['sweat', main + 300]); say(main, '破音');
    return st;
  }

  // The 扭蛋 daily (GACHA): won (o.mishap false) the plush, lost an empty capsule. She moves only by hopping (never a slide)
  // and stands in front of the cabinet where each of her drawings at it has her (gachaX); the cabinet and what happens in
  // it are drawn by drawGacha behind her, the plush popping out of the capsule in front of her.
  gacha(t, st, o, line) {
    st._t = t;
    const T = GACHA.t, W = T.won, L = T.lost, k = H / ANCHOR, im = this.props.gacha, left = GACHA.x - im.width * k / 2, top = FOOT.y - im.height * k;
    const at2 = (px, py) => ({ x: left + px * k, y: top + py * k });   // a point of the cabinet's picture on the page
    // each line for its own stretch only (until): the show is 14 s, and its first line hung over the whole of it
    const say = (from, until, key) => { if (t >= from && t < until) st.bubble = { text: key ? this.saying(key, o.seed + from) : line, t: t - from }; };
    const press = this.gachaX('gPress'), turn = this.gachaX('gTurn'), take = this.gachaX('gTake');
    // hopping from x0 to x1 between a and b in n hops
    const hops = (a, b, x0, x1, n) => { const w = k01(t, a, b); st.x = x0 + (x1 - x0) * w; st.y -= HOP * 0.45 * Math.abs(Math.sin(Math.PI * n * w)); };
    const end = o.mishap ? L.gone : W.gone;
    const g = st.gacha = { k, ...this.popped(t, T.up, end) };
    const centre = at2(im.width / 2, im.height * 0.45);
    // the sprite spins round where the cabinet comes (and goes), glowing, and it flashes there
    const spin = a => this.spinAt(st, t, a, centre);
    st.fx.push(['flash', T.up, 0.8, { x: centre.x, y: centre.y + 60 }], ['flash', end[0], 0.8, { x: centre.x, y: centre.y + 60 }]);

    // ---- she points home, the sprite fetches the battery and hands it over, spins the cabinet up
    if (t < T.fetch) { st.pose = 'gPointHome'; st.sprite = 'nod'; }
    // it holds the battery out until it goes into her hands, her in-between's frame 3 (90 ms on): its drawing fades over
    // 150 ms, so it lets go 60 ms before, and the two batteries are never seen at once
    else if (t < T.give) { st.pose = 'gRub'; if (t < T.back) { st.sprite = 'sHappy'; st.sp = ['at', -80, FOOT.y - 0.5 * H]; } else { st.sprite = t < T.give - 300 ? 'sCarry' : t < T.give - 60 ? 'sGive' : 'sHappy'; st.sp = ['rel', 0.05, 0.36]; } }
    else if (t < T.spin) { st.pose = 'gBattery'; st.sprite = 'sHappy'; st.sp = ['rel', 0.05, 0.36]; }
    else if (t < T.hop[0]) { st.pose = 'gBattery'; spin(T.spin); }
    say(200, T.up);
    if (t < T.hop[0]) return st;

    // ---- at the cabinet: she hops over with the battery, presses it in, turns the knob, squats for the capsule
    st.slide = true;   // her drawings at the cabinet stand where each has her: the in-betweens move her between them
    if (t < T.press) { st.pose = 'gBattery'; hops(T.hop[0], T.hop[1], FOOT.x, press, 2); }
    else if (t < T.turn) { st.pose = 'gPress'; st.x = press; }
    else if (t < T.take) { st.pose = 'gTurn'; st.x = turn; }
    else if (t < T.stand) { st.pose = 'gTake'; st.x = take; }
    else if (t < T.home[1]) { st.pose = 'gCapsule'; if (t < T.home[0]) st.x = take; else hops(T.home[0], T.home[1], take, FOOT.x, 2); }
    if (t >= T.drop) g.bay = { y: 14 * ease(k01(t, T.drop + 150, T.drop + 550)), a: 1 - k01(t, T.drop + 350, T.drop + 550) };   // in, and down out of sight
    if (t >= T.turn && t < T.out) { const u = t - T.turn; g.knob = u / 260; g.jig = [2.2 * Math.sin(u / 40), 1.6 * Math.sin(u / 55)]; g.shake = 0.8 * Math.sin(u / 35); }
    if (t >= T.out && t < T.take + 180) g.cap = { y: -(GACHA.outlet[1] - GACHA.win[3]) * (1 - ease(k01(t, T.out, T.out + 220))) - 10 * bump(t, T.out + 220, T.out + 380) };
    // as she hops over it goes ahead to the top of the cabinet's sign (following her, it crossed her face)
    if (t < T.turn) { st.sprite = 'sHappy'; st.sp = ['at', left + 25 * k, top + 60 * k]; }
    else if (t < T.out) { st.sprite = 'sPeek'; st.sp = ['at', left + 175 * k, top + 160 * k + 2 * Math.sin(t / 120)]; st.fx.push(['sweat', T.turn + 600, 900]); }
    else if (t < T.home[1]) { st.sprite = 'sHappy'; st.sp = ['rel', 1.0, 0.25]; }
    if (t < T.shake) return st;

    // ---- back at her place: she shakes the capsule by her ear (the sprite listens) and twists it open
    st.slide = false;
    if (t < T.twist) { st.pose = 'gShake'; st.sprite = 'sListen'; st.sp = ['rel', 1.02, 0.1]; return st; }
    if (t < T.open) { st.pose = 'gTwist'; st.sprite = 'sHappy'; st.sp = ['rel', 1.0, 0.3]; st.fx.push(['shock', T.twist + 200]); return st; }

    if (!o.mishap) {
      // the plush pops out of the capsule and into her arms; she hugs it, hopping; the sprite circles her, spins the cabinet
      // away, takes the plush and flies it home
      // the plush: out of her hands, growing as it rises over her head with a little wobble, hanging there bobbing, then
      // down into her arms where her drawing hugs it (41 px right of her centre, 87 px up: the gHug cell), fading into it
      const u = t - T.open;
      if (u < W.down + 60) {
        const r = 1 - Math.pow(1 - k01(u, 0, W.rise), 3), d = ease(k01(u, W.hang, W.down));
        const hx = FOOT.x + 14 + 18 * r, hy = FOOT.y - 0.3 * H + (FOOT.y - H - 10 - (FOOT.y - 0.3 * H)) * r + (u >= W.rise ? 4 * Math.sin((u - W.rise) / 60) : 0);
        st.pop = { x: hx + (FOOT.x + 41 - hx) * d, y: hy + (FOOT.y - 87 - hy) * d, s: 0.25 + 0.75 * r, a: 1 - k01(u, W.down, W.down + 60) };
        if (u < W.rise) st.fx.push(['sparkles', T.open]);
      }
      st.halves = this.halves(t, T.open, 'pop', 1 - k01(t, W.gone[0], W.gone[1]));
      st.pose = t < W.take ? 'gHug' : 'idle';
      // the sprite watches from her side while the plush is in the air (tossed from the start, it hung over her head
      // right where the plush comes), and is tossed for joy once she hugs it
      if (t < W.hug) { st.sprite = 'surprised'; st.sp = ['rel', 1.05, 0.3]; }
      else if (t < W.spin) { st.y -= 12 * bump(t, W.hug + 300, W.hug + 620) + 10 * bump(t, W.hug + 900, W.hug + 1220); this.toss(st, t, W.hug, 900); }
      else if (t < W.gone[1]) spin(W.spin);
      else if (t < W.away) { st.sprite = t < W.take ? 'sHappy' : 'sPlush'; st.sp = ['rel', 0.5, 0.42]; }
      else { st.sprite = 'sPlush'; st.sp = ['at', -90, FOOT.y - 0.55 * H]; }
      st.fx.push(['sparkles', T.open], ['confetti', T.open + 100]);
      say(W.hug, W.spin, '扭中了');
      return st;
    }
    // empty: frozen over the halves; she drops them and wails on her knees (the sprite pats her head), wipes her tears and
    // gets up; the sprite spins the cabinet and the halves away
    st.pose = at(t - L.empty, [[0, 'gEmpty'], [L.wail - L.empty, 'gWail'], [L.wipe - L.empty, 'gWipe'], [L.idle - L.empty, 'idle']]);
    if (t >= L.wail) st.halves = this.halves(t, L.wail, 'drop', 1 - k01(t, L.gone[0], L.gone[1]));
    if (t < L.pat) { st.sprite = 'surprised'; st.sp = ['rel', 1.0, 0.3]; }
    else if (t < L.wipe) { st.sprite = 'pat'; st.sp = 'head'; }
    else if (t < L.gone[1]) spin(L.spin);
    else st.sprite = 'sHappy';
    st.fx.push(['shock', L.empty], ['sweat', L.empty + 300, 900]);
    if (t >= L.wail) st.fx.push(['tears', L.wail + 100, L.wipe - L.wail]);
    say(L.empty + 100, L.wail, '扭空'); say(L.wail + 150, L.wipe, '没扭中'); say(L.wipe + 150, L.end, '打起精神');
    return st;
  }

  // The sprite glowing round the place where a prop comes (or goes) from time a, leaving a trail of stars.
  spinAt(st, t, a, centre) {
    const ang = (t - a) / 130;
    st.sprite = 'glow'; st.sp = ['at', centre.x + 78 * Math.cos(ang), centre.y + 26 * Math.sin(ang)]; st.fx.push(['trail', a]);
  }

  // Where a point of a FIXED sheet's cell (its px, as in HOTPOT and MOBILE) is on the page when her spot is (x, y).
  fromSpot(sheet, [px, py], x, y) {
    const c = this.cells[sheet][0], k = H / c.ruler;
    return { x: x + (px - c.cx) * k, y: y + (py - c.ground) * k };
  }

  // A prop the sprite brings with a pop (from up) and takes away with a shrink (gone): its alpha and its scale about its
  // bottom middle, as the 扭蛋 cabinet does.
  popped(t, up, gone) {
    return { a: k01(t, up, up + 200) * (1 - k01(t, gone[0], gone[1])), s: 0.85 + 0.15 * ease(k01(t, up, up + 300)) + 0.06 * bump(t, up + 150, up + 450) - 0.3 * ease(k01(t, gone[0], gone[1])) };
  }

  // The 火锅 daily (HOTPOT): yum (o.mishap false) or spicy. Her spot is FOOT.x, back px up while the table is there.
  hotpot(t, st, o, line) {
    st._t = t;
    const T = HOTPOT.t, E = o.mishap ? T.spicy : T.yum, k = H / ANCHOR, y0 = FOOT.y - HOTPOT.back;
    const say = (from, until, key) => { if (t >= from && t < until) st.bubble = { text: key ? this.saying(key, o.seed + from) : line, t: t - from }; };
    const im = this.props.table, base = this.fromSpot(PROP_SPOT.table.sheet, PROP_SPOT.table.at, FOOT.x, y0), w = im.width * k, h = im.height * k;
    const tb = st.table = { x: base.x + w / 2, y: base.y, w, h, ...this.popped(t, T.up, E.gone) };
    const pot = this.fromSpot(PROP_SPOT.table.sheet, HOTPOT.pot, FOOT.x, y0), end = { x: base.x - 0.16 * SPRITE_H, y: base.y - 0.62 * h };   // the pot; the table's left end
    if (t >= T.up + 200 && t < E.gone[0]) st.fx.push(['potSteam', T.up + 200, { x: pot.x, y: pot.y }]);
    st.fx.push(['flash', T.up, 0.8, { x: tb.x, y: tb.y - h / 2 }], ['flash', E.gone[0], 0.8, { x: tb.x, y: tb.y - h / 2 }]);
    const spin = a => this.spinAt(st, t, a, { x: tb.x, y: tb.y - h * 0.6 });
    const sat = (sprite, p) => { st.sprite = sprite; st.sp = ['at', p.x, p.y]; };

    // ---- hungry; she watches the table come; she kneels and says grace; the bowl and chopsticks come
    if (t < T.kneel) { st.pose = t < T.spin ? 'hHungry' : 'idle'; if (t < T.spin) st.sprite = 'nod'; else spin(T.spin); say(200, T.kneel + 600); return this.atTable(st, y0); }
    say(200, T.kneel + 600);
    if (t < T.ready) { st.pose = 'hPray'; sat(t < T.bowl - 300 ? 'sHappy' : 'glow', end); if (t >= T.bowl - 100) st.fx.push(['sparkles', T.bowl - 100]); return this.atTable(st, y0); }
    if (t < T.pick) { st.pose = 'hSit'; sat('sHappy', end); return this.atTable(st, y0); }
    if (t < T.blow) { st.pose = o.mishap ? 'hPickRed' : 'hPickClear'; sat('sLook', end); return this.atTable(st, y0); }
    if (t < T.eat) { st.pose = 'hBlow'; sat('sDrool', end); return this.atTable(st, y0); }

    if (!o.mishap) {
      // it is good: she eats; she feeds the sprite a meatball (it flies to her chopsticks, mouth open, and chews); grace
      const Y = T.yum, tip = { x: FOOT.x - 0.34 * H, y: y0 - 0.66 * H };   // the meatball on her chopsticks (hFeed)
      st.pose = at(t, [[T.eat, 'hYum'], [Y.feed, 'hFeed'], [Y.chew + 400, 'hSit'], [Y.grace, 'hPray'], [Y.stand, 'idle']]);
      if (t < Y.feed) { sat('sDrool', end); st.fx.push(['hearts', T.eat + 200, 3]); }
      else if (t < Y.chew) sat(t < Y.open - 150 ? 'sHappy' : 'sOpen', { x: tip.x - 0.3 * SPRITE_H, y: tip.y + 0.1 * SPRITE_H });
      else if (t < Y.grace) { sat('sChew', { x: tip.x - 0.3 * SPRITE_H, y: tip.y + 0.1 * SPRITE_H - 6 * Math.abs(Math.sin(Math.PI * (t - Y.chew) / 300)) }); st.fx.push(['hearts', Y.chew, 2]); }
      else if (t < Y.spin) { sat(t < Y.grace + 300 ? 'glow' : 'sHappy', end); if (t >= Y.grace) st.fx.push(['sparkles', Y.grace]); }
      else if (t < Y.gone[1]) spin(Y.spin);
      else st.sprite = 'sHappy';
      say(T.eat + 200, Y.feed, '好吃');
      return this.atTable(st, y0);
    }
    // the chili: her face burns (flames out of her mouth, tears); the sprite starts, flies home for 豆奶, hands it to her
    // and pats her head while she drinks; grace
    const S = T.spicy, G = HOTPOT.give, sp5 = this.cells.sp5[0], bottle = this.fromSpot('hotpot25', G.her, FOOT.x, y0);
    const hand = { x: bottle.x - G.sprite[0] * SPRITE_H / sp5.ruler, y: bottle.y - G.sprite[1] * SPRITE_H / sp5.ruler };   // the sprite there
    st.pose = at(t, [[T.eat, 'hYum'], [S.burn, 'hSpicy'], [S.drink, 'hDrink'], [S.grace, 'hPray'], [S.stand, 'idle']]);
    if (t >= S.burn && t < S.drink) st.fx.push(['flame', S.burn], ['steam', S.burn + 150, S.drink - S.burn], ['tears', S.burn + 100, S.drink - S.burn], ['sweat', S.burn + 200, 1200]);
    if (t < S.burn) sat('sDrool', end);
    else if (t < S.fly) sat('surprised', end);
    else if (t < S.back) { st.sprite = 'sHappy'; st.sp = ['at', -90, y0 - 0.5 * H]; }
    // it lets go 60 ms before the bottle shows in her hand (its drawing fades over 150 ms: the two bottles are never seen
    // apart), stays a moment, and flies up to pat her head
    else if (t < S.drink + 350) sat(t < S.give ? 'sBottle' : t < S.drink - 60 ? 'sGiveBottle' : 'sHappy', hand);
    else if (t < S.grace) { st.sprite = 'pat'; st.sp = 'head'; }
    else if (t < S.spin) { sat(t < S.grace + 300 ? 'glow' : 'sHappy', end); if (t >= S.grace) st.fx.push(['sparkles', S.grace]); }
    else if (t < S.gone[1]) spin(S.spin);
    else st.sprite = 'sHappy';
    say(S.burn + 100, S.drink, '辣到了'); say(S.drink + 1100, S.grace + 600, '得救了');
    return this.atTable(st, y0);
  }

  // At the table she kneels back from her place (HOTPOT.back), standing she is at it; between them her in-betweens carry
  // her over (st.slide), behind the table.
  atTable(st, y0) {
    st.y = PROP_OF[st.pose] === 'table' ? y0 : FOOT.y;
    st.slide = true;
    return st;
  }

  // The 手游 daily (MOBILE): won (o.mishap false) or lost. Her spot stays FOOT; the sofa stands behind her.
  mobile(t, st, o, line) {
    st._t = t;
    const T = MOBILE.t, E = o.mishap ? T.lost : T.won, k = H / ANCHOR;
    const say = (from, until, key) => { if (t >= from && t < until) st.bubble = { text: key ? this.saying(key, o.seed + from) : line, t: t - from }; };
    const im = this.props.sofa, base = this.fromSpot(PROP_SPOT.sofa.sheet, PROP_SPOT.sofa.at, FOOT.x, FOOT.y), w = im.width * k, h = im.height * k;
    const so = st.sofa = { x: base.x + w / 2, y: base.y, w, h, ...this.popped(t, T.up, E.gone) };
    st.fx.push(['flash', T.up, 0.8, { x: so.x, y: so.y - h / 2 }], ['flash', E.gone[0], 0.8, { x: so.x, y: so.y - h / 2 }]);
    const spin = a => this.spinAt(st, t, a, { x: so.x, y: so.y - h * 0.55 });
    // on the backrest's top over her legs, watching the phone from her feet's side (by her head it sat on her face and phone)
    const perch = { x: base.x + 0.32 * w, y: base.y - 1.0 * h + 3 * Math.sin(t / 400) };
    const seat = { x: base.x + 0.15 * w, y: base.y - 0.42 * h + 2 * Math.sin(t / 500) };   // on the seat at her left while she sits
    const sat = (sprite, p) => { st.sprite = sprite; st.sp = ['at', p.x, p.y]; };
    say(200, T.lie);
    if (t < T.sit) { st.pose = 'mPhone'; if (t < T.spin) st.sprite = 'nod'; else spin(T.spin); return st; }
    if (t < T.lie) { st.pose = 'mSit'; sat('sHappy', seat); return st; }
    const play = o.mishap ? E.stun : E.win;
    if (t < play) { st.pose = 'mPlay'; sat('nod', perch); st.fx.push(['sweat', T.lie + 1200, 1600]); return st; }
    if (!o.mishap) {
      st.pose = at(t, [[E.win, 'mWin'], [E.sit, 'mSit'], [E.stand, 'mPhone']]);
      // waving its flag over the left armrest: over her legs it sat on the phone she holds up and on her kicking feet
      if (t < E.sit) { sat('flag', { x: base.x + 0.04 * w, y: base.y - 1.05 * h + 3 * Math.sin(t / 300) }); st.fx.push(['confetti', E.win + 100], ['sparkles', E.win]); }
      else if (t < E.spin) sat('sHappy', seat);
      else if (t < E.gone[1]) spin(E.spin);
      else st.sprite = 'sHappy';
      say(E.win + 100, E.sit + 400, '赢了');
      return st;
    }
    st.pose = at(t, [[E.stun, 'mStunned'], [E.smack, 'mSmack'], [E.ouch, 'mOuch'], [E.sit, 'mSit'], [E.stand, 'mPhone']]);
    st.fx.push(['shock', E.stun]);
    if (t >= E.smack) st.fx.push(['impact', E.smack + 40, [0.5, 0.42]], ['dizzy', E.smack + 300, 1100, [0.7, 0.05]]);
    if (t >= E.ouch && t < E.sit) st.fx.push(['tears', E.ouch + 100, E.sit - E.ouch]);
    if (t >= E.smack) st.shake = [[E.smack + 40, 2, 200]];
    if (t < E.smack) sat('surprised', perch);
    else if (t < E.ouch) sat('hide', perch);
    else if (t < E.sit) { st.sprite = 'pat'; st.sp = ['rel', 0.8, -0.2]; }   // over her head, at the armrest end
    else if (t < E.spin) sat('sHappy', seat);
    else if (t < E.gone[1]) spin(E.spin);
    else st.sprite = 'sHappy';
    say(E.stun + 100, E.smack, '输了'); say(E.smack + 300, E.sit, '砸到脸');
    return st;
  }

  // The capsule's two halves leaving her hands at a: popping off to either side as the plush comes out (pop), or slipping
  // from her hands as she sinks to her knees (drop); both come to lie by her feet, where they stay till the cabinet goes.
  halves(t, a, how, alpha) {
    const u = t - a, p = k01(u, 0, how === 'pop' ? 450 : 260);
    return { a: alpha, pts: [[-1, -6, -52], [1, 14, 58]].map(([half, sx, tx]) => {
      const x0 = FOOT.x + sx, y0 = FOOT.y - 0.3 * H, x1 = FOOT.x + tx, y1 = FOOT.y - 2;
      const y = how === 'pop' ? y0 + (y1 - y0) * p - 70 * Math.sin(Math.PI * p) : y0 + (y1 - y0) * p * p;
      // both end dome up, on their rims: the pink top half is dome up as it is (0), the white bottom half turned over (π);
      // popping off they tumble on the way (a whole turn, a turn and a half), dropped they only tip a little
      const rot = how === 'pop' ? (half < 0 ? -2 * Math.PI * p : 3 * Math.PI * p) : (half < 0 ? 0.25 * p : Math.PI + 0.3 * p);
      return { half, x: x0 + (x1 - x0) * p, y, rot };
    }) };
  }

  // Where she stands (her drawing's centre) for a drawing of hers at the cabinet, so the cabinet in its cell meets the one on
  // the page: the cell's cabinet edge at GACHA.cell, the page's at the cabinet picture's left.
  gachaX(pose) {
    const c = this.cells.gacha22?.[POSE[pose][1]], k = H / ANCHOR, left = GACHA.x - this.props.gacha.width * k / 2;
    return c ? left - (c.ox + GACHA.cell - c.cx) * H / c.ruler : FOOT.x;
  }

  // The cabinet (st.gacha): popping up and shrinking away with its alpha a and scale s about its bottom middle; while she
  // turns the knob the capsules in its window tumble (the window drawn again, shaken, jig), the knob turns (knob, in
  // turns) and the cabinet trembles (shake); the battery sinks into its bay (bay); the capsule drops into its outlet (cap,
  // its height above it); the empty capsule's halves lie at her feet (st.halves, drawn here with it).
  drawGacha(g, c) {
    const im = this.props.gacha, k = c.k * c.s, w = im.width * k, h = im.height * k, x0 = GACHA.x - w / 2 + (c.shake || 0), y0 = FOOT.y - h;
    if (!c.a) return;
    g.save(); g.globalAlpha = c.a;
    g.drawImage(im, x0, y0, w, h);
    const P = (px, py) => [x0 + px * k, y0 + py * k];
    if (c.jig) {   // the capsules tumbling: the window again, shaken inside its own frame
      const [wx0, wy0] = P(GACHA.win[0] + 4, GACHA.win[1] + 4), [wx1, wy1] = P(GACHA.win[2] - 4, GACHA.win[3] - 4);
      g.save(); g.beginPath(); g.rect(wx0, wy0, wx1 - wx0, wy1 - wy0); g.clip();
      g.drawImage(im, x0 + c.jig[0], y0 + c.jig[1], w, h); g.restore();
    }
    if (c.knob) {   // the knob turning
      const [kx, ky] = P(GACHA.knob[0], GACHA.knob[1]), r = GACHA.knob[2] * k;
      g.save(); g.beginPath(); g.arc(kx, ky, r, 0, Math.PI * 2); g.clip();
      g.translate(kx, ky); g.rotate(c.knob * Math.PI * 2); g.translate(-kx, -ky); g.drawImage(im, x0, y0, w, h); g.restore();
    }
    if (c.bay && c.bay.a > 0) {   // the battery in its bay, sinking out of sight below the bay's rim
      const b = this.props.battery, [bx, by] = P(GACHA.bay[0], GACHA.bay[1]), bw = b.width * k, bh = b.height * k;

  // The cos daily (COS): dressed like a sport (dress), then the costume's steps and its ending.

  // A point of one of her drawings (fractions of it) on the page, where she stands.

  // Something she drops (COS.<costume>.item): where it pops from (from, on one of her drawings), the ground it lands on

  // The sprite blowing on something (COS.<costume>.blow: what, and its lips from its centre plus a little gap, sp6 px):

  // A sport (SPORTS): the sprite joins in (cheers her lifts with its flag, leads her hike, flies beside her bike or skis); if

    st._t = t;
    const sp = SPORTS[o.kind], go = 1100, stop = go + sp.act[1], end = stop + (o.mishap ? sp.fallMs : sp.calmMs) + 900, back = end - 900;
    const say = (from, key) => { if (t >= from) st.bubble = { text: key ? this.saying(key, o.seed + from) : line, t: t - from }; };
    const lead = o.kind === '爬山' ? ['at', 70, FOOT.y - 0.62 * H + 5 * Math.sin(t / 300)] : ['rel', -0.22, 0.3];

      if (o.kind === '爬山') { st.sprite = 'flag'; st.sp = lead; st.fx.push(['sweat', go + 800, 1600]); for (let k = 0; k * 340 < sp.act[1]; k++) st.fx.push(['dust', go + k * 340, null, 2]); }
      if (o.kind === '骑车') {

        st.fx.push(['speed', go, sp.act[1] - 400]); for (let k = 0; k * 440 < sp.act[1]; k++) st.fx.push(['dust', go + k * 440, [0.78, 0.97], 2]);

  // The ship sails in while the sprite dresses her as governor; she jumps aboard, the sprite flies up to the rear mast (the

  // The governor (SS, README 3): the page edges glow gold, a sea of gold clouds rolls in and the flagship sails up to us out
  // of the distance while the sprite dresses her; it flies up to plant its flag on the mainmast; a stair of light takes her up onto the bow,
  // where she points ahead: the emblem rises in front of the sails, three fireworks go up, gold rains over the page; she
  // waves, comes back down the stair, and the ship sails off into the distance leaving a gold wake.

      ['lightStairs', 11200, 1000, FOOT, deck], ['wake', 12000, 3000, [{ x: 440, y: 560 }, { x: 250, y: 330 }, { x: 70, y: 100 }]], ['flash', 14800, 0.8]);

  // The admiral (A, README 3): dressed by the sprite, she raises her spyglass to the left, where her ship appears far off;
  // the sprite flies out to meet it and rides in on its mainmast while it sails up to stop behind her; she lowers the glass
  // and salutes, and the ship answers: it dresses its flags from bow to stern and glows; then it sails off to the right,

    // right with its bow lifting. (It used to slide in down a slant while growing, which a ship seen side on cannot do.)

  // Where a point of the admiral's ship (prop px) is on the page, the ship's bottom centre at s.x, s.y, rocked by s.rot.
  admPoint(s, pt) {
    const im = this.props.admship, k = H / ANCHOR * s.s, dx = (pt[0] - im.width / 2) * k, dy = -(im.height - pt[1]) * k, c = Math.cos(s.rot || 0), n = Math.sin(s.rot || 0);

  // The big gift (A): a beam from the top of the page lands at her right; the box comes down it under a bunch of balloons,
  // lands, the balloons float away; the lid flies off, a beam and a fountain of stars and hearts go up to the top; she cheers,
  // and the box shrinks into a star that flies into her arms.
  // 盲盒查询 (QUERY): the card hangs just over her head, centred on her, never so high that its stamp leaves the page; a
  // long one comes down behind her hair a little. No bubble: the card is where it would go, and her words are on it.
  billOf(opts, line) { return { result: opts.result || '赚', period: opts.period || '今日', name: opts.nickname ?? this.cfg.name, spend: opts.spend ?? 15, profit: opts.profit ?? 4.5, line }; }
  billSpot(st, c) {
    const h = BILL.layout(this.measureG ??= document.createElement('canvas').getContext('2d'), c).h;
    return { x: st.x - BILL.W / 2, y: Math.max(40, FOOT.y - H - 4 - h), h };

    st.pose = at(t, [[0, 'hope'], [q.react, BILL_POSE[r]], [q.done, 'idle']]);
    if (r === '赚') { hop(q.react, 14); st.fx.push(['sparkles', q.react]); }
    if (r === '亏') { if (t >= q.react && t < q.react + 1200) st.y -= 4 * Math.abs(Math.sin((t - q.react) / 90)); st.fx.push(['sweat', q.react - 100], ['anger', q.react, 900]); }

    else if (t < q.side) { st.sprite = 'sLook'; st.sp = ['at', spot.x + BILL.W + 22, FOOT.y - 0.34 * H]; }
    else st.sprite = t < q.side + 500 ? 'sLook' : BILL_SPRITE[r];
    const reveal = t < q.print[0] ? 0 : t < q.print[1] ? ease(k01(t, q.print[0], q.print[1])) : 1 - ease(k01(t, q.roll[0], q.roll[1]));
    if (reveal > 0) st.bill = { c, x: spot.x, y: spot.y + 2 * Math.sin(t / 500) + 3 * bump(t, q.stamp, q.stamp + 200), h: spot.h, reveal, stampT: stamped && t >= q.stamp ? t - q.stamp : null };
  }

  // B站 PK (PK_SIGN): her sprite glows and the sign flies out of it, small to full size, to over her head as she raises
  // her empty hands for it (the double bonus's condition: into her hands in front of her, she ducks behind it, peeks over
  // it, says her line, brings it down to her chest and it glides up as she raises her arms); she lowers her arms and it
  // flies back into her sprite. The words are on it all the time; a countdown's number pops at each second. Her drawings
  // with a sign draw it themselves (drawHer); signFly is the sign anywhere else, drawn while her drawing has none.
  signShow(name, t, st, opts, say) {

    const q = PK_SIGN, count = name.endsWith('10秒'), key = count ? 'count' : name, up = q.pose[key];
    const begun = count ? (opts.until != null && opts.at != null ? opts.until - opts.at + t : opts.left ?? 10000) : 0, lower = count ? Math.min(q.lower.count, begun) : q.lower[key];
    const left = count ? begun - t : 0, n = Math.max(0, Math.ceil(left / 1000)), pop = count ? 1 - k01(1000 - (left % 1000 || 1000), 0, 220) : 0;
