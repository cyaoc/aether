    for (const [pose, s] of Object.entries(STRIP)) if (img['f:' + s.f] && (!s.f2 || img['f:' + s.f2])) this.strips[pose] = [...framesOf(s.f, pose), ...(s.f2 ? framesOf(s.f2, pose) : [])];
    for (const [pair, f] of Object.entries(TRANS)) if (img['f:' + f]) {
      const prop = pair.split('>').map(p => PROP_OF[p]).find(Boolean);   // between standing and kneeling at the table, it is there
      this.tweens[pair] = framesOf(f, pair.split('>')[0]).slice(1, 3).map(c => ({ ...c, prop }));
    }
    for (const [key, [f]] of Object.entries(SSTRIP)) {
      const im = img['f:' + f], c = key[0] === 'v' ? this.cells.views[+key[1]] : key in SPRITE ? this.cells[SPRITE[key][0]][SPRITE[key][1]] : this.cells[key][0];
      if (im) this.sstrips[key] = [0, 1, 2, 3].map(i => ({ im, ...box(im, i * im.width / 4, 0, im.width / 4, im.height), cx: c.cx - c.ox + i * im.width / 4, cy: c.cy - c.oy, ruler: c.ruler }));
    }
    this.castle = { closed: img.castleClosed, open: img.castleOpen, box: box(img.castleClosed, 0, 0, img.castleClosed.width, img.castleClosed.height) };
    this.props = { flagship: img.flagship, admship: img.admship, emblem: img.emblem, giftbox: img.giftbox, giftboxOpen: img.giftboxOpen, balloons: img.balloons, chest: img.chest, chestOpen: img.chestOpen, chestRing: img.chestRing,
      gacha: img.gachaBox, battery: img.battery, plush: img.plush, table: img.hotpot, sofa: img.sofa,
      // the cos daily (#418): the fire-fan kunoichi's fan, the ice general's cap, the esports girl's gun
      fan: img.fanProp, cap: img.capProp, gun: img.gunProp };
    // the chest game: its paper ball, the lucky one the same ball blushing pink (its glow and sparkles are drawn), the
    // board's viewers' avatars, and the two sides' gift icons, which load from B站 later or never (a gift box then)
    const lucky = document.createElement('canvas'), lg = lucky.getContext('2d');
    lucky.width = img.paperball.width; lucky.height = img.paperball.height;
    lg.drawImage(img.paperball, 0, 0); lg.globalCompositeOperation = 'source-atop'; lg.fillStyle = 'rgba(255,128,180,0.42)'; lg.fillRect(0, 0, lucky.width, lucky.height);
    this.ball = { plain: img.paperball, lucky };
    this.avatars = Object.fromEntries(VIEWERS.map(w => [w.av, img[w.av]]));
    this.sideIcon = {};
    for (const s of [1, -1]) { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => { this.sideIcon[s] = i; }; i.src = SIDE_ICON[s]; }
    // The chest's size on the page (its closed drawing), and where the rope a pulling drawing holds ends (or the sprite's
    // fists are): the middle of what the drawing shows at its left edge, down its height.
    this.chestBox = img.chest ? { w: img.chest.width * H / ANCHOR, h: img.chest.height * H / ANCHOR, open: img.chestOpen.height * H / ANCHOR } : { w: 104, h: 84, open: 150 };
    const pixels = c => {
      const cv = document.createElement('canvas'); cv.width = c.w; cv.height = c.h;
      const g = cv.getContext('2d'); g.drawImage(c.im, c.x, c.y, c.w, c.h, 0, 0, c.w, c.h);
      return g.getImageData(0, 0, c.w, c.h).data;
    };
    const ropeEnd = c => {
      const a = pixels(c);
      let n = 0, sy = 0;
      for (let j = 0; j < c.h; j++) for (let k = 0; k < 3; k++) if (a[(j * c.w + k) * 4 + 3] > 40) { n++; sy += j; }
      c.rope = n ? sy / n / c.h : 0.5;
    };
    for (const pose of ['tug', 'haul', 'ouch']) ropeEnd(this.pkCell(pose));
    for (const pose of ['hold', 'hold2']) ropeEnd(this.cell(pose, SPRITE));
    // Where the rope in a carrying drawing ends (tip, from the drawing's centre): the lowest thin strand in it that runs
    // on up a little way (the round end of its tail narrows for a few rows only; the paper bag's rope is free of the
    // tail for the last twenty rows or so). The chest's hook hangs LINK below it.
    const ropeTip = c => {
      const a = pixels(c), thin = c.ruler * 0.11, rows = [];
      const strands = j => rows[j] ??= (() => {   // the middles of the thin runs of row j
        const out = []; let s = -1;
        for (let i = 0; i <= c.w; i++) { const on = i < c.w && a[(j * c.w + i) * 4 + 3] > 40; if (on && s < 0) s = i; if (!on && s >= 0) { if (i - s <= thin) out.push((s + i - 1) / 2); s = -1; } }
        return out;
      })();
      for (let j = c.h - 1; j > 0; j--) for (const mid of strands(j)) {
        let n = 1, m = mid;
        for (; j - n >= 0; n++) { const up = strands(j - n).find(q => Math.abs(q - m) < 6); if (up == null) break; m = up; }
        if (n >= c.ruler * 0.03) return (c.tip = { x: c.x + mid - c.cx, y: c.y + j - c.cy });
      }
      throw new Error('a carrying drawing holds no rope');
    };
    for (const pose of ['carry', 'carryBag', 'carryCrown']) ropeTip(this.pkCell(pose));
    for (const pose of ['lift', 'lift2']) ropeTip(this.cell(pose, SPRITE));
    this.day = img.day;
    const idle = this.cells.common[0];
    this.herLeft = (idle.x - idle.cx) * H / idle.ruler;  // her left edge standing idle, from her centre
    this.ready = true;
  }

  renderVals() {
    const p = this.props;
    this.cfg = {
      scene: p.scene || '手动', env: p.env || '右下角', room: p.room || '明亮画面', name: NAMES[p.name] || NAMES.普通昵称,
      speed: { '0.5 倍': 0.5, '0.25 倍': 0.25 }[p.speed] || 1, caption: p.caption !== '隐藏', game: p.game === '开'
    };
    return {};
  }

  // ---- clock and engine ---------------------------------------------------------------------------------------------
  now() { return (this.master ? this.master.currentTime : 0) * this.cfg.speed; }

  reset() {
    this.cur = this.seen = null; this.queue = []; this.log = []; this.lot = null; this.pending = []; this.round = null; this.announced = null;
    this.lastGift = this.lastAny = this.now(); this.recent = []; this.nextDaily = this.now() + 6000; this.lines = {}; this.said = null; this.rng = seeded(7);
    this.gm = { chest: 0, pile: 0, drops: [], nums: [], visit: null, due: false, pk: false, last: this.now(), out: null, walk: null, streak: 0, steals: 0, brag: false, grudge: null, say: null, herX: FOOT.x, aside: 0, asidePile: 0, top: false };
    this.gl = null;
  }

  fire(name, opts = {}) {
    const now = this.now(), ev = EVENTS[name], vis = this.gm.visit, live = !!vis && !DONE.has(vis.phase);
    // a PK countdown's end is the moment it fires for, however long it then waits (PK_SIGN)
    if (name.endsWith('10秒') && opts.until == null) opts = { ...opts, until: now + (opts.left ?? 10000) };
    // a gift while the prankster is here (not on its way off): its light goes out from her first, and it is scared off,
    // and the show goes on, once the light reaches it (gameUpdate fires it again, burst); what comes meanwhile waits behind
    if (this.cfg.game && ev.gift && !opts.burst && !opts.game && live) {
      if (this.gm.burst?.due != null) return void this.gm.burst.more.push([name, opts]);
      return this.giftBurst(now, ev, name, opts);
    }
    // (nor anything while the prankster is here: the room is not quiet then, though no gift has come for 40 minutes, and a
    // 舰长 that scared it off had her start “啊！有人来了！” all the while the chest went home; nor the game's own shows:
    // robbed at 0 : 0 in a quiet room she was woken first, “冷场后来了人”)
    if (name !== '日常' && !opts.chained) opts = { ...opts, wake: opts.wake ?? (!opts.game && !vis && ['沮丧', '犯困'].includes(this.mood(now, false))) };
    // 开心 counts only gifts, 大航海 included: a room viewers keep coming into would otherwise never be calm, and the daily
    // actions only come when she is calm (README 6). Anyone coming in still counts as something happening for 犯困.
    if (name !== '日常') this.lastAny = now;
    if (ev.gift) { this.lastGift = now; this.recent = this.recent.filter(r => now - r < 60000).concat(now); }
    // while the prankster is here she waves at no one, and a 大航海 or a lottery scares it off; the show then waits while the
    // sprite takes the chest home (tidy; the game's own shows are opts.game). A gift's does it with a burst of light; while
    // the fight is on (contested: the bar is up, in the air too) the line goes to her end and she cheers, saved (kept: a
    // lottery's too, with no name; 用户 review: in the air the bar was gone in a blink, the lottery's in the tug as well);
    // after the lightning her sprite smooths her hair before it takes the chest (wait).
    if (this.cfg.game && this.gm.visit && name !== '日常' && !opts.game) {
      if (name === '进场' || name === '盲盒查询') return this.note(`${name}：捣蛋鬼在，不演`);
      const v = this.gm.visit, frizz = v.phase === 'tug' && !!v.bolted, kept = this.contested(v);
      if (kept) this.sweep(now, ev.gift ? opts.nickname ?? this.cfg.name : null);
      opts = { ...opts, tidy: this.scare(now), frizz, kept };
      if (kept && frizz && this.gm.out) this.gm.out.wait = true;
    }
    // a 大航海's 电池 go into the chest like a gift's (after the scare: the chest it saved goes home with them)
    if (this.cfg.game && opts.price) this.gameGift({ price: opts.price, n: 1 });
    // she waves at whoever comes in only while she is idle: never over a daily action or any show, and it does not queue
    if (name === '进场' && this.cur) return this.note('进场：正在演，不演');
    // neither a wave nor a 账单卡 over blind boxes she shakes: the 盲盒·小 they open into would be dropped behind it
    if ((name === '进场' || name === '盲盒查询') && this.shaking()) return this.note(`${name}：正摇盲盒，不演`);
    const curTier = this.cur ? TIER[EVENTS[this.cur.name].tier] : -1, tier = TIER[ev.tier];
    // A gift round that grows to 5 gifts takes over its own plain thank-you, instead of being dropped as busy.
    // The two showpieces never cut each other short: the governor waits for the castle and then goes first.
    const show = name === '总督' && this.cur?.name === '城堡';
    // While the chest game is wound up she is busy (wrapping): nothing cuts in, save the show that scared it off (live)
    const wait = this.cfg.game && !opts.game && !live && this.wrapping(now);
    if (!wait && (!this.cur || tier > curTier && !show || name === '连着送' && this.cur.name === '普通礼物')) return this.start(name, opts);
    if (tier <= TIER.C) return this.note(`${name}：正忙，丢掉`);
    if (tier < TIER.S && this.queue.filter(q => EVENTS[q.name].tier === ev.tier).length >= 3) return this.note(`${name}：同档已排 3 个，丢掉`);
    this.queue.push({ name, opts }); this.note(`${name}：排队`);
  }

  start(name, opts) {
    const now = this.now();
    if (opts.until != null && opts.until - now < PK_SIGN.least) return this.note(`${name}：只剩 ${Math.max(0, (opts.until - now) / 1000).toFixed(1)} 秒，不举牌`);
    if (this.cur) this.note(`${this.cur.name} 被 ${name} 打断`);
    // a PK countdown cut off goes back to the head of the queue: once the bigger show is over it is held up again for
    // what is left, if PK_SIGN.least or more (the check above); every other show cut off is gone
    if (this.cur?.opts.until != null && this.cur.name !== name) this.queue.unshift({ name: this.cur.name, opts: this.cur.opts });
    const wake = !!opts.wake, dur = name === '日常' ? DAILY[opts.kind][0] + (opts.mishap ? DAILY[opts.kind][1] : 0) : (opts.zap && EVENTS[name].zapDur) || EVENTS[name].durs?.[opts.result] || EVENTS[name].dur;   // zapDur: the longer show after the lightning
    // (robbed: 被偷了 waits while it makes off with the chest, the visit's last moments; endVisit starts it)
    this.cur = { name, opts, start: now, pre: Math.max(wake ? 1000 : 0, opts.tidy || opts.robbed ? FRIZZ : 0), dur, line: this.pick(this.lineKey(name, opts)), wakeLine: wake ? this.pick('冷场后来了人') : null };
    // a round's blind boxes were shaken all the while they came in: the show opens the box right away instead of shaking it again
    if (opts.shaken && BOX_OPEN[name]) this.cur.start -= BOX_OPEN[name];
    if (opts.until != null) this.cur.dur = Math.min(dur, opts.until - now + PK_SIGN.down);   // a late countdown is shorter
    if (name === '日常') this.nextDaily = now + dur + 20000 + this.rng() * 20000;
    // after the chest game: robbed, she is sad until a gift cheers her up (MOOD_HOLD.robbed at most, its own lines); kept,
    // glad for MOOD_HOLD.kept (and no 日常 meanwhile: those come only when she is 平静)
    if (name === '被偷了') this.moodHold = { mood: '沮丧', lines: '沮丧·被偷', until: now + dur + MOOD_HOLD.robbed };
    // a gift cheers her up: one whose show plays, not one let go while she is busy (the rest of a spam of 小花花 came in as
    // she was robbed, and she was over it before she had cried)
    else if (EVENTS[name].gift && this.moodHold?.mood === '沮丧') this.moodHold = null;
    if (name === '守住了') this.moodHold = { mood: '开心', until: now + dur + MOOD_HOLD.kept };
    if (name === '报名开场') this.lot = { kind: '报名', phase: '报名中' };
    if (name === '奖池开场') this.lot = { kind: '奖池', phase: '点名前' };
    if (name === '报名截止' && this.lot) this.lot.phase = '等待';
    if (name === '奖池转动' && this.lot) this.lot.phase = '转动';
    if (name === '没人报名' || name === '抽奖结束') this.lot = null;
  }

  note(s) { this.log = [s, ...this.log].slice(0, 4); }

  // A blind box says the lines of its ending, a 日常 its kind's; every other show its own.
  lineKey(name, opts = {}) { return name === '盲盒查询' ? '账单·' + (opts.result || '赚') : name === 'PK·结果' || name === 'PK·比分' ? 'PK·' + (opts.result || '赢') : name === 'PK·挑战' ? 'PK·挑战' + (opts.result || '成功') : EVENTS[name]?.results ? BOX_LINES[opts.result || '赚'] : name === '日常' ? (opts.kind === 'cos' ? costumeOf(opts) : opts.kind) : name === '守住了' && opts.buzzer ? '绝杀守住' : name; }

  // The endings a show can have, for checking every pose change (tools/check-board.mjs).
  eventVariants(name) { return (EVENTS[name]?.results || [null]).map(r => (r ? { result: r } : {})); }

  // ---- gift rounds (README 2): a viewer's gifts and blind boxes gather until ROUND_GAP of silence, then one show plays
  // for the whole round, chosen by what it spent and, for blind boxes, what they opened. 大航海 purchases do not wait.
  // give(list): sends one after another, 350 ms apart; an entry is one gift { gift, price, n, box?, boxPrice?, top?, castle? }
  // or a list of them, one message (B站 sends a batch of blind boxes as one message split by the gift each opened).
  give(list) { const now = this.now(); list.forEach((m, i) => { for (const x of [].concat(m)) this.pending.push({ ...x, at: now + i * 350 }); }); }

  arrive(x) {
    // any gift cuts a 盲盒查询 short, its card gone at once: blind boxes and a round's gift short of moving it up play no show
    // to take it over (as a C show it would otherwise drop a 普通礼物's thank-you as busy)
    if (this.cur?.name === '盲盒查询') { this.cur = this.seen = null; this.note('盲盒查询：礼物来了，截掉'); }
    // the first gift into a quiet room wakes her first (冷场后来了人), before the round's own show (not while the prankster is
    // here: fire)
    if (!this.round) { const wake = !this.gm.visit && ['沮丧', '犯困'].includes(this.mood(x.at, false)); this.round = { start: x.at, items: [], wake, wakeLine: wake ? this.pick('冷场后来了人') : null, played: -1 }; }
    const r = this.round;
    r.items.push(x); r.last = x.at;
    this.lastGift = this.lastAny = x.at; this.recent = this.recent.filter(v => x.at - v < 60000).concat(x.at);
    // the chest game: a gift counts for her chest at home; one thrown while the prankster is here plays no show of hers.
    // Blind boxes then stay in the round for its 盲盒播报 (endRound). A new first place it brings plays once it has gone.
    const kept = this.cfg.game && this.gameGift(x, r);
    if (kept && x.top) this.gm.top = true;
    if (kept === 'quiet') return;   // kept aside for her chest, in the round still, no show while the prankster is here
    if (kept) { r.items.pop(); if (!r.items.length) this.round = null; return; }   // thrown: a 人气票 or 小花花
    // Gifts do not wait for the round to end: she plays at once the show the round's gifts have come to so far, and moves
    // up when it grows into a bigger one (the fifth gift, 1000 or 10000 电池, a castle); one already played is not played
    // again. Blind boxes wait for the 盲盒播报 (announce).
    if (x.box) return;
    const gifts = r.items.filter(i => !i.box), spend = gifts.reduce((a, i) => a + i.price * i.n, 0), count = gifts.reduce((a, i) => a + i.n, 0);
    const kind = gifts.some(i => i.castle) ? '城堡' : spend >= BIG ? '大礼物' : spend >= MID ? '中礼物' : count >= 5 ? '连着送' : '普通礼物';
    if (GIFT_SHOWS.indexOf(kind) <= r.played) return;
    const best = gifts.reduce((a, i) => (i.price > a.price ? i : a));
    this.fire(kind, { top: !!x.top, spend, gift: best.gift, count, wake: r.played < 0 && r.wake });
    r.played = GIFT_SHOWS.indexOf(kind); r.wake = false;
  }

  // The bot's 盲盒播报 for the round's blind boxes, worded as BlindBoxTally.Announcement; the show plays its result.
  announce(now) {
    const boxes = this.round.items.filter(x => x.box), spend = boxes.reduce((a, x) => a + x.boxPrice * x.n, 0), profit = boxes.reduce((a, x) => a + x.price * x.n, 0) - spend;
    this.announced = { at: now, text: `@${this.cfg.name} 本次投入${spend}电池 ${profit === 0 ? '不赚不亏' : (profit > 0 ? '赚' : '亏') + Math.abs(profit) + '电池'}` };
    this.endRound();
  }

  // The round is over. Its gifts have played already; its blind boxes play now, with the 盲盒播报's result: the size by
  // what the boxes cost, the ending by what they opened, and castles among them play the castle, each after the one before
  // (用户：“出两个城堡只演一段？这可不行”).
  endRound() {
    const items = this.round.items; this.round = null;
    const boxes = items.filter(x => x.box); if (!boxes.length) return;
    const sum = f => boxes.reduce((a, x) => a + f(x), 0), best = boxes.reduce((a, x) => (x.price > a.price ? x : a));
    const spend = sum(x => x.boxPrice * x.n), opened = sum(x => x.price * x.n), count = sum(x => x.n), opts = { top: boxes.some(x => x.top), spend, opened, count };
    const castles = sum(x => (x.castle ? x.n : 0));
    if (castles) return this.castles(castles, opts);
    const jackpot = best.price >= BIG, result = jackpot ? '大奖' : opened > spend ? '赚' : opened === spend ? '平' : '亏';
    const size = jackpot || spend >= BIG ? 2 : spend >= MID ? 1 : 0, v = this.gm.visit;
    // While the prankster is here a 盲盒·小 round only goes in her chest, as a gift short of a 中礼物 does (gameGift); a
    // bigger one plays and scares it off at its 盲盒播报, as castles out of it do (用户 review: 5000 电池 of boxes did nothing
    // while 1000 of a gift scared it off; castles used to be timed apart, castleDue).
    if (!size && v && !DONE.has(v.phase)) { if (opts.top) this.gm.top = true; return; }
    this.fire(['盲盒·小', '盲盒·中', '盲盒·大'][size], { ...opts, result, gift: best.gift, shaken: true });
  }

  // n castles, each its own show queued after the one before; the first place is crowned after the first.
  castles(n, opts) { for (let i = 0; i < n; i++) this.fire('城堡', { top: opts.top && !i, spend: opts.spend, gift: '浪漫城堡', count: 1 }); }

  // Whether she shakes the round's blind boxes while no show plays.
  // (not over blind boxes thrown at the prankster while it is here: held, gameGift)
  shaking() { return this.round?.items.some(x => x.box && !(x.held && this.gm.visit)); }

  // While a round with blind boxes is still coming in she does not just wait: she shakes the box the whole time, until the
  // 盲盒播报 tells how it came out, and each gift flies into her arms.
  roundState(now) {
    const r = this.round, st = this.base();
    st._t = now - r.start; st.round = true;
    if (r.wake && st._t < 1000) {
      st.pose = 'awake'; st.sprite = 'surprised'; st.fx.push(['bang', 0], ['shock', 0], ['sweat', 200]); st.y -= 10 * bump(st._t, 0, 300);
      st.bubble = { text: this.fill(r.wakeLine, '冷场后来了人'), t: st._t };
      return st;
    }
    st.pose = 'shakeBox'; st.sprite = 'sLook'; st.sFlip = true; st.sp = BOX_EAR;
    for (const x of r.items) st.fx.push(['giftArc', x.at - r.start]);
    st.fx.push(['shakeMarks', 0, 0.83, 0.44, 1e9]);
    return st;
  }

  pick(name, lines = LINES) {
    const list = lines[name]; if (!list) return null;
    let i = Math.floor(this.rng() * list.length);
    if (list.length > 1 && i === this.lines[name]) i = (i + 1) % list.length;
    this.lines[name] = i;
    return list[i];
  }

  // A line said for a while, a 心情's, a jolt's or a 日常's going wrong, is picked when she starts saying it (at) and kept till
  // she is done; at is rounded, as worked out from now it comes out a hair apart from frame to frame.
  saying(name, at) {
    const start = Math.round(at);
    if (this.said?.at !== start) this.said = { at: start, line: this.pick(name) };
    return this.said.line;
  }

  update(now) {
    for (const x of this.pending.filter(x => x.at <= now)) this.arrive(x);
    this.pending = this.pending.filter(x => x.at > now);
    const r = this.round;
    if (r && !this.pending.length && now - r.last >= ROUND_GAP) {
      if (!r.items.some(x => x.box)) this.endRound();
      else if (now - r.last >= ROUND_GAP + ANNOUNCE_AFTER) this.announce(now);
    }
    const c = this.cur;
    if (c && now >= c.start + c.pre + c.dur) {
      this.cur = this.seen = null;
      if (c.name.startsWith('揭晓') && this.lot?.kind === '奖池') this.lot.phase = '点名前';
      if (c.opts.top) this.start('新的第一名', { chained: true });
    }
    // what waited, the best first; while the chest game is wound up it waits on (wrapping)
    if (!this.cur && this.queue.length && !(this.cfg.game && this.wrapping(now))) {
      const best = Math.max(...this.queue.map(q => TIER[EVENTS[q.name].tier]));
      const i = this.queue.findIndex(q => TIER[EVENTS[q.name].tier] === best);
      const [q] = this.queue.splice(i, 1);
      this.start(q.name, { ...q.opts, chained: true });
    }
    if (this.cfg.game) this.gameUpdate(now);
    // (README 2 has it after the main show: a gift thrown at the prankster plays none, so it waits for it to be gone and
    // the chest home; 用户 review: it was lost)
    if (this.gm.top && !this.cur && !this.gm.visit && !this.gm.out && !this.gm.fix && !this.shaking()) { this.gm.top = false; this.start('新的第一名', { chained: true }); }
    // (nor while the sprite is still taking the chest home or to pat her hair smooth, nor in a PK: humming or skiing
    // through it, right after the score swung, made no sense)
    if (!this.cur && this.mood(now) === '平静' && !this.lot && !this.gm.visit && !this.gm.out && !this.gm.fix && !this.gm.pk && now >= this.nextDaily) {
      const kinds = Object.keys(DAILY), kind = kinds[Math.floor(this.rng() * kinds.length)], mishap = this.rng() < 0.25;
      const costumes = Object.keys(COS), costume = kind === 'cos' ? costumes[Math.floor(this.rng() * costumes.length)] : undefined;
      this.start('日常', { kind, mishap, costume });
    }
  }

  // hold: a mood the chest game left her in (moodHold) goes first; the 冷场 rules alone decide whether a gift wakes her
  // (sad over the chest she has not dozed off nor been left alone: a gift is thanked at once, with no 冷场后来了人)
  mood(now, hold = true) {
    if (hold && this.moodHold && now < this.moodHold.until) return this.moodHold.mood;
    const recent = this.recent.filter(r => now - r < 60000).length;
    if (now - this.lastAny >= 60 * 60000) return '犯困';
    if (now - this.lastGift >= 40 * 60000) return '沮丧';
    if (now - this.lastGift >= 15 * 60000) return '无聊';
    return recent >= 3 ? '开心' : '平静';
  }

  // a danmaku is not played (README 10), it only tells her someone is there: 犯困 needs an hour with nothing at all
  heard(w, said = '') { this.lastAny = this.now(); if (this.cfg.game) this.gameDanmaku(w ?? this.someone(false), said); }

  fastForward(min) { const d = min * 60000; this.lastGift -= d; this.lastAny -= d; this.recent = this.recent.map(r => r - d); this.nextDaily -= d; this.gm.last -= d; }

  // ---- the chest game (#372) ----------------------------------------------------------------------------------------
  // Nothing of it is on the page until the prankster comes, and nothing of it stays. Her chest is at home, off the left
  // of the page, where the game only counts what the stream's gifts put in it. The prankster has stolen it: it flies in
  // from the left with the chest hanging from its own hook rope, over her head, and sets it down on her right, on its way
  // out to the right. An empty chest it opens, mocks, and throws back. One with gifts in it springs open as it lands: she
  // takes hold of the handle at her end and pulls for home, it pulls its rope for the right edge, and the room has a
  // minute to beat it off. There is one rope in all of it, the prankster's; the chest has two plain handles.
  // gm: chest (the 电池 in it), pile (the gifts drawn in it), drops and nums (what falls and the numbers that rise, for
  // drawGame), visit (the prankster while it is here), due (it is to come once nothing plays), last (when it last left),
  // out (the sprite flying the chest home), walk (her hopping to another place), streak and steals, brag and grudge (what
  // it opens with next time), say (her line of the game), herX (where she stands).

  // A gift while the game is on, in its viewer's round r. Out of a visit it only counts for the chest at home: her own
  // show plays as ever (false). While the prankster is here a 人气票 or 小花花 is thrown (queue), one 票 each, twice while
  // the other side is open (luck), and plays nothing ('thrown'); over an empty chest in the air the first decides it
  // there and then, as a 秒杀 in the air does (finish; 用户 review: it waited up to 12 s for the chest to land, with no bar
  // to show it meanwhile). Any other gift plays nothing, staying in the round ('quiet'), until the round comes to a 中礼物:
  // then its show plays (false), which scares it off (fire); a blind box stays in its round for the 盲盒播报 (held,
  // endRound). Those it is not fought over: they are kept aside for her chest at home, which it has on the page, and go in
  // once it has gone, however it went (endVisit; 用户 review: in that chest an empty one was opened as empty with gifts in
  // it, and they were lost with it). Once a gift's light is on its way the fight is decided: a 人气票 or 小花花 then is
  // only a gift (giftBurst).
  gameGift(x, r) {
    const gm = this.gm, v = gm.visit, spend = (x.box ? x.boxPrice : x.price) * x.n, side = !x.box && SIDE_GIFT[x.gift], now = this.now();
    if (!v || DONE.has(v.phase)) { gm.chest += spend; gm.pile += x.n; return false; }
    if (!side || gm.burst?.due != null) {
      gm.aside += spend; gm.asidePile += x.n;
      if (x.box) { x.held = true; return false; }
      return side || r.items.filter(i => !i.box).reduce((a, i) => a + i.price * i.n, 0) >= MID ? false : 'quiet';
    }
    const w = x.viewer || this.someone();
    this.enlist(w, side, 'gift');
    const more = v.luck?.side === side && now < v.luck.until ? x.n : 0, q = { n: x.n + more, count: x.n, side, spend, w, double: more > 0, early: v.phase === 'peek' };
    v.queue.push(q);
    if (!q.early) this.reckon(q, now);
    return 'thrown';
  }

  // A 人气票 or 小花花 counts the moment it comes: on the bar (tally), or over an empty chest in the air it decides it there
  // and then (finish). One while it only peeks in counts once the chest hangs from its rope on its way in (early,
  // gameUpdate; 用户 review: it was off across the page with a chest out of nowhere, or she cheered for one never seen).
  reckon(q, now) {
    const v = this.gm.visit;
    if (v.loot) this.tally(q.w, q.side, q.n, now, q.double);
    else if (['carry', 'fall'].includes(v.phase)) this.finish(now, q.side, { w: q.w });
  }

  // Whether the fight is on: the chest has something in it, and it is flying in with it or they are pulling (the bar is up).
  contested(v) { return v.loot && ['peek', 'carry', 'fall', 'tug'].includes(v.phase); }

  // The score as the 票 reach the page (red, blue), and the bar's line with it there and then: where it was stays white a
  // moment (ghost), the bar shakes, and +N and the name rise from where it is now (用户：“怎么送了礼物以后、宝箱不按照进度
  // 移动？反而出现颜色？”: it moved when the gift landed, a light segment showing what was on its way meanwhile). Then
  // whose side it now favours (hers only when she is ahead: a tie is its) and who turned it so, as it stood then (flip:
  // who scored the 绝杀 if it stays so); then, a side with enough on the way to take the line to its end wins at once.
  tally(w, side, n, now, double = false) {
    const v = this.gm.visit, before = v.red - v.blue;
    v[side > 0 ? 'red' : 'blue'] += n;
    const lead = v.red - v.blue, favours = lead > 0 ? 1 : -1;
    v.ghost = { lead: before, at: now, n };
    this.gm.nums.push({ at: now, text: `+${n} ${w.name}`, side, x: this.lineX(v), big: double || Math.abs(lead) >= v.span });
    if (favours !== v.favours) { v.favours = favours; v.flip[favours] = { w, late: v.judge != null || (v.left ?? GAME.fight) <= GAME.sprint }; }
    if (Math.abs(lead) >= v.span) this.finish(now, favours, { w, n, late: v.judge != null || (v.left ?? GAME.fight) <= GAME.sprint });
  }

  // The fight ends with side's 秒杀 (by: the gift that did it). In the tug what is on its way lands at once, the lightning
  // cut short; in the air she knocks it down (it lets go as if scared off, the chest falls and goes home) or it gets away
  // with the chest over the right of the page.
  finish(now, side, by) {
    const gm = this.gm, v = gm.visit;
    if (DONE.has(v.phase)) return;
    for (const q of [...v.hits, ...v.queue]) { v.spent += q.spend; v.count += q.count; }
    v.hits = []; v.queue = [];
    const buzzer = by.late ? by.w : null;
    if (v.phase !== 'tug') {
      v.pos = { x: this.gl?.pk?.x ?? v.pos.x, y: this.gl?.pk?.y ?? v.pos.y };
      return side > 0 ? this.airKnock(now, by.w) : this.airSteal(now, by.w);
    }
    v.net = side * v.span; v.cut = null;
    if (side > 0) this.win(now, by.w, buzzer); else this.lose(now, by.w, buzzer);
  }

  // Its lightning's bolt hits her (BOLT into it): its side gains a quarter of the way to an end at once, shown as a gift
  // reaching the page is (the line back her way, where it was white a moment, the jolt, +N in its colour), and the chest
  // jerks its way (tumble). Half her lead at the lightning goes, but it does not put it ahead; who turned it stays a
  // viewer's (the lightning is no one's 绝杀). (用户：“而且触发了没啥特殊buff么”: the lightning only paused the clock;
  // a ×2 for 小花花 was no good, the lucky paper ball being one already.)
  zapBack(now) {
    const v = this.gm.visit, n = Math.round(v.span / 4), before = v.red - v.blue;
    v.blue += n; v.net -= n; v.tumble = now;
    v.ghost = { lead: before, at: now, n };
    this.gm.nums.push({ at: now, text: `+${n} 捣蛋鬼`, side: -1, x: this.lineX(v) });
    const lead = v.red - v.blue, favours = lead > 0 ? 1 : -1;
    if (favours !== v.favours) { v.favours = favours; v.flip[favours] = null; }
    if (lead <= -v.span) this.finish(now, -1, { w: null });
  }

  // Knocked out of the air: it lets go and flees as a 大航海 scares it, the chest falls and the sprite takes it home, and
  // she cheers as when it is beaten off (守住了) the moment it is knocked down, not once the chest is home (用户：“她看到了
  // 打下来就欢呼”); her line still waits for the chest to be up past her bubble (chestUp). (scare puts what was thrown in
  // the chest and counts it kept.) An empty chest knocked down is as one knocked off on the ground: 打跑了, and no bar.
  airKnock(now, w) {
    const gm = this.gm, v = gm.visit;
    this.scare(now); gm.grudge = w.name;
    if (!v.loot) return this.fire('打跑了', { game: true, nickname: w.name });
    Object.assign(v, { result: 1, resultAt: now });
    this.fire('守住了', { game: true, streak: gm.streak, nickname: w.name });
  }

  // Off with an empty chest for a 小花花: it laughs its thanks, gets up with the chest on its rope and is away with it, and
  // she cries over it (被偷了, from now: she is sorry, then reaches after it). She has lost her chest, so 连守 goes; there
  // was nothing in it, so it has nothing to brag of next time (用户 review: 连守 stayed, and it bragged of 上次那箱).
  snatch(now, w) {
    const gm = this.gm;
    Object.assign(gm, { chest: 0, pile: 0, streak: 0, steals: gm.steals + 1 });
    this.phase('snatch', now); this.pkSay('flower', now, w.name); gm.visit.snatched = true;
    this.fire('被偷了', { game: true, robbed: true });
  }

  // Off with it in the air: it flies on over the right of the page with the chest still hanging from its rope (away).
  // (an empty chest, given it by a 小花花 in the air, it thanks them for, as for one on the ground: snatch)
  airSteal(now, w) {
    const gm = this.gm, v = gm.visit;
    Object.assign(gm, { chest: 0, pile: 0, streak: 0, steals: gm.steals + 1, brag: v.loot });
    if (v.loot) Object.assign(v, { result: -1, resultAt: now });
    this.phase('away', now); this.pkSay(v.loot ? 'lost' : 'flower', now, w.name);
    this.fire('被偷了', { game: true, robbed: true });
  }

  // Whoever sends a 人气票 or 小花花 (by: 'gift') or says 1 or 2 (by: 'dm') is on that side this visit, the newest last; a
  // gift's side stands, so 1 or 2 after it does not move them (their avatar would hang on one side, their balls fly
  // from the other). Returns the side they are on.
  enlist(w, side, by) {
    const sides = this.gm.visit.sides, s = sides.get(w.uid);
    if (s?.by === 'gift' && by === 'dm') return s.side;
    sides.delete(w.uid); sides.set(w.uid, { ...w, side, by, at: this.now() });
    return side;
  }

  // One of the board's viewers: on a side (true), on none (false), or anyone, rather one on no side yet (null).
  someone(on = null) {
    const sides = this.gm.visit?.sides, pool = VIEWERS.filter(w => on === null ? !sides?.has(w.uid) : !!sides?.has(w.uid) === on);
    const from = pool.length ? pool : on === null ? VIEWERS : [];
    return from.length ? from[Math.floor(this.rng() * from.length)] : null;
  }

  // A lucky ball for sure (three in ten by chance), from someone put on side sd, while the tug is on and none is open (the
  // 小游戏 buttons, and check-game.mjs's lucky routes).
  lucky(sd) { const v = this.gm.visit, w = this.someone(); if (v?.phase !== 'tug' || v.cut != null || v.luck) return; this.enlist(w, sd, 'dm'); v.balls.push({ at: this.now(), side: sd, lucky: true, w, seed: this.rng() }); }

  // The prankster is to come: once whatever plays is over (a 日常小动作 is not cut short), gameUpdate starts its visit.
  visit() { if (this.cfg.game && !this.gm.visit && !this.gm.pk) this.gm.due = true; }
  // A PK (连麦 PK) is no time for it: it does not come, and one here goes as if scared off, with no show after: she lets
  // go and is herself again; after the lightning she cheers frizzed until the sprite, the chest home, has patted her hair
  // smooth (gm.fix, unfrizz, as before a show that scared it off). It used to play 守住了 without its line, confetti
  // and all the moment it ran (用户：“pk开始打断的效果不好、重改”).
  pkOn(on) {
    const gm = this.gm, v = gm.visit, now = this.now();
    gm.pk = on;
    if (!on) return;
    gm.due = false;
    if (!v || DONE.has(v.phase)) return;
    const frizz = v.phase === 'tug' && !!v.bolted;
    this.scare(now);
    if (frizz) gm.fix = { start: now };
  }

  startVisit(now) {
    const gm = this.gm;
    gm.due = false; gm.out = null;
    // loot: there is something in the chest to fight over
    gm.visit = { phase: 'peek', at: now, queue: [], hits: [], spent: 0, count: 0, freezes: 0, helped: 0,
      sides: new Map(), balls: [], struck: {}, retorted: {}, taunted: new Set(), taunt: -Infinity, lucked: -Infinity, luck: null,
      span: clamp(Math.round(gm.chest / 20), 300, 500), net: 0, red: 0, blue: 0, favours: -1, flip: {}, drag: 0, pos: { x: -70, y: 120 }, chest: null, loot: gm.chest > 0 };
    this.pkSay(gm.brag ? 'brag' : gm.grudge ? 'grudge' : 'peek', now, gm.grudge);
    gm.brag = false; gm.grudge = null;   // (said once: 上次 is the last visit, 用户 review: it named one from visits before)
  }

  // Its next phase; from and fromCx are where it and the chest (standing) were, for the phases that go on from there.
  phase(p, now) {
    const v = this.gm.visit;
    Object.assign(v, { phase: p, at: now, from: { ...v.pos }, fromCx: v.chest?.x ?? LAND });
    if (['knocked', 'fled'].includes(p)) v.say = null;
  }

  // Where the tug's line is across the bar: her share is what she has knocked off its life.
  lineX(v) { return BAR.x + 2 + (BAR.w - 4) * clamp(0.5 + (v.red - v.blue) / (2 * v.span), 0, 1); }

  // In the last stretch, while she is not ahead, it hauls the chest off and she is dragged along; ahead, she holds on.
  dragging(v) { return v.sprint != null && v.net <= 0; }

  pkSay(kind, now, name) { this.gm.visit.say = { text: this.pick(kind, PKLINES).replace('{昵称}', name), at: now }; }

  herSay(kind, now, name = this.cfg.name) { this.gm.say = { text: this.fill(this.pick(kind).replaceAll('{昵称}', name)), at: now }; }

  // She hops to x in so many little hops (never a slide).
  hopTo(x, now, hops = 1) { const gm = this.gm; if (Math.abs(x - gm.herX) > 1) gm.walk = { from: gm.herX, to: x, at: now, ms: 300 * hops, hops }; }

  // The chest it has let go of goes home: the sprite presses the lid shut if it is open, takes up the prankster's dropped
  // hook rope and flies the chest back over her head, off the left of the page, in ms. t2 is how long it is before the
  // sprite can have the rope; got (gameState) is when it really has it.
  sendHome(now, ms = HOME, popped = false) {
    const v = this.gm.visit, c = v.chest;
    if (!c) return;
    const open = popped || !!this.gl?.open;
    this.gm.out = { at: now, ms, hook: this.ring(c.x, 1), open, t2: GO + (open ? SHUT : 0) + TAKE, got: null };
    v.chest = null;
  }

  // Where the rope in the prankster's carrying drawing ends on the page (tip, boot), and how far from the sprite's centre
  // the rope in its drawing ends.
  pkTip(p) {
    const c = this.pkCell(p.pose), s = PK_H / c.ruler * p.scale, x = (p.flip ? -1 : 1) * c.tip.x * s, y = c.tip.y * s, k = Math.cos(p.rot), n = Math.sin(p.rot);
    return { x: p.x + x * k - y * n, y: p.y + x * n + y * k };
  }

  spTip(pose) { const c = this.cell(pose, SPRITE), s = SPRITE_H / c.ruler; return { x: c.tip.x * s, y: c.tip.y * s }; }

  // Where its flight with the chest ends: the end of its rope right over where the chest's handle will stand.
  carryEnd() { const c = this.pkCell('carry'); return { x: this.ring(LAND, 1).x + c.tip.x * PK_H / c.ruler, y: 198 }; }

  // The link the chest's ring on side s (-1 hers, 1 the prankster's) hangs from, when the chest stands at x.
  ring(x, s) { return { x: x + s * (this.chestBox.w / 2 - RING.x * K), y: CHEST.y - RING.y * K }; }

  // How far in front of her centre the chest's link is in a drawing of hers that holds its ring (GRIP).
  grip(pose) { const [k, i] = POSE[pose], c = this.cells[k][i]; return (c.ox + GRIP - c.cx) * H / c.ruler; }   // (its cell, not a loop's frame)

  // A ring of the chest, hung from the link at p and swung to point along ux, uy (straight down when nothing holds it).
  drawRing(g, p, ux = 0, uy = 1) {
    g.save(); g.translate(p.x, p.y); g.rotate(Math.atan2(uy, ux) - Math.PI / 2); g.scale(K, K);
    g.drawImage(this.props.chestRing, -RING.hang[0], -RING.hang[1]); g.restore();
  }

  // Where her sprite pats her head as she lies where the prankster has dragged the chest from her: as 'head' puts it over her standing (a little left of her
  // head and over it), her head HEAD across her lying drawing.
  comfort(st, now) { const b = this.herBox(st, this.cell(st.pose)); return ['at', b.x + b.w * HEAD[st.pose] - 36, b.y - 15 + 3 * Math.sin(now / 500)]; }

  // Where the prankster floats to pull at the ring that hangs from p: leaning back by rot, the rope its drawing holds
  // (less trim) in one line with the hook and the ring. pkEnd: where that rope ends on the page, the prankster at p.
  pkPull(p, pose, rot, trim) {
    const c = this.pkCell(pose), s = PK_H / c.ruler, x = (c.x - c.cx + trim) * s, y = (c.y - c.cy + c.h * c.rope) * s;
    const d = RING.reach * K + HOOK + 2, k = Math.cos(rot), n = Math.sin(rot);
    return { x: p.x + d * k - x * k + y * n, y: p.y + d * n - x * n - y * k };
  }

  pkEnd(p) {
    const c = this.pkCell(p.pose), s = PK_H / c.ruler * p.scale, x = (c.x - c.cx + (p.trim || 0)) * s + 2, y = (c.y - c.cy + c.h * c.rope) * s, k = Math.cos(p.rot), n = Math.sin(p.rot);
    return { x: p.x + x * k - y * n, y: p.y + x * n + y * k };
  }

  // A 人气票 or 小花花 lands (h: its 票 n, twice in a lucky window, the gifts count, its side, spend and viewer w). Over an
  // empty chest one gift decides it: a 人气票 knocks it off the page, and is the chest's first; a 小花花 goes in the chest,
  // and it is off with the chest (snatch; 用户：“空箱子送小花花会怎么样”: it only laughed, sat on, and threw the chest back
  // at 45 s all the same, saying 箱子归我了). In the tug a 人气票 moves the line its 票 toward the prankster's end, a 小花花
  // its 票 toward hers, landing on her head: she lets go of the handle, so the prankster, glad of it, points at her and
  // laughs, and the chest comes a little its way (tumble), while her sprite pulls on alone; then she takes hold again. The
  // fifth of them, counted by the gift (count, five in one go too), flattens her: she lies flat while her sprite pulls on,
  // catches the handle lying down and is dragged a little before she is up. While she is dragged in the last stretch she
  // only winces. Where the line was before it (ghost) shows a moment on the bar. One that lands once the fight is over
  // goes home to her chest.
  strike(now, h) {
    const gm = this.gm, v = gm.visit, name = h.w.name;
    if (DONE.has(v.phase)) { gm.chest += h.spend; gm.pile += h.count; return; }
    if (!v.loot) {
      if (h.side < 0) return this.snatch(now, h.w);
      gm.grudge = name; gm.chest += h.spend; gm.pile += h.count;
      this.phase('knocked', now); this.sendHome(now, HOME, true); return this.fire('打跑了', { game: true, nickname: name });   // the lid it sat on springs open for the gift
    }
    v.spent += h.spend; v.count += h.count;
    v.net += h.side * h.n;   // as it is, so time up judges it right: only the chest's drift stops at an end
    if (h.side < 0) {
      if (this.dragging(v)) { v.wince = now; return; }
      Object.assign(v, { bonk: now, tumble: now, helped: v.helped + h.count });
      if (v.helped % 5 < h.count) v.buried = now;   // one of these was the fifth, the tenth…
      return this.herSay('怎么砸我', now, name);
    }
    v.hit = now; gm.grudge = name;
    this.herSay('打得好', now, name);
  }

  // The chest has landed beside her: she starts back from the crash, then lunges for its handle and pulls, and the minute
  // starts. (How far each end is, span, was set as it came: the bar shows from then on.)
  grab(now) {
    const gm = this.gm, v = gm.visit;
    Object.assign(v, { left: GAME.fight, grabbed: now });
    this.phase('tug', now); v.say = null; this.herSay('宝箱摔下来', now);
    this.hopTo(Math.min(gm.herX, this.ring(LAND, -1).x - this.grip('lunge') - 10), now);   // back far enough to lunge forward
  }

  // A danmaku of w's (said: whether it is just 1 or 2) while it is here. Flying over with the chest, any danmaku freezes it
  // in a disguise while she looks about (three times at most). 1 or 2 puts w on a side (enlist). On the ground beside her
  // (the tug, or sitting on an empty chest), and not while the lightning plays: one on a side throws a paper ball at the
  // other side, a lucky one now and then while they fight; one on no side is called out by name, once a visit, no
  // sooner than TAUNT after the last and not over another line of its own. A danmaku never moves the bar.
  gameDanmaku(w, said) {
    const v = this.gm.visit, now = this.now();
    if (!v || DONE.has(v.phase) || !w) return;
    if (v.phase === 'carry' && v.freezes < 3 && !(now - v.frozen < FREEZE)) { v.frozen = now; v.freezes++; }
    const side = said === '1' || said === '2' ? this.enlist(w, said === '1' ? 1 : -1, 'dm') : v.sides.get(w.uid)?.side;
    if (!['tug', 'sit'].includes(v.phase) || v.cut != null) return;
    if (side) {
      const lucky = v.phase === 'tug' && !v.luck && now - v.lucked >= LUCK.gap && this.rng() < LUCK.chance;
      return void v.balls.push({ at: now, side, lucky, w, seed: this.rng() });
    }
    if (v.taunted.has(w.uid) || now - v.taunt < TAUNT || v.say && now - v.say.at < 3000) return;   // (its bubble shows 3 s)
    v.taunted.add(w.uid); v.taunt = now; this.pkSay('taunt', now, w.name);
  }

  // The paper balls that hit this frame: a lucky one opens whoever it hit, its side's gift counting twice for LUCK.ms (it
  // says so: hit, it begs nobody to send 人气票 now; her hit, it calls for 小花花); RETORT.hits of one side's in RETORT.ms
  // has the one hit answer back to whoever threw the last (it to her side, she to its), not over a line just said.
  ballsLand(now) {
    const v = this.gm.visit;
    for (const b of v.balls) {
      if (b.hit != null || now - b.at < BALL) continue;
      b.hit = now;
      const run = v.struck[b.side] = (v.struck[b.side] || []).filter(t => now - t < RETORT.ms).concat(now);
      if (b.lucky && v.phase === 'tug' && v.cut == null && !v.luck) {
        v.luck = { side: b.side, at: now, until: now + LUCK.ms, extra: 0 }; v.lucked = now + LUCK.ms;
        this.pkSay(b.side > 0 ? 'dazed' : 'urge', now);
      } else if (run.length >= RETORT.hits && now - (v.retorted[b.side] ?? -Infinity) >= RETORT.gap && !(v.say && now - v.say.at < 3000) && !(this.gm.say && now - this.gm.say.at < 2600)) {   // (its bubble 3 s, hers 2.6)
        v.retorted[b.side] = now;
        if (b.side > 0) this.pkSay('retort', now, b.w.name); else this.herSay('别丢啦', now, b.w.name);
      }
    }
    v.balls = v.balls.filter(b => b.hit == null || now - b.hit < 450);
    if (v.luck && now >= v.luck.until) { v.luckOut = { side: v.luck.side, at: now }; v.luck = null; }
  }

  // A gift that scares it off (a 大航海, a 中礼物 or bigger, a castle; not a lottery or a PK) does it before everyone's eyes:
  // light in the colour of the gift's tier swells in her and goes out as a ring; it is scared off the moment the ring
  // reaches it (BURST). In the tug it is her 秒杀:
  // the line runs to its end, her half flashes as when she wins, and the sender's name rises from that end (用户：“主要是拔
  // 河小游戏的时候、有人没送人气票或小花花、而是其他的大礼物、这时候需要打断并表演大礼物动画、但是打断的方式你再仔细研究”: the bar
  // was gone in a blink, the fight quietly counted as kept, and she stood about 4 s, 6.5 after the lightning, before the
  // show; ui-ux-pro-max: feedback at once, motion shows cause and effect, a result is confirmed, no unexplained wait).
  // The light swells in her and its ring goes out (drawGame); due is when the ring, slowing as it goes, reaches the edge
  // of the prankster where it is now (her middle o, its v.pos), and then it is scared off.
  giftBurst(now, ev, name, opts) {
    const gm = this.gm, p = gm.visit.pos, o = { x: gm.herX, y: FOOT.y - H * 0.5 };
    const k = clamp((Math.hypot(p.x - o.x, p.y - o.y) - PK_H * 0.35 - 30) / BURST.r, 0, 0.9);
    gm.burst = { at: now, o, rgb: GLOW[ev.glow || ev.tier], due: now + BURST.glow + BURST.ms * (1 - Math.sqrt(1 - k)), name, opts, more: [] };
  }

  // While the fight is on it is her 秒杀; name: who sent the gift (a lottery has none).
  sweep(now, name) {
    const gm = this.gm, v = gm.visit;
    Object.assign(v, { result: 1, resultAt: now, swept: true, ghost: { lead: v.red - v.blue, at: now, n: 30 } });
    if (name) gm.nums.push({ at: now, text: name, side: 1, x: BAR.x + BAR.w, big: true });
  }

  // A 大航海, a castle or a lottery scares it off: it drops its rope and flees, and the sprite hurries the chest home
  // before the show starts (TIDY, the show's wait); while the fight is on that is the chest kept. What is thrown and not
  // yet landed goes in the chest there and then (it used to land after on her or it, and neither minded). Returns that wait.
  scare(now) {
    const gm = this.gm, v = gm.visit;
    if (DONE.has(v.phase)) return 0;
    for (const q of [...v.hits, ...v.queue]) { v.spent += q.spend; v.count += q.count; }
    v.hits = []; v.queue = [];
    if (this.contested(v)) gm.streak++;
    gm.chest += v.spent; gm.pile += v.count;
    const hung = v.chest && v.chest.x == null && gm.hung;   // flying with it, the chest hanging from its rope
    this.phase('fled', now);
    if (!v.chest) return 0;
    let fall = null;
    if (hung) {
      // it falls straight down from where it hung (kept on the page), and stands where it lands
      const box = this.chestBox, ex = this.ring(0, 1).x, cx = clamp(hung.hook.x - ex, box.w / 2 + 4, PAGE.w - box.w / 2 - 4);
      fall = { at: now, hook: { ...hung.hook }, rot: hung.rot };
      v.chest = { x: cx };
      // were it to come down on her, she hops out from under it first, away from it
      const reach = box.w / 2 + 50;
      if (Math.abs(cx - gm.herX) < reach) {
        let side = gm.herX <= cx ? -1 : 1, to = cx + side * (reach + 20);
        if (to < 60 || to > PAGE.w - 60) { side = -side; to = cx + side * (reach + 20); }
        this.hopTo(clamp(to, 60, PAGE.w - 60), now);
      }
      v.dodge = now;
    }
    this.sendHome(now, TIDY, !!(fall && v.loot)); Object.assign(gm.out, { hop: 2, fall, spot: now + (fall ? FALL : 0) });   // she hops back to the middle once the chest is up out of her way
    return TIDY;
  }

  // Beaten off: what was thrown lands in the chest, the sprite flies it home, and she thanks whoever landed the last of it.
  // w: who landed the last of it; buzzer: who scored the 绝杀, if it was one (shown over where the fight's board was).
  win(now, w, buzzer) {
    const gm = this.gm, v = gm.visit;
    gm.streak++; gm.chest += v.spent; gm.pile += v.count;
    if (buzzer) gm.buzzer = { at: now + GAME.flash, side: 1, w: buzzer };
    Object.assign(v, { result: 1, resultAt: now });
    // beaten while it is still getting up from its fall it is knocked flying off the lid, as off an empty chest
    this.phase(v.phase === 'tug' && now - v.grabbed < UP ? 'knocked' : 'won', now); this.sendHome(now); this.hopTo(FOOT.x, now + HOME * 0.6, 3); this.pkSay('won', now);
    this.fire('守住了', { game: true, streak: gm.streak, zap: !!v.bolted, nickname: (buzzer ?? w)?.name, buzzer: !!buzzer });
  }

  lose(now, w, buzzer) {
    const gm = this.gm;
    Object.assign(gm, { chest: 0, pile: 0, streak: 0, steals: gm.steals + 1, brag: true });   // next time it brags of it
    if (buzzer) gm.buzzer = { at: now + GAME.flash, side: -1, w: buzzer };
    Object.assign(gm.visit, { result: -1, resultAt: now });
    this.phase('lost', now); this.pkSay(buzzer ? 'buzzer' : 'lost', now, buzzer?.name);
    this.fire('被偷了', { game: true, zap: !!gm.visit.bolted, robbed: true });
  }

  // 0:00 and the grace are over: what is on its way lands, and the side the line is on wins, a tie the prankster's. It is a
  // 绝杀 when whoever put the winners ahead did so in the last stretch or the grace.
  settle(now) {
    const v = this.gm.visit;
    for (const q of [...v.hits, ...v.queue]) this.strike(now, q);
    v.hits = []; v.queue = [];
    if (DONE.has(v.phase)) return;
    const side = v.net > 0 ? 1 : -1, f = v.flip[side], buzzer = f?.late ? f.w : null;
    if (side > 0) this.win(now, f?.w, buzzer); else this.lose(now, f?.w, buzzer);
  }

  // It is off the page: what came while it was here goes in her chest (gameGift), and, robbed, she cries now (被偷了).
  endVisit(now) {
    const gm = this.gm, c = this.cur;
    gm.chest += gm.aside; gm.pile += gm.asidePile; gm.aside = gm.asidePile = 0;
    gm.visit = null; gm.last = now; if (!gm.walk) this.hopTo(FOOT.x, now, 2);
    if (c?.opts.robbed && now < c.start + c.pre) c.pre = now - c.start;
  }

  // The chest game is still being wound up: it is still on the page, the chest is on its way home, her hair is still to
  // be smoothed, the game's own last show plays (守住了, 打跑了, 被偷了), or the show that scared it off waits for those.
  // Meanwhile she is busy: a show that comes waits its turn (a C one is let go), and none cuts in (用户 review: a 大礼物
  // just after it won cut 守住了 short while the sprite still flew the chest home, one just after it stole had her glad
  // before she had cried, and a 总督 just after a 舰长 that scared it off left the 舰长 unthanked, her hair smooth at once).
  wrapping(now) {
    const gm = this.gm, c = this.cur;
    return !!(gm.visit || gm.out || gm.fix || c && (c.opts.game || (c.opts.tidy || c.opts.frizz) && now < c.start + c.pre));
  }

  // The visit's clock. It comes at most once in GAME.every, when someone is about and no PK is on, once nothing plays and
  // she shakes no blind boxes for their 盲盒播报 (shaking): a round of gifts still coming in does not keep it waiting
  // (README 12: 不看礼物停没停). Then each phase runs its time, and the tug its countdown.
  gameUpdate(now) {
    const b = this.gm.burst;
    if (b?.due != null && now >= b.due) { b.due = null; this.fire(b.name, { ...b.opts, burst: true }); for (const [n, o] of b.more) this.fire(n, o); }   // the light has reached it
    const gm = this.gm, v = gm.visit, dt = now - (gm.clock ?? now);
    gm.clock = now;
    gm.drops = gm.drops.filter(d => now - d.at < 1400); gm.nums = gm.nums.filter(n => now - n.at < 1100);
    // the chest is home once the sprite has flown it off the page (or, should the sprite never get the rope, a while after)
    if (gm.out && (gm.out.got != null ? now - gm.out.got >= gm.out.ms - gm.out.t2 && !(this.sv?.x > -50) : now - gm.out.at >= gm.out.ms + 6000)) gm.out = null;
    if (!v) {
      if (now - gm.last >= GAME.every && now - this.lastAny < 5 * 60000) gm.due = true;
      if (gm.due && !this.cur && !this.shaking() && !this.lot && !gm.pk) this.startVisit(now);
      return;
    }
    // what is thrown waits while the chest is in the air, until the prankster is on its feet again, and while the lightning plays;
    // then all of it drops
    const away = ['peek', 'carry', 'fall'].includes(v.phase) || v.phase === 'tug' && now - v.grabbed < UP || v.phase === 'peer' && now - v.at < DAZED + 400 || gm.burst?.due != null;
    if (!away && v.cut == null && v.queue.length) {
      for (const q of v.queue) { gm.drops.push({ at: now, her: q.side < 0 && v.loot, big: q.n >= 10, side: q.side }); v.hits.push({ at: now + DROP, ...q }); }   // over an empty chest a 小花花 is for it
      v.queue = [];
    }
    for (const h of v.hits.filter(h => h.at <= now)) this.strike(now, h);
    this.ballsLand(now);
    v.hits = v.hits.filter(h => h.at > now);
    const u = now - v.at;
    switch (v.phase) {
      case 'peek': if (u >= GAME.peek) this.phase('carry', now); break;
      case 'carry':
        // what came while it peeked counts now, the chest hanging from its rope (drawn: v.chest) on its way in
        if (v.chest) for (const q of v.queue.filter(q => q.early)) { q.early = false; if (!DONE.has(v.phase)) this.reckon(q, now); }
        if (DONE.has(v.phase)) break;
        if (now - v.frozen < FREEZE) v.at += dt;   // frozen, its clock stands still
        else if (u >= GAME.carry) {
          // the chest is too much for it: over her right it can hold on no longer, and comes down with the chest
          v.pos = this.carryEnd();   // where the carrying ends, whatever frame drew it last
          this.phase('fall', now);
        }
        break;
      case 'fall':
        if (u < FALL) break;
        // the chest stands on the ground, the prankster in a heap on its lid
        v.chest = { x: LAND }; v.landed = now; v.pos = { x: LAND, y: CHEST.y - this.chestBox.h - PK_H * 0.3 };
        if (v.loot) this.grab(now); else { this.phase('peer', now); this.hopTo(FOOT.x - 60, now + DAZED + 300); }
        break;
      case 'peer': if (u >= DAZED + 1900) { this.phase('shrug', now); this.pkSay('shrug', now); } break;
      case 'shrug': if (u >= 2800) { this.phase('sit', now); this.pkSay('sit', now); } break;
      case 'sit': {
        const n = Math.floor(u / 20000);
        if (u >= GAME.loiter) { this.phase('toss', now); this.pkSay('toss', now); }
        else if (n > (v.heckled || 0)) { v.heckled = n; v.laugh = now; this.pkSay('sit', now); }
        break;
      }
      case 'toss': if (u >= 1700) this.phase('leave', now); break;
      case 'tug':
        if (v.cut != null) {   // the set piece plays: the countdown waits; its bolt knocks her lead back (zapBack)
          if (!v.bolted && now - v.cut >= BOLT) { v.bolted = true; if (gm.burst?.due == null) this.zapBack(now); }
          if (v.cut != null && now - v.cut >= ZAP) v.cut = null;
          break;
        }
        // a gift's light is on its way to scare it off: the fight is decided, so the countdown and the lightning wait, and
        // no 秒杀 comes first (用户 review: 100 小花花 just after a 小电视飞船 stole the chest under its light)
        if (gm.burst?.due != null) break;
        if (v.zapped == null && v.judge == null && v.net >= v.span / 2) { v.zapped = v.cut = now; this.pkSay('zap', now); break; }
        // it answers her once her bubble is gone (the two stand close then), and after that calls for helpers
        if (!v.caught && now - v.grabbed >= 2900) { v.caught = true; this.pkSay('grab', now); }
        if (!v.recruited && now - v.grabbed >= 6200) { v.recruited = true; this.pkSay('recruit', now); }
        if (v.judge == null) {
          v.left -= dt;
          if (v.left <= GAME.sprint && v.sprint == null) v.sprint = now;
          if (v.left <= 0) Object.assign(v, { left: 0, judge: now });   // 判定中: GAME.grace for what is late on the way
        } else if (now - v.judge >= GAME.grace) { this.settle(now); break; }
        // its bye the first time it hauls the chest off (it said it on the last 10 s with her ahead, not hauling at all)
        if (this.dragging(v) && !v.bye) { v.bye = true; this.pkSay('sprint', now); }
        // dragged in the last stretch while she is not ahead, held while she is: the chest comes back as smoothly as it went
        v.drag += clamp((this.dragging(v) ? 150 * k01(now, v.sprint, v.sprint + GAME.sprint) : 0) - v.drag, -dt * 0.06, dt * 0.06);
        break;
      case 'snatch': if (u >= SNATCH.up) { this.phase('away', now); v.from.x += 2 * this.pkTip({ pose: 'carry', flip: false, x: 0, y: 0, rot: 0, scale: 1 }).x; } break;
      case 'lost': if (u >= 1600) this.endVisit(now); break;
      case 'away': if (u >= 2400) this.endVisit(now); break;
      default: if (u >= (v.phase === 'fled' ? (v.ran ?? Infinity) + OFF.fled : OFF[v.phase] ?? 1800)) this.endVisit(now);   // leave, knocked, won, fled: it is off the page
    }
  }

  // Where the chest and the prankster are at this moment (this.gl, for drawGame), and what she does about it while no
  // show of hers plays: every phase of a visit has its place and pose, and she stays in her 心情 until the chest lands
  // beside her.
  gameState(st, now) {
    const gm = this.gm, v = gm.visit, box = this.chestBox;
    const L = this.gl = { chest: null, open: false, pk: null };
    // she hops to where she is to stand, and everything she plays is played from there
    let hopY = 0;
    if (gm.walk) {
      const k = k01(now, gm.walk.at, gm.walk.at + gm.walk.ms);
      gm.herX = gm.walk.from + (gm.walk.to - gm.walk.from) * ease(k);
      if (k > 0 && k < 1) hopY = 10 * Math.abs(Math.sin(k * Math.PI * gm.walk.hops));
      if (k >= 1) gm.walk = null;
    }
    st.x += gm.herX - FOOT.x; st.y -= hopY;
    if (gm.herX !== FOOT.x && !st.sp) st.sp = ['home', gm.herX - FOOT.x, 0];
    // The chest going home: the sprite comes down on an open lid and presses it shut, takes up the prankster's dropped hook
    // rope (its drawing holds the rope from then on), lifts the chest straight up, higher than her bubble, and flies it over
    // her head off the left of the page. The chest hangs from the end of the sprite's rope, where the sprite really is
    // (drawGame); out of the air the prankster holds it up until the sprite has the rope (fled).
    if (gm.out) {
      const o = gm.out, tip = this.spTip('lift'), home = o.hook.x - this.ring(0, 1).x, sv = this.sv;
      // it sets off only once the prankster is off the chest (knocked off it, it springs up from the lid), and goes for
      // the rope only once it is clear of where the chest goes up (CLEAR); its times run from when it sets off (go)
      // Scared off, the chest it was flying with falls first (fall), landing with a thud; and the sprite starts at it ('!',
      // NOTICE) from o.spot before it does anything.
      const fell = !o.fall || now - o.fall.at >= FALL, startle = o.spot != null && now >= o.spot && now < o.spot + NOTICE;
      if (o.fall && fell && !o.fall.landed) { o.fall.landed = now; if (v) v.landed = now; }
      if (startle) { st.sprite = 'surprised'; L.notice = now - o.spot; }
      // (by her it can be where the chest comes down: it darts out from under it to the side of it it is on, not across
      // her, or to the other side when that is off the page)
      if (o.fall && o.go == null) {
        const cx = o.hook.x - this.ring(0, 1).x, d = box.w / 2 + 36, ok = x => x >= 30 && x <= PAGE.w - 30;
        o.fall.dart ??= (sv ? sv.x : gm.herX) < cx ? (ok(cx - d) ? cx - d : cx + d) : (ok(cx + d) ? cx + d : cx - d);
        st.sp = ['at', o.fall.dart, CHEST.y - 120];
      }
      const away = !v || v.pos.a < 0.05 || v.pos.x > PAGE.w + PK_H / 2 || v.pos.y < -PK_H / 2;
      if (o.go == null && !o.wait && fell && (o.spot == null || now >= o.spot + NOTICE) && (away || Math.abs(v.pos.x - home) > 110 || v.pos.y < CHEST.y - 300)) o.go = now;   // (wait: her hair first, unfrizz)
      const u = o.go == null ? -Infinity : now - o.go;
      const p0 = { x: o.hook.x - tip.x, y: o.hook.y - tip.y - LINK };   // there the end of the sprite's rope is LINK over the hook
      // (the prankster's place last frame: v.pos)
      if (o.clear == null && o.go != null && (away || v.pos.x - p0.x > CLEAR)) o.clear = now;
      if (o.got == null && o.clear != null && u >= o.t2 && sv && Math.hypot(sv.x - p0.x, sv.y - p0.y) < 8) { o.got = now; if (o.hop) this.hopTo(FOOT.x, now + 400, o.hop); }
      st.orbit = null; st.sFlip = false;
      if (o.got != null) {
        // straight up first, above where her bubble is, then across over her head
        const q = k01(now - o.got, 0, o.ms - o.t2), up = ease(k01(q, 0, 0.4)), across = ease(k01(q, 0.4, 1));
        st.sprite = up < 1 ? 'lift' : 'lift2'; st.sp = ['at', p0.x + (-100 - p0.x) * across, p0.y + (56 - p0.y) * up];
        L.chest = { carried: true, len: LINK, lift: ease(k01(q, 0, 0.25)) };
      } else {
        // (it presses at the end of SHUT: the gift that beat the prankster off is still on its way into the chest)
        const press = o.open && u < GO + SHUT, shut = o.open ? ease(k01(u, GO + SHUT * 0.4, GO + SHUT)) : 1;
        if (o.go != null) {
          st.sprite = press && u >= GO ? 'lid' : 'sIdle';
          st.sp = press ? ['at', home, CHEST.y - box.open + (box.open - box.h) * shut - SPRITE_H * 0.16]
            : o.clear == null ? ['at', home - 20, CHEST.y - box.h - SPRITE_H * 0.45] : ['at', p0.x, p0.y];
        }
        if (!fell) {
          // falling: from where its ring hung to where it is on the ground, coming level, the dropped rope trailing
          const k = Math.min(1, ((now - o.fall.at) / FALL) ** 2);
          L.chest = { still: { x: o.fall.hook.x + (o.hook.x - o.fall.hook.x) * k, y: o.fall.hook.y + (o.hook.y - o.fall.hook.y) * k }, rot: o.fall.rot * (1 - k) }; L.loose = true;
        } else { L.chest = { x: home, y: CHEST.y }; L.open = o.open && shut < 0.5; L.dropped = true; }
      }
    }
    if (!v) return st;
    st.slide = true;   // her place goes with her pose while it is here (drawHer)
    // (free: no show of hers plays, or 被偷了 waits for it to be off with the chest and she is still the game's)
    const u = now - v.at, free = !this.cur || this.cur.opts.robbed && now < this.cur.start + this.cur.pre, bob = 4 * Math.sin(now / 520), low = CHEST.y - 74;
    if (free && ['peek', 'carry', 'fall'].includes(v.phase)) st.bubble = null;   // her 心情 says nothing while a chest flies past where its bubble is
    else if (free) { st.orbit = null; st.y = FOOT.y - hopY; }                     // and beside the chest she is no longer in her 心情: no happy bounce
    const seat = CHEST.y - box.h - PK_H * 0.3, over = CHEST.y - box.open - PK_H * 0.24;   // its height seated on the lid; over the open lid
    const pk = L.pk = { pose: 'idle', x: v.pos.x, y: v.pos.y, flip: false, rot: 0, scale: 1, a: 1 };
    const fly = (vx, vy, grav = 0) => { pk.x = v.from.x + vx * u; pk.y = v.from.y + vy * u + grav * u * u; };
    const hop = (x, y, ms = 400) => { const e = ease(k01(u, 0, ms)); pk.x = v.from.x + (x - v.from.x) * e; pk.y = v.from.y + (y - v.from.y) * e; };
    let cx = v.chest?.x ?? null;   // the chest standing on the ground, if it does
    switch (v.phase) {
      // it slides in and, before it flies the chest over, back out the same way: it takes up its rope off the page
      case 'peek': Object.assign(pk, { pose: 'peek', flip: true, x: -70 + 94 * ease(k01(Math.min(u, GAME.peek - u), 0, 500)), y: 120 + bob }); break;
      case 'carry': {
        // It flies in little goes, its arms in front of it holding its hook rope, the chest hanging from the rope by one
        // handle and swinging as it goes (drawGame); the weight sinks it until it is over her head. Frozen, it is a paper
        // bag or a paper king with a chest still hanging from it. (Its sneaking drawing faces the viewer's left: flipped.)
        const p = u / GAME.carry * 9, go = Math.min(1, (Math.floor(p) + ease(k01(p % 1, 0, 0.6))) / 9), frozen = now - v.frozen < FREEZE;
        const strain = frozen ? 0 : k01(go, 0.72, 1);   // near the end the weight is too much for it: it wobbles, sweats and sinks
        Object.assign(pk, { pose: frozen ? (v.freezes % 2 ? 'carryBag' : 'carryCrown') : 'carry', flip: !frozen, x: -70 + (this.carryEnd().x + 70) * go,
          y: 120 + 70 * Math.sin(Math.PI / 2 * Math.min(1, go / 0.6)) + 8 * k01(go, 0.72, 1) + (frozen ? 0 : bob), rot: 0.12 * strain * Math.sin(now / 80) });
        L.sweat = strain;
        L.chest = { hang: this.pkTip(pk), len: LINK };
        if (frozen && free) { if (st.pose === 'idle') st.pose = 'lookUp'; st.sprite = 'sLook'; L.ask = now - v.frozen; }   // she looks up and about
        break;
      }
      case 'fall': {
        // It can hold on no longer: it and the chest come down together, faster and faster, the chest coming level, and it
        // lands in a heap on the chest's lid.
        const k = Math.min(1, (u / FALL) ** 2), r = this.ring(LAND, 1), y0 = this.pkTip({ ...pk, pose: 'carry', flip: true, x: v.from.x, y: v.from.y }).y + LINK;
        Object.assign(pk, { pose: 'fall', flip: true, x: v.from.x + (LAND - v.from.x) * k, y: v.from.y + (seat - v.from.y) * k, rot: -0.3 * k });
        L.chest = { still: { x: r.x, y: y0 + (r.y - y0) * k }, rot: HANG * (1 - k) };
        break;
      }
      case 'peer': {
        // It lies dazed on the lid where it fell (DAZED); then it is up over the chest and has the lid open: empty, and a moth
        // flies out. She has started at the crash; now she is sorry and embarrassed about her empty chest.
        const up = ease(k01(u, DAZED, DAZED + 400));
        Object.assign(pk, { pose: u < DAZED ? 'dazed' : u < DAZED + 400 ? 'shake' : 'peer', flip: u < DAZED, x: cx, y: seat + (over - seat) * up + bob * up });
        L.open = u >= DAZED + 500; L.moth = u - DAZED - 700; L.ropes = L.slack = true;
        if (free && u >= 250) st.pose = u < DAZED + 700 ? 'startled' : 'sorry';
        break;
      }
      case 'shrug': Object.assign(pk, { pose: 'shrug', x: cx, y: over + (seat - over) * ease(k01(u, 1900, 2700)) + bob * (1 - k01(u, 1900, 2700)) }); L.open = u < 1900; L.ropes = L.slack = true; if (free) st.pose = 'sorry'; break;
      // (she is sorry and embarrassed about her empty chest, not angry)
      case 'sit': Object.assign(pk, { pose: now - v.laugh < 2600 ? 'laugh' : 'sit', x: cx, y: seat }); L.ropes = L.slack = true; if (free) st.pose = 'sorry'; break;
      case 'toss': {
        // bored of an empty chest, it gets off and throws the chest back over her head, home
        pk.pose = u < 450 ? 'shrug' : u < 1200 ? 'throw' : 'laugh'; hop(v.fromCx + 56, low + bob, 400);
        const w = Math.max(0, u - 500);
        if (w > 0) { L.chest = { x: v.fromCx - 0.42 * w, y: CHEST.y - 1.6 * w + 0.00145 * w * w, spin: -w / 180 }; cx = null; v.chest = null; }
        else L.ropes = L.slack = true;   // its hook comes out of the ring as it throws
        if (free) st.pose = 'sorry';
        break;
      }
      case 'leave': fly(0.16, -0.05); pk.y += bob; break;
      // Off with the empty chest (snatch): it settles on the lid and laughs its thanks at her, hops off to the right till its
      // rope hangs straight down to the chest's ring, and rises, the chest coming off the ground by that handle and tilting
      // as it comes up; she stays sorry till it is off (away).
      case 'snatch': {
        const tip = this.pkTip({ pose: 'carry', flip: false, x: 0, y: 0, rot: 0, scale: 1 }), r = this.ring(v.fromCx, 1), need = r.y - LINK - tip.y;   // (the chest's place as it began: once up, it stands nowhere)
        const e = ease(k01(u, 0, 300)), a = ease(k01(u, SNATCH.laugh, SNATCH.laugh + SNATCH.hop)), b = ease(k01(u, SNATCH.laugh + SNATCH.hop, SNATCH.up));
        const bx = v.from.x + (v.fromCx - v.from.x) * e, by = v.from.y + (seat - v.from.y) * e;
        Object.assign(pk, { pose: u < SNATCH.laugh ? 'laugh' : 'carry', x: bx + (r.x - tip.x - bx) * a, y: by + (need - by) * a - SNATCH.rise * b });
        if (b > 0) { L.chest = { hang: this.pkTip(pk), len: LINK, lift: clamp(SNATCH.rise * b / 40, 0, 1) }; cx = null; v.chest = null; }
        else L.ropes = L.slack = true;
        if (free) st.pose = 'sorry';
        break;
      }
      // Off with her chest in the air: she starts, sees it go and reaches up after it on her toes until it is off the page;
      // then she drops to her knees crying (被偷了). (She stood idle until then and the show went by way of her sulking
      // crouch, 用户：“抢走的时候、怎么先蹲下来在哭、衔接太违和……比如突然发现宝箱被抢”.)
      case 'away':
        Object.assign(pk, { pose: 'carry', flip: true }); fly(...(v.snatched ? SNATCH.fly : [0.3, -0.03])); pk.y += bob; L.chest = { hang: this.pkTip(pk), len: LINK };
        if (free) { st.pose = u < AWAY.spot ? 'startled' : 'reachUp'; st.sprite = 'surprised'; }
        break;
      // knocked off an empty chest it spins up and out of the top; beaten off it zigzags up and out of the top like a balloon
      // letting its air out (both slowly, and up rather than right: it stands by the right edge, and was gone in a blink)
      case 'knocked': pk.pose = 'knocked'; fly(0.12, -0.32, 0.00003); pk.rot = u / 260; pk.a = 1 - k01(u, 2100, 2600); break;
      case 'fled': {
        // Scared off, it lets go of everything with a start (startle; a chest in the air falls: gm.out.fall), then it is off
        // to the right, looking back. (Her frizzed hair the sprite pats smooth once the chest is home: unfrizz.)
        const w = u - (v.ran ??= u);
        // it jumps with fright first, then runs off bobbing out at the right, at its own height, taking OFF.fled however far
        // from the edge it was (run). It used to flee straight up, beside the chest the sprite lifts straight up to take
        // home, and the two went up side by side, the sprite seeming to carry it off (用户：“怎么变得小精灵抬着捣蛋鬼跑了”).
        const run = Math.max(0, w - 450), vx = Math.max(0.06, (PAGE.w + 60 - v.from.x) / (OFF.fled - 450));
        // (it starts the way it faced, flying with the chest to the right or pulling toward her, and turns to run)
        Object.assign(pk, { pose: w < 450 ? 'startle' : 'flee', flip: w < 450 ? v.from.flip ?? true : true, x: v.from.x + vx * run, y: v.from.y - 18 * bump(w, 0, 450) - 6 * Math.abs(Math.sin(run / 110)), a: 1 - k01(run, OFF.fled - 700, OFF.fled - 450) });
        // a chest it let go of over her head: she hops out from under it, and starts at the thud
        if (v.dodge != null && (free || now < this.cur.start + this.cur.pre) && now - v.dodge < FALL + 700) st.pose = 'startled';
        break;
      }
      // (it drifts off up and to the right, out of the way of the chest the sprite lifts straight up: it used to drift
      // straight up, right where the chest went, and the sprite seemed to carry it off)
      case 'won': pk.pose = 'flat'; fly(0.07, -0.12); pk.x += 24 * Math.sin(u / 95); pk.y += 26 * Math.sin(u / 120); pk.rot = 0.7 * Math.sin(u / 85); pk.a = 1 - k01(u, 2900, 3400); break;
      // it has the chest: she has lost her hold and lies where she was dragged to
      // (her lying drawing with empty fists: the ring she held hangs from the chest again)
      case 'lost': pk.pose = 'haul'; pk.rot = HAUL; fly(0.32, 0); cx = v.fromCx + 0.32 * u; L.open = true; L.ropes = true; if (free) { st.pose = v.bolted ? 'fallenZap' : 'fallen'; Object.assign(st, { sprite: 'pat', sp: this.comfort(st, now) }); } break;
      case 'tug': {
        // She starts back from the crash, lunges for the chest's handle and pulls the chest back toward her (she backs off
        // with it, out from under the dazed prankster), and then the three drift with the prankster's life: to its side
        // while it has most of it, back to hers as it loses it. In the last stretch it hauls the chest off and she is
        // dragged along.
        const t = now - v.grabbed, e = ease(k01(t, 850, 2300)), cut = v.cut != null ? now - v.cut : null;
        const drift = e * (TUG.drift * clamp(-v.net / v.span, -1, 1) + 1.5 * Math.sin(now / 260)) + v.drag, drag = this.dragging(v);
        // A helper's gift on her head (strike): down is how long she has been flattened (flat 1200 ms, then 700 ms holding
        // the handle lying down), loose whether she has let go. The prankster is glad of it: it points at her and laughs,
        // and the chest comes a little its way (yank). The bump and the dizzy eyes are for a gift that hits it.
        const down = now - v.buried < 1900 ? now - v.buried : null, loose = down != null ? down < 1200 : now - v.bonk < 800;
        const yank = now - v.tumble < 800 ? 10 * bump(now, v.tumble, v.tumble + 800) : 0;
        cx = v.fromCx + (TUG.chest - v.fromCx) * e + drift + yank;
        // It lies dazed on the lid where it fell; as she pulls the chest away it tumbles off to the far side, heels over
        // head (off; its tumbling drawing is upside down), the lid springs open, and it shakes itself and takes up its
        // rope, still hooked in the handle (UP).
        // It floats where its rope runs straight from the chest's ring into its fists, leaning back (pkPull).
        const place = drag ? this.pkPull(this.ring(cx, 1), 'haul', HAUL, 0) : this.pkPull(this.ring(cx, 1), 'tug', LEAN, TRIM);
        const off = ease(k01(t, 900, 1700)), to = { x: place.x + yank * 0.4, y: place.y + bob * 0.5 };
        pk.x = cx + (to.x - cx) * off; pk.y = seat + (to.y - seat) * off - 26 * Math.sin(Math.PI * off);
        if (t < 900) Object.assign(pk, { pose: 'dazed', flip: true });
        else if (t < 1700) Object.assign(pk, { pose: 'tumble', rot: (off - 0.5) * Math.PI * 2 });
        else if (t < UP) pk.pose = 'shake';
        else pk.pose = cut != null ? 'thunder' : drag ? 'haul' : loose ? 'laugh' : now - v.hit < 450 ? 'ouch' : 'tug';
        if (pk.pose === 'haul') pk.rot = HAUL; else if (pk.pose === 'tug' || pk.pose === 'ouch') Object.assign(pk, { rot: LEAN, trim: TRIM });
        L.ropes = true; L.open = t >= 1100; L.slack = !['tug', 'haul', 'ouch'].includes(pk.pose);   // not pulling, its rope hangs slack
        if (cut != null) L.zap = cut;
        if (free) {
          // after the lightning her hair stays frizzed, whatever she does
          const z = now - v.zapped >= BOLT ? 'Zap' : '';
          st.pose = t < 500 ? 'startled' : t < 850 ? 'lunge' : down != null ? (down < 1200 ? 'flat' : 'dragged') + z : loose ? 'bonk' + z : drag ? 'dragged' + z : 'tug' + z;
          // from her lunge on the ring in her fists is at the chest's link (her drawings hold it; held: the chest's own
          // ring on her side is then not drawn); where she has let go she stands where she pulled from
          if (t >= 500) {
            const holds = POSE[st.pose][0] === 'game16';
            st.x = gm.herX = this.ring(cx - yank, -1).x - this.grip(holds ? st.pose : 'tug'); gm.walk = null;
            if (holds) L.held = 'her';
          }
          if (now - v.wince < 300) st.y -= 5 * bump(now, v.wince, v.wince + 300);
          // Her sprite is on her side: once the prankster is up and pulling, it takes hold of the open lid's edge on her
          // side, over her arms, and pulls with her (its two pulling drawings by turns, its fists over the lid's edge:
          // sOver), on alone while she has let go or lies flattened: were it to let go, the prankster would be off with
          // the chest. (While the prankster still lies on the lid it stays by her, startled.)
          if (t >= UP) {

            const lid = { x: cx - box.w / 2 + LID.x * K, y: CHEST.y - LID.y * K };
            Object.assign(st, { sprite: key, sFlip: true, sOver: true, sp: ['at', lid.x + 4 - (hc.cx - hc.x) * ks, lid.y - (hc.y + hc.rope * hc.h - hc.cy) * ks] });
          } else st.sprite = 'surprised';
          if (cut != null) st.shake = [[v.cut + BOLT, 3, 260]];
        }
