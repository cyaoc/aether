const TIER = { S: 4, A: 3, B: 2, C: 1, D: 0 };
const EVENTS = {

  盲盒开亏: { tier: 'C', dur: 2600, gift: true }, 舰长: { tier: 'B', dur: 3000, gift: true }, 盲盒开大: { tier: 'B', dur: 4000, gift: true },

  城堡: { tier: 'S', dur: 10500, gift: true }, 新的第一名: { tier: 'C', dur: 2600 },
  报名开场: { tier: 'A', dur: 2600 }, 报名截止: { tier: 'A', dur: 2000 }, 奖池开场: { tier: 'A', dur: 2600 }, 奖池点名: { tier: 'A', dur: 2000 },
  奖池转动: { tier: 'A', dur: 2000 }, '揭晓·大奖': { tier: 'A', dur: 5200 }, '揭晓·二奖': { tier: 'A', dur: 4600 }, '揭晓·三奖': { tier: 'A', dur: 4600 },
  没人报名: { tier: 'A', dur: 2800 }, 日常: { tier: 'D' }
};
const LINES = {
  进场: ['{昵称}来啦…欢、欢迎！', '啊，是{昵称}！你好呀～', '又见到{昵称}了，嘿嘿', '{昵称}，欢迎光临…（小声）'],
  普通礼物: ['谢谢{昵称}的{礼物}！', '{昵称}送了{个数}个{礼物}…谢、谢谢！', '收到{礼物}了，好开心…', '{昵称}人真好～'],
  连着送: ['这么多…我会害羞的…', '{昵称}，够、够啦…谢谢你！'],
  大礼物: ['哇！{昵称}送了{礼物}！', '这么贵重的{礼物}…谢谢{昵称}！', '心跳好快…谢谢{昵称}！', '我会好好珍惜的！'],
  新的第一名: ['新的榜一是{昵称}！王冠给你～', '{昵称}登上第一名啦！', '{昵称}好厉害！'],
  舰长: ['欢迎{昵称}上船！舰长好！', '{昵称}成为舰长了！敬礼！', '船员+1！谢谢{昵称}！'],
  提督: ['提督{昵称}驾到！', '全体注意，提督{昵称}登舰！', '{昵称}开了提督…好、好帅！'],
  总督: ['总、总督大人{昵称}！！', '{昵称}开了总督…我是在做梦吗', '起航！为了总督{昵称}！'],
  盲盒开大: ['开出{礼物}了！{昵称}运气好好！', '欧皇{昵称}！是{礼物}！'],
  盲盒开亏: ['呜…{昵称}的盲盒亏了…', '可恶的盲盒！下次一定！'],
  城堡: ['是城堡！{昵称}送了我一座城堡！', '要变成公主了…谢谢{昵称}！'],
  '城堡·门口': ['欢迎来到我的城堡～', '{昵称}，要一起进来吗？'],
  报名开场: ['抽奖开始啦！发「{关键字}」就能报名～', '要抽奖了…大家快来报名！'],
  报名截止: ['报名结束！要开始抽了…', '会是谁呢…好紧张'],
  奖池开场: ['奖池抽奖开始啦！', '今天的奖池…有好东西哦！'],
  奖池点名: ['{昵称}，轮到你啦！发口令吧～', '{昵称}，准备好了吗？'],
  奖池转动: ['转呀转…', '求求了，出个好的！'],
  '揭晓·大奖': ['恭喜{昵称}抽中{奖项}！！', '大奖！{昵称}运气爆棚！'],
  '揭晓·二奖': ['恭喜{昵称}！是{奖项}～', '{昵称}抽到了{奖品}，不错哦～'],
  '揭晓·三奖': ['恭喜{昵称}抽中{奖项}～', '{昵称}抽到了{奖品}～下次会更好！'],
  没人报名: ['没、没有人报名吗…', '呜…再等等吧…'],
  无聊: ['好安静啊…', '今天的星星好多…', '要不要…举个哑铃？'],
  沮丧: ['是不是没人喜欢我了…', '画个圈圈…', '（偷偷看）有人在吗…'],
  冷场后来了人: ['啊！有人来了！', '我、我没睡着！'],
  举哑铃: ['今天也要锻炼！'], 哼歌: ['♪啦啦啦～'], 爬山: ['下次一起去爬山吧！', '山顶的风好舒服～'], 骑车: ['叮铃叮铃～', '骑车去兜风！'],
  砸到脚: ['好痛痛痛！', '又、又砸到了…'], 破音: ['咳、咳…刚才不算！', '破、破音了…'], 摔屁股墩: ['哎呦…屁股好痛…', '山路好滑…'],
  骑车摔倒: ['车、车子不听话…', '呜…又摔了…'], 贴创可贴: ['贴一下就好啦！', '创可贴…又要用完了']
};
const NAMES = { 普通昵称: '星河', 长昵称: '这是一个非常非常长的昵称啊', 中英混排: 'Lily月下' };
const GIFT = { 普通礼物: '小花花', 连着送: '小花花', 大礼物: '告白气球', 盲盒开大: '告白气球', 盲盒开亏: '小花花', 城堡: '浪漫城堡' };
const PAGE = { w: 480, h: 640 }, H = 250, FOOT = { x: 240, y: 626 };
const SPRITE_H = 76, NAME_MAX = 8;
const DAILY = { 举哑铃: [3000, 2000], 哼歌: [4000, 1500], 爬山: [4000, 4500], 骑车: [4000, 4500] };  // main, then the mishap and its bandage

const seeded = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const k01 = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = x => x * x * (3 - 2 * x);
const bump = (t, a, b) => Math.sin(Math.PI * k01(t, a, b));
const at = (t, list) => { let v = list[0][1]; for (const [s, x] of list) if (t >= s) v = x; return v; };

class Component extends DCLogic {
  componentDidMount() {
    if (this.loopFn) return;
    this.loopFn = () => { this.frame(); requestAnimationFrame(this.loopFn); };
    requestAnimationFrame(this.loopFn);
    if (this.props.controls !== '隐藏') this.buildControls();
  }

  async boot() {
    this.booting = true;
    const load = id => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = '/_blob/' + id; });
    const img = {};
    await Promise.all(Object.entries(BLOB).map(async ([k, id]) => { img[k] = await load(id); }));
    const box = (im, x, y, w, h) => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.drawImage(im, x, y, w, h, 0, 0, w, h);
      const a = g.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (a[(j * w + i) * 4 + 3] > 40) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (j < y0) y0 = j; if (j > y1) y1 = j; }
      return x1 < 0 ? null : { x: x + x0, y: y + y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
    };
    // A sheet is 3 x 2 cells; each cell anchors at its row's ground line and its own centre column, and every sheet is
    // scaled by its first cell (the idle ruler).
    this.cells = {};
    for (const k of ['common', 'lottery', 'daily1', 'daily2', 'moods', 'gifts', 'castleSheet', 'voyage', 'sp1', 'sp2']) {
      const im = img[k], cw = im.width / 3, ch = im.height / 2, list = [];
      for (let i = 0; i < 6; i++) list.push(box(im, (i % 3) * cw, Math.floor(i / 3) * ch, cw, ch));
      const ground = [0, 1].map(r => Math.max(...list.slice(r * 3, r * 3 + 3).filter(Boolean).map(b => b.y + b.h)));
      this.cells[k] = list.map((b, i) => b && { im, ...b, cx: (i % 3 + 0.5) * cw, cy: (Math.floor(i / 3) + 0.5) * ch, ground: ground[Math.floor(i / 3)], ruler: list[0].h });
    }
    for (const k of ['sIdle', 'sBlink', 'sHappy']) { const im = img[k], b = box(im, 0, 0, im.width, im.height); this.cells[k] = [{ im, ...b, cx: b.x + b.w / 2, cy: b.y + b.h / 2, ruler: b.h }]; }
    this.castle = { closed: img.castleClosed, open: img.castleOpen, box: box(img.castleClosed, 0, 0, img.castleClosed.width, img.castleClosed.height) };
    this.ship = { im: img.ship, box: box(img.ship, 0, 0, img.ship.width, img.ship.height) };
    this.day = img.day;
    const idle = this.cells.common[0];
    this.herHalfW = idle.w * H / idle.ruler / 2;
    this.ready = true;
  }

  renderVals() {
    const p = this.props;
    this.cfg = {
      scene: p.scene || '手动', env: p.env || '右下角', room: p.room || '明亮画面', name: NAMES[p.name] || NAMES.普通昵称,
      speed: { '0.5 倍': 0.5, '0.25 倍': 0.25 }[p.speed] || 1, caption: p.caption !== '隐藏'
    };
    return {};
  }

  // ---- clock and engine ---------------------------------------------------------------------------------------------
  now() { return (this.master ? this.master.currentTime : 0) * this.cfg.speed; }

  reset() {
    this.cur = null; this.queue = []; this.log = []; this.lot = null; this.gifts = [];
    this.lastGift = this.lastAny = this.now(); this.recent = []; this.nextDaily = this.now() + 6000; this.lines = {}; this.rng = seeded(7);
  }

  fire(name, opts = {}) {
    const now = this.now(), ev = EVENTS[name];
    if (name !== '日常' && !opts.chained) opts = { ...opts, wake: ['沮丧', '犯困'].includes(this.mood(now)) };
    if (name === '普通礼物') {
      this.gifts = this.gifts.filter(g => now - g < 30000).concat(now);
      if (this.gifts.length >= 5) { this.gifts = []; return this.fire('连着送', opts); }
    }
    if (name !== '日常') { this.lastAny = now; this.recent = this.recent.filter(r => now - r < 60000).concat(now); }
    if (ev.gift) this.lastGift = now;
    const curTier = this.cur ? TIER[EVENTS[this.cur.name].tier] : -1, tier = TIER[ev.tier];
    // The fifth gift in a burst takes over the plain thank-you that is still playing, instead of being dropped as busy.
    if (!this.cur || tier > curTier || name === '连着送' && this.cur.name === '普通礼物') return this.start(name, opts);
    if (tier <= TIER.C) return this.note(`${name}：正忙，丢掉`);
    if (tier < TIER.S && this.queue.filter(q => EVENTS[q.name].tier === ev.tier).length >= 3) return this.note(`${name}：同档已排 3 个，丢掉`);
    this.queue.push({ name, opts }); this.note(`${name}：排队`);
  }

  start(name, opts) {
    const now = this.now();
    if (this.cur) this.note(`${this.cur.name} 被 ${name} 打断`);
    const wake = !!opts.wake, dur = name === '日常' ? DAILY[opts.kind][0] + (opts.mishap ? DAILY[opts.kind][1] : 0) : EVENTS[name].dur;
    this.cur = { name, opts, start: now, pre: wake ? 1000 : 0, dur, line: this.pick(name), wakeLine: wake ? this.pick('冷场后来了人') : null };
    if (name === '日常') this.nextDaily = now + dur + 20000 + this.rng() * 20000;
    if (name === '报名开场') this.lot = { kind: '报名', phase: '报名中' };
    if (name === '奖池开场') this.lot = { kind: '奖池', phase: '点名前' };
    if (name === '报名截止' && this.lot) this.lot.phase = '等待';
    if (name === '奖池转动' && this.lot) this.lot.phase = '转动';
    if (name === '没人报名') this.lot = null;
  }

  note(s) { this.log = [s, ...this.log].slice(0, 4); }

  pick(name) {
    const list = LINES[name]; if (!list) return null;
    let i = Math.floor(this.rng() * list.length);
    if (list.length > 1 && i === this.lines[name]) i = (i + 1) % list.length;
    this.lines[name] = i;
    return list[i];
  }

  update(now) {
    const c = this.cur;
    if (c && now >= c.start + c.pre + c.dur) {
      this.cur = null;
      if (c.name.startsWith('揭晓') && this.lot?.kind === '奖池') this.lot.phase = '点名前';
      if (c.opts.top) this.start('新的第一名', { chained: true });
      else if (this.queue.length) {
        const best = Math.max(...this.queue.map(q => TIER[EVENTS[q.name].tier]));
        const i = this.queue.findIndex(q => TIER[EVENTS[q.name].tier] === best);
        const [q] = this.queue.splice(i, 1);
        this.start(q.name, { ...q.opts, chained: true });
      }
    }
    if (!this.cur && this.mood(now) === '平静' && !this.lot && now >= this.nextDaily) {
      const kind = ['举哑铃', '哼歌', '爬山', '骑车'][Math.floor(this.rng() * 4)], mishap = this.rng() < 0.25;
      this.start('日常', { kind, mishap });
    }
  }

  mood(now) {
    const recent = this.recent.filter(r => now - r < 60000).length;
    if (now - this.lastAny >= 60 * 60000) return '犯困';
    if (now - this.lastGift >= 40 * 60000) return '沮丧';
    if (now - this.lastGift >= 15 * 60000) return '无聊';
    return recent >= 3 ? '开心' : '平静';
  }

  fastForward(min) { const d = min * 60000; this.lastGift -= d; this.lastAny -= d; this.recent = this.recent.map(r => r - d); this.nextDaily -= d; }

  // ---- what she is doing at a moment --------------------------------------------------------------------------------
  base() { return { pose: 'idle', x: FOOT.x, y: FOOT.y, s: 1, sx: 1, sprite: 'sIdle', sp: null, sBehind: false, sScale: 1, sAlpha: 1, fx: [], bubble: null, hide: false }; }

  idleState(now, mood) {
    const st = this.base();
    if (this.lot && (this.lot.phase === '等待' || this.lot.phase === '转动')) { st.pose = 'hope'; return st; }
    if (mood === '开心') { st.y -= 6 * Math.abs(Math.sin(now / 380)); st.orbit = now; }
    if (mood === '无聊') { st.pose = 'bored'; st.sprite = 'yawn'; }
    if (mood === '沮丧') { st.pose = 'gloomy'; st.sprite = 'pat'; st.sp = 'head'; }
    if (mood === '犯困') { st.pose = 'doze'; st.sprite = 'sleep'; st.sp = 'knee'; st.fx.push(['z', now]); }
    const line = mood === '无聊' || mood === '沮丧' ? LINES[mood][Math.floor(now / 30000) % LINES[mood].length] : null;
    if (line && now % 30000 > 1500 && now % 30000 < 4500) st.bubble = { text: line, t: now % 30000 - 1500 };
    return st;
  }

  eventState(name, t, opts, line) {
    const st = this.base();
    st._t = t;
    const say = (from, text = line) => { if (t >= from && text) st.bubble = { text, t: t - from }; };
    const hop = (a, h = 10) => { st.y -= h * bump(t, a, a + 320); };
    switch (name) {
      case '进场': st.pose = 'wave'; st.sprite = 'flag'; hop(0, 8); say(100); break;
      case '普通礼物': st.pose = t < 1500 ? 'bow' : 'idle'; st.sprite = t < 1500 ? 'nod' : 'sIdle'; st.fx.push(['hearts', 200, 3]); say(150); break;
      case '连着送': st.pose = 'shy'; st.sprite = 'sHappy'; st.fx.push(['hearts', 0, 7]); say(150); break;
      case '大礼物': st.pose = t < 1400 ? 'giftBox' : 'cheer'; hop(0); hop(1400, 14); st.sprite = 'sHappy'; st.orbit = t; st.fx.push(['confetti', 1400], ['sparkles', 1400]); say(200); break;
      case '新的第一名':
        st.pose = t < 1300 ? 'idle' : 'crownV';
        st.sprite = t < 1600 ? 'crown' : 'sHappy';
        st.sp = t < 1600 ? ['crown', ease(k01(t, 0, 900)), ease(k01(t, 900, 1300))] : ['home-from-top', ease(k01(t, 1600, 2400))];
        st.fx.push(['ring', 1300], ['sparkles', 1300]); say(1300); break;
      case '盲盒开大':
        st.pose = at(t, [[0, 'shakeBox'], [1200, 'openBox'], [2000, 'surprised'], [2600, 'cheer']]);
        if (t < 1200) st.x += 3 * Math.sin(t / 25);
        hop(2600, 14); st.sprite = at(t, [[0, 'sIdle'], [2000, 'surprised'], [2600, 'sHappy']]);
        st.fx.push(['beam', 1200], ['sparkles', 2600], ['confetti', 2600]); say(1300); break;
      case '盲盒开亏':
        st.pose = at(t, [[0, 'shakeBox'], [900, 'openBox'], [1500, 'pout']]);
        if (t < 900) st.x += 3 * Math.sin(t / 25);
        if (t >= 1500) st.y -= 4 * Math.abs(Math.sin((t - 1500) / 90));
        st.sprite = t < 1000 ? 'sIdle' : 'hide'; st.fx.push(['puff', 900]); say(1000); break;
      case '舰长': st.pose = 'capSalute'; hop(0, 8); st.sprite = 'sailor'; st.fx.push(['flash', 0, 0.6], ['seaBubbles', 0]); say(200); break;
      case '提督': st.pose = t < 2200 ? 'spyglass' : 'admSalute'; st.sprite = 'sailor'; st.fx.push(['flash', 0, 1], ['gulls', 300], ['seaBubbles', 0]); say(300); break;
      case '总督': return this.governor(t, st, say);
      case '城堡': return this.castleShow(t, st, say);
      case '报名开场': case '奖池开场': st.pose = 'announce'; hop(0, 12); st.sprite = 'flag'; st.fx.push(['sparkles', 0]); say(150); break;
      case '报名截止': case '奖池转动': st.pose = 'hope'; say(150); break;
      case '奖池点名': st.pose = 'point'; say(150); break;
      case '揭晓·大奖': case '揭晓·二奖': case '揭晓·三奖': {
        const react = 2500;
        st.pose = t < react ? 'hope' : { '揭晓·大奖': 'cheer', '揭晓·二奖': 'clap', '揭晓·三奖': 'nod' }[name];
        if (name === '揭晓·大奖') { hop(react, 14); st.fx.push(['confetti', react]); st.sprite = t < react ? 'sIdle' : 'sHappy'; }
        if (name === '揭晓·二奖') st.fx.push(['sparkles', react]);
        say(react); break;
      }
      case '没人报名': st.pose = 'dejected'; st.sprite = 'pat'; st.sp = 'head'; say(200); break;
      case '日常': return this.daily(t, st, opts);
    }
    return st;
  }

  daily(t, st, o) {
    const main = DAILY[o.kind][0];
    st._t = t;
    const say = (from, key) => { if (t >= from) st.bubble = { text: LINES[key][(o.seed || 0) % LINES[key].length], t: t - from }; };
    if (t < main) {
      if (o.kind === '举哑铃') { st.pose = 'dumbbell'; st.x += 1.5 * Math.sin(t / 30); }
      if (o.kind === '哼歌') { st.pose = 'hum'; st.x += 4 * Math.sin(t / 400); st.fx.push(['notes', 0]); }
      if (o.kind === '爬山') { st.pose = 'hike'; st.y -= 5 * Math.abs(Math.sin(t / 220)); }
      if (o.kind === '骑车') { st.pose = 'bike'; st.y -= 2 * Math.abs(Math.sin(t / 90)); st.x += 14 * Math.sin(t / 900); }
      say(200, o.kind);
      return st;
    }
    const u = t - main;
    if (o.kind === '举哑铃') { st.pose = 'footHurt'; st.y -= 8 * Math.abs(Math.sin(u / 140)); say(main, '砸到脚'); }
    if (o.kind === '哼歌') { st.pose = 'crack'; say(main, '破音'); }
    if (o.kind === '爬山' || o.kind === '骑车') {
      st.pose = u < 2000 ? (o.kind === '爬山' ? 'slip' : 'crash') : 'bandage';
      say(main, u < 2000 ? (o.kind === '爬山' ? '摔屁股墩' : '骑车摔倒') : '贴创可贴');
      if (u >= 2000) st.bubble.t = u - 2000;
    }
    return st;
  }

  governor(t, st, say) {
    const sw = 470, s = sw / this.ship.box.w, sh = this.ship.box.h * s;
    const shipX = t < 1500 ? PAGE.w + sw / 2 - (PAGE.w / 2 + sw / 2) * ease(k01(t, 0, 1500)) : t < 5000 ? PAGE.w / 2 : PAGE.w / 2 - (PAGE.w / 2 + sw / 2) * ease(k01(t, 5000, 6000));
    st.ship = { x: shipX, y: PAGE.h - 18 - sh / 2, s, a: t < 6000 ? 1 : 0 };
    const deck = { x: shipX - sw / 2 + this.ship.box.w * 0.26 * s, y: PAGE.h - 18 - sh + this.ship.box.h * 0.66 * s };
    if (t < 1500) { st.hide = false; st.sprite = 'surprised'; }
    else if (t < 6000) { st.onDeck = deck; st.pose = t < 3600 ? 'govPoint' : 'govWave'; st.s = 0.6; st.x = deck.x; st.y = deck.y + 4; st.sprite = 'flag'; st.sp = ['mast', shipX - sw / 2 + this.ship.box.w * 0.55 * s, PAGE.h - 18 - sh + 18]; st.sScale = 0.8; }
    else { st.pose = 'idle'; }
    st.fx.push(['flash', 1500, 1, deck], ['fireworks', 1700], ['goldConfetti', 1700], ['flash', 6000, 0.8]);
    say(1700);
    return st;
  }

  castleShow(t, st, say) {
    const b = this.castle.box, cs = 340 / b.h;
    const rise = ease(k01(t, 900, 1600)), shrink = ease(k01(t, 9000, 10000));
    const cy = 420 - 230 * rise, cscale = (0.6 + 0.4 * rise) * (1 - 0.8 * shrink);
    st.castle = { x: PAGE.w / 2, y: cy, s: cs * cscale, a: k01(t, 900, 1500) * (1 - k01(t, 9600, 10000)), open: t >= 7500 ? k01(t, 7500, 7800) : 0 };
    const gate = { x: PAGE.w / 2 + (this.castle.closed.width * 0.503 - this.castle.closed.width / 2) * cs, y: cy + (this.castle.closed.height * 0.676 - this.castle.closed.height / 2) * cs };
    st.sprite = t < 1500 ? 'glow' : 'sHappy'; st.sBehind = t < 1500;
    st.sp = t < 1500 ? ['to-castle', ease(k01(t, 0, 1200)), 1 + 1.6 * k01(t, 300, 1500)] : t < 9800 ? ['gone'] : null;
    st.sAlpha = t < 1500 ? 1 - k01(t, 900, 1500) : t < 9800 ? 0 : k01(t, 9800, 10300);
    if (t < 2200) { st.pose = 'idle'; st.sx = t < 1500 ? 1 : Math.cos((t - 1500) / 90); }
    else if (t < 3000) st.pose = 'spin';
    else if (t < 4500) st.pose = 'curtsy';
    else if (t < 7500) { st.pose = Math.floor((t - 4500) / 260) % 2 ? 'walkB' : 'walkA'; const w = k01(t, 4500, 7500); st.x = FOOT.x + (gate.x - FOOT.x) * w; st.y = FOOT.y + (gate.y - FOOT.y) * w; st.s = 1 - 0.68 * w; }
    else if (t < 9300) { st.pose = 'lookBack'; st.x = gate.x; st.y = gate.y; st.s = 0.32; }
    else st.pose = 'idle';
    st.fx.push(['rainbowSparkles', 900], ['flash', 2200, 1.2], ['gateGlow', 7500, gate], ['flash', 9300, 1]);
    if (t >= 3000 && t < 4500) say(3000);
    if (t >= 7600 && t < 9300) st.bubble = { text: this.cur?.gateLine || '欢迎来到我的城堡～', t: t - 7600, at: gate };
    return st;
  }

  // ---- scenes: fixed loops that can be frozen for screenshots ---------------------------------------------------------
  sceneState(now) {
    const scene = this.cfg.scene, name = this.cfg.name;
    const ev = (n, t, opts = {}) => this.eventState(n, t, opts, this.fill(LINES[n]?.[0], n));
    if (scene === '平时') {
      const plan = [[2000, '举哑铃', true], [9000, '哼歌', false], [16000, '爬山', true], [27000, '骑车', false]];
      const t = now % 34000;
      for (const [s, kind, mishap] of plan) {
        const dur = DAILY[kind][0] + (mishap ? DAILY[kind][1] : 0);
        if (t >= s && t < s + dur) return this.daily(t - s, this.base(), { kind, mishap, seed: 0 });
      }
      return this.idleState(now, '平静');
    }
    if (scene === '心情') {
      const t = now % 50000, moods = ['平静', '无聊', '沮丧', '犯困'];
      if (t < 40000) { const st = this.idleState(t % 10000 + 30000, moods[Math.floor(t / 10000)]); st.label = `心情：${moods[Math.floor(t / 10000)]}`; return st; }
      const u = t - 40000, st = u < 1000 ? this.base() : ev('大礼物', u - 1000);
      if (u < 1000) { st.pose = 'awake'; st.y -= 10 * bump(u, 0, 300); st.bubble = { text: LINES.冷场后来了人[0], t: u }; }
      st.label = '冷场后来了人：惊醒，再演大礼物'; return st;
    }
    const seqs = {
      报名抽奖: [['报名开场', 2600], ['hold', 2500, '报名中'], ['报名截止', 2000], ['hold', 2500, '等待'], ['揭晓·三奖', 4600], ['揭晓·二奖', 4600], ['揭晓·大奖', 5200]],
      奖池抽奖: [['奖池开场', 2600], ['奖池点名', 2000], ['奖池转动', 2000], ['揭晓·大奖', 5200]],
      '大礼物+新第一': [['大礼物', 3000], ['新的第一名', 2600]]
    };
    const seq = seqs[scene] || [[scene, EVENTS[scene]?.dur || 3000]];
    const total = seq.reduce((a, s) => a + s[1], 0) + 2500, t = now % total;
    let acc = 1000;
    if (t < acc) return this.idleState(now, '平静');
    for (const [n, d, phase] of seq) {
      if (t < acc + d) {
        if (n === 'hold') { const st = this.base(); if (phase === '等待') st.pose = 'hope'; return st; }
        const st = ev(n, t - acc);
        if (n === '城堡' && t - acc >= 7600) st.bubble = { ...st.bubble, text: this.fill(LINES['城堡·门口'][0]) };
        return st;
      }
      acc += d;
    }
    return this.idleState(now, '平静');
  }

  fill(text, name) {
    if (!text) return text;
    let nick = this.cfg.name;
    if ([...nick].length > NAME_MAX) nick = [...nick].slice(0, NAME_MAX - 1).join('') + '…';
    return text.replaceAll('{昵称}', nick).replaceAll('{礼物}', GIFT[name] || '小花花').replaceAll('{个数}', '3')
      .replaceAll('{关键字}', '抽奖').replaceAll('{奖项}', '一等奖').replaceAll('{奖品}', '定制周边');
  }

  // ---- drawing -----------------------------------------------------------------------------------------------------
  frame() {
    const canvas = document.getElementById('dp-cv'), root = document.getElementById('dp-root');
    if (!canvas || !this.cfg) return;
    if (!this.ready) { if (!this.booting) this.boot(); return; }
    if (root !== this.root || this.cfg !== this.boundCfg) {
      this.root = root; this.boundCfg = this.cfg;
      for (const a of root.getAnimations()) a.cancel();
      this.master = root.animate([{ outlineColor: 'transparent' }, { outlineColor: 'transparent' }], { duration: 1e9 });
      this.reset();
    }
    const now = this.now();
    let st;
    if (this.cfg.scene === '手动' || this.cfg.scene === '演示') {
      if (this.cfg.scene === '演示') this.demo(now);
      this.update(now);
      const c = this.cur;
      if (c && now < c.start + c.pre) { st = this.base(); st.pose = 'awake'; st.y -= 10 * bump(now - c.start, 0, 300); st.bubble = { text: this.fill(c.wakeLine), t: now - c.start }; }
      else if (c) { st = this.eventState(c.name, now - c.start - c.pre, { ...c.opts, seed: Math.floor(c.start) }, this.fill(c.line, c.name)); if (c.name === '城堡' && st.bubble?.at) st.bubble.text = this.fill(c.gateLine || (c.gateLine = this.pick('城堡·门口'))); }
      else st = this.idleState(now, this.mood(now));
    } else st = this.sceneState(now);
    this.draw(canvas.getContext('2d'), st, now);
  }

  demo(now) {
    const t = now % 30000, last = this.lastDemo ?? -1;
    this.lastDemo = t;
    const cross = s => last < s && t >= s || (t < last && s <= t);
    if (cross(3000)) this.fire('进场');
    if (cross(7000)) this.fire('普通礼物');
    if (cross(11000)) this.fire('大礼物', { top: true });
  }

  draw(g, st, now) {
    const env = this.cfg.env, small = env === '小页面', ps = small ? 0.75 : 1;
    const pw = PAGE.w * ps, ph = PAGE.h * ps, px = env === '左下角' ? 40 : 1920 - pw - 40, py = 1080 - ph - 20;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, 1920, 1080);
    if (this.cfg.room === '明亮画面') { const r = Math.max(1920 / this.day.width, 1080 / this.day.height); g.drawImage(this.day, 0, 0, this.day.width * r, this.day.height * r); }
    else if (this.cfg.room === '深色房间') { const gr = g.createLinearGradient(0, 0, 0, 1080); gr.addColorStop(0, '#2b3048'); gr.addColorStop(1, '#151826'); g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080); }
    else { for (let y = 0; y < 1080; y += 40) for (let x = 0; x < 1920; x += 40) { g.fillStyle = (x + y) / 40 % 2 ? '#9a9a9a' : '#b4b4b4'; g.fillRect(x, y, 40, 40); } }
    g.save(); g.setLineDash([10, 8]); g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 2; g.strokeRect(px, py, pw, ph); g.restore();
    g.save(); g.translate(px, py); g.scale(ps, ps);
    g.beginPath(); g.rect(0, 0, PAGE.w, PAGE.h); g.clip();
    if (st.castle) this.drawCastle(g, st.castle);
    if (st.ship) this.drawShip(g, st.ship);
    const her = this.herBox(st);
    const sp = this.spritePos(st, her, now);
    if (sp && st.sBehind) this.drawSprite(g, st, sp, now);
    if (!st.hide) this.drawHer(g, st, now);
    if (sp && !st.sBehind) this.drawSprite(g, st, sp, now);
    for (const f of st.fx) this.drawFx(g, f, st, her, now);
    if (st.bubble?.text) this.drawBubble(g, st.bubble, her);
    g.restore();
    if (this.cfg.caption) this.drawCaption(g, st, now, px, py);
  }

  cell(name, set = POSE) { const [k, i] = set[name] || [name, 0]; return this.cells[k][i]; }

  herBox(st) {
    const c = this.cell(st.pose), k = H / c.ruler * st.s;
    return { x: st.x + (c.x - c.cx) * k, y: st.y + (c.y - c.ground) * k, w: c.w * k, h: c.h * k, k };
  }

  drawHer(g, st, now) {
    const c = this.cell(st.pose), b = this.herBox(st), breathe = st.pose === 'idle' || st.pose === 'pIdle' ? 1 + 0.012 * Math.sin(now / 600) : 1;
    g.save(); g.translate(st.x, st.y); g.scale(st.sx, breathe); g.translate(-st.x, -st.y);
    g.drawImage(c.im, c.x, c.y, c.w, c.h, b.x, b.y, b.w, b.h);
    g.restore();
  }

  spritePos(st, her, now) {
    if (st.sp?.[0] === 'gone') return null;
    // Low in front of her (README 1.1): her widest point is her hair, so it sits a little inside that to overlap her outline.
    const home = { x: FOOT.x - this.herHalfW * 0.82 - SPRITE_H * 0.12, y: FOOT.y - 0.3 * H + 4 * Math.sin(now / 700) };
    const head = { x: her.x + her.w * 0.3, y: her.y - SPRITE_H * 0.15 };
    // Circling her waist: on the far half of the circle it passes behind her, so it never covers her face.
    if (st.orbit != null) { const a = st.orbit / 1000 * Math.PI * 1.6; st.sBehind = Math.sin(a) < 0; return { x: FOOT.x + Math.cos(a) * 135, y: FOOT.y - 0.34 * H + Math.sin(a) * 26 }; }
    if (!st.sp) return home;
    if (st.sp === 'head') return { x: her.x + her.w * 0.25, y: her.y - SPRITE_H * 0.2 + 3 * Math.sin(now / 500) };
    if (st.sp === 'knee') return { x: FOOT.x + this.herHalfW * 0.75, y: FOOT.y - 42 + 2 * Math.sin(now / 900) };
    if (st.sp[0] === 'crown') { const top = { x: FOOT.x, y: her.y - SPRITE_H * 0.55 }; const p = st.sp[1], d = st.sp[2]; return { x: home.x + (top.x - home.x) * p, y: home.y + (top.y - home.y) * p + 26 * d }; }
    if (st.sp[0] === 'home-from-top') { const top = { x: FOOT.x, y: her.y - SPRITE_H * 0.55 }; const p = st.sp[1]; return { x: top.x + (home.x - top.x) * p, y: top.y + (home.y - top.y) * p }; }
    if (st.sp[0] === 'to-castle') { const p = st.sp[1]; return { x: home.x + (FOOT.x - home.x) * p, y: home.y + (300 - home.y) * p, scale: st.sp[2] }; }
    if (st.sp[0] === 'mast') return { x: st.sp[1], y: st.sp[2] };
    return home;
  }

  drawSprite(g, st, p, now) {
    let name = st.sprite;
    if (name === 'sIdle' && now % 4500 < 140) name = 'sBlink';
    const c = name in SPRITE ? this.cell(name, SPRITE) : this.cells[name][0];
    const k = SPRITE_H / c.ruler * st.sScale * (p.scale || 1);
    g.save(); g.globalAlpha = st.sAlpha;
    g.drawImage(c.im, c.x, c.y, c.w, c.h, p.x + (c.x - c.cx) * k, p.y + (c.y - c.cy) * k, c.w * k, c.h * k);
    g.restore();
  }

  drawCastle(g, c) {
    const im = c.open ? this.castle.open : this.castle.closed, w = this.castle.closed.width * c.s, h = this.castle.closed.height * c.s;
    g.save(); g.globalAlpha = c.a;
    g.drawImage(this.castle.closed, c.x - w / 2, c.y - h / 2, w, h);
    if (c.open) { g.globalAlpha = c.a * c.open; g.drawImage(this.castle.open, c.x - w / 2, c.y - h / 2, w, h); }
    g.restore();
  }

  drawShip(g, s) {
    const b = this.ship.box, w = b.w * s.s, h = b.h * s.s;
    g.save(); g.globalAlpha = s.a; g.drawImage(this.ship.im, b.x, b.y, b.w, b.h, s.x - w / 2, s.y - h / 2, w, h); g.restore();
  }

  drawBubble(g, b, her) {
    const pop = 0.6 + 0.4 * ease(k01(b.t, 0, 160)), alpha = k01(b.t, 0, 120);
    g.save();
    g.font = '600 18px "PingFang SC", "Hiragino Sans GB", sans-serif';
    const maxW = 230, lines = [];
    let cur = '';
    for (const ch of [...b.text]) { if (g.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; } else cur += ch; }
    lines.push(cur);
    const w = Math.max(...lines.map(l => g.measureText(l).width)) + 26, h = lines.length * 24 + 16;
    const anchor = b.at ? { x: b.at.x, y: b.at.y - 90 } : { x: her.x + her.w * 0.62, y: her.y - 6 };
    const x = clamp(anchor.x - w / 2 + 30, 10, PAGE.w - w - 10), y = clamp(anchor.y - h - 14, 8, PAGE.h - h - 8);
    g.globalAlpha = alpha;
    g.translate(x + w / 2, y + h); g.scale(pop, pop); g.translate(-(x + w / 2), -(y + h));
    g.fillStyle = '#fff'; g.strokeStyle = '#F0A3C0'; g.lineWidth = 2.5;
    g.beginPath(); g.roundRect(x, y, w, h, 14); g.fill(); g.stroke();
    const tx = clamp(anchor.x, x + 22, x + w - 22);
    g.beginPath(); g.moveTo(tx - 9, y + h - 1); g.lineTo(tx - 4, y + h + 13); g.lineTo(tx + 8, y + h - 1); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(tx - 9, y + h); g.lineTo(tx - 4, y + h + 13); g.lineTo(tx + 8, y + h); g.stroke();
    g.fillStyle = '#4A3742'; g.textBaseline = 'top';
    lines.forEach((l, i) => g.fillText(l, x + 13, y + 9 + i * 24));
    g.restore();
  }

  drawFx(g, f, st, her, now) {
    const [type, from] = f, t = st._t == null ? now - from : st._t - from;
    if (t == null || t < 0) return;
    const head = { x: her.x + her.w / 2, y: her.y + her.h * 0.2 };
    const r = seeded(type.length * 97 + Math.floor(from));
    const star = (x, y, rad, color, a) => { g.save(); g.globalAlpha = a; g.fillStyle = color; g.beginPath(); for (let i = 0; i < 8; i++) { const ang = i * Math.PI / 4, rr = i % 2 ? rad * 0.32 : rad; g.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); } g.closePath(); g.fill(); g.restore(); };
    const heart = (x, y, s, a) => { g.save(); g.globalAlpha = a; g.fillStyle = '#FF7FA8'; g.beginPath(); g.moveTo(x, y + s * 0.3); g.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3); g.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s); g.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3); g.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3); g.fill(); g.restore(); };
    switch (type) {
      case 'hearts': for (let i = 0; i < f[2]; i++) { const d = i * 180, u = t - d; if (u < 0 || u > 1400) continue; heart(head.x + (r() - 0.5) * 120, head.y - u * 0.09, 16 + r() * 8, 1 - u / 1400); } break;
      case 'sparkles': for (let i = 0; i < 10; i++) { const a = r() * Math.PI * 2, d = 60 + r() * 90, u = t - r() * 400; if (u < 0 || u > 1200) continue; star(head.x + Math.cos(a) * d, head.y + 30 + Math.sin(a) * d * 0.7, 9 + r() * 7, r() < 0.5 ? '#FFE27A' : '#fff', Math.sin(Math.PI * u / 1200)); } break;
      case 'confetti': { if (t > 2600) break; const colors = ['#FF7FA8', '#FFD45E', '#7FD3FF', '#B9F28A', '#fff']; for (let i = 0; i < 40; i++) { const vx = (r() - 0.5) * 0.5, vy = -0.55 - r() * 0.35, u = t; const x = FOOT.x + vx * u, y = FOOT.y - H * 0.6 + vy * u + 0.00045 * u * u; g.save(); g.globalAlpha = 1 - k01(u, 1800, 2600); g.fillStyle = colors[i % 5]; g.translate(x, y); g.rotate(u / 200 + i); g.fillRect(-4, -2, 8, 4); g.restore(); } break; }
      case 'goldConfetti': { const u = (t % 2400); for (let i = 0; i < 30; i++) { const x = r() * PAGE.w, y = -20 + ((u * (0.12 + r() * 0.1) + r() * 600) % 680); g.save(); g.fillStyle = r() < 0.6 ? '#FFD45E' : '#fff'; g.translate(x, y); g.rotate(u / 300 + i); g.fillRect(-4, -2, 8, 4); g.restore(); } break; }
      case 'ring': { if (t > 900) break; g.save(); g.globalAlpha = 1 - t / 900; g.strokeStyle = '#FFD45E'; g.lineWidth = 6 * (1 - t / 900) + 1; g.beginPath(); g.ellipse(FOOT.x, her.y + 10, 30 + t * 0.12, 12 + t * 0.04, 0, 0, Math.PI * 2); g.stroke(); g.restore(); break; }
      case 'beam': { if (t > 900) break; const bx = her.x + her.w * 0.45, by = her.y + her.h * 0.5; g.save(); g.globalAlpha = Math.sin(Math.PI * t / 900) * 0.85; const gr = g.createLinearGradient(bx, by, bx, by - 260); gr.addColorStop(0, 'rgba(255,230,140,1)'); gr.addColorStop(1, 'rgba(255,230,140,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(bx - 18, by); g.lineTo(bx - 70, by - 260); g.lineTo(bx + 70, by - 260); g.lineTo(bx + 18, by); g.fill(); g.restore(); for (let i = 0; i < 6; i++) star(bx + (r() - 0.5) * 100, by - 60 - r() * 160, 8, '#fff', Math.sin(Math.PI * t / 900)); break; }
      case 'puff': { if (t > 900) break; const bx = her.x + her.w * 0.45, by = her.y + her.h * 0.45; for (let i = 0; i < 5; i++) { g.save(); g.globalAlpha = 0.55 * (1 - t / 900); g.fillStyle = '#9A9AA6'; g.beginPath(); g.arc(bx + (i - 2) * 14, by - t * 0.06 - (i % 2) * 10, 10 + t * 0.02, 0, Math.PI * 2); g.fill(); g.restore(); } break; }
      case 'flash': { if (t > 450) break; const p = f[3] || { x: FOOT.x, y: FOOT.y - H * 0.5 }; g.save(); g.globalAlpha = (1 - t / 450) * 0.9; const rad = 60 + t * 0.5 * f[2]; const gr = g.createRadialGradient(p.x, p.y - 60, 0, p.x, p.y - 60, rad); gr.addColorStop(0, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y - 60, rad, 0, Math.PI * 2); g.fill(); g.restore(); break; }
      case 'seaBubbles': for (let i = 0; i < 10; i++) { const u = (t + i * 260) % 2600; g.save(); g.globalAlpha = 0.7 * (1 - u / 2600); g.strokeStyle = '#BFEAFF'; g.lineWidth = 2; g.beginPath(); g.arc(FOOT.x + (r() - 0.5) * 260, FOOT.y - 20 - u * 0.14, 4 + r() * 6, 0, Math.PI * 2); g.stroke(); g.restore(); } break;
      case 'gulls': for (let i = 0; i < 3; i++) { const u = t - i * 300; if (u < 0) continue; const x = PAGE.w + 20 - u * 0.16, y = 120 + i * 40 + 6 * Math.sin(u / 200); g.save(); g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 12, y - 4 * Math.sin(u / 120)); g.quadraticCurveTo(x - 6, y - 8, x, y); g.quadraticCurveTo(x + 6, y - 8, x + 12, y - 4 * Math.sin(u / 120)); g.stroke(); g.restore(); } break;
      case 'fireworks': for (let i = 0; i < 4; i++) { const u = (t + i * 700) % 1400, cx = 70 + ((i * 131) % 340), cy = 70 + ((i * 53) % 140); const colors = ['#FFD45E', '#FF7FA8', '#7FD3FF', '#fff']; for (let j = 0; j < 12; j++) { const a = j * Math.PI / 6; g.save(); g.globalAlpha = 1 - u / 1400; g.fillStyle = colors[i]; g.beginPath(); g.arc(cx + Math.cos(a) * u * 0.05, cy + Math.sin(a) * u * 0.05 + u * u * 0.00002, 3, 0, Math.PI * 2); g.fill(); g.restore(); } } break;
      case 'rainbowSparkles': if (t < 8500) for (let i = 0; i < 10; i++) { const u = (t + i * 300) % 1500; star(40 + r() * 400, 30 + r() * 320, 7 + r() * 6, ['#FFE27A', '#FFB3D1', '#B7E4FF', '#fff'][i % 4], Math.sin(Math.PI * u / 1500)); } break;
      case 'gateGlow': { if (t > 1800) break; const p = f[2]; g.save(); g.globalAlpha = Math.sin(Math.PI * Math.min(t, 1500) / 1500) * 0.7; const gr = g.createRadialGradient(p.x, p.y - 20, 0, p.x, p.y - 20, 70); gr.addColorStop(0, 'rgba(255,236,170,1)'); gr.addColorStop(1, 'rgba(255,236,170,0)'); g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y - 20, 70, 0, Math.PI * 2); g.fill(); g.restore(); break; }
      case 'notes': for (let i = 0; i < 4; i++) { const u = (t + i * 500) % 2000; g.save(); g.globalAlpha = Math.sin(Math.PI * u / 2000); g.fillStyle = '#7C6CF0'; g.font = '700 22px sans-serif'; g.fillText(i % 2 ? '♪' : '♫', head.x + 50 + i * 8 + 10 * Math.sin(u / 300), head.y - u * 0.05); g.restore(); } break;
      case 'z': for (let i = 0; i < 3; i++) { const u = (now + i * 900) % 2700; g.save(); g.globalAlpha = Math.sin(Math.PI * u / 2700); g.fillStyle = '#C9D6FF'; g.font = `700 ${16 + i * 5}px sans-serif`; g.fillText('Z', her.x + her.w * 0.75 + u * 0.02, her.y + 10 - u * 0.035); g.restore(); } break;
    }
  }

  drawCaption(g, st, now, px, py) {
    const c = this.cur, mood = this.mood(now);
    const rows = [];
    if (['手动', '演示'].includes(this.cfg.scene)) {
      rows.push(c ? `演出：${c.name === '日常' ? '日常·' + c.opts.kind + (c.opts.mishap ? '（出事）' : '') : c.name}（${EVENTS[c.name].tier} 档）${((now - c.start) / 1000).toFixed(1)} / ${((c.pre + c.dur) / 1000).toFixed(1)} 秒` : '演出：没有');
      rows.push(`排队：${this.queue.map(q => q.name).join('、') || '空'}`);
      rows.push(`心情：${mood} · 距上次礼物 ${Math.floor((now - this.lastGift) / 60000)} 分 · 距上次事件 ${Math.floor((now - this.lastAny) / 60000)} 分`);
      if (this.lot) rows.push(`抽奖：${this.lot.kind} · ${this.lot.phase}`);
      for (const l of this.log) rows.push('· ' + l);
    } else rows.push(`画面：${this.cfg.scene}${st.label ? ' · ' + st.label : ''}`);
    g.save(); g.font = '500 20px "PingFang SC", sans-serif';
    const x = this.cfg.env === '左下角' ? 1920 - 640 : 40, y = 40;
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.beginPath(); g.roundRect(x - 14, y - 12, 620, rows.length * 30 + 20, 10); g.fill();
    g.fillStyle = '#fff'; g.textBaseline = 'top'; rows.forEach((r, i) => g.fillText(r, x, y + i * 30));
    g.fillStyle = 'rgba(255,255,255,0.85)'; g.font = '500 16px "PingFang SC", sans-serif'; g.fillText('虚线框是浏览器素材的范围（页面本身透明）', px, py - 26);
    g.restore();
  }

  buildControls() {
    const bar = document.body.appendChild(document.createElement('div'));
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:#16181Dee;font:13px "PingFang SC",sans-serif;color:#fff';
    const group = (label, items) => {
      const s = bar.appendChild(document.createElement('span')); s.textContent = label; s.style.cssText = 'opacity:.7;margin:0 4px 0 10px';
      for (const [text, fn] of items) {
        const b = bar.appendChild(document.createElement('button')); b.textContent = text;
        b.style.cssText = 'padding:5px 9px;border:0;border-radius:6px;background:#3358D4;color:#fff;cursor:pointer;font:inherit';
        b.onclick = () => { if (!['手动', '演示'].includes(this.cfg.scene)) return; fn(); };
      }
    };
    const f = (n, o) => () => this.fire(n, o);
    group('事件', [['进场', f('进场')], ['普通礼物', f('普通礼物')], ['连送 5 份', () => { for (let i = 0; i < 5; i++) this.fire('普通礼物'); }], ['大礼物', f('大礼物')],
      ['大礼物+新第一', f('大礼物', { top: true })], ['普通礼物+新第一', f('普通礼物', { top: true })], ['盲盒开大', f('盲盒开大')], ['盲盒开亏', f('盲盒开亏')],
      ['舰长', f('舰长')], ['提督', f('提督')], ['总督', f('总督')], ['城堡', f('城堡')]]);
    group('抽奖', [['报名开场', f('报名开场')], ['报名截止', f('报名截止')], ['奖池开场', f('奖池开场')], ['奖池点名', f('奖池点名')], ['奖池转动', f('奖池转动')],
      ['揭晓·大奖', f('揭晓·大奖')], ['揭晓·二奖', f('揭晓·二奖')], ['揭晓·三奖', f('揭晓·三奖')], ['没人报名', f('没人报名')], ['抽奖结束', () => { this.lot = null; }]]);
    group('时间', [['快进 10 分钟', () => this.fastForward(10)], ['快进 30 分钟', () => this.fastForward(30)], ['回到刚有礼物', () => { this.lastGift = this.lastAny = this.now(); }]]);
    const fit = () => { const r = document.getElementById('root'); if (r) r.style.zoom = Math.min(innerWidth / 1920, (innerHeight - bar.offsetHeight) / 1080); };
    addEventListener('resize', fit); setTimeout(fit, 50);
  }
}
</script>
