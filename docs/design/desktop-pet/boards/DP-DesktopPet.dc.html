    // The two showpieces never cut each other short: the governor waits for the castle and then goes first.
    const show = name === '总督' && this.cur?.name === '城堡';
    if (!this.cur || tier > curTier && !show || name === '连着送' && this.cur.name === '普通礼物') return this.start(name, opts);
    if (tier <= TIER.C) return this.note(`${name}：正忙，丢掉`);
    if (tier < TIER.S && this.queue.filter(q => EVENTS[q.name].tier === ev.tier).length >= 3) return this.note(`${name}：同档已排 3 个，丢掉`);
    this.queue.push({ name, opts }); this.note(`${name}：排队`);
  }

  start(name, opts) {
    const now = this.now();
    if (this.cur) this.note(`${this.cur.name} 被 ${name} 打断`);
    const wake = !!opts.wake, dur = name === '日常' ? DAILY[opts.kind][0] + (opts.mishap ? DAILY[opts.kind][1] : 0) : (opts.zap && EVENTS[name].zapDur) || EVENTS[name].dur;   // zapDur: the longer show after the lightning
    this.cur = { name, opts, start: now, pre: Math.max(wake ? 1000 : 0, opts.tidy ? FRIZZ : 0), dur, line: this.pick(this.lineKey(name, opts)), wakeLine: wake ? this.pick('冷场后来了人') : null };
    // a round's blind boxes were shaken all the while they came in: the show opens the box right away instead of shaking it again
    if (opts.shaken && BOX_OPEN[name]) this.cur.start -= BOX_OPEN[name];
    if (name === '日常') this.nextDaily = now + dur + 20000 + this.rng() * 20000;
    // after the chest game: robbed, she is sad until a gift cheers her up (MOOD_HOLD.robbed at most, its own lines); kept,
    // glad for MOOD_HOLD.kept (and no 日常 meanwhile: those come only when she is 平静)
    if (name === '被偷了') this.moodHold = { mood: '沮丧', lines: '沮丧·被偷', until: now + dur + MOOD_HOLD.robbed };
    if (name === '守住了') this.moodHold = { mood: '开心', until: now + dur + MOOD_HOLD.kept };
    if (name === '报名开场') this.lot = { kind: '报名', phase: '报名中' };
    if (name === '奖池开场') this.lot = { kind: '奖池', phase: '点名前' };
    if (name === '报名截止' && this.lot) this.lot.phase = '等待';
    if (name === '奖池转动' && this.lot) this.lot.phase = '转动';
    if (name === '没人报名' || name === '抽奖结束') this.lot = null;
  }

  note(s) { this.log = [s, ...this.log].slice(0, 4); }

  // A blind box says the lines of its ending; every other show its own.
  lineKey(name, opts = {}) { return EVENTS[name]?.results ? BOX_LINES[opts.result || '赚'] : name; }

  // The endings a show can have, for checking every pose change (tools/check-board.mjs).
  eventVariants(name) { return (EVENTS[name]?.results || [null]).map(r => (r ? { result: r } : {})); }

  // ---- gift rounds (README 2): a viewer's gifts and blind boxes gather until ROUND_GAP of silence, then one show plays
  // for the whole round, chosen by what it spent and, for blind boxes, what they opened. 大航海 purchases do not wait.
  // give(list): sends one after another, 350 ms apart; an entry is one gift { gift, price, n, box?, boxPrice?, top?, castle? }
  // or a list of them, one message (B站 sends a batch of blind boxes as one message split by the gift each opened).
  give(list) { const now = this.now(); list.forEach((m, i) => { for (const x of [].concat(m)) this.pending.push({ ...x, at: now + i * 350 }); }); }

  arrive(x) {
    // the first gift into a quiet room wakes her first (冷场后来了人), before the round's own show
    if (!this.round) { const wake = ['沮丧', '犯困'].includes(this.mood(x.at, false)); this.round = { start: x.at, items: [], wake, wakeLine: wake ? this.pick('冷场后来了人') : null, played: -1 }; }
    const r = this.round;
    r.items.push(x); r.last = x.at;
    this.lastGift = this.lastAny = x.at; this.recent = this.recent.filter(v => x.at - v < 60000).concat(x.at);
    // the chest game: a gift counts for her chest at home; one thrown while the prankster is here plays no show of hers
    if (this.cfg.game && this.gameGift(x)) { r.items.pop(); if (!r.items.length) this.round = null; return; }
    // Gifts do not wait for the round to end: she plays at once the show the round's gifts have come to so far, and moves
    // up when it grows into a bigger one (the fifth gift, 1000 or 10000 电池, a castle); one already played is not played
    // again. Blind boxes wait for the 盲盒播报 (announce).
    if (x.box) return;
    const gifts = r.items.filter(i => !i.box), spend = gifts.reduce((a, i) => a + i.price * i.n, 0), count = gifts.reduce((a, i) => a + i.n, 0);
    const kind = gifts.some(i => i.castle) ? '城堡' : spend >= BIG ? '大礼物' : spend >= MID ? '中礼物' : count >= 5 ? '连着送' : '普通礼物';
    if (GIFT_SHOWS.indexOf(kind) <= r.played) return;
    const best = gifts.reduce((a, i) => (i.price > a.price ? i : a));
    this.fire(kind, { top: !!x.top, spend, gift: best.gift, count, wake: r.played < 0 && r.wake });
    r.played = GIFT_SHOWS.indexOf(kind); r.wake = false;
  }

  // The bot's 盲盒播报 for the round's blind boxes, worded as BlindBoxTally.Announcement; the show plays its result.
  announce(now) {
    const boxes = this.round.items.filter(x => x.box), spend = boxes.reduce((a, x) => a + x.boxPrice * x.n, 0), profit = boxes.reduce((a, x) => a + x.price * x.n, 0) - spend;
    this.announced = { at: now, text: `@${this.cfg.name} 本次投入${spend}电池 ${profit === 0 ? '不赚不亏' : (profit > 0 ? '赚' : '亏') + Math.abs(profit) + '电池'}` };
    this.endRound();
  }

  // The round is over. Its gifts have played already; its blind boxes play now, with the 盲盒播报's result: the size by
  // what the boxes cost, the ending by what they opened, and a castle among them plays the castle.
  endRound() {
    const items = this.round.items; this.round = null;
    const boxes = items.filter(x => x.box); if (!boxes.length) return;
    const sum = f => boxes.reduce((a, x) => a + f(x), 0), best = boxes.reduce((a, x) => (x.price > a.price ? x : a));
    const spend = sum(x => x.boxPrice * x.n), opened = sum(x => x.price * x.n), count = sum(x => x.n), opts = { top: boxes.some(x => x.top), spend, opened, count };
    if (boxes.some(x => x.castle)) return this.fire('城堡', { ...opts, gift: '浪漫城堡', count: 1 });
    const jackpot = best.price >= BIG, result = jackpot ? '大奖' : opened > spend ? '赚' : opened === spend ? '平' : '亏';
    this.fire(['盲盒·小', '盲盒·中', '盲盒·大'][jackpot || spend >= BIG ? 2 : spend >= MID ? 1 : 0], { ...opts, result, gift: best.gift, shaken: true });
  }

  // While a round with blind boxes is still coming in she does not just wait: she shakes the box the whole time, until the
  // 盲盒播报 tells how it came out, and each gift flies into her arms.
  roundState(now) {
    const r = this.round, st = this.base();
    st._t = now - r.start; st.round = true;
    if (r.wake && st._t < 1000) {
      st.pose = 'awake'; st.sprite = 'surprised'; st.fx.push(['bang', 0], ['shock', 0], ['sweat', 200]); st.y -= 10 * bump(st._t, 0, 300);
      st.bubble = { text: this.fill(r.wakeLine, '冷场后来了人'), t: st._t };
      return st;
    }
    st.pose = 'shakeBox'; st.sprite = 'sLook'; st.sFlip = true; st.sp = BOX_EAR;
    for (const x of r.items) st.fx.push(['giftArc', x.at - r.start]);
    st.fx.push(['shakeMarks', 0, 0.83, 0.44, 1e9]);
    return st;
  }

  pick(name) {
    const list = LINES[name]; if (!list) return null;
    let i = Math.floor(this.rng() * list.length);
    if (list.length > 1 && i === this.lines[name]) i = (i + 1) % list.length;
    this.lines[name] = i;
    return list[i];
  }

  update(now) {
    for (const x of this.pending.filter(x => x.at <= now)) this.arrive(x);
    this.pending = this.pending.filter(x => x.at > now);
    const r = this.round;
    if (r && !this.pending.length && now - r.last >= ROUND_GAP) {
      if (!r.items.some(x => x.box)) this.endRound();
      else if (now - r.last >= ROUND_GAP + ANNOUNCE_AFTER) this.announce(now);
    }
    const c = this.cur;
    if (c && now >= c.start + c.pre + c.dur) {
      this.cur = this.seen = null;
      if (c.name.startsWith('揭晓') && this.lot?.kind === '奖池') this.lot.phase = '点名前';
      if (c.opts.top) this.start('新的第一名', { chained: true });
      else if (this.queue.length) {
        const best = Math.max(...this.queue.map(q => TIER[EVENTS[q.name].tier]));
        const i = this.queue.findIndex(q => TIER[EVENTS[q.name].tier] === best);
        const [q] = this.queue.splice(i, 1);
        this.start(q.name, { ...q.opts, chained: true });
      }
    }
    if (this.cfg.game) this.gameUpdate(now);
    if (!this.cur && this.mood(now) === '平静' && !this.lot && !this.gm.visit && !this.gm.out && !this.gm.fix && now >= this.nextDaily) {   // (nor while the sprite is still taking the chest home or to pat her hair smooth)
      const kinds = Object.keys(DAILY), kind = kinds[Math.floor(this.rng() * kinds.length)], mishap = this.rng() < 0.25;
      this.start('日常', { kind, mishap });
    }
  }

  // hold: a mood the chest game left her in (moodHold) goes first; the 冷场 rules alone decide whether a gift wakes her
  // (sad over the chest she has not dozed off nor been left alone: a gift is thanked at once, with no 冷场后来了人)
  mood(now, hold = true) {
    if (hold && this.moodHold && now < this.moodHold.until) return this.moodHold.mood;
    const recent = this.recent.filter(r => now - r < 60000).length;
    if (now - this.lastAny >= 60 * 60000) return '犯困';
    if (now - this.lastGift >= 40 * 60000) return '沮丧';
    if (now - this.lastGift >= 15 * 60000) return '无聊';
    return recent >= 3 ? '开心' : '平静';
  }

  // a danmaku is not played (README 10), it only tells her someone is there: 犯困 needs an hour with nothing at all
  heard() { this.lastAny = this.now(); if (this.cfg.game) this.pebble(); }

  fastForward(min) { const d = min * 60000; this.lastGift -= d; this.lastAny -= d; this.recent = this.recent.map(r => r - d); this.nextDaily -= d; this.gm.last -= d; }

  // ---- the chest game (#372) ----------------------------------------------------------------------------------------
  // Nothing of it is on the page until the prankster comes, and nothing of it stays. Her chest is at home, off the left
  // of the page, where the game only counts what the stream's gifts put in it. The prankster has stolen it: it flies in
  // from the left with the chest hanging from its own hook rope, over her head, and sets it down on her right, on its way
  // out to the right. An empty chest it opens, mocks, and throws back. One with gifts in it springs open as it lands: she
  // takes hold of the handle at her end and pulls for home, it pulls its rope for the right edge, and the room has a
  // minute to beat it off. There is one rope in all of it, the prankster's; the chest has two plain handles.
  // gm: chest (the 电池 in it), pile (the gifts drawn in it), drops and nums (what falls and the numbers that rise, for
  // drawGame), visit (the prankster while it is here), due (it is to come once nothing plays), last (when it last left),
  // out (the sprite flying the chest home), walk (her hopping to another place), streak and steals, brag and grudge (what
  // it opens with next time), say (her line of the game), herX (where she stands).

  // A gift while the game is on. Out of a visit it only counts for the chest at home: her own show plays as ever. While
  // the prankster is here it is thrown (queue), and plays no show of hers: true then.
  gameGift(x) {
    const gm = this.gm, v = gm.visit, spend = (x.box ? x.boxPrice : x.price) * x.n;
    if (!v || DONE.has(v.phase)) { gm.chest += spend; gm.pile += x.n; return false; }
    v.queue.push({ spend, helper: !!x.helper && v.phase === 'tug' });
    return true;
  }

  // The prankster is to come: once whatever plays is over (a 日常小动作 is not cut short), gameUpdate starts its visit.
  visit() { if (this.cfg.game && !this.gm.visit && !this.gm.pk) this.gm.due = true; }
  // A PK (连麦 PK) is no time for it: it does not come, and one here goes as if scared off, with no show after: she lets
  // go and is herself again; after the lightning she cheers frizzed until the sprite, the chest home, has patted her hair
  // smooth (gm.fix, unfrizz, as before a show that scared it off). It used to play 守住了 without its line, confetti
  // and all the moment it ran (用户：“pk开始打断的效果不好、重改”).
  pkOn(on) {
    const gm = this.gm, v = gm.visit, now = this.now();
    gm.pk = on;
    if (!on) return;
    gm.due = false;
    if (!v || DONE.has(v.phase)) return;
    const frizz = v.phase === 'tug' && v.zapped != null;
    this.scare(now);
    if (frizz) gm.fix = { start: now };
  }

  startVisit(now) {
    const gm = this.gm;
    gm.due = false; gm.out = null;
    // loot: there is something in the chest to fight over
    gm.visit = { phase: 'peek', at: now, queue: [], hits: [], spent: 0, count: 0, freezes: 0, helpers: 0, helped: 0, pos: { x: -70, y: 120 }, chest: null, loot: gm.chest > 0 };
    this.pkSay(gm.brag ? PKLINES.brag : gm.grudge ? PKLINES.grudge.replace('{昵称}', gm.grudge) : PKLINES.peek, now);
    gm.brag = false;
  }

  // Its next phase; from and fromCx are where it and the chest (standing) were, for the phases that go on from there.
  phase(p, now) {
    const v = this.gm.visit;
    Object.assign(v, { phase: p, at: now, from: { ...v.pos }, fromCx: v.chest?.x ?? LAND });
    if (['knocked', 'fled'].includes(p)) v.say = null;
  }

  pkSay(text, now) { this.gm.visit.say = { text, at: now }; }

  herSay(text, now) { this.gm.say = { text: this.fill(text), at: now }; }

  // She hops to x in so many little hops (never a slide).
  hopTo(x, now, hops = 1) { const gm = this.gm; if (Math.abs(x - gm.herX) > 1) gm.walk = { from: gm.herX, to: x, at: now, ms: 300 * hops, hops }; }

  // The chest it has let go of goes home: the sprite presses the lid shut if it is open, takes up the prankster's dropped
  // hook rope and flies the chest back over her head, off the left of the page, in ms. t2 is how long it is before the
  // sprite can have the rope; got (gameState) is when it really has it.
  sendHome(now, ms = HOME, popped = false) {
    const v = this.gm.visit, c = v.chest;
    if (!c) return;
    const open = popped || !!this.gl?.open;
    this.gm.out = { at: now, ms, hook: this.ring(c.x, 1), open, t2: GO + (open ? SHUT : 0) + TAKE, got: null };
    v.chest = null;
  }

  // Where the rope in the prankster's carrying drawing ends on the page (tip, boot), and how far from the sprite's centre
  // the rope in its drawing ends.
  pkTip(p) {
    const c = this.pkCell(p.pose), s = PK_H / c.ruler * p.scale, x = (p.flip ? -1 : 1) * c.tip.x * s, y = c.tip.y * s, k = Math.cos(p.rot), n = Math.sin(p.rot);
    return { x: p.x + x * k - y * n, y: p.y + x * n + y * k };
  }

  spTip(pose) { const c = this.cell(pose, SPRITE), s = SPRITE_H / c.ruler; return { x: c.tip.x * s, y: c.tip.y * s }; }

  // Where its flight with the chest ends: the end of its rope right over where the chest's handle will stand.
  carryEnd() { const c = this.pkCell('carry'); return { x: this.ring(LAND, 1).x + c.tip.x * PK_H / c.ruler, y: 198 }; }

  // The link the chest's ring on side s (-1 hers, 1 the prankster's) hangs from, when the chest stands at x.
  ring(x, s) { return { x: x + s * (this.chestBox.w / 2 - RING.x * K), y: CHEST.y - RING.y * K }; }

  // How far in front of her centre the chest's link is in a drawing of hers that holds its ring (GRIP).
  grip(pose) { const [k, i] = POSE[pose], c = this.cells[k][i]; return (c.ox + GRIP - c.cx) * H / c.ruler; }   // (its cell, not a loop's frame)

  // A ring of the chest, hung from the link at p and swung to point along ux, uy (straight down when nothing holds it).
  drawRing(g, p, ux = 0, uy = 1) {
    g.save(); g.translate(p.x, p.y); g.rotate(Math.atan2(uy, ux) - Math.PI / 2); g.scale(K, K);
    g.drawImage(this.props.chestRing, -RING.hang[0], -RING.hang[1]); g.restore();
  }

  // Where her sprite pats her head as she lies where the prankster has dragged the chest from her: as 'head' puts it over her standing (a little left of her
  // head and over it), her head HEAD across her lying drawing.
  comfort(st, now) { const b = this.herBox(st, this.cell(st.pose)); return ['at', b.x + b.w * HEAD[st.pose] - 36, b.y - 15 + 3 * Math.sin(now / 500)]; }

  // Where the prankster floats to pull at the ring that hangs from p: leaning back by rot, the rope its drawing holds
  // (less trim) in one line with the hook and the ring. pkEnd: where that rope ends on the page, the prankster at p.
  pkPull(p, pose, rot, trim) {
    const c = this.pkCell(pose), s = PK_H / c.ruler, x = (c.x - c.cx + trim) * s, y = (c.y - c.cy + c.h * c.rope) * s;
    const d = RING.reach * K + HOOK + 2, k = Math.cos(rot), n = Math.sin(rot);
    return { x: p.x + d * k - x * k + y * n, y: p.y + d * n - x * n - y * k };
  }

  pkEnd(p) {
    const c = this.pkCell(p.pose), s = PK_H / c.ruler * p.scale, x = (c.x - c.cx + (p.trim || 0)) * s + 2, y = (c.y - c.cy + c.h * c.rope) * s, k = Math.cos(p.rot), n = Math.sin(p.rot);
    return { x: p.x + x * k - y * n, y: p.y + x * n + y * k };
  }

  // A gift lands. Over an empty chest the prankster has one life: any gift knocks it off the page, and is the chest's
  // first. With gifts in the chest every gift takes its 电池 off the prankster's life; a 中礼物 ends it there. A helper's
  // gift lands on her head instead and gives the prankster that much life back. She lets go of the handle, so the
  // prankster, glad of it, points at her and laughs, and the chest comes a little its way (tumble), while her
  // sprite pulls on alone; then she takes hold again. The fifth of them flattens her: she lies flat while her sprite
  // pulls on (it lets go, the prankster is off with the chest), catches the handle lying down and is dragged a little
  // before she is up. In the fight's last stretch she lies holding
  // on already, and only winces.
  strike(now, spend, helper) {
    const gm = this.gm, v = gm.visit, name = this.cfg.name;
    if (DONE.has(v.phase)) return;
    if (!v.loot) {
      Object.assign(gm, { grudge: name, chest: spend, pile: 1 });
      this.phase('knocked', now); this.sendHome(now, HOME, true); return this.fire('打跑了', { game: true });   // the lid it sat on springs open for the gift
    }
    v.spent += spend; v.count++;
    if (helper) {
      v.hp = Math.min(v.max, v.hp + spend);
      gm.nums.push({ at: now, text: `+${spend}`, heal: true });
      if (v.sprint != null) { v.wince = now; return; }
      Object.assign(v, { bonk: now, tumble: now, helped: v.helped + 1 });
      if (v.helped % 5 === 0) v.buried = now;
      return this.herSay('{昵称}！怎么砸我呀！', now);
    }
    Object.assign(v, { hp: v.hp - spend, hit: now }); gm.grudge = name;
    gm.nums.push({ at: now, text: `-${spend} ${name}` });
    if (v.hp <= 0 || spend >= MID) this.win(now); else this.herSay('{昵称}打得好！', now);
  }

  // The chest has landed beside her: she starts back from the crash, then lunges for its handle and pulls. The
  // prankster's life is a fifth of what is in it, a 中礼物 at most, and the minute starts.
  grab(now) {
    const gm = this.gm, v = gm.visit;
    v.max = v.hp = clamp(Math.round(gm.chest / 5), 1, MID);
    Object.assign(v, { left: GAME.fight, pebbles: 0, grabbed: now });
    this.phase('tug', now); v.say = null; this.herSay('啊！我的宝箱！', now);
    this.hopTo(Math.min(gm.herX, this.ring(LAND, -1).x - this.grip('lunge') - 10), now);   // back far enough to lunge forward
  }

  // A danmaku while it is here: flying over with the chest, it freezes in a disguise while she looks about (three times
  // at most); in the tug it is a pebble, and all the pebbles together take no more than GAME.pebbles of its life, never
  // the last of it.
  pebble() {
    const v = this.gm.visit, now = this.now();
    if (!v) return;
    if (v.phase === 'carry' && v.freezes < 3 && !(now - v.frozen < FREEZE)) { v.frozen = now; v.freezes++; }
    if (v.phase === 'tug' && v.cut == null && v.pebbles < GAME.pebbles * v.max && v.hp > 1) {
      const d = Math.min(v.hp - 1, Math.max(1, Math.round(v.max * 0.02)));
      v.pebbles += d; v.hp -= d; this.gm.nums.push({ at: now, text: `-${d}`, small: true });
    }
  }

  // A viewer sends the keyword and is on its side for this fight: their gifts are a helper's.
  join() { const v = this.gm.visit; if (v?.phase === 'tug') { v.helpers++; v.joined = this.now(); } }

  // A 大航海, a castle or a lottery scares it off: it drops its rope and flees, and the sprite hurries the chest home
  // before the show starts (TIDY, the show's wait); out of a tug that is the chest kept. Returns that wait.
  scare(now) {
    const gm = this.gm, v = gm.visit;
    if (DONE.has(v.phase)) return 0;
    if (v.phase === 'tug') { gm.streak++; gm.chest += v.spent; gm.pile += v.count; }
    const hung = v.chest && v.chest.x == null && gm.hung;   // flying with it, the chest hanging from its rope
    this.phase('fled', now);
    if (!v.chest) return 0;
    let fall = null;
    if (hung) {
      // it falls straight down from where it hung (kept on the page), and stands where it lands
      const box = this.chestBox, ex = this.ring(0, 1).x, cx = clamp(hung.hook.x - ex, box.w / 2 + 4, PAGE.w - box.w / 2 - 4);
      fall = { at: now, hook: { ...hung.hook }, rot: hung.rot };
      v.chest = { x: cx };
      // were it to come down on her, she hops out from under it first, away from it
      const reach = box.w / 2 + 50;
      if (Math.abs(cx - gm.herX) < reach) {
        let side = gm.herX <= cx ? -1 : 1, to = cx + side * (reach + 20);
        if (to < 60 || to > PAGE.w - 60) { side = -side; to = cx + side * (reach + 20); }
        this.hopTo(clamp(to, 60, PAGE.w - 60), now);
      }
      v.dodge = now;
    }
    this.sendHome(now, TIDY, !!(fall && v.loot)); Object.assign(gm.out, { hop: 2, fall, spot: now + (fall ? FALL : 0) });   // she hops back to the middle once the chest is up out of her way
    return TIDY;
  }

  // Beaten off: what was thrown lands in the chest, the sprite flies it home, and she thanks whoever landed the last of it.
  win(now) {
    const gm = this.gm, v = gm.visit;
    gm.streak++; gm.chest += v.spent; gm.pile += v.count;
    this.phase('won', now); this.sendHome(now); this.hopTo(FOOT.x, now + HOME * 0.6, 3); this.pkSay(PKLINES.won, now);
    this.fire('守住了', { game: true, streak: gm.streak, zap: v.zapped != null });
  }

  lose(now) {
    const gm = this.gm;
    Object.assign(gm, { chest: 0, pile: 0, streak: 0, steals: gm.steals + 1, brag: true });   // next time it brags of it
    this.phase('lost', now); this.pkSay(PKLINES.lost, now);
  }

  endVisit(now) { this.gm.visit = null; this.gm.last = now; if (!this.gm.walk) this.hopTo(FOOT.x, now, 2); }

  // The visit's clock. It comes at most once in GAME.every, when someone is about and no PK is on; then each phase runs
  // its time, and the tug its countdown.
  gameUpdate(now) {
    const gm = this.gm, v = gm.visit, dt = now - (gm.clock ?? now);
    gm.clock = now;
    gm.drops = gm.drops.filter(d => now - d.at < 1400); gm.nums = gm.nums.filter(n => now - n.at < 1100);
    // the chest is home once the sprite has flown it off the page (or, should the sprite never get the rope, a while after)
    if (gm.out && (gm.out.got != null ? now - gm.out.got >= gm.out.ms - gm.out.t2 && !(this.sv?.x > -50) : now - gm.out.at >= gm.out.ms + 6000)) gm.out = null;
    if (!v) {
      if (now - gm.last >= GAME.every && now - this.lastAny < 5 * 60000) gm.due = true;
      if (gm.due && !this.cur && !this.round && !this.lot && !gm.pk) this.startVisit(now);
      return;
    }
    // what is thrown waits while the chest is in the air, until the prankster is on its feet again, and while the lightning plays;
    // then all of it drops
    const away = ['peek', 'carry', 'fall'].includes(v.phase) || v.phase === 'tug' && now - v.grabbed < UP || v.phase === 'peer' && now - v.at < DAZED + 400;
    if (!away && v.cut == null && v.queue.length) {
      for (const q of v.queue) { gm.drops.push({ at: now, her: q.helper, big: q.spend >= MID }); v.hits.push({ at: now + DROP, ...q }); }
      v.queue = [];
    }
    for (const h of v.hits.filter(h => h.at <= now)) this.strike(now, h.spend, h.helper);
    v.hits = v.hits.filter(h => h.at > now);
    const u = now - v.at;
    switch (v.phase) {
      case 'peek': if (u >= 2400) this.phase('carry', now); break;
      case 'carry':
        if (now - v.frozen < FREEZE) v.at += dt;   // frozen, its clock stands still
        else if (u >= GAME.carry) {
          // the chest is too much for it: over her right it can hold on no longer, and comes down with the chest
          v.pos = this.carryEnd();   // where the carrying ends, whatever frame drew it last
          this.phase('fall', now);
        }
        break;
      case 'fall':
        if (u < FALL) break;
        // the chest stands on the ground, the prankster in a heap on its lid
        v.chest = { x: LAND }; v.landed = now; v.pos = { x: LAND, y: CHEST.y - this.chestBox.h - PK_H * 0.3 };
        if (v.loot) this.grab(now); else { this.phase('peer', now); this.hopTo(FOOT.x - 60, now + DAZED + 300); }
        break;
      case 'peer': if (u >= DAZED + 1900) { this.phase('shrug', now); this.pkSay(PKLINES.shrug, now); } break;
      case 'shrug': if (u >= 2800) { this.phase('sit', now); this.pkSay(PKLINES.sit[0], now); } break;
      case 'sit': {
        const n = Math.floor(u / 20000);
        if (u >= GAME.loiter) { this.phase('toss', now); this.pkSay(PKLINES.toss, now); }
        else if (n > (v.heckled || 0)) { v.heckled = n; v.laugh = now; this.pkSay(PKLINES.sit[n % PKLINES.sit.length], now); }
        break;
      }
      case 'toss': if (u >= 1700) this.phase('leave', now); break;
      case 'tug':
        if (v.cut != null) { if (now - v.cut >= ZAP) v.cut = null; break; }   // the set piece plays: the countdown waits
        if (v.zapped == null && v.hp <= v.max / 2) { v.zapped = v.cut = now; this.pkSay(PKLINES.zap, now); break; }
        // it answers her once her bubble is gone (the two stand close then), and after that calls for helpers
        if (!v.caught && now - v.grabbed >= 2900) { v.caught = true; this.pkSay(PKLINES.grab, now); }
        if (!v.recruited && now - v.grabbed >= 6200) { v.recruited = true; this.pkSay(PKLINES.recruit, now); }
        v.left -= dt;
        if (v.left <= GAME.sprint && v.sprint == null) { v.sprint = now; this.pkSay(PKLINES.sprint, now); }
        if (v.left <= 0) this.lose(now);
        break;
      case 'lost': if (u >= 1600) { this.endVisit(now); this.fire('被偷了', { game: true, zap: v.zapped != null }); } break;
      default: if (u >= (v.phase === 'fled' ? (v.ran ?? Infinity) + OFF.fled : OFF[v.phase] ?? 1800)) this.endVisit(now);   // leave, knocked, won, fled: it is off the page
    }
  }

  // Where the chest and the prankster are at this moment (this.gl, for drawGame), and what she does about it while no
  // show of hers plays: every phase of a visit has its place and pose, and she stays in her 心情 until the chest lands
  // beside her.
  gameState(st, now) {
    const gm = this.gm, v = gm.visit, box = this.chestBox;
    const L = this.gl = { chest: null, open: false, pk: null };
    // she hops to where she is to stand, and everything she plays is played from there
    let hopY = 0;
    if (gm.walk) {
      const k = k01(now, gm.walk.at, gm.walk.at + gm.walk.ms);
      gm.herX = gm.walk.from + (gm.walk.to - gm.walk.from) * ease(k);
      if (k > 0 && k < 1) hopY = 10 * Math.abs(Math.sin(k * Math.PI * gm.walk.hops));
      if (k >= 1) gm.walk = null;
    }
    st.x += gm.herX - FOOT.x; st.y -= hopY;
    if (gm.herX !== FOOT.x && !st.sp) st.sp = ['home', gm.herX - FOOT.x, 0];
    // The chest going home: the sprite comes down on an open lid and presses it shut, takes up the prankster's dropped hook
    // rope (its drawing holds the rope from then on), lifts the chest straight up, higher than her bubble, and flies it over
    // her head off the left of the page. The chest hangs from the end of the sprite's rope, where the sprite really is
    // (drawGame); out of the air the prankster holds it up until the sprite has the rope (fled).
    if (gm.out) {
      const o = gm.out, tip = this.spTip('lift'), home = o.hook.x - this.ring(0, 1).x, sv = this.sv;
      // it sets off only once the prankster is off the chest (knocked off it, it springs up from the lid), and goes for
      // the rope only once it is clear of where the chest goes up (CLEAR); its times run from when it sets off (go)
      // Scared off, the chest it was flying with falls first (fall), landing with a thud; and the sprite starts at it ('!',
      // NOTICE) from o.spot before it does anything.
      const fell = !o.fall || now - o.fall.at >= FALL, startle = o.spot != null && now >= o.spot && now < o.spot + NOTICE;
      if (o.fall && fell && !o.fall.landed) { o.fall.landed = now; if (v) v.landed = now; }
      if (startle) { st.sprite = 'surprised'; L.notice = now - o.spot; }
      // (by her it can be where the chest comes down: it darts out from under it to the side of it it is on, not across
      // her, or to the other side when that is off the page)
      if (o.fall && o.go == null) {
        const cx = o.hook.x - this.ring(0, 1).x, d = box.w / 2 + 36, ok = x => x >= 30 && x <= PAGE.w - 30;
        o.fall.dart ??= (sv ? sv.x : gm.herX) < cx ? (ok(cx - d) ? cx - d : cx + d) : (ok(cx + d) ? cx + d : cx - d);
        st.sp = ['at', o.fall.dart, CHEST.y - 120];
      }
      const away = !v || v.pos.a < 0.05 || v.pos.x > PAGE.w + PK_H / 2 || v.pos.y < -PK_H / 2;
      if (o.go == null && fell && (o.spot == null || now >= o.spot + NOTICE) && (away || Math.abs(v.pos.x - home) > 110 || v.pos.y < CHEST.y - 300)) o.go = now;
      const u = o.go == null ? -Infinity : now - o.go;
      const p0 = { x: o.hook.x - tip.x, y: o.hook.y - tip.y - LINK };   // there the end of the sprite's rope is LINK over the hook
      // (the prankster's place last frame: v.pos)
      if (o.clear == null && o.go != null && (away || v.pos.x - p0.x > CLEAR)) o.clear = now;
      if (o.got == null && o.clear != null && u >= o.t2 && sv && Math.hypot(sv.x - p0.x, sv.y - p0.y) < 8) { o.got = now; if (o.hop) this.hopTo(FOOT.x, now + 400, o.hop); }
      st.orbit = null; st.sFlip = false;
      if (o.got != null) {
        // straight up first, above where her bubble is, then across over her head
        const q = k01(now - o.got, 0, o.ms - o.t2), up = ease(k01(q, 0, 0.4)), across = ease(k01(q, 0.4, 1));
        st.sprite = up < 1 ? 'lift' : 'lift2'; st.sp = ['at', p0.x + (-100 - p0.x) * across, p0.y + (56 - p0.y) * up];
        L.chest = { carried: true, len: LINK, lift: ease(k01(q, 0, 0.25)) };
      } else {
        // (it presses at the end of SHUT: the gift that beat the prankster off is still on its way into the chest)
        const press = o.open && u < GO + SHUT, shut = o.open ? ease(k01(u, GO + SHUT * 0.4, GO + SHUT)) : 1;
        if (o.go != null) {
          st.sprite = press && u >= GO ? 'lid' : 'sIdle';
          st.sp = press ? ['at', home, CHEST.y - box.open + (box.open - box.h) * shut - SPRITE_H * 0.16]
            : o.clear == null ? ['at', home - 20, CHEST.y - box.h - SPRITE_H * 0.45] : ['at', p0.x, p0.y];
        }
        if (!fell) {
          // falling: from where its ring hung to where it is on the ground, coming level, the dropped rope trailing
          const k = Math.min(1, ((now - o.fall.at) / FALL) ** 2);
          L.chest = { still: { x: o.fall.hook.x + (o.hook.x - o.fall.hook.x) * k, y: o.fall.hook.y + (o.hook.y - o.fall.hook.y) * k }, rot: o.fall.rot * (1 - k) }; L.loose = true;
        } else { L.chest = { x: home, y: CHEST.y }; L.open = o.open && shut < 0.5; L.dropped = true; }
      }
    }
    if (!v) return st;
    st.slide = true;   // her place goes with her pose while it is here (drawHer)
    const u = now - v.at, free = !this.cur, bob = 4 * Math.sin(now / 520), low = CHEST.y - 74;
    if (free && ['peek', 'carry', 'fall'].includes(v.phase)) st.bubble = null;   // her 心情 says nothing while a chest flies past where its bubble is
    else if (free) { st.orbit = null; st.y = FOOT.y - hopY; }                     // and beside the chest she is no longer in her 心情: no happy bounce
    const seat = CHEST.y - box.h - PK_H * 0.3, over = CHEST.y - box.open - PK_H * 0.24;   // its height seated on the lid; over the open lid
    const pk = L.pk = { pose: 'idle', x: v.pos.x, y: v.pos.y, flip: false, rot: 0, scale: 1, a: 1 };
    const fly = (vx, vy, grav = 0) => { pk.x = v.from.x + vx * u; pk.y = v.from.y + vy * u + grav * u * u; };
    const hop = (x, y, ms = 400) => { const e = ease(k01(u, 0, ms)); pk.x = v.from.x + (x - v.from.x) * e; pk.y = v.from.y + (y - v.from.y) * e; };
    let cx = v.chest?.x ?? null;   // the chest standing on the ground, if it does
    switch (v.phase) {
      case 'peek': Object.assign(pk, { pose: 'peek', flip: true, x: -70 + 94 * ease(k01(u, 0, 500)), y: 120 + bob }); break;
      case 'carry': {
        // It flies in little goes, its arms in front of it holding its hook rope, the chest hanging from the rope by one
        // handle and swinging as it goes (drawGame); the weight sinks it until it is over her head. Frozen, it is a paper
        // bag or a paper king with a chest still hanging from it. (Its sneaking drawing faces the viewer's left: flipped.)
        const p = u / GAME.carry * 9, go = Math.min(1, (Math.floor(p) + ease(k01(p % 1, 0, 0.6))) / 9), frozen = now - v.frozen < FREEZE;
        const strain = frozen ? 0 : k01(go, 0.72, 1);   // near the end the weight is too much for it: it wobbles, sweats and sinks
        Object.assign(pk, { pose: frozen ? (v.freezes % 2 ? 'carryBag' : 'carryCrown') : 'carry', flip: !frozen, x: -70 + (this.carryEnd().x + 70) * go,
          y: 120 + 70 * Math.sin(Math.PI / 2 * Math.min(1, go / 0.6)) + 8 * k01(go, 0.72, 1) + (frozen ? 0 : bob), rot: 0.12 * strain * Math.sin(now / 80) });
        L.sweat = strain;
        L.chest = { hang: this.pkTip(pk), len: LINK };
        if (frozen && free) { if (st.pose === 'idle') st.pose = 'lookUp'; st.sprite = 'sLook'; L.ask = now - v.frozen; }   // she looks up and about
        break;
      }
      case 'fall': {
        // It can hold on no longer: it and the chest come down together, faster and faster, the chest coming level, and it
        // lands in a heap on the chest's lid.
        const k = Math.min(1, (u / FALL) ** 2), r = this.ring(LAND, 1), y0 = this.pkTip({ ...pk, pose: 'carry', flip: true, x: v.from.x, y: v.from.y }).y + LINK;
        Object.assign(pk, { pose: 'fall', flip: true, x: v.from.x + (LAND - v.from.x) * k, y: v.from.y + (seat - v.from.y) * k, rot: -0.3 * k });
        L.chest = { still: { x: r.x, y: y0 + (r.y - y0) * k }, rot: HANG * (1 - k) };
        break;
      }
      case 'peer': {
        // It lies dazed on the lid where it fell (DAZED); then it is up over the chest and has the lid open: empty, and a moth
        // flies out. She has started at the crash; now she is sorry and embarrassed about her empty chest.
        const up = ease(k01(u, DAZED, DAZED + 400));
        Object.assign(pk, { pose: u < DAZED ? 'dazed' : u < DAZED + 400 ? 'shake' : 'peer', flip: u < DAZED, x: cx, y: seat + (over - seat) * up + bob * up });
        L.open = u >= DAZED + 500; L.moth = u - DAZED - 700; L.ropes = L.slack = true;
        if (free && u >= 250) st.pose = u < DAZED + 700 ? 'startled' : 'sorry';
        break;
      }
      case 'shrug': Object.assign(pk, { pose: 'shrug', x: cx, y: over + (seat - over) * ease(k01(u, 1900, 2700)) + bob * (1 - k01(u, 1900, 2700)) }); L.open = u < 1900; L.ropes = L.slack = true; if (free) st.pose = 'sorry'; break;
      // (she is sorry and embarrassed about her empty chest, not angry)
      case 'sit': Object.assign(pk, { pose: now - v.laugh < 2600 ? 'laugh' : 'sit', x: cx, y: seat }); L.ropes = L.slack = true; if (free) st.pose = 'sorry'; break;
      case 'toss': {
        // bored of an empty chest, it gets off and throws the chest back over her head, home
        pk.pose = u < 450 ? 'shrug' : u < 1200 ? 'throw' : 'laugh'; hop(v.fromCx + 56, low + bob, 400);
        const w = Math.max(0, u - 500);
        if (w > 0) { L.chest = { x: v.fromCx - 0.42 * w, y: CHEST.y - 1.6 * w + 0.00145 * w * w, spin: -w / 180 }; cx = null; v.chest = null; }
        else L.ropes = L.slack = true;   // its hook comes out of the ring as it throws
        if (free) st.pose = 'sorry';
        break;
      }
      case 'leave': fly(0.16, -0.05); pk.y += bob; break;
      // knocked off an empty chest it spins up and out of the top; beaten off it zigzags up and out of the top like a balloon
      // letting its air out (both slowly, and up rather than right: it stands by the right edge, and was gone in a blink)
      case 'knocked': pk.pose = 'knocked'; fly(0.12, -0.32, 0.00003); pk.rot = u / 260; pk.a = 1 - k01(u, 2100, 2600); break;
      case 'fled': {
        // Scared off, it lets go of everything with a start (startle; a chest in the air falls: gm.out.fall), then it is off
        // to the right, looking back. (Her frizzed hair the sprite pats smooth once the chest is home: unfrizz.)
        const w = u - (v.ran ??= u);
        // it jumps with fright first, then runs off bobbing out at the right, at its own height, taking OFF.fled however far
        // from the edge it was (run). It used to flee straight up, beside the chest the sprite lifts straight up to take
        // home, and the two went up side by side, the sprite seeming to carry it off (用户：“怎么变得小精灵抬着捣蛋鬼跑了”).
        const run = Math.max(0, w - 450), vx = Math.max(0.06, (PAGE.w + 60 - v.from.x) / (OFF.fled - 450));
        // (it starts the way it faced, flying with the chest to the right or pulling toward her, and turns to run)
        Object.assign(pk, { pose: w < 450 ? 'startle' : 'flee', flip: w < 450 ? v.from.flip ?? true : true, x: v.from.x + vx * run, y: v.from.y - 18 * bump(w, 0, 450) - 6 * Math.abs(Math.sin(run / 110)), a: 1 - k01(run, OFF.fled - 700, OFF.fled - 450) });
        // a chest it let go of over her head: she hops out from under it, and starts at the thud
        if (v.dodge != null && (free || now < this.cur.start + this.cur.pre) && now - v.dodge < FALL + 700) st.pose = 'startled';
        break;
      }
      // (it drifts off up and to the right, out of the way of the chest the sprite lifts straight up: it used to drift
      // straight up, right where the chest went, and the sprite seemed to carry it off)
      case 'won': pk.pose = 'flat'; fly(0.07, -0.12); pk.x += 24 * Math.sin(u / 95); pk.y += 26 * Math.sin(u / 120); pk.rot = 0.7 * Math.sin(u / 85); pk.a = 1 - k01(u, 2900, 3400); break;
      // it has the chest: she has lost her hold and lies where she was dragged to
      // (her lying drawing with empty fists: the ring she held hangs from the chest again)
      case 'lost': pk.pose = 'haul'; pk.rot = HAUL; fly(0.32, 0); cx = v.fromCx + 0.32 * u; L.open = true; L.ropes = true; if (free) { st.pose = v.zapped != null ? 'fallenZap' : 'fallen'; Object.assign(st, { sprite: 'pat', sp: this.comfort(st, now) }); } break;
      case 'tug': {
        // She starts back from the crash, lunges for the chest's handle and pulls the chest back toward her (she backs off
        // with it, out from under the dazed prankster), and then the three drift with the prankster's life: to its side
        // while it has most of it, back to hers as it loses it. In the last stretch it hauls the chest off and she is
        // dragged along.
        const t = now - v.grabbed, e = ease(k01(t, 850, 2300)), cut = v.cut != null ? now - v.cut : null;
        const drift = e * (TUG.drift * (v.hp / v.max * 2 - 1) + 1.5 * Math.sin(now / 260)) + (v.sprint != null ? 150 * (now - v.sprint) / GAME.sprint : 0);
        // A helper's gift on her head (strike): down is how long she has been flattened (flat 1200 ms, then 700 ms holding
        // the handle lying down), loose whether she has let go. The prankster is glad of it: it points at her and laughs,
        // and the chest comes a little its way (yank). The bump and the dizzy eyes are for a gift that hits it.
        const down = now - v.buried < 1900 ? now - v.buried : null, loose = down != null ? down < 1200 : now - v.bonk < 800;
        const yank = now - v.tumble < 800 ? 10 * bump(now, v.tumble, v.tumble + 800) : 0;
        cx = v.fromCx + (TUG.chest - v.fromCx) * e + drift + yank;
        // It lies dazed on the lid where it fell; as she pulls the chest away it tumbles off to the far side, heels over
        // head (off; its tumbling drawing is upside down), the lid springs open, and it shakes itself and takes up its
        // rope, still hooked in the handle (UP).
        // It floats where its rope runs straight from the chest's ring into its fists, leaning back (pkPull).
        const place = v.sprint != null ? this.pkPull(this.ring(cx, 1), 'haul', HAUL, 0) : this.pkPull(this.ring(cx, 1), 'tug', LEAN, TRIM);
        const off = ease(k01(t, 900, 1700)), to = { x: place.x + yank * 0.4, y: place.y + bob * 0.5 };
        pk.x = cx + (to.x - cx) * off; pk.y = seat + (to.y - seat) * off - 26 * Math.sin(Math.PI * off);
        if (t < 900) Object.assign(pk, { pose: 'dazed', flip: true });
        else if (t < 1700) Object.assign(pk, { pose: 'tumble', rot: (off - 0.5) * Math.PI * 2 });
        else if (t < UP) pk.pose = 'shake';
        else pk.pose = cut != null ? 'thunder' : v.sprint != null ? 'haul' : loose ? 'laugh' : now - v.hit < 450 ? 'ouch' : 'tug';
        if (pk.pose === 'haul') pk.rot = HAUL; else if (pk.pose === 'tug' || pk.pose === 'ouch') Object.assign(pk, { rot: LEAN, trim: TRIM });
        L.ropes = true; L.open = t >= 1100; L.slack = !['tug', 'haul', 'ouch'].includes(pk.pose);   // not pulling, its rope hangs slack
        if (cut != null) L.zap = cut;
        if (free) {
          // after the lightning her hair stays frizzed, whatever she does
          const z = now - v.zapped >= 900 ? 'Zap' : '';
          st.pose = t < 500 ? 'startled' : t < 850 ? 'lunge' : down != null ? (down < 1200 ? 'flat' : 'dragged') + z : loose ? 'bonk' + z : v.sprint != null ? 'dragged' + z : 'tug' + z;
          // from her lunge on the ring in her fists is at the chest's link (her drawings hold it; held: the chest's own
          // ring on her side is then not drawn); where she has let go she stands where she pulled from
          if (t >= 500) {
            const holds = POSE[st.pose][0] === 'game16';
            st.x = gm.herX = this.ring(cx - yank, -1).x - this.grip(holds ? st.pose : 'tug'); gm.walk = null;
            if (holds) L.held = 'her';
          }
          if (now - v.wince < 300) st.y -= 5 * bump(now, v.wince, v.wince + 300);
          // Her sprite is on her side: once the prankster is up and pulling, it takes hold of the open lid's edge on her
          // side, over her arms, and pulls with her (its two pulling drawings by turns, its fists over the lid's edge:
          // sOver), on alone while she has let go or lies flattened: were it to let go, the prankster would be off with
          // the chest. (While the prankster still lies on the lid it stays by her, startled.)
          if (t >= UP) {
            const key = Math.floor(now / 400) % 2 ? 'hold2' : 'hold', hc = this.cell(key, SPRITE), ks = SPRITE_H / hc.ruler;

    if (free && gm.say && now - gm.say.at < 2600) st.bubble = { text: gm.say.text, t: now - gm.say.at };
    return st;
  }

  // The chest on a rope len long swings like a weight from pivot: it lags when what carries it starts off and swings on
  // when that stops, and settles. Returns the rope's angle from straight down.
  swing(pivot, len) {
    const rt = performance.now(), s = this.sw ??= { a: 0, w: 0, x: pivot.x, vx: 0, rt };
    const dt = Math.min(40, (rt - s.rt) * this.cfg.speed);

  }

  pkCell(pose) { const [k, i] = PKPOSE[pose]; return this.cells[k][i]; }

  // The drawing of it to show now: a loop's frame (PKSTRIP) or its cell. Where its rope ends is the cell's (pkCell): a
  // loop keeps its fists and rope still.
  pkFrame(pose) { const f = this.pkstrips?.[pose]; return f ? f[Math.floor(this.clock / PKSTRIP[pose].ms) % 4] : this.pkCell(pose); }

  // The prankster at p, its drawing's centre: every sheet's first cell is its idle drawing, the ruler that brings its
  // sheets to one size.
  drawPk(g, p) {
    // A change of its pose plays the in-betweens drawn for it (PKTRANS; the other way round, backwards), 90 ms each, as
    // hers do, and the lean it pulls at (rot) goes over to the new one with them.

    const rt = performance.now(), pv = this.pv ??= { pose: p.pose, at: -1e9, tween: null, rot: p.rot, flip: p.flip };
    if (p.pose !== pv.pose) {

      Object.assign(pv, { tween: !!pv.flip === !!p.flip && (there || back?.slice().reverse()) || null, pose: p.pose, at: rt, from: pv.rot });
    }
    pv.flip = p.flip;

    const c = tw || this.pkFrame(p.pose), rot = tw ? pv.from + (p.rot - pv.from) * (i + 1) / (pv.tween.length + 1) : p.rot;
    const s = PK_H / c.ruler * p.scale, t = p.trim || 0;   // trim: that much of the rope it holds, at the drawing's left, is left off
    pv.rot = rot;
    g.save(); g.globalAlpha = p.a; g.translate(p.x, p.y); g.rotate(rot); g.scale(p.flip ? -s : s, s);
    g.drawImage(c.im, c.x + t, c.y, c.w - t, c.h, c.x + t - c.cx, c.y - c.cy, c.w - t, c.h); g.restore();
  }

  // A little gift box, b its half side.

    g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = '#FF9EB8'; g.strokeStyle = '#4A2E2A'; g.lineWidth = 1.5; g.beginPath(); g.roundRect(-b, -b, 2 * b, 2 * b, b * 0.3); g.fill(); g.stroke();
    g.fillStyle = '#E8454F'; g.fillRect(-b * 0.2, -b, b * 0.4, 2 * b); g.fillRect(-b, -b * 0.2, 2 * b, b * 0.4); g.beginPath(); g.ellipse(-b * 0.45, -b - b * 0.28, b * 0.42, b * 0.28, -0.5, 0, Math.PI * 2); g.ellipse(b * 0.45, -b - b * 0.28, b * 0.42, b * 0.28, 0.5, 0, Math.PI * 2); g.fill(); g.restore();
  }

  // The chest game's drawings, over her and everything of hers: the chest (standing, or hanging by the handle the hook
  // rope is in, that end up), the prankster and its rope, what drops, the numbers, the fight's board along the top of the
  // page, and what the prankster says. Nothing of it passes behind her: it flies over her head or stays on her right.
  drawGame(g, st, now, her, bub) {
    const gm = this.gm, L = this.gl, v = gm.visit, box = this.chestBox;
    if (!L) return;
    const c = L.chest, pk = L.pk, top = CHEST.y - box.h, sv = this.sv;
    const text = (str, x, y, font, fill) => { g.font = font; g.lineJoin = 'round'; g.lineWidth = 4; g.strokeStyle = 'rgba(40,26,54,0.88)'; g.strokeText(str, x, y); g.fillStyle = fill; g.fillText(str, x, y); };
    // A rope from a to the ring that hangs from the link at p: a pull on the rope, or the chest's own weight on it, swings
    // the ring out toward a, and a slack rope leaves it hanging; the rope ends in a hook round the far side of the ring.
    // It sags by sag of its length, trembles when it is pulled taut, and shows its twist all along.

      if (im) this.drawProp(g, im, 0, 0); else { g.fillStyle = '#C98A4B'; g.fillRect(-box.w / 2, -box.h, box.w, box.h); }

      if (L.open) for (let i = 0; i < Math.min(gm.pile, 18); i++) this.giftIcon(g, (r() - 0.5) * box.w * 0.62, -box.h + 6 - r() * 10 - Math.floor(i / 5) * 8, 9, (r() - 0.5) * 0.9);

      // hook is in it (rope)
      if (!L.held || c.x == null) this.drawRing(g, at(-ex, -ey));

    } else this.sw = null;

      g.save(); g.globalAlpha = a; g.translate(sv.x + 16, sv.y - SPRITE_H * 0.62); g.rotate(0.15); g.scale(s, s);
      g.font = `900 28px ${SANS}`; g.textAlign = 'center'; g.lineWidth = 5; g.strokeStyle = '#fff'; g.strokeText('!', 0, 0); g.fillStyle = '#FF5A6E'; g.fillText('!', 0, 0);
      g.restore();
    }
    // straining under the chest it sweats
    if (L.sweat > 0 && pk) for (let i = 0; i < 3; i++) {
      const w = (now + i * 230) % 700;
      g.save(); g.globalAlpha = (1 - w / 700) * L.sweat; g.fillStyle = '#BFE6FF'; g.beginPath(); g.ellipse(pk.x - 22 - i * 9 - w * 0.04, pk.y - 44 - w * 0.05, 3, 5, -0.5, 0, Math.PI * 2); g.fill(); g.restore();
    }

      if (u < 0) continue;
      if (u < DROP) this.giftIcon(g, to.x, -30 + (to.y + 30) * (u / DROP) ** 2, b, u / 160);
      else if (u < DROP + 600) { const p = (u - DROP) / 600; this.giftIcon(g, to.x + (into.x - to.x) * p, to.y + (top - to.y) * p - 70 * Math.sin(Math.PI * p), b, u / 110); }
      if (u >= DROP && u < DROP + 240) {

        for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + 0.3; g.beginPath(); g.moveTo(to.x + Math.cos(a) * (10 + 14 * q), to.y + Math.sin(a) * (10 + 14 * q)); g.lineTo(to.x + Math.cos(a) * (18 + 22 * q), to.y + Math.sin(a) * (18 + 22 * q)); g.stroke(); }
        g.restore();
      }
    }

    if (L.ask != null && L.ask < 1300) { g.save(); g.globalAlpha = 1 - k01(L.ask, 900, 1300); g.textAlign = 'center'; text('？', her.x + her.w * 0.82, her.y - 2 - 8 * bump(L.ask, 0, 300), `800 30px ${SANS}`, '#B79BE8'); g.restore(); }
    if (c?.x != null && L.open && L.moth > 0 && L.moth < 2600) {
      const m = L.moth, x = c.x + 26 * Math.sin(m / 190), y = top - 10 - m * 0.07, w = 4 + 3 * Math.abs(Math.sin(m / 45));
      g.save(); g.globalAlpha = 1 - k01(m, 2000, 2600); g.fillStyle = '#B9B2A6'; g.beginPath(); g.ellipse(x - w, y, w, 5, -0.4, 0, Math.PI * 2); g.ellipse(x + w, y, w, 5, 0.4, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#7A7468'; g.fillRect(x - 1, y - 4, 2, 8); g.restore();

        gr.addColorStop(0, '#FFF7C2'); gr.addColorStop(1, 'rgba(255,226,122,0)');

        pts.push(head);

      g.save(); g.globalAlpha = 1 - k01(u, 700, 1100); g.textAlign = 'center'; text(n.text, x, y, `800 ${n.small ? 15 : 22}px ${SANS}`, n.heal ? '#9BE8A6' : '#FFE27A'); g.restore();
    });

      // harder, warming from white to amber and growing; in the last 10 s (sprint) it turns red, grows on, beats twice a
      // second in the last 5, shakes and glows red behind, and what its life still asks for beats with it.

    // or scared off it goes slowly and its bubble goes with it (left where it was, it hid it as it went). Where her bubble

    if (pk && v?.say && now - v.say.at < 3000 && !(DONE.has(v.phase) && (pk.x > PAGE.w || pk.y < 0))) {
