  }

  update(now) {
    const c = this.cur;
    if (c && now >= c.start + c.pre + c.dur) {
      this.cur = this.seen = null;
      if (c.name.startsWith('揭晓') && this.lot?.kind === '奖池') this.lot.phase = '点名前';
      if (c.opts.top) this.start('新的第一名', { chained: true });
      else if (this.queue.length) {
        const best = Math.max(...this.queue.map(q => TIER[EVENTS[q.name].tier]));
        const i = this.queue.findIndex(q => TIER[EVENTS[q.name].tier] === best);
        const [q] = this.queue.splice(i, 1);
        this.start(q.name, { ...q.opts, chained: true });
      }
    }
    if (!this.cur && this.mood(now) === '平静' && !this.lot && now >= this.nextDaily) {
      const kinds = Object.keys(DAILY), kind = kinds[Math.floor(this.rng() * kinds.length)], mishap = this.rng() < 0.25;
      this.start('日常', { kind, mishap });
    }
  }

  mood(now) {
    const recent = this.recent.filter(r => now - r < 60000).length;
    if (now - this.lastAny >= 60 * 60000) return '犯困';
    if (now - this.lastGift >= 40 * 60000) return '沮丧';
    if (now - this.lastGift >= 15 * 60000) return '无聊';
    return recent >= 3 ? '开心' : '平静';
  }

  fastForward(min) { const d = min * 60000; this.lastGift -= d; this.lastAny -= d; this.recent = this.recent.map(r => r - d); this.nextDaily -= d; }

  // ---- what she is doing at a moment --------------------------------------------------------------------------------
  base() { return { pose: 'idle', x: FOOT.x, y: FOOT.y, s: 1, sx: 1, sprite: 'sIdle', sp: null, sBehind: false, sScale: 1, sAlpha: 1, fx: [], bubble: null, hide: false }; }

  // since: how long she has been in this mood (or lottery wait) without an event.
  idleState(now, mood, since = now) {
    const st = this.base();
    if (this.lot && (this.lot.phase === '等待' || this.lot.phase === '转动')) { st.pose = 'hope'; st.fx.push(['sweat', 0, 2400]); this.talk(st, '等开奖', since); return st; }
    if (mood === '开心') { st.y -= 6 * Math.abs(Math.sin(now / 380)); st.orbit = now; }
    if (mood === '平静' && now % 7000 > 5800) st.sprite = 'sLook';  // now and then it looks up at her
    if (mood === '无聊') { st.fx.push(['dots', 0, 6000], ['sigh', 0, 7000]); }
    if (mood === '沮丧') st.fx.push(['gloom', 0]);
    if (mood === '无聊') { st.pose = 'bored'; st.sprite = now % 8000 < 2600 ? 'yawn' : 'sIdle'; st.sp = ['home', 10 * Math.sin(now / 1800), 6 * Math.sin(now / 1300)]; }
    if (mood === '沮丧') { st.pose = 'gloomy'; st.sprite = 'pat'; st.sp = 'head'; }
    if (mood === '犯困') { st.pose = 'doze'; st.sprite = 'sleep'; st.sp = 'knee'; }
    this.talk(st, this.lot?.phase === '报名中' ? '报名中' : mood, since);
    if (mood === '犯困') {
      // every other half minute her head drops onto her knees: she jolts awake, insists she wasn't asleep, and dozes off again
      const u = since % 30000;
      if (u >= 23000 && u < 24400) { st.pose = 'awake'; st.y -= 10 * bump(u, 23000, 23300); st.sprite = 'surprised'; st.bubble = { text: LINES.冷场后来了人[1], t: u - 23000 }; st.fx.push(['bang', now - (u - 23000)], ['shock', now - (u - 23000)]); }
      else st.fx.push(['z', now]);
    }
    return st;
  }

  // A mood or a lottery wait says its first line 0.6 s in and the next one every 15 s after (平静 and 开心 say nothing).
  talk(st, key, since) {
    const lines = LINES[key], u = since % 15000;
    if (lines && u >= 600 && u < 4600) st.bubble = { text: this.fill(lines[Math.floor(since / 15000) % lines.length]), t: u - 600 };
  }

  eventState(name, t, opts, line) {
    const st = this.base();
    st._t = t; st.glow = GLOW[EVENTS[name]?.glow || EVENTS[name]?.tier || 'D'];
    const say = (from, text = line) => { if (t >= from && text) st.bubble = { text, t: t - from }; };
    const hop = (a, h = 10) => { st.y -= h * bump(t, a, a + 320); if (h >= 10) st.fx.push(['dust', a + 300]); };  // a puff where she lands
    switch (name) {
      // it looks up at her first, then waves its flag with her
      case '进场': st.pose = 'wave'; hop(0, 8); st.sprite = t < 350 ? 'sLook' : 'flag'; say(100); break;
      // they bow together
      case '普通礼物': st.pose = t < 1500 ? 'bow' : 'idle'; st.sprite = t < 1500 ? 'nod' : 'sHappy'; st.fx.push(['hearts', 200, 3]); say(150); break;
      // it copies her: up beside her shoulder, hiding its face too
      // little boxes fly in from both sides one after another; at the fifth she hides her face
      case '连着送':
        st.pose = t < 1250 ? 'idle' : 'shy'; if (t >= 1250) { st.sprite = 'hide'; st.sp = ['rel', -0.04, 0.42]; } else st.sprite = 'sLook';
        if (t >= 1250) st.fx.push(['hearts', 1250, 7]); say(1250); break;
      // the box drops from above her head into her hands; she cheers and tosses the sprite
      case '中礼物':
        st.pose = at(t, [[0, 'idle'], [1100, 'giftBox'], [2000, 'cheer']]); hop(1200, 6); hop(2000, 14);
        if (t < 2000) { st.sprite = 'sLook'; st.sp = ['rel', 0.04, 0.52]; } else this.toss(st, t, 2000);
        say(1200); break;
      case '大礼物': this.bigGift(t, st, say); break;
      case '新的第一名':
        st.pose = t < 1300 ? 'idle' : 'crownV';
        st.sprite = t < 1600 ? 'crown' : 'sHappy';
        st.sp = t < 1600 ? ['crown', ease(k01(t, 0, 900)), ease(k01(t, 900, 1300))] : ['home-from-top', ease(k01(t, 1600, 2400))];
        st.fx.push(['ring', 1300], ['sparkles', 1300]); say(1300); break;
      // it listens at the box with her (its seams glowing in the tier's colour first), is blown back when it opens, then
      // cheers beside her; a big prize sends a beam up to the top of the page and a star that bursts over it
      case '盲盒开中': case '盲盒开大': {
        const big = name === '盲盒开大', o = big ? 1500 : 1200, r = big ? 3500 : 2600;
        st.pose = at(t, [[0, 'shakeBox'], [o, 'openBox'], [big ? 2600 : 2000, 'surprised'], [r, 'cheer']]);
        hop(r, 14);
        if (t < o) { st.sprite = 'sLook'; st.sFlip = true; st.sp = ['rel', 1.02, 0.22]; }
        else if (t < r) { st.sprite = 'surprised'; st.sp = ['rel', 1.12, 0.02]; }
        else { st.sprite = 'sHappy'; st.sp = ['home', 0, -14 * bump(t, r, r + 320)]; }
        if (big) st.fx.push(['pillar', o, 1100, null, 'box'], ['bigStar', o], ['fountain', 2500, 1800, { x: FOOT.x, y: 200 }]);
        else st.fx.push(['beam', o], ['sparkles', r], ['confetti', r]);
        say(o + 100); break;
      }
      // it listens at the box with her, hides from the puff, then pats her pouting head
      case '盲盒开亏':
        st.pose = at(t, [[0, 'shakeBox'], [900, 'openBox'], [1500, 'pout']]);
        if (t >= 1500) st.y -= 4 * Math.abs(Math.sin((t - 1500) / 90));
        if (t < 900) { st.sprite = 'sLook'; st.sFlip = true; st.sp = ['rel', 1.02, 0.22]; }
        else if (t < 1500) { st.sprite = 'hide'; st.sp = ['rel', 1.1, 0.3]; }
        else { st.sprite = 'pat'; st.sp = 'head'; }
        st.fx.push(['puff', 900]); say(1000); break;
      // the sprite dresses her, salutes beside her in its sailor collar, and dresses her back
      case '舰长':
        if (t < 600) this.dress(st, t, 0, 600);
        else { st.pose = 'capSalute'; hop(600, 8); st.sprite = 'sailor'; st.sp = ['rel', -0.1, 0.42]; }
        if (t >= 3700) { st.pose = t < 4300 ? 'capSalute' : 'idle'; if (t < 4300) this.dress(st, t, 3700, 4300); else st.sprite = 'sHappy'; }
        st.fx.push(['flash', 600, 0.6], ['seaBubbles', 600], ['flash', 4300, 0.6]); say(800); break;
      case '提督': this.admiral(t, st, say); break;
      case '总督': this.governor(t, st, say); break;
      case '城堡': this.castleShow(t, st, say); break;
      // it flies up beside her raised fist with its flag
      case '报名开场': case '奖池开场': st.pose = 'announce'; hop(0, 12); st.sprite = 'flag'; st.sp = ['rel', -0.18, 0.05]; st.fx.push(['sparkles', 0]); say(150); break;
      // both hold their breath: it looks up at her, trembling
      case '报名截止': case '奖池转动': st.pose = 'hope'; st.sprite = 'sLook'; st.sp = ['home', 1.5 * Math.sin(t / 30), 0]; say(150); break;
      // it dashes out the way she points, toward the viewer, waving its flag
      case '奖池点名': st.pose = 'point'; st.sprite = 'flag'; st.sp = ['rel', 1.0, 0.32]; st.sScale = 1 + 0.3 * bump(t, 200, 1600); say(150); break;
      case '揭晓·大奖': case '揭晓·二奖': case '揭晓·三奖': {
        const react = 2500;
        st.pose = t < react ? 'hope' : { '揭晓·大奖': 'cheer', '揭晓·二奖': 'clap', '揭晓·三奖': 'nod' }[name];
        if (t < react) { st.sprite = 'sLook'; st.sp = ['home', 1.5 * Math.sin(t / 30), 0]; }
        else if (name === '揭晓·大奖') { hop(react, 14); st.fx.push(['confetti', react]); this.toss(st, t, react); }
        else if (name === '揭晓·二奖') { st.sprite = 'sHappy'; st.sp = ['home', 0, -8 * Math.abs(Math.sin(Math.PI * (t - react) / 440))]; st.fx.push(['sparkles', react]); }
        else st.sprite = 'nod';
        say(react); break;
      }
      // she bows her thanks with the sprite, straightens up and waves goodbye while it waves its flag
      case '抽奖结束': st.pose = at(t, [[0, 'bow'], [1200, 'idle'], [1450, 'wave']]); st.sprite = t < 1200 ? 'nod' : 'flag'; say(150); break;
      case '没人报名': st.pose = 'dejected'; st.sprite = 'pat'; st.sp = 'head'; say(200); break;
      case '日常': return this.daily(t, st, opts);
    }
    const extra = EVENT_FX[name];
    if (extra) { st.fx.push(...extra.fx); st.shake = extra.shake; }
    return st;
  }

  daily(t, st, o) {
    if (SPORTS[o.kind]) return this.sport(t, st, o);
    // humming: the sprite sways along; when her voice cracks it hides its head
    const main = DAILY[o.kind][0];
    st._t = t;
    const say = (from, key) => { if (t >= from) st.bubble = { text: LINES[key][(o.seed || 0) % LINES[key].length], t: t - from }; };
    if (t < main) { st.pose = 'hum'; st.fx.push(['notes', 0]); st.sprite = 'sHappy'; st.sp = ['home', 6 * Math.sin(2 * Math.PI * t / 1280), 0]; say(200, o.kind); return st; }
    st.pose = 'crack'; st.sprite = 'hide'; st.fx.push(['brokenNote', main], ['shock', main], ['sweat', main + 300]); say(main, '破音');
    return st;
  }

  // A sport (SPORTS): the sprite joins in (cheers her lifts with its flag, leads her hike, flies beside her bike or skis); if
  // it goes wrong it starts, then rubs her foot or pats her head, and nods along while she puts a plaster on bare skin.
  sport(t, st, o) {
    st._t = t;
    const sp = SPORTS[o.kind], go = 1100, stop = go + sp.act[1], end = stop + (o.mishap ? sp.fallMs : sp.calmMs) + 900, back = end - 900;
    const say = (from, key) => { if (t >= from) st.bubble = { text: LINES[key][(o.seed || 0) % LINES[key].length], t: t - from }; };
    const lead = o.kind === '爬山' ? ['at', 70, FOOT.y - 0.62 * H + 5 * Math.sin(t / 300)] : ['rel', -0.22, 0.3];
    st.fx.push(['flash', 700, 0.8], ['flash', back + 700, 0.8]);
    if (o.kind === '滑雪') st.fx.push(['snow', 0, end]);
    if (t < 700) { this.dress(st, t, 0, 700); return st; }
    if (t >= back + 700) { st.sprite = 'sHappy'; return st; }
    if (t < go) { st.pose = sp.ready; st.sprite = 'sHappy'; }
    else if (t < stop) {
      const u = t - go;
      st.pose = sp.act[0];
      if (o.kind === '举哑铃') { st.sprite = 'flag'; st.sp = ['home', 0, -6 * Math.abs(Math.sin(Math.PI * u / 400))]; st.fx.push(['sweat', go + 300, 800]); }
      if (o.kind === '爬山') { st.sprite = 'flag'; st.sp = lead; st.fx.push(['sweat', go + 800, 1600]); for (let k = 0; k * 340 < sp.act[1]; k++) st.fx.push(['dust', go + k * 340, null, 2]); }
      if (o.kind === '骑车') {
        st.y -= 2 * Math.abs(Math.sin(Math.PI * u / 220)); st.x += 14 * Math.sin(u / 900); st.sView = 'v2'; st.sp = lead;
        st.fx.push(['speed', go, sp.act[1] - 400]); for (let k = 0; k * 440 < sp.act[1]; k++) st.fx.push(['dust', go + k * 440, [0.78, 0.97], 2]);
      }
      if (o.kind === '滑雪') { st.x += 10 * Math.sin(u / 700); st.sView = 'v2'; st.sp = lead; st.fx.push(['speed', go, sp.act[1] - 200], ['spray', go, sp.act[1]]); }
    } else if (!o.mishap) { st.pose = at(t - stop, sp.calm); st.sprite = 'sHappy'; }
    else {
      const u = t - stop, hit = stop + (o.kind === '举哑铃' ? 60 : 150);
      st.pose = at(u, sp.fall);
      if (u < 450) { st.sprite = 'surprised'; st.sp = o.kind === '举哑铃' ? null : lead; }
      else if (o.kind === '举哑铃') { st.sprite = u < 2800 ? 'pat' : 'sHappy'; st.sp = u < 2800 ? ['rel', 0.3, 0.8] : null; }
      else if (sp.lines[1] && u >= sp.lines[1][0]) { st.sprite = sp.plaster ? 'nod' : 'sHappy'; st.sp = ['rel', -0.06, 0.5]; }
      else { st.sprite = 'pat'; st.sp = 'head'; }
      if (o.kind === '举哑铃') st.fx.push(['impact', hit, [0.62, 0.95]], ['tears', stop + 200, 2600]);
      else if (o.kind === '滑雪') st.fx.push(['snowBurst', hit], ['impact', hit, [0.45, 0.85]], ['dizzy', stop + 1100, 1000], ['snowShake', stop + 2200, 1000]);
      else st.fx.push(['impact', hit, sp.hitAt || [0.45, 0.9]], ['dust', hit, null, 6], ['dizzy', stop + 250, 1200, o.kind === '骑车' ? [0.25, 0.1] : null]);
      if (sp.plaster) st.fx.push(['spark', stop + sp.plaster + 1700, ...sp.plasterAt, 6]);
      st.shake = [[hit, o.kind === '举哑铃' ? 2 : 3, 240]];
    }
    if (t >= back) this.dress(st, t, back, back + 700);
    if (o.mishap && t >= stop) for (const [ms, key] of sp.lines) say(stop + ms, key);
    else say(1300, o.kind);
    return st;
  }

  // The ship sails in while the sprite dresses her as governor; she jumps aboard, the sprite flies up to the rear mast (the
  // middle one is under her bubble), and before the ship sails away she jumps back down, waves it off and is dressed back.
  // The governor (SS, README 3): the page edges glow gold, a sea of gold clouds rolls in and the flagship sails up to us out
  // of the distance while the sprite dresses her; it flies up to plant its flag on the mainmast; a stair of light takes her up onto the bow,
  // where she points ahead: the emblem rises in front of the sails, three fireworks go up, gold rains over the page; she
  // waves, comes back down the stair, and the ship sails off into the distance leaving a gold wake.
  governor(t, st, say) {
    const come = ease(k01(t, 1500, 4000)), go = ease(k01(t, 12000, 14000)), far = { x: 380, y: 170 }, gone = { x: 60, y: 90 };
    const deck = t < 12000 ? { x: far.x + (SHIP_DECK.x - far.x) * come, y: far.y + (SHIP_DECK.y - far.y) * come + 3 * Math.sin(t / 500) }
      : { x: SHIP_DECK.x + (gone.x - SHIP_DECK.x) * go, y: SHIP_DECK.y + (gone.y - SHIP_DECK.y) * go };
    const s = (0.3 + 0.7 * come) * (1 - 0.8 * go);
    st.ship = { x: deck.x, y: deck.y, s, a: k01(t, 1500, 1900) * (1 - k01(t, 13300, 14000)) };
    const mast = this.shipPoint(st.ship, PROPS.flagship.mast);
    // up the stair in three hops, and down again
    const climb = (a, b, from, to) => { const w = k01(t, a, b), hopN = Math.floor(w * 3), u = w * 3 - hopN; return { x: from.x + (to.x - from.x) * w, y: from.y + (to.y - from.y) * w - 40 * Math.sin(Math.PI * Math.min(1, u)) }; };
    if (t >= 5500 && t < 6500) Object.assign(st, climb(5500, 6500, FOOT, deck));
    else if (t >= 6500 && t < 11400) { st.x = deck.x; st.y = deck.y; }
    else if (t >= 11400 && t < 12000) Object.assign(st, climb(11400, 12000, deck, FOOT));
    // the sprite dresses her while the ship comes in, then flies ahead up to the mainmast with its flag before she
    // climbs aboard, and flies back down to her when she jumps off
    if (t < 2900) { st.pose = 'surprised'; st.sprite = 'surprised'; st.sp = ['rel', -0.1, 0.42]; }
    else if (t < 3900) { st.pose = 'surprised'; this.dress(st, t, 2900, 3900); }
    else if (t < 14000) {
      st.pose = t < 5500 ? 'govPoint' : t < 6500 || t >= 11400 && t < 12000 ? 'govJump' : t < 9600 ? 'govPoint' : 'govWave';
      st.sprite = 'flag';
      st.sp = t < 11400 ? ['mast', mast.x, mast.y] : ['rel', -0.1, 0.42];
    } else if (t < 14800) { st.pose = 'govWave'; this.dress(st, t, 14000, 14800); }
    else st.sprite = 'sHappy';
    if (t >= 6600 && t < 12000) st.emblem = { x: 355, y: 150 - 40 * ease(k01(t, 6600, 7400)), s: 0.8 * ease(k01(t, 6600, 7200)), a: k01(t, 6600, 6900) * (1 - k01(t, 11400, 12000)) };
    st.fx.push(['edgeGlow', 0, 15000], ['bang', 200], ['shock', 200], ['cloudSea', 1500, 13000, SHIP_DECK.y + 160], ['gulls', 2400], ['flash', 3900, 1],
      ['lightStairs', 5300, 1400, FOOT, deck], ['pillar', 6600, 3000], ['rays', 6600, 4800, 0.6, { x: 355, y: 110 }], ['burst', 6600, 300],
      ['skyFireworks', 6800, [[0, 70, 90, '#FFD45E'], [600, 240, 46, '#FF9AB5'], [1200, 420, 100, '#9CCFFF'], [6000, 380, 80, '#FFD45E'], [6500, 440, 170, '#FFE9A8']]],
      ['lightStairs', 11200, 1000, FOOT, deck], ['wake', 12000, 3000, [{ x: 440, y: 560 }, { x: 250, y: 330 }, { x: 70, y: 100 }]], ['flash', 14800, 0.8]);
    if (t >= 6800 && t < 12000) st.fx.push(['goldConfetti', 6800]);
    st.shake = [[4000, 3, 300], [6600, 4, 320]];
    say(1700);
    return st;
  }

  // The admiral (A, README 3): dressed by the sprite, she raises her spyglass to the left, where her ship appears far off;
  // the sprite flies out to meet it and rides in on its mainmast while it sails up to stop behind her; she lowers the glass
  // and salutes, and the ship answers: it dresses its flags from bow to stern and glows; then it sails off to the right,
  // the sprite flies back down to her and dresses her back.
  admiral(t, st, say) {
    // It is drawn side on, so it only ever moves along its heading: in from beyond the left edge, slowing to a stop behind
    // her (running on a little and settling back, its bow dipping), rocking on the waves, then gathering way out to the
    // right with its bow lifting. (It used to slide in down a slant while growing, which a ship seen side on cannot do.)
    const a = ADM_SHIP, w = this.props.admship.width * H / ANCHOR * a.s, from = -w / 2 - 30, to = PAGE.w + w / 2 + 30;
    const xAt = u => from + (a.x - from) * (1 - (1 - k01(u, 1100, 3400)) ** 3) + 10 * Math.sin(Math.PI * k01(u, 3400, 4300)) + (to - a.x) * k01(u, 6000, 7600) ** 2;
    const speed = Math.min(1, Math.abs(xAt(t + 20) - xAt(t - 20)) / 40 / 0.45);  // 1 at full way
    const ship = { x: xAt(t), y: a.y + 4 * Math.sin(t / 450), s: a.s, a: t >= 1100 && t < 7700 ? 1 : 0, speed,
      rot: 0.015 * Math.sin(t / 650) + 0.035 * Math.sin(Math.PI * k01(t, 3300, 4300)) - 0.03 * Math.sin(Math.PI * k01(t, 6000, 6800)),
      flags: ease(k01(t, 3600, 4300)), glow: bump(t, 3500, 5600) };
    st.admShip = ship;
    const mast = this.admPoint(ship, a.mast);
    if (t < 700) this.dress(st, t, 0, 700);
    else if (t < 7200) {
      st.pose = t < 3500 ? 'spyglass' : 'admSalute';
      st.sprite = t >= 2300 && t < 6200 ? 'flag' : 'sailor';
      st.sp = t >= 1500 && t < 6200 ? ['at', mast.x, mast.y - 4] : ['rel', -0.1, 0.42];
    } else if (t < 7900) { st.pose = 'admSalute'; this.dress(st, t, 7200, 7900); }
    else { st.pose = 'idle'; st.sprite = 'sHappy'; }
    st.fx.push(['flash', 700, 1], ['seaBubbles', 700], ['gulls', 1600], ['flash', 7900, 0.8]);
    say(1000);
    return st;
  }

  // Where a point of the admiral's ship (prop px) is on the page, the ship's bottom centre at s.x, s.y, rocked by s.rot.
  admPoint(s, pt) {
    const im = this.props.admship, k = H / ANCHOR * s.s, dx = (pt[0] - im.width / 2) * k, dy = -(im.height - pt[1]) * k, c = Math.cos(s.rot || 0), n = Math.sin(s.rot || 0);
    return { x: s.x + dx * c - dy * n, y: s.y + dx * n + dy * c };
  }

  // Where a point of the flagship's picture (prop px) is on the page, the ship's deck at st.ship.x, .y.
  shipPoint(sh, pt) { const k = H / ANCHOR * sh.s, d = PROPS.flagship.deck; return { x: sh.x + (pt[0] - d[0]) * k, y: sh.y + (pt[1] - d[1]) * k }; }

  // The big gift (A): a beam from the top of the page lands at her right; the box comes down it under a bunch of balloons,
  // lands, the balloons float away; the lid flies off, a beam and a fountain of stars and hearts go up to the top; she cheers,
  // and the box shrinks into a star that flies into her arms.
  bigGift(t, st, say) {
    const land = { x: FOOT.x + 150, y: FOOT.y }, fall = 1 - (1 - k01(t, 800, 2800)) ** 2;
    const y = -20 + (land.y + 20) * fall, x = land.x + 14 * Math.sin(t / 260) * (1 - fall);
    const into = ease(k01(t, 5300, 5900)), chest = { x: FOOT.x - 10, y: FOOT.y - 0.45 * H };
    st.gift = { x: x + (chest.x - x) * into, y: y + (chest.y - y) * into, s: 1 - into, open: t >= 3400, lid: t >= 3400 ? t - 3400 : null,
      balloons: t < 3600 ? { rise: Math.max(0, t - 2800), a: 1 - k01(t, 3200, 3600) } : null };
    st.pose = at(t, [[0, 'idle'], [2800, 'surprised'], [4400, 'cheer']]);
    const hop = (a, h) => { st.y -= h * bump(t, a, a + 320); }; hop(4400, 14);
    if (t < 4400) { st.sprite = t < 2800 ? 'sLook' : 'surprised'; st.sp = ['rel', -0.1, 0.42]; } else this.toss(st, t, 4400);
    say(2900);
    return st;
  }

  // Tossed up by her cheer: over her head for a moment, then circling her.
  toss(st, t, a) { st.sprite = 'sHappy'; if (t < a + 350) st.sp = ['rel', 0.5, -0.28]; else st.orbit = t - a - 350; }

  // The sprite dresses her up (or back): it spirals up round her glowing, leaving a trail, and the caller flashes at b.
  dress(st, t, a, b) {
    st.sprite = 'glow'; st.orbit = 1000 / 1.2 + (t - a) * 2.2; st.orbitR = 90;  // from her left, where it waits st.orbitY = FOOT.y - (0.1 + 0.85 * ease(k01(t, a, b))) * H;
    st.fx.push(['trail', a]);
  }

  // The sprite turns into the castle behind her; she twirls into the princess gown, curtsies, walks up to the gate and
  // waves from it, then runs back down the steps to us while the castle shrinks back into the sprite at its spot, and the
  // sprite circles her to dress her back.
  castleShow(t, st, say) {
    const b = this.castle.box, cs = 340 / b.h, home = this.home(0);
    const rise = ease(k01(t, 900, 1600)), back = ease(k01(t, 9600, 10400)), top = 420 - 230 * rise;
    const cx = PAGE.w / 2 + (home.x - PAGE.w / 2) * back, cy = top + (home.y - top) * back;
    st.castle = { x: cx, y: cy, s: cs * (0.6 + 0.4 * rise) * (1 - 0.75 * back), a: k01(t, 900, 1500) * (1 - k01(t, 10000, 10400)),
      open: t < 9000 ? (t >= 7500 ? k01(t, 7500, 7800) : 0) : 1 - k01(t, 9000, 9300) };
    const gate = { x: PAGE.w / 2 + (this.castle.closed.width * 0.503 - this.castle.closed.width / 2) * cs, y: top + (this.castle.closed.height * 0.676 - this.castle.closed.height / 2) * cs };
    if (t < 1500) { st.sprite = 'glow'; st.sBehind = true; st.sp = ['to-castle', ease(k01(t, 0, 1200)), 1 + 1.6 * k01(t, 300, 1500)]; st.sAlpha = 1 - k01(t, 900, 1500); }
    else if (t < 9600) st.sp = ['gone'];
    else if (t < 10500) { st.sprite = 'sHappy'; st.sp = ['at', cx, cy]; st.sAlpha = k01(t, 10000, 10400); st.sScale = 1.6 - 0.6 * k01(t, 10000, 10500); }
    else if (t < 11200) this.dress(st, t, 10500, 11200);
    else st.sprite = 'sHappy';
    if (t < 2200) { st.pose = 'idle'; st.sx = t < 1500 ? 1 : Math.cos((t - 1500) / 90); }
    else if (t < 3000) st.pose = 'spin';
    else if (t < 4500) st.pose = 'curtsy';
    else if (t < 7500) { st.pose = 'walkA'; const w = k01(t, 4500, 7500); st.x = FOOT.x + (gate.x - FOOT.x) * w; st.y = FOOT.y + (gate.y - FOOT.y) * w; st.s = 1 - 0.68 * w; }
    else if (t < 9000) { st.pose = 'lookBack'; st.x = gate.x; st.y = gate.y; st.s = 0.32; }
    else if (t < 9800) {
      // three bounding steps down to us, growing as she comes closer
      const w = ease(k01(t, 9000, 9800));
      st.pose = 'pIdle'; st.x = gate.x + (FOOT.x - gate.x) * w; st.y = gate.y + (FOOT.y - gate.y) * w - 26 * Math.abs(Math.sin(Math.PI * 3 * w)); st.s = 0.32 + 0.68 * w;
    } else st.pose = t < 11200 ? 'pIdle' : 'idle';
    st.fx.push(['rainbowSparkles', 900], ['flash', 2200, 1.2], ['gateGlow', 7500, gate], ['flash', 11200, 1]);
    if (t >= 3000 && t < 4500) say(3000);
    if (t >= 7600 && t < 9000) st.bubble = { text: this.cur?.gateLine || '欢迎来到我的城堡～', t: t - 7600, at: gate };
    return st;
  }

  // ---- scenes: fixed loops that can be frozen for screenshots ---------------------------------------------------------
  sceneState(now) {
    const scene = this.cfg.scene, name = this.cfg.name;
    const ev = (n, t, opts = {}) => this.eventState(n, t, opts, this.fill(LINES[n]?.[0], n));
    if (scene === '平时') {
      const plan = [[2000, '举哑铃', true], [11500, '哼歌', false], [16000, '爬山', true], [27000, '骑车', false], [33500, '滑雪', true]];
      const t = now % 43000;
      for (const [s, kind, mishap] of plan) {
        const dur = DAILY[kind][0] + (mishap ? DAILY[kind][1] : 0);
        if (t >= s && t < s + dur) return this.daily(t - s, this.base(), { kind, mishap, seed: 0 });
      }
      return this.idleState(now, '平静');
    }
    if (scene === '心情') {
      const t = now % 58000, moods = ['平静', '无聊', '沮丧', '犯困'];
      if (t < 48000) { const m = moods[Math.floor(t / 12000)], st = this.idleState(now, m, 15000 + t % 12000); st.label = `心情：${m}`; return st; }
      const u = t - 48000, st = u < 1000 ? this.base() : ev('大礼物', u - 1000);
      if (u < 1000) { st.pose = 'awake'; st.sprite = 'surprised'; st.fx.push(['bang', now - u], ['shock', now - u]); st.y -= 10 * bump(u, 0, 300); st.bubble = { text: LINES.冷场后来了人[0], t: u }; }
      st.label = '冷场后来了人：惊醒，再演大礼物'; return st;
    }
    const seqs = {
      报名抽奖: [['报名开场', 2600], ['hold', 2500, '报名中'], ['报名截止', 2000], ['hold', 2500, '等待'], ['揭晓·三奖', 4600], ['揭晓·二奖', 4600], ['揭晓·大奖', 5200], ['抽奖结束', 2600]],
      奖池抽奖: [['奖池开场', 2600], ['奖池点名', 2000], ['奖池转动', 2000], ['揭晓·大奖', 5200], ['抽奖结束', 2600]],
      '大礼物+新第一': [['大礼物', 6000], ['新的第一名', 2600]]
    };
    const seq = seqs[scene] || [[scene, EVENTS[scene]?.dur || 3000]];
    const total = seq.reduce((a, s) => a + s[1], 0) + 2500, t = now % total;
    let acc = 1000;
    if (t < acc) return this.idleState(now, '平静');
    for (const [n, d, phase] of seq) {
      if (t < acc + d) {
        if (n === 'hold') { const st = this.base(); if (phase === '等待') st.pose = 'hope'; this.talk(st, phase === '等待' ? '等开奖' : '报名中', t - acc); return st; }
        const st = ev(n, t - acc);
        if (n === '城堡' && st.bubble?.at) st.bubble.text = this.fill(LINES['城堡·门口'][0]);
        return st;
      }
      acc += d;
    }
    return this.idleState(now, '平静');
  }

  fill(text, name) {
    if (!text) return text;
    let nick = this.cfg.name;
    if ([...nick].length > NAME_MAX) nick = [...nick].slice(0, NAME_MAX - 1).join('') + '…';
    return text.replaceAll('{昵称}', nick).replaceAll('{礼物}', GIFT[name] || '小花花').replaceAll('{个数}', '3')
      .replaceAll('{关键字}', '抽奖').replaceAll('{奖项}', '一等奖').replaceAll('{奖品}', '定制周边');
  }

  // ---- drawing -----------------------------------------------------------------------------------------------------
  frame() {
    const canvas = document.getElementById('dp-cv'), root = document.getElementById('dp-root');
    if (!canvas || !this.cfg) return;
    if (!this.ready) { if (!this.booting) this.boot(); return; }
    if (root !== this.root || this.cfg !== this.boundCfg) {
      this.root = root; this.boundCfg = this.cfg;
      for (const a of root.getAnimations()) a.cancel();
      this.master = root.animate([{ outlineColor: 'transparent' }, { outlineColor: 'transparent' }], { duration: 1e9 });
      this.reset(); this.sv = this.hv = this.sc = null;
    }
    const now = this.clock = this.now();
    let st;
    if (this.cfg.scene === '手动' || this.cfg.scene === '演示') {
      if (this.cfg.scene === '演示') this.demo(now);
      this.update(now);
      const c = this.cur;
      if (c && now < c.start + c.pre) { st = this.base(); st.pose = 'awake'; st.sprite = 'surprised'; st.fx.push(['bang', c.start], ['shock', c.start], ['sweat', c.start + 200]); st.y -= 10 * bump(now - c.start, 0, 300); st.bubble = { text: this.fill(c.wakeLine), t: now - c.start }; }
      else if (c) { st = this.eventState(c.name, now - c.start - c.pre, { ...c.opts, seed: Math.floor(c.start) }, this.fill(c.line, c.name)); if (c.name === '城堡' && st.bubble?.at) st.bubble.text = this.fill(c.gateLine || (c.gateLine = this.pick('城堡·门口'))); }
      else {
        const mood = this.mood(now), key = mood + (this.lot?.phase || '');
        if (this.seen?.key !== key) this.seen = { key, at: now };
        st = this.idleState(now, mood, now - this.seen.at);
      }
    } else st = this.sceneState(now);
    this.draw(canvas.getContext('2d'), st, now);
  }

  demo(now) {
    const t = now % 30000, last = this.lastDemo ?? -1;
    this.lastDemo = t;
    const cross = s => last < s && t >= s || (t < last && s <= t);
    if (cross(3000)) this.fire('进场');
    if (cross(7000)) this.fire('普通礼物');
    if (cross(11000)) this.fire('大礼物', { top: true });
  }

  draw(g, st, now) {
    const env = this.cfg.env, small = env === '小页面', ps = small ? 0.75 : 1;
    const pw = PAGE.w * ps, ph = PAGE.h * ps, px = env === '左下角' ? 40 : 1920 - pw - 40, py = 1080 - ph - 20;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, 1920, 1080);
    if (this.cfg.room === '明亮画面') { const r = Math.max(1920 / this.day.width, 1080 / this.day.height); g.drawImage(this.day, 0, 0, this.day.width * r, this.day.height * r); }
    else if (this.cfg.room === '深色房间') { const gr = g.createLinearGradient(0, 0, 0, 1080); gr.addColorStop(0, '#2b3048'); gr.addColorStop(1, '#151826'); g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080); }
    else { for (let y = 0; y < 1080; y += 40) for (let x = 0; x < 1920; x += 40) { g.fillStyle = (x + y) / 40 % 2 ? '#9a9a9a' : '#b4b4b4'; g.fillRect(x, y, 40, 40); } }
    g.save(); g.setLineDash([10, 8]); g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 2; g.strokeRect(px, py, pw, ph); g.restore();
    g.save(); g.translate(px, py); g.scale(ps, ps);
    g.beginPath(); g.rect(0, 0, PAGE.w, PAGE.h); g.clip();
    const shake = this.shakeOf(st, now); g.translate(shake.x, shake.y);
    if (st.castle) this.drawCastle(g, st.castle);
    if (st.ship) this.drawShip(g, st.ship);
    if (st.admShip) this.drawAdmShip(g, st.admShip);
    if (st.emblem) this.drawProp(g, this.props.emblem, st.emblem.x, st.emblem.y + this.props.emblem.height * H / ANCHOR * st.emblem.s / 2, st.emblem.s, st.emblem.a);
    const rt = performance.now(), dt = Math.min(100, rt - (this.rt ?? rt)) * this.cfg.speed;
    this.rt = rt;
    const her = this.herBox(st);
    const target = this.spritePos(st, her, now), sp = target && this.follow(target, dt, st);
    if (sp) { this.trail = (this.trail || []).filter(q => rt - q.rt < 420); if (st.sprite === 'glow') this.trail.push({ x: sp.x, y: sp.y, rt }); }
    for (const f of st.fx) if (BACK.has(f[0])) this.drawFx(g, f, st, her, now);
    if (sp && st.sBehind) this.drawSprite(g, st, sp, now);
    if (!st.hide) this.drawHer(g, st, now);
    if (sp && !st.sBehind) this.drawSprite(g, st, sp, now);
    if (st.gift) this.drawGift(g, st.gift);
    for (const f of st.fx) if (!BACK.has(f[0])) this.drawFx(g, f, st, her, now);
    if (st.bubble?.text) this.drawBubble(g, st.bubble, her);
    g.restore();
    if (this.cfg.caption) this.drawCaption(g, st, now, px, py);
  }

  cell(name, set = POSE) {
    const f = set === POSE && this.strips?.[name];
    if (f) {
      const s = STRIP[name];
      if (s.ms) return f[Math.floor(this.clock / s.ms) % 4];
      const steps = s.loop || s.once, total = steps.reduce((a, [, ms]) => a + ms, 0);
      let t = s.loop ? this.clock % total : this.clock - (this.hv?.pose === name ? this.hv.since : this.clock);
      for (const [i, ms] of steps) { if (t < ms || !ms) return f[i]; t -= ms; }
      return f[steps.at(-1)[0]];
    }
    const [k, i] = set[name] || [name, 0]; return this.cells[k][i];
  }

  herBox(st, c = this.cell(st.pose)) {
    const k = H / c.ruler * st.s;
    return { x: st.x + (c.x - c.cx) * k, y: st.y + (c.y - c.ground) * k, w: c.w * k, h: c.h * k, k };
  }

  // In-between frames from pose a to pose b: their own strip; else [] where she simply switches (CUT, that direction);
  // else the other way's strip played backwards; null where there are none.
  hop(a, b) {
    const there = this.tweens[`${a}>${b}`], back = this.tweens[`${b}>${a}`];
    return there || (CUT.has(`${a}>${b}`) ? [] : null) || (back && [...back].reverse()) || null;
  }

  // An event can start, or take over a lesser one, whatever she is doing (humming, sitting bored, lying by her bike),
  // and most of those pairs have no in-betweens of their own. So she goes the shortest way through poses that have them
  // (at most five steps; standing is tried first, so it is the usual way through, and a movement played forwards before
  // one played backwards, so after a fall she gets up rather than the fall running back), playing their frames one
  // after another; null where there is no way (then the new pose just comes in).
  route(a, b) {
    const memo = this.routes ??= {}, key = `${a}>${b}`;
    if (key in memo) return memo[key];
    const from = { [a]: null }, forwards = (p, n) => this.tweens[`${p}>${n}`] || CUT.has(`${p}>${n}`);
    let ring = [a];
    for (let depth = 0; depth < 5 && ring.length && !(b in from); depth++) {
      const next = [];
      for (const back of [false, true]) for (const p of ring) for (const n of Object.keys(POSE)) {
        if (!(n in from) && this.hop(p, n) && !forwards(p, n) === back) { from[n] = p; next.push(n); }
      }
      ring = next;
    }
    if (!(b in from)) return memo[key] = null;
    const path = [b];
    while (path[0] !== a) path.unshift(from[path[0]]);
    return memo[key] = path.slice(1).flatMap((m, i) => this.hop(path[i], m));
  }

  // A pose change is one movement, not a cut: she moves through in-between frames, the pair's own or a way through
  // others (route); where she simply switches (CUT) or there is no way at all, the new pose just comes in.
  drawHer(g, st, now) {
    const rt = performance.now(), el = t0 => (rt - t0) * this.cfg.speed;
    const hv = this.hv ??= { pose: st.pose, at: -1e9, since: this.clock, tween: null };
    if (st.pose !== hv.pose) Object.assign(hv, { tween: this.route(hv.pose, st.pose), pose: st.pose, at: rt, since: this.clock });
    // she breathes in every pose, in-between frames too (breathing that stopped when she left her idle pose made her head
    // jump up to 3 px at the change): her drawing scaled at her feet, a touch taller and narrower, then shorter and wider
    const s = 1 + 0.012 * Math.sin(now / 600), c = hv.tween?.[Math.floor(el(hv.at) / 90)] || this.cell(hv.pose), b = this.herBox(st, c);
    g.save(); g.translate(st.x, st.y); g.scale(st.sx / Math.sqrt(s), s); g.translate(-st.x, -st.y);
    g.drawImage(c.im, c.x, c.y, c.w, c.h, b.x, b.y, b.w, b.h); g.restore();
  }

  // The sprite flies to where it is wanted instead of jumping there; its speed decides which way it faces.
  follow(target, dt, st) {
    const sv = this.sv;
    if (!sv) { this.sv = { ...target, vx: 0, vy: 0, d: 0 }; return this.sv; }
    const k = 1 - Math.exp(-dt / (st.orbit != null ? 90 : 200)), sec = Math.max(dt, 1) / 1000;
    let nx = sv.x + (target.x - sv.x) * k, ny = sv.y + (target.y - sv.y) * k;
    // no faster than SPRITE_SPEED px/ms: a long way (her shoulder up to a masthead and back) is flown, never jumped
    const step = Math.hypot(nx - sv.x, ny - sv.y), most = SPRITE_SPEED * (st.orbit != null ? 2 : 1) * Math.max(dt, 1);
    if (step > most) { nx = sv.x + (nx - sv.x) * most / step; ny = sv.y + (ny - sv.y) * most / step; }
    sv.vx += ((nx - sv.x) / sec - sv.vx) * 0.3; sv.vy += ((ny - sv.y) / sec - sv.vy) * 0.3;
    sv.x = nx; sv.y = ny; sv.scale = target.scale; sv.d = Math.hypot(target.x - nx, target.y - ny);
    return sv;
  }

  // Low in front of her (README 1.1), on her left: a little outside her standing outline, so it overlaps her hair.
  home(now) { return { x: FOOT.x + this.herLeft - SPRITE_H * 0.22, y: FOOT.y - 0.3 * H + 4 * Math.sin(now / 700) }; }

  // st.sp: null (home), ['home', dx, dy] (home moved by), ['rel', fx, fy] (a point of her drawing's box, as fractions of
  // it), ['at', x, y] (a page point), or the named spots below.
  spritePos(st, her, now) {
    if (st.sp?.[0] === 'gone') return null;
    const home = this.home(now);
    const head = { x: her.x + her.w * 0.3, y: her.y - SPRITE_H * 0.15 };
    // Circling her waist: on the far half of the circle it passes behind her, so it never covers her face.
    // It is a little bigger on the near half, and drawSprite turns it by st.orbitA.
    if (st.orbit != null) {
      const a = st.orbitA = st.orbit / 1000 * Math.PI * 1.2; st.sBehind = Math.sin(a) < 0;
      return { x: st.x + Math.cos(a) * (st.orbitR || 135), y: (st.orbitY ?? FOOT.y - 0.34 * H) + Math.sin(a) * 26, scale: 1 + 0.1 * Math.sin(a) };
    }
    if (!st.sp) return home;
    if (st.sp[0] === 'home') return { x: home.x + st.sp[1], y: home.y + st.sp[2] };
    if (st.sp[0] === 'rel') return { x: her.x + her.w * st.sp[1], y: her.y + her.h * st.sp[2] };
    if (st.sp[0] === 'at') return { x: st.sp[1], y: st.sp[2] };
    if (st.sp === 'head') return { x: her.x + her.w * 0.25, y: her.y - SPRITE_H * 0.2 + 3 * Math.sin(now / 500) };
    if (st.sp === 'knee') return { x: her.x + her.w * 0.94, y: FOOT.y - 42 + 2 * Math.sin(now / 900) };
    if (st.sp[0] === 'crown') { const top = { x: FOOT.x, y: her.y - SPRITE_H * 0.55 }; const p = st.sp[1], d = st.sp[2]; return { x: home.x + (top.x - home.x) * p, y: home.y + (top.y - home.y) * p + 26 * d }; }
    if (st.sp[0] === 'home-from-top') { const top = { x: FOOT.x, y: her.y - SPRITE_H * 0.55 }; const p = st.sp[1]; return { x: top.x + (home.x - top.x) * p, y: top.y + (home.y - top.y) * p }; }
    if (st.sp[0] === 'to-castle') { const p = st.sp[1]; return { x: home.x + (FOOT.x - home.x) * p, y: home.y + (300 - home.y) * p, scale: st.sp[2] }; }
    if (st.sp[0] === 'mast') return { x: st.sp[1], y: st.sp[2] };
    if (st.sp[0] === 'scout') { const far = { x: 64, y: her.y + 6 + 5 * Math.sin(now / 260) }, p = st.sp[1]; return { x: home.x + (far.x - home.x) * p, y: home.y + (far.y - home.y) * p }; }
    return home;
  }

  // The sprite turns the way it goes. Going round her (anticlockwise seen from above) it faces front, three-quarter, side and
  // back in turn; flying somewhere it shows its side or three-quarter, leaning in, and does its action (patting, sleeping,
  // the flag...) only once it has arrived, landing into it with a squash. The views face left and are mirrored for right.
  drawSprite(g, st, p, now) {
    let key = st.sprite, flip = !!st.sFlip, tilt = 0;
    if (st.sView) key = st.sView;
    else if (st.orbit != null) {
      const hx = -Math.sin(st.orbitA), d = Math.abs(Math.atan2(hx, Math.cos(st.orbitA)));
      key = d < Math.PI / 8 ? key : d < 3 * Math.PI / 8 ? 'v1' : d < 5 * Math.PI / 8 ? 'v2' : 'v3'; flip = key[0] === 'v' && hx > 0;
    } else if (p.d > 14 && !CARRY.has(key)) {
      key = Math.abs(p.vx) > 2 * Math.abs(p.vy) ? 'v2' : 'v1'; flip = p.vx > 0; tilt = clamp(p.vx / 2500, -0.18, 0.18);
    }
    const rt = performance.now(), id = key + (flip ? '<' : ''), sc = this.sc ??= { id, prev: null, at: -1e9, land: false };
    if (sc.id !== id) { sc.land = st.orbit == null && key[0] !== 'v'; sc.prev = sc.id; sc.id = id; sc.at = rt; }
    const u = (rt - sc.at) * this.cfg.speed, [out, inn] = sc.prev ? xfade(u) : [0, 1], q = k01(u, 0, 320);
    const land = sc.land ? 1 - 0.14 * Math.sin(2 * Math.PI * q) * (1 - q) : 1;

        for (let i = 0; i < 18; i++) { const u = r() * shown, pt = q(u), age = (t - u * 2000) / 1000; if (age < 0) continue; star(pt.x + 10 * Math.sin(i + age * 3), pt.y + age * 60, 5, i % 2 ? glow(1) : '#fff', fade * Math.max(0, 1 - age / 1.6)); }
        break;
      }
      // the castle's steps light up one by one under her as she walks up
      case 'stepGlow': {
        const dur = f[2] || 3000; if (t > dur + 600) break;
        const gate = st.castle && { x: st.castle.x, y: st.castle.y + this.castle.closed.height * st.castle.s * 0.18 };
        if (!gate) break;
        for (let i = 0; i < 8; i++) {
          const u = i / 8, x = FOOT.x + (gate.x - FOOT.x) * u, y = FOOT.y + (gate.y - FOOT.y) * u, on = k01(t, u * dur, u * dur + 200) * (1 - k01(t, dur, dur + 600));
          g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = on * 0.8; g.fillStyle = glow(0.9); g.beginPath(); g.ellipse(x, y, 30 * (1 - u * 0.6), 7 * (1 - u * 0.6), 0, 0, Math.PI * 2); g.fill(); g.restore();
        }
        break;
      }
      // pink stars twinkle up from the castle's tower tips while she waves from the gate
      case 'towerSparkles': {
        const dur = f[2] || 1600; if (t > dur || !st.castle) break;
        const c = st.castle, w = this.castle.closed.width * c.s, h = this.castle.closed.height * c.s;
        for (let i = 0; i < 14; i++) { const u = (t + i * 140) % 900, x = c.x + (r() - 0.5) * w * 0.7, y = c.y - h * 0.42 + r() * h * 0.25 - u * 0.05; star(x, y, 6 + r() * 5, i % 2 ? glow(1) : '#fff', Math.sin(Math.PI * u / 900)); }
        break;
      }
      // ---- things
      case 'anchors': {
        if (t > (f[2] || 2400)) break;
        for (let i = 0; i < 5; i++) {
          const u = (t + i * 420) % 2100, x = st.x + (r() - 0.5) * 240, y = st.y - 30 - u * 0.15;
          if (f[3] === 'hearts') { heart(x, y, 16, 0.85 * Math.sin(Math.PI * u / 2100)); continue; }
          g.save(); g.globalAlpha = 0.85 * Math.sin(Math.PI * u / 2100); g.translate(x, y); g.rotate(0.3 * Math.sin(u / 300)); g.strokeStyle = '#F4C542'; g.lineWidth = 2.5; g.lineCap = 'round';
          g.beginPath(); g.moveTo(0, -9); g.lineTo(0, 8); g.moveTo(-5, -5); g.lineTo(5, -5); g.moveTo(-8, 3); g.quadraticCurveTo(0, 13, 8, 3); g.stroke(); g.beginPath(); g.arc(0, -11, 2.5, 0, Math.PI * 2); g.stroke(); g.restore();
        }
        break;
      }
      case 'splash': {
        if (t > 700) break;
        g.save(); g.fillStyle = '#BFEAFF';
        for (let i = 0; i < 10; i++) { const vx = (r() - 0.5) * 0.5, vy = -0.35 - r() * 0.3; g.globalAlpha = 1 - t / 700; g.beginPath(); g.arc(st.x + vx * t, st.y - 6 + vy * t + 0.0011 * t * t, 3 + r() * 2.5, 0, Math.PI * 2); g.fill(); }
        g.restore(); break;
      }
      case 'coins': {
        if (t > 1300) break;
        const p = at(f[2], f[3]);
        for (let i = 0; i < 12; i++) {
          const vx = (r() - 0.5) * 0.45, vy = -0.5 - r() * 0.35, u = t - i * 25; if (u < 0) continue;
          const x = p.x + vx * u, y = p.y + vy * u + 0.0009 * u * u, a = 1 - k01(u, 900, 1300);
          if (i % 3) { g.save(); g.globalAlpha = a; g.fillStyle = '#FFD45E'; g.strokeStyle = '#D9A21E'; g.lineWidth = 2; g.beginPath(); g.ellipse(x, y, 6 * Math.abs(Math.cos(u / 90)) + 1, 6, 0, 0, Math.PI * 2); g.fill(); g.stroke(); g.restore(); }
          else star(x, y, 8, '#fff', a);
        }
        break;
      }
      case 'petals': {
        const dur = f[2] || 3000; if (t > dur) break;
        for (let i = 0; i < 16; i++) {
          const u = (t + r() * 3000) % 3000, x = r() * PAGE.w + 30 * Math.sin(u / 400 + i), y = -20 + u * 0.22;
          g.save(); g.globalAlpha = Math.min(1, (dur - t) / 400); g.translate(x, y); g.rotate(u / 300 + i); g.fillStyle = i % 3 ? '#FFB3C8' : '#FF8FAE'; g.beginPath(); g.ellipse(0, 0, 6, 3.5, 0, 0, Math.PI * 2); g.fill(); g.restore();
        }
        break;
      }
      case 'leaf': {
        if (t > 2400) break;
        const p = t / 2400, x = PAGE.w + 20 - (PAGE.w + 40) * p, y = st.y - 20 - 18 * Math.abs(Math.sin(p * Math.PI * 3));
        g.save(); g.translate(x, y); g.rotate(-p * 12); g.fillStyle = '#C49A5A'; g.strokeStyle = '#8A6A3A'; g.lineWidth = 1.5;
        g.beginPath(); g.ellipse(0, 0, 10, 5, 0, 0, Math.PI * 2); g.fill(); g.stroke(); g.beginPath(); g.moveTo(-10, 0); g.lineTo(10, 0); g.stroke(); g.restore(); break;
      }
      // ---- snow
      case 'snow': {
        const a = life(t, 500, (f[2] || 5000) - 1000, 500); if (!a) break;
        g.save(); g.fillStyle = '#fff';
        for (let i = 0; i < 40; i++) {
          const fall = 0.04 + r() * 0.05, x0 = r() * PAGE.w, y = (r() * PAGE.h + t * fall) % (PAGE.h + 20) - 10;
          g.globalAlpha = a * (0.5 + 0.5 * r()); g.beginPath(); g.arc(x0 + 12 * Math.sin(t / 700 + i), y, 1.5 + r() * 2.5, 0, Math.PI * 2); g.fill();
        }
        g.restore(); break;
      }
      case 'spray': {
        if (t > (f[2] || 3000)) break;
        g.save(); g.fillStyle = '#fff';
        for (let i = 0; i < 14; i++) {
          const u = (t + i * 70) % 600 / 600, x = her.x + her.w * 0.85 + u * 60 + (i % 4) * 4, y = st.y - 6 - 120 * u * (1 - u) * (0.6 + (i % 3) * 0.2);
          g.globalAlpha = 0.85 * (1 - u); g.beginPath(); g.arc(x, y, 2 + u * 4, 0, Math.PI * 2); g.fill();
        }
        g.restore(); break;
      }
      case 'snowBurst': {
        if (t > 800) break;
        const p = at(0.45, 0.8);
        g.save(); g.fillStyle = '#fff'; g.strokeStyle = '#D6E6F5'; g.lineWidth = 1.5;
        for (let i = 0; i < 12; i++) {
          const ang = Math.PI * (1.05 + i / 11 * 0.9), dd = 20 + 70 * ease(Math.min(1, t / 500));
          g.globalAlpha = 1 - k01(t, 400, 800); g.beginPath(); g.arc(p.x + Math.cos(ang) * dd, p.y + Math.sin(ang) * dd * 0.7, 8 + 6 * (i % 3), 0, Math.PI * 2); g.fill(); g.stroke();
        }
        g.restore(); break;
      }
      case 'snowShake': {
        if (t > (f[2] || 2000)) break;
        g.save(); g.fillStyle = '#fff';
        for (let i = 0; i < 10; i++) {
          const u = (t + i * 90) % 500, side = i % 2 ? 1 : -1, x = head.x + side * (her.w * 0.25 + u * 0.15), y = her.y + her.h * (0.15 + (i % 4) * 0.08) - u * 0.05 + 0.0005 * u * u;
          g.globalAlpha = 1 - u / 500; g.beginPath(); g.arc(x, y, 3 + i % 3, 0, Math.PI * 2); g.fill();
        }
        g.restore(); break;
      }
      case 'z': for (let i = 0; i < 3; i++) { const u = (now + i * 900) % 2700; g.save(); g.globalAlpha = Math.sin(Math.PI * u / 2700); g.fillStyle = '#C9D6FF'; g.font = `700 ${16 + i * 5}px sans-serif`; g.fillText('Z', her.x + her.w * 0.75 + u * 0.02, her.y + 10 - u * 0.035); g.restore(); } break;
    }
  }

  drawCaption(g, st, now, px, py) {
    const c = this.cur, mood = this.mood(now);
    const rows = [];
    if (['手动', '演示'].includes(this.cfg.scene)) {
      rows.push(c ? `演出：${c.name === '日常' ? '日常·' + c.opts.kind + (c.opts.mishap ? '（出事）' : '') : c.name}（${EVENTS[c.name].tier} 档）${((now - c.start) / 1000).toFixed(1)} / ${((c.pre + c.dur) / 1000).toFixed(1)} 秒` : '演出：没有');
      rows.push(`排队：${this.queue.map(q => q.name).join('、') || '空'}`);
      rows.push(`心情：${mood} · 距上次礼物 ${Math.floor((now - this.lastGift) / 60000)} 分 · 距上次事件 ${Math.floor((now - this.lastAny) / 60000)} 分`);
      if (this.lot) rows.push(`抽奖：${this.lot.kind} · ${this.lot.phase}`);
      for (const l of this.log) rows.push('· ' + l);
    } else rows.push(`画面：${this.cfg.scene}${st.label ? ' · ' + st.label : ''}`);
    g.save(); g.font = '500 20px "PingFang SC", sans-serif';
    const x = this.cfg.env === '左下角' ? 1920 - 640 : 40, y = 40;
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.beginPath(); g.roundRect(x - 14, y - 12, 620, rows.length * 30 + 20, 10); g.fill();
    g.fillStyle = '#fff'; g.textBaseline = 'top'; rows.forEach((r, i) => g.fillText(r, x, y + i * 30));
    g.fillStyle = 'rgba(255,255,255,0.85)'; g.font = '500 16px "PingFang SC", sans-serif'; g.fillText('虚线框是浏览器素材的范围（页面本身透明）', px, py - 26);
    g.restore();
  }

  buildControls() {
    const bar = document.body.appendChild(document.createElement('div'));
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:#16181Dee;font:13px "PingFang SC",sans-serif;color:#fff';
    const group = (label, items) => {
      const s = bar.appendChild(document.createElement('span')); s.textContent = label; s.style.cssText = 'opacity:.7;margin:0 4px 0 10px';
      for (const [text, fn] of items) {
        const b = bar.appendChild(document.createElement('button')); b.textContent = text;
        b.style.cssText = 'padding:5px 9px;border:0;border-radius:6px;background:#3358D4;color:#fff;cursor:pointer;font:inherit';
        b.onclick = () => { if (!['手动', '演示'].includes(this.cfg.scene)) return; fn(); };
      }
    };
    const f = (n, o) => () => this.fire(n, o);
    group('事件', [['进场', f('进场')], ['普通礼物', f('普通礼物')], ['连送 5 份', () => { for (let i = 0; i < 5; i++) this.fire('普通礼物'); }], ['中礼物', f('中礼物')], ['大礼物', f('大礼物')],
      ['大礼物+新第一', f('大礼物', { top: true })], ['普通礼物+新第一', f('普通礼物', { top: true })], ['盲盒开亏', f('盲盒开亏')], ['盲盒开中', f('盲盒开中')], ['盲盒开大', f('盲盒开大')],
      ['舰长', f('舰长')], ['提督', f('提督')], ['总督', f('总督')], ['城堡', f('城堡')]]);
    group('抽奖', [['报名开场', f('报名开场')], ['报名截止', f('报名截止')], ['奖池开场', f('奖池开场')], ['奖池点名', f('奖池点名')], ['奖池转动', f('奖池转动')],
      ['揭晓·大奖', f('揭晓·大奖')], ['揭晓·二奖', f('揭晓·二奖')], ['揭晓·三奖', f('揭晓·三奖')], ['没人报名', f('没人报名')], ['抽奖结束', f('抽奖结束')]]);
    const d = (kind, mishap) => () => this.fire('日常', { kind, mishap });
    group('日常', [['举哑铃', d('举哑铃', false)], ['砸到脚', d('举哑铃', true)], ['哼歌', d('哼歌', false)], ['破音', d('哼歌', true)],
      ['爬山', d('爬山', false)], ['摔屁股墩', d('爬山', true)], ['骑车', d('骑车', false)], ['骑车摔倒', d('骑车', true)],
      ['滑雪', d('滑雪', false)], ['滑雪摔跤', d('滑雪', true)]]);
    group('时间', [['快进 10 分钟', () => this.fastForward(10)], ['快进 30 分钟', () => this.fastForward(30)], ['回到刚有礼物', () => { this.lastGift = this.lastAny = this.now(); }]]);
    const fit = () => { const r = document.getElementById('root'); if (r) r.style.zoom = Math.min(innerWidth / 1920, (innerHeight - bar.offsetHeight) / 1080); };
    addEventListener('resize', fit); setTimeout(fit, 50);
  }
}
</script>
