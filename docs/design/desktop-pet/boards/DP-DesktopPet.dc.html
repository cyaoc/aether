    const sprite = { x: FOOT.x - SIGN.W / 2 - 30, y: FOOT.y - H * 0.55 };   // beside the sign's left edge, never over its words
    const glide = (from, to, u) => { const e = ease(u); return { x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e, a: from.a + (to.a - from.a) * e, k: from.k + (to.k - from.k) * e }; };
    const spot = c => ({ ...this.signSpot(st, c), k: 1 }), from = { ...sprite, a: 0, k: 0.15 };
    if (hide) {
      // into her hands in front of her (the first in-between of ducking behind it), then, lifting, down to her chest (the
      // last of them going back) and up over her head as her arms go up
      const duck = this.hop('idle', 'signHide') || [], chest = duck[0] || this.cell('signHide');
      st.pose = t < q.fly ? 'idle' : t < lift ? 'signHide' : t < lift + q.lift ? 'idle' : t < lower ? up : 'idle';
      if (t < q.fly) st.signFly = glide(from, spot(chest), k01(t, 0, q.fly));
      else if (t >= lift + q.lift && t < raised + 60) st.signFly = glide(spot(chest), spot(this.cell(up)), k01(t, lift + q.lift, raised));
      if (t >= q.hide[0] && t < lift) { st.fx.push(['sweat', q.hide[0] + 200]); say(q.hide[0] + 150); }
    } else {
      st.pose = t < q.fly - q.raise ? 'idle' : t < lower ? up : 'idle';
      if (t < q.fly + 60) st.signFly = glide(from, spot(this.cell(up)), k01(t, 0, q.fly));
    }
    // it waits beside the sign while she hides behind it, goes home under it once it is up, and is back beside it for her
    // to give it back
    if (t < q.fly + 150) { st.sprite = 'glow'; st.sp = ['at', sprite.x, sprite.y]; }
    else if (t >= lower) { st.sprite = t < lower + q.raise + q.back ? 'glow' : 'sHappy'; st.sp = ['at', sprite.x, sprite.y]; }
    else { st.sprite = 'sLook'; if (hide && t < lift + q.lift) st.sp = ['at', sprite.x, sprite.y]; }
    if (name === 'PK·2倍' && t >= raised && t < lower) {
      st.fx.push(['sparkles', q.jump[0][0]]);
      const [c, j] = [this.cells.pkSign[2], this.cells.pkSign[5]], k = H / c.ruler, drop = ((j.sign.y - j.ground) - (c.sign.y - c.ground)) * k;
      for (const [a, ms, h] of q.jump) {
        const lifted = h * Math.sin(Math.PI * k01(t, a, a + ms));
        if (t < a || t >= a + ms) continue;
        st.y -= lifted;
        if (lifted > h * 0.35) { st.pose = 'signJump'; st.y -= drop; }   // in the air: her legs tuck up, her hands and the sign go on
      }
    }
  }

  // B站 PK's 对手情报卡 (INTEL): as the 账单卡, the sprite flies to the card's top right corner and prints it out of
  // itself, glowing; it taps the card over (a nod) where it has two sides, and goes home down beside the card's right
  // edge. The card hangs over her head on the side shown, as tall as that side; it turns over edge on, its height too.
  intelShow(t, st, opts) {
    const q = INTEL, c = opts.intel || PK_INTEL.SAMPLES['普通'], L = PK_INTEL.layout(this.measureG ??= document.createElement('canvas').getContext('2d'), c);
    const both = L.front && L.back, turn = both ? ease(k01(t, q.turn[0], q.turn[1])) : L.front ? 0 : 1, h = L[turn < 0.5 ? 'front' : 'back'].h;
    const x = FOOT.x - PK_INTEL.W / 2, y = Math.max(40, FOOT.y - H - 4 - h);
    st.pose = at(t, [[0, 'surprised'], [600, 'hope'], ...(both ? [[q.turn[1], 'announce']] : []), [q.done, 'idle']]);
    if (t >= 1700 && t < q.turn[0]) st.fx.push(['sweat', 1700]);
    // between its trips to the card's corner it waits at her right, below the card, inside the page; it goes home only
    // after the turn, low in front of her (never across her face)
    const corner = ['at', x + PK_INTEL.W - 6, Math.max(SPRITE_H / 2 + 4, y - 4)], side = ['at', Math.min(x + PK_INTEL.W + 22, PAGE.w - 34), FOOT.y - 0.34 * H];
    if (t < q.print[1]) { st.sprite = t < q.print[0] ? 'sLook' : 'glow'; st.sp = corner; }
    else if (both && t >= q.turn[0] - 600 && t < q.turn[1] + 300) { st.sprite = t >= q.turn[0] - 100 ? 'nod' : 'sLook'; st.sp = corner; }
    else if (t < (both ? q.turn[1] + 1100 : q.print[1] + 800)) { st.sprite = 'sLook'; st.sp = side; }
    else st.sprite = both ? 'sHappy' : 'sLook';
    const reveal = t < q.print[0] ? 0 : t < q.print[1] ? ease(k01(t, q.print[0], q.print[1])) : 1 - ease(k01(t, q.roll[0], q.roll[1]));
    if (reveal > 0) st.intel = { c, x, y: y + 2 * Math.sin(t / 500), h, turn, reveal };
  }

  // B站 PK's result (PK_RESULT), with poses she has. Winning she cheers and thanks her viewers: 大胜 with confetti and
  // two jumps, then, calming down, she hides her face at how loud she was; 险胜 startled first (that close!). 平局: a
  // surprised blink, then a nod. Losing: 惜败 she stomps (so close), 输 she droops and her sprite pats her head, 惨败
  // she squats drawing circles under a little rain cloud (输 and 惨败 looked the same when both drooped); each then bows
  // her thanks, a second line (·二). Never gloating, never fierce.
  pkEndShow(t, st, opts, say, hop) {
    const r = opts.result || '赢', two = LINES[`PK·${r}·二`] && this.saying(`PK·${r}·二`, opts.seed ?? 0), end = EVENTS['PK·结果'].durs[r] - 400;
    say(150);
    const steps = {
      大胜: [[0, 'cheer'], [2800, 'shy']], 赢: [[0, 'cheer'], [1900, 'bow']], 险胜: [[0, 'surprised'], [700, 'cheer'], [2600, 'bow']],
      平局: [[0, 'surprised'], [800, 'nod']], 惜败: [[0, 'pout'], [1900, 'bow']], 输: [[0, 'dejected'], [2000, 'bow']], 惨败: [[0, 'gloomy'], [2700, 'bow']]
    }[r];
    st.pose = at(t, [...steps, [end, 'idle']]);
    const second = { 大胜: 2900, 惜败: 2000, 输: 2100, 惨败: 2800 }[r];
    if (two && t >= second) say(second, two);
    if (r === '大胜') { hop(0, 16); hop(480, 16); st.fx.push(['confetti', 100], ['sparkles', 100]); if (t >= 2900) st.fx.push(['sweat', 3000, 1400]); }
    if (r === '赢') { hop(0, 12); st.fx.push(['sparkles', 100]); }
    if (r === '险胜') { st.fx.push(['shock', 0], ['sweat', 100, 1400]); hop(700, 10); if (t >= 700) st.fx.push(['sparkles', 800]); }
    if (r === '惜败' && t < 1300) { st.y -= 4 * Math.abs(Math.sin(t / 90)); st.fx.push(['anger', 100, 900]); }
    if (r === '惨败') st.fx.push(['gloom', 0, 2600], ['rain', 200, 2400]);
    // its sprite: waves its flag for a win, looks up at a 平局, hides its face with hers, pats her head when she lost
    const win = ['大胜', '赢', '险胜'].includes(r), down = ['dejected', 'gloomy', 'pout'].includes(st.pose);
    if (st.pose === 'shy') { st.sprite = 'hide'; st.sp = ['rel', -0.04, 0.42]; }
    else if (st.pose === 'bow' || st.pose === 'nod') st.sprite = 'nod';
    else if (win) st.sprite = r === '险胜' && t < 700 ? 'surprised' : 'flag';
    else if (down && r !== '惜败') { st.sprite = 'pat'; st.sp = 'head'; }
    else st.sprite = down ? 'hide' : 'sLook';
  }

  // While a PK is on, how it stands has changed (PK_GAP): a short show with poses she has. 反超 she is startled and
  // cheers with a jump; 被反超 startled, then a frustrated stomp, never fierce; 拉开 she claps under hearts; 被拉开 she
  // droops and her sprite pats her head; 追近 hands together, hoping, a few sparkles; 被追近 nervous, sweating.
  pkGapShow(t, st, opts, say, hop) {
    const r = opts.result || '反超', end = EVENTS['PK·比分'].durs[r] - 300;
    say(150);
    // (被反超 goes from startled to stomping by her standing: the shortest way the board found went through opening a
    // blind box, a box in her hands for a moment)
    const steps = { 反超: [[0, 'surprised'], [400, 'cheer']], 被反超: [[0, 'surprised'], [1020, 'idle'], [1200, 'pout']], 拉开: [[0, 'clap']],
      被拉开: [[0, 'dejected']], 追近: [[0, 'hope']], 被追近: [[0, 'hope']] }[r];
    st.pose = at(t, [...steps, [end, 'idle']]);
    if (r === '反超') { st.fx.push(['shock', 0]); hop(400, 14); if (t >= 400) st.fx.push(['sparkles', 450]); st.sprite = t < 400 ? 'surprised' : 'flag'; }
    if (r === '被反超') { st.fx.push(['shock', 0], ['sweat', 200, 1000]); if (t >= 1200 && t < 2200) st.y -= 3 * Math.abs(Math.sin((t - 1200) / 90)); st.sprite = t < 1200 ? 'surprised' : 'hide'; }
    if (r === '拉开') { st.fx.push(['hearts', 200, 3]); st.sprite = 'sHappy'; }
    if (r === '被拉开') { st.sprite = 'pat'; st.sp = 'head'; }
    if (r === '追近') { st.fx.push(['sparkles', 300]); st.sprite = 'sLook'; }
    if (r === '被追近') { st.fx.push(['sweat', 100, 1800]); st.sprite = 'sLook'; }
    if (t >= end) { st.sprite = 'sIdle'; st.sp = null; }
  }

  // Our double bonus challenge (from B站's capsule). Done: a surprised blink, then she claps for her viewers under
  // sparkles and hearts, her sprite waving its flag. Run out: she droops and her sprite pats her head, then she nods,
  // picking herself up (·二); never asking for more gifts.
  pkChallengeShow(t, st, opts, say) {
    const ok = (opts.result || '成功') === '成功', end = EVENTS['PK·挑战'].durs[ok ? '成功' : '失败'] - 300;
    say(150);
    if (ok) {
      st.pose = at(t, [[0, 'surprised'], [400, 'clap'], [end, 'idle']]);
      st.sprite = t < 400 ? 'surprised' : 'flag';
      if (t >= 400) st.fx.push(['sparkles', 450], ['hearts', 600, 3]);
    } else {
      st.pose = at(t, [[0, 'dejected'], [1600, 'nod'], [end, 'idle']]);
      const two = this.saying('PK·挑战失败·二', opts.seed ?? 0);
      if (t >= 1700) say(1700, two);
      if (t < 1600) { st.sprite = 'pat'; st.sp = 'head'; } else st.sprite = 'nod';
    }
    if (t >= end) { st.sprite = 'sIdle'; st.sp = null; }
  }

  // The scores of a PK on the board: each change checked against how it stood (PK_GAP), the show fired if one is due and
  // the last was COOL ago; the caption says the score and what came of it.
  pkScore(ours, theirs) {
    const now = this.now(), clock = this.pkClock(now) ?? now, a = this.pkGap || PK_GAP.stand(0, 0), b = PK_GAP.stand(ours, theirs, a), show = PK_GAP.show(a, b);
    this.pkGap = b;
    const cool = show && this.pkGapAt != null && clock - this.pkGapAt < PK_GAP.COOL;
    this.note(`PK 比分 ${ours} : ${theirs}` + (show ? `：${show}` + (cool ? `（离上次不到 20 秒，不演）` : '') : ''));
    // the 20 s count from a show that played, not one let go because she was busy
    if (show && !cool) { this.fire('PK·比分', { result: show }); if (this.cur?.name === 'PK·比分' && this.cur.start === now) this.pkGapAt = clock; }
  }

  // 整场 PK (PK_DEMO): from the match, in real time or fast; what happens is fired as B站 would set it off.
  pkDemoStart(fast) {
    Object.assign(this, { cur: null, queue: [], pkGap: null, pkGapAt: null, pkDemo: { at: this.now(), fast, i: 0, ours: 0, theirs: 0, cap: '' } });
    this.note(`整场 PK 开始（${fast ? '快进' : '真实时间'}）`);
  }
  // The PK's own clock (ms from its start; the match is at -10 s), while 整场 PK plays; fast, read off PK_DEMO's pairs.
  pkClock(now) {
    const d = this.pkDemo; if (!d) return null;
    const e = now - d.at; if (!d.fast) return e - 10000;
    const k = Math.max(0, PK_DEMO.findLastIndex(s => s[1] <= e)), [s0, d0] = PK_DEMO[k], [s1, d1] = PK_DEMO[Math.min(k + 1, PK_DEMO.length - 1)];
    return 1000 * (d1 > d0 ? s0 + (s1 - s0) * Math.min(1, (e - d0) / (d1 - d0)) : s0);
  }
  pkDemoStep(now) {
    const d = this.pkDemo, e = now - d.at;
    while (d.i < PK_DEMO.length && (d.fast ? PK_DEMO[d.i][1] : (PK_DEMO[d.i][0] + 10) * 1000) <= e) {
      const [, , what, a, b] = PK_DEMO[d.i++];
      // in a PK from the match on (PK_BATTLE_PRE_NEW), not from its start: in the 0.5 s between the card and the start
      // she went off on a daily action
      if (what === 'match') { this.pkOn(true); this.fire('PK·对手', { intel: PK_INTEL.SAMPLES['普通'] }); d.cap = '匹配上，10 秒后开打'; }
      if (what === 'start') d.cap = '首次送礼翻倍中';
      if (what === 'score') { d.ours = a; d.theirs = b; this.pkScore(a, b); }
      if (what === 'capsule') { this.fire('PK·双倍条件', { text: a }); d.cap = a; }
      if (what === 'challenge') { this.fire('PK·挑战', { result: a }); d.cap = a === '成功' ? '挑战成功，190 秒翻倍' : '挑战失败'; }
      if (what === 'gift') { if (a === '舰长') this.fire('舰长', { price: 1980 }); else this.give([{ gift: a, price: 10, n: 1 }]); }
      if (what === 'double') { this.fire('PK·2倍'); d.cap = '2倍加成中（到 250 秒）'; }
      if (what === 'doubleEnd') this.fire('PK·双倍还剩10秒', { left: 10000 });
      if (what === 'doubleOver') d.cap = '双倍结束';
      if (what === 'last10') this.fire('PK·最后10秒', { left: 10000 });
      if (what === 'end') {
        const result = PK_RESULT.of(d.ours, d.theirs); this.pkOn(false); this.pkGap = null;
        this.note(`PK 结束：我们 ${d.ours} : 对面 ${d.theirs} → ${result}`); this.fire('PK·结果', { result, ours: d.ours, theirs: d.theirs }); d.cap = '结束：' + result;
      }
      if (what === 'done') { this.pkDemo = null; if (this.cfg.scene === '整场 PK') this.pkDemoNext = now + 3000; return; }
    }
  }

  // The 对手情报卡 as far as it has come out (reveal), its top first, with the curl of paper at the edge (as drawBill).
  drawIntel(g, v) {
    const edge = v.y + v.h * v.reveal;
    g.save(); g.beginPath(); g.rect(v.x - 80, v.y - 80, PK_INTEL.W + 160, edge - v.y + 80); g.clip();
    PK_INTEL.draw(g, v.c, v.x, v.y, v.turn); g.restore();
    if (v.reveal < 1) {
      g.save(); g.fillStyle = '#FFFDF9'; g.strokeStyle = '#A9C1F5'; g.lineWidth = 2; g.shadowColor = 'rgba(40,40,80,0.3)'; g.shadowBlur = 6; g.shadowOffsetY = 2;
      g.beginPath(); g.roundRect(v.x - 4, edge - 8, PK_INTEL.W + 8, 16, 8); g.fill(); g.stroke(); g.restore();
    }
  }

  // The card as far as it has come out (reveal), its top first; a curl of paper at the edge while it unrolls or rolls up.
  drawBill(g, b) {
    const edge = b.y + b.h * b.reveal;
    g.save(); g.beginPath(); g.rect(b.x - 80, b.y - 80, BILL.W + 160, edge - b.y + 80); g.clip();
    BILL.draw(g, b.c, b.x, b.y, b.stampT); g.restore();
    if (b.reveal < 1) {
      g.save(); g.fillStyle = '#FFFDF9'; g.strokeStyle = '#F0A3C0'; g.lineWidth = 2; g.shadowColor = 'rgba(60,30,50,0.3)'; g.shadowBlur = 6; g.shadowOffsetY = 2;
      g.beginPath(); g.roundRect(b.x - 4, edge - 8, BILL.W + 8, 16, 8); g.fill(); g.stroke(); g.restore();
    }
  }

  bigGift(t, st, say) {
    const land = { x: FOOT.x + 150, y: FOOT.y }, fall = 1 - (1 - k01(t, 800, 2800)) ** 2;
    const y = -20 + (land.y + 20) * fall, x = land.x + 14 * Math.sin(t / 260) * (1 - fall);
    const into = ease(k01(t, 5300, 5900)), chest = { x: FOOT.x - 10, y: FOOT.y - 0.45 * H };
    st.gift = { x: x + (chest.x - x) * into, y: y + (chest.y - y) * into, s: 1 - into, open: t >= 3400, lid: t >= 3400 ? t - 3400 : null,
      balloons: t < 3600 ? { rise: Math.max(0, t - 2800), a: 1 - k01(t, 3200, 3600) } : null };
    st.pose = at(t, [[0, 'idle'], [2800, 'surprised'], [4400, 'cheer']]);
    const hop = (a, h) => { st.y -= h * bump(t, a, a + 320); }; hop(4400, 14);
    if (t < 4400) { st.sprite = t < 2800 ? 'sLook' : 'surprised'; st.sp = ['rel', -0.1, 0.42]; } else this.toss(st, t, 4400);
    say(2900);
    return st;
  }

  // When her line in 守住了 or 打跑了 may come (show time): once the sprite has lifted the chest higher than where her
  // bubble comes (it waits for the prankster to be clear of the chest first, CLEAR, so not at a set time), 1.9 s at the soonest.
  chestUp(t, opts) {
    const k = this.lineWait?.seed === opts.seed ? this.lineWait : (this.lineWait = { seed: opts.seed, at: null }), o = this.gm.out;
    if (k.at == null && (!o || o.got != null && this.clock - o.got >= 0.4 * (o.ms - o.t2))) k.at = Math.max(1900, t);
    return k.at ?? Infinity;
  }

  // A show that scared the prankster off a tug after the lightning (a 大航海, a castle, a lottery) waits for her hair: she
  // cheers frizzed while the sprite takes the chest home and comes back to pat it smooth (smooth), and the show starts once
  // it has settled (c.pre; 用户：“大航海那个也改成精灵摸回来”; it used to go back in a blink as the show began). A PK
  // that scared it off does the same with no show after (gm.fix). A gift's has it the other way round (kept): the sprite,
  // right by her, smooths her hair first while the prankster runs off (the chest waits, gm.out.wait), then takes the chest
  // home, and the show starts once both are done: about 4 s, not 6.5.
  unfrizz(st, t, c) {
    const fixed = this.smooth(st, t, { seed: -c.start }, 'cheerZap', 'cheer', 0, FRIZZ, 'sHappy'), o = this.gm.out;
    st.pose = fixed ? 'cheer' : 'cheerZap';
    if (fixed && o?.wait) o.wait = false;
    if (fixed && t >= this.pat.fix + SETTLE && !(c.opts?.kept && o)) c.pre = t;
  }

  // Tossed up by her cheer: over her head for a moment, then circling her.
  // After the lightning her hair stays frizzed (pose zap) until her sprite pats it smooth: once the sprite is really on
  // her head (sTarget, where it was flying to, and not taking the chest home) it pats it, the last two pats harder (PATS),
  // and as the second lands her hair settles (pose plain, through its slow in-betweens) with a spark under its paw, stars
  // having gathered round her head (hairMagic) to fall down her hair as glitter; then it does after ('pat'
  // goes on patting her head, anything else back by her side: nodding on her head it went behind her bubble, which
  // comes down as the hair does). Not before min, nor later than 700 ms before the show's end (dur) if the
  // sprite never got there. Returns whether her hair is itself again.
  smooth(st, t, o, zap, plain, min, dur, after) {
    const p = this.pat?.seed === o.seed ? this.pat : (this.pat = { seed: o.seed, at: null }), sv = this.sv, to = this.sTarget;
    if (p.at == null && (!this.gm.out || this.gm.out.wait) && to?.sp === 'head' && sv && Math.hypot(sv.x - to.x, sv.y - to.y) < 12) p.at = t;
    const fix = p.fix = Math.min(Math.max(min, (p.at ?? Infinity) + PATS), dur - 700 - SETTLE);
    const b = this.herBox(st, this.cell(zap)), a = this.herBox(st, this.cell(plain)), paw = { x: b.x + b.w * 0.25 + 20, y: b.y - SPRITE_H * 0.2 + 14 };
    st.fx.push(['spark', fix, (paw.x - a.x) / a.w, (paw.y - a.y) / a.h, 8]);
    // the stars round her head, given across whichever drawing she is in this frame (they stay at her head as it changes)
    const h = { x: a.x + a.w * HAIR[plain][0], y: a.y + a.h * HAIR[plain][1] }, now = t < fix ? b : a;
    st.fx.push(['hairMagic', fix - GATHER, (h.x - now.x) / now.w, (h.y - now.y) / now.h, GATHER]);
    // its paw comes down on her head (patPhase) just as the hair is fixed
    Object.assign(st, { sStay: p.at != null && (t < fix || after === 'pat'), sprite: t < fix ? 'pat' : after, sp: t < fix || after === 'pat' ? 'head' : null, patPhase: t - fix + 90 * Math.PI, patHard: t >= fix - PATS && t < fix });
    return t >= fix;
  }

  // She tosses it up over her head: it flies up, hangs there hopping for joy, and only then comes down to circle her. The
  // toss used to last 350 ms, about the flight up, so it started down the moment it got there (用户：一上头顶就下来了).
  // It hangs above her speech bubble, however many lines it has, not behind it.
  toss(st, t, a, hold = 1100) {
    st.sprite = 'sHappy';
    if (t < a + 350 + hold) st.sp = ['tossed', 0.05 * Math.abs(Math.sin(Math.max(0, t - a - 350) / 170))];
    else st.orbit = t - a - 350 - hold;
  }

  // The sprite dresses her up (or back): it spirals up round her glowing, leaving a trail, and the caller flashes at b.
  dress(st, t, a, b) {
    st.sprite = 'glow'; st.orbit = 1000 / 1.2 + (t - a) * 2.2; st.orbitR = 90;  // from her left, where it waits st.orbitY = FOOT.y - (0.1 + 0.85 * ease(k01(t, a, b))) * H;
    st.fx.push(['trail', a]);
  }

  // The sprite turns into the castle behind her; she twirls into the princess gown, curtsies, walks up to the gate and
  // waves from it, then runs back down the steps to us while the castle shrinks back into the sprite at its spot, and the
  // sprite circles her to dress her back.
  castleShow(t, st, say) {
    const b = this.castle.box, cs = 340 / b.h, home = this.home(0);
    const rise = ease(k01(t, 900, 1600)), back = ease(k01(t, 9600, 10400)), top = 420 - 230 * rise;
    const cx = PAGE.w / 2 + (home.x - PAGE.w / 2) * back, cy = top + (home.y - top) * back;
    st.castle = { x: cx, y: cy, s: cs * (0.6 + 0.4 * rise) * (1 - 0.75 * back), a: k01(t, 900, 1500) * (1 - k01(t, 10000, 10400)),
      open: t < 9000 ? (t >= 7500 ? k01(t, 7500, 7800) : 0) : 1 - k01(t, 9000, 9300) };
    const gate = { x: PAGE.w / 2 + (this.castle.closed.width * 0.503 - this.castle.closed.width / 2) * cs, y: top + (this.castle.closed.height * 0.676 - this.castle.closed.height / 2) * cs };
    if (t < 1500) { st.sprite = 'glow'; st.sBehind = true; st.sp = ['to-castle', ease(k01(t, 0, 1200)), 1 + 1.6 * k01(t, 300, 1500)]; st.sAlpha = 1 - k01(t, 900, 1500); }
    else if (t < 9600) st.sp = ['gone'];
    else if (t < 10500) { st.sprite = 'sHappy'; st.sp = ['at', cx, cy]; st.sAlpha = k01(t, 10000, 10400); st.sScale = 1.6 - 0.6 * k01(t, 10000, 10500); }
    else if (t < 11200) this.dress(st, t, 10500, 11200);
    else st.sprite = 'sHappy';
    if (t < 2200) { st.pose = 'idle'; st.sx = t < 1500 ? 1 : Math.cos((t - 1500) / 90); }
    else if (t < 3000) st.pose = 'spin';
    else if (t < 4500) st.pose = 'curtsy';
    else if (t < 7500) { st.pose = 'walkA'; const w = k01(t, 4500, 7500); st.x = FOOT.x + (gate.x - FOOT.x) * w; st.y = FOOT.y + (gate.y - FOOT.y) * w; st.s = 1 - 0.68 * w; }
    else if (t < 9000) { st.pose = 'lookBack'; st.x = gate.x; st.y = gate.y; st.s = 0.32; }
    else if (t < 9800) {
      // three bounding steps down to us, growing as she comes closer
      const w = ease(k01(t, 9000, 9800));
      st.pose = 'pIdle'; st.x = gate.x + (FOOT.x - gate.x) * w; st.y = gate.y + (FOOT.y - gate.y) * w - 26 * Math.abs(Math.sin(Math.PI * 3 * w)); st.s = 0.32 + 0.68 * w;
    } else st.pose = t < 11200 ? 'pIdle' : 'idle';
    st.fx.push(['rainbowSparkles', 900], ['flash', 2200, 1.2], ['gateGlow', 7500, gate], ['flash', 11200, 1]);
    if (t >= 3000 && t < 4500) say(3000);
    if (t >= 7600 && t < 9000) st.bubble = { text: this.cur?.gateLine || '欢迎来到我的城堡～', t: t - 7600, at: gate };
    return st;
  }

  // ---- scenes: fixed loops that can be frozen for screenshots ---------------------------------------------------------
  sceneState(now) {
    const scene = this.cfg.scene, name = this.cfg.name;
    const ev = (n, t, opts = {}) => this.eventState(n, t, opts, this.fill(LINES[this.lineKey(n, opts)]?.[0], n, opts));
    if (scene === '平时') {
      const plan = [[2000, '举哑铃', true], [11500, '哼歌', false], [16000, '爬山', true], [27000, '骑车', false], [33500, '滑雪', true]];
      const t = now % 43000;
      for (const [s, kind, mishap] of plan) {
        const dur = DAILY[kind][0] + (mishap ? DAILY[kind][1] : 0);
        if (t >= s && t < s + dur) return this.daily(t - s, this.base(), { kind, mishap, seed: 0 }, LINES[kind][0]);
      }
      return this.idleState(now, '平静');
    }
    if (scene === '心情') {
      const t = now % 58000, moods = ['平静', '无聊', '沮丧', '犯困'];
      if (t < 48000) { const m = moods[Math.floor(t / 12000)], st = this.idleState(now, m, 15000 + t % 12000); st.label = `心情：${m}`; return st; }
      const u = t - 48000, st = u < 1000 ? this.base() : ev('大礼物', u - 1000);
      if (u < 1000) { st.pose = 'awake'; st.sprite = 'surprised'; st.fx.push(['bang', now - u], ['shock', now - u]); st.y -= 10 * bump(u, 0, 300); st.bubble = { text: LINES.冷场后来了人[0], t: u }; }
      st.label = '冷场后来了人：惊醒，再演大礼物'; return st;
    }
    const seqs = {
      报名抽奖: [['报名开场', 2600], ['hold', 2500, '报名中'], ['报名截止', 2000], ['hold', 2500, '等待'], ['揭晓·三奖', 4600], ['揭晓·二奖', 4600], ['揭晓·大奖', 5200], ['抽奖结束', 2600]],
      奖池抽奖: [['奖池开场', 2600], ['奖池点名', 2000], ['奖池转动', 2000], ['揭晓·大奖', 5200], ['抽奖结束', 2600]],
      '大礼物+新第一': [['大礼物', 6000], ['新的第一名', 2600]]
    };
    const seq = seqs[scene] || [[scene, EVENTS[scene]?.dur || 3000]];
    const total = seq.reduce((a, s) => a + s[1], 0) + 2500, t = now % total;
    let acc = 1000;
    if (t < acc) return this.idleState(now, '平静');
    for (const [n, d, phase] of seq) {
      if (t < acc + d) {
        if (n === 'hold') { const st = this.base(); if (phase === '等待') st.pose = 'hope'; this.talk(st, phase === '等待' ? '等开奖' : '报名中', now, t - acc); return st; }
        const st = ev(n, t - acc);
        if (n === '城堡' && st.bubble?.at) st.bubble.text = this.fill(LINES['城堡·门口'][0]);
        return st;
      }
      acc += d;
    }
    return this.idleState(now, '平静');
  }

  fill(text, name, opts = {}) {
    if (!text) return text;
    return text.replaceAll('{昵称}', opts.nickname ?? this.cfg.name).replaceAll('{礼物}', opts.gift || GIFT[name] || '小花花').replaceAll('{个数}', String(opts.count ?? 3))
      .replaceAll('{连守}', String(opts.streak ?? 1)).replaceAll('{关键字}', '抽奖').replaceAll('{奖项}', '一等奖').replaceAll('{奖品}', '定制周边');
  }

  // ---- drawing -----------------------------------------------------------------------------------------------------
  frame() {
    const canvas = document.getElementById('dp-cv'), root = document.getElementById('dp-root');
    if (!canvas || !this.cfg) return;
    if (!this.ready) { if (!this.booting) this.boot(); return; }
    if (root !== this.root || this.cfg !== this.boundCfg) {
      this.root = root; this.boundCfg = this.cfg;
      for (const a of root.getAnimations()) a.cancel();
      this.master = root.animate([{ outlineColor: 'transparent' }, { outlineColor: 'transparent' }], { duration: 1e9 });
      this.reset(); this.sv = this.hv = this.sc = this.bubSide = null;
    }
    const now = this.clock = this.now();
    let st;
    if (['手动', '演示', '整场 PK'].includes(this.cfg.scene)) {
      if (this.cfg.scene === '演示') this.demo(now);
      if (this.cfg.scene === '整场 PK' && !this.pkDemo && now >= (this.pkDemoNext ?? 0)) this.pkDemoStart(true);
      if (this.pkDemo) this.pkDemoStep(now);
      this.update(now);
      const c = this.cur;
      if (c && now < c.start + c.pre && !c.wakeLine) {   // the chest game tidies up before the show
        st = this.base();
        if (c.opts.frizz) this.unfrizz(st, now - c.start, c);
        else { if (c.opts.kept) Object.assign(st, { pose: 'cheer', sprite: 'sHappy' }); if (c.opts.tidy && !this.gm.out) c.pre = now - c.start; }
        if (c.opts.kept) for (const a of [300, 1100]) st.y -= 12 * bump(now - c.start, a, a + 320);   // saved by the gift, she cheers (kept)
      }
      else if (c && now < c.start + c.pre) { st = this.base(); st.pose = 'awake'; st.sprite = 'surprised'; st.fx.push(['bang', c.start], ['shock', c.start], ['sweat', c.start + 200]); st.y -= 10 * bump(now - c.start, 0, 300); st.bubble = { text: this.fill(c.wakeLine), t: now - c.start }; }
      else if (c) { st = this.eventState(c.name, now - c.start - c.pre, { ...c.opts, seed: Math.floor(c.start), at: now }, this.fill(c.line, c.name, c.opts)); if (c.name === '城堡' && st.bubble?.at) st.bubble.text = this.fill(c.gateLine || (c.gateLine = this.pick('城堡·门口'))); }
      // only blind boxes have a state of their own while the round comes in (she shakes them); gifts have played at once,
      // and once their show is over she is herself again, not holding the 中礼物's box (she used to pick it up after a
      // plain thank-you, until the round's 3 s were up)
      else if (this.shaking()) st = this.roundState(now);
      else if (this.gm.fix) { st = this.base(); this.unfrizz(st, now - this.gm.fix.start, this.gm.fix); if (this.gm.fix.pre != null) this.gm.fix = null; }
      else {
        const mood = this.mood(now), key = mood + (this.lot?.phase || '');
        if (this.seen?.key !== key) this.seen = { key, at: now };
        st = this.idleState(now, mood, now - this.seen.at);
      }
      // a round's gifts still fly into her arms over whatever she is doing
      if (this.round && !st.round) for (const x of this.round.items) st.fx.push(['giftArc', st._t == null ? x.at : st._t - (now - x.at)]);
      if (this.cfg.game) st = this.gameState(st, now);
    } else st = this.sceneState(now);
    this.draw(canvas.getContext('2d'), st, now);
  }

  demo(now) {
    const t = now % 30000, last = this.lastDemo ?? -1;
    this.lastDemo = t;
    const cross = s => last < s && t >= s || (t < last && s <= t);
    if (cross(3000)) this.fire('进场');
    if (cross(7000)) this.give([{ gift: '小花花', price: 10, n: 1 }]);
    if (cross(11000)) this.give([{ gift: '小电视飞船', price: 12450, n: 1, top: true }]);
  }

  draw(g, st, now) {
    const env = this.cfg.env, small = env === '小页面', ps = small ? 0.75 : 1;
    const pw = PAGE.w * ps, ph = PAGE.h * ps, px = env === '左下角' ? 40 : 1920 - pw - 40, py = 1080 - ph - 20;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, 1920, 1080);
    if (this.cfg.room === '明亮画面') { const r = Math.max(1920 / this.day.width, 1080 / this.day.height); g.drawImage(this.day, 0, 0, this.day.width * r, this.day.height * r); }
    else if (this.cfg.room === '深色房间') { const gr = g.createLinearGradient(0, 0, 0, 1080); gr.addColorStop(0, '#2b3048'); gr.addColorStop(1, '#151826'); g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080); }
    else { for (let y = 0; y < 1080; y += 40) for (let x = 0; x < 1920; x += 40) { g.fillStyle = (x + y) / 40 % 2 ? '#9a9a9a' : '#b4b4b4'; g.fillRect(x, y, 40, 40); } }
    g.save(); g.setLineDash([10, 8]); g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 2; g.strokeRect(px, py, pw, ph); g.restore();
    g.save(); g.translate(px, py); g.scale(ps, ps);
    g.beginPath(); g.rect(0, 0, PAGE.w, PAGE.h); g.clip();
    const shake = this.shakeOf(st, now); g.translate(shake.x, shake.y);
    if (st.castle) this.drawCastle(g, st.castle);
    if (st.ship) this.drawShip(g, st.ship);
    if (st.admShip) this.drawAdmShip(g, st.admShip);
    if (st.gacha) this.drawGacha(g, st.gacha);
    // (cut short: kept while she needs it, with her where she was at it: the show cutting in has her back at her place, and
    // the table's show had her a step back; once she is up she goes over to the new place in UNPROP ms)
    const prop = k => st[k] ? (this.propAt[k] = { ...st[k], herX: st.x, herY: st.y }) : this.drawn?.c.prop === k ? this.propAt[k] : null;
    this.propAt ??= {};
    const sofa = prop('sofa'), table = prop('table'), kept = !st.sofa && sofa || !st.table && table;
    if (kept) this.unprop = { x: kept.herX - st.x, y: kept.herY - st.y, at: null };
    else if (this.unprop) this.unprop.at ??= performance.now();
    const off = kept ? 1 : this.unprop ? 1 - ease(k01((performance.now() - this.unprop.at) * this.cfg.speed, 0, UNPROP)) : 0;
    const herSt = kept ? { ...st, x: kept.herX, y: kept.herY } : off ? { ...st, x: st.x + this.unprop.x * off, y: st.y + this.unprop.y * off } : st;
    if (!kept && this.unprop && off <= 0) this.unprop = null;
    if (sofa) this.drawPopped(g, this.props.sofa, sofa);   // behind her: she sits and lies on it
    if (st.halves?.a) { g.save(); g.globalAlpha = st.halves.a; for (const h of st.halves.pts) this.capsule(g, h.x, h.y, 12, h.rot, h.half); g.restore(); }   // the capsule's halves, off her hands and by her feet
    if (st.emblem) this.drawProp(g, this.props.emblem, st.emblem.x, st.emblem.y + this.props.emblem.height * H / ANCHOR * st.emblem.s / 2, st.emblem.s, st.emblem.a);
    const rt = performance.now(), dt = Math.min(100, rt - (this.rt ?? rt)) * this.cfg.speed;
    this.rt = rt;
    const her = this.herBox(st);
    const bub = st.bubble?.text && this.bubbleBox(g, st, her, this.bubSide);
    this.bubSide = bub?.side;
    const target = this.spritePos(st, her, now, bub), sp = target && this.follow(target, dt, st);
    this.sTarget = target && { ...target, sp: st.sp };   // where it is flying to (smooth: is it on her head yet)
    if (sp) { this.trail = (this.trail || []).filter(q => rt - q.rt < 420); if (st.sprite === 'glow') this.trail.push({ x: sp.x, y: sp.y, rt }); }
    for (const f of st.fx) if (BACK.has(f[0])) this.drawFx(g, f, st, her, now);
    if (st.bill) this.drawBill(g, st.bill);   // behind her: a long card comes down behind her hair
    if (st.intel) { this.drawIntel(g, st.intel); this.intelHeld = st.intel; }
    // cut off by a bigger show, the card rolls itself up where it hung, as at its own end (it used to vanish)
    else if (this.intelHeld) { this.intelBack = { ...this.intelHeld, at: rt }; this.intelHeld = null; }
    if (this.intelBack) {
      const f = this.intelBack, u = k01((rt - f.at) * this.cfg.speed, 0, INTEL.roll[1] - INTEL.roll[0]);
      if (u >= 1) this.intelBack = null; else this.drawIntel(g, { ...f, reveal: f.reveal * (1 - ease(u)) });
    }
    if (sp && st.sBehind) this.drawSprite(g, st, sp, now);
    if (!st.hide) this.drawHer(g, herSt, now);
    // the hot-pot table in front of her, over her legs; what she holds over it (her drawings at it) over it again
    if (table) { this.drawPopped(g, this.props.table, table); if (table.a) this.redrawHer(g, { x: table.x - table.w / 2, y: table.y - table.h, w: table.w, h: table.h }); }
    if (st.pop) this.drawProp(g, this.props.plush, st.pop.x, st.pop.y, st.pop.s, st.pop.a);   // the plush out of the capsule
    const flying = (f, words) => { g.save(); g.translate(f.x, f.y); g.rotate(f.a); g.scale(f.k, f.k); g.translate(-SIGN.W / 2, -SIGN.H / 2); SIGN.draw(g, words); g.restore(); };
    if (st.signFly && !this.signShown) flying(st.signFly, st.sign || []);
    if (this.signBack) {   // let go of: from where she held it, small, into her sprite
      const f = this.signBack, u = ease(k01((rt - f.at) * this.cfg.speed, 0, PK_SIGN.back)), to = sp || this.home(now);
      if (u >= 1) this.signBack = null; else flying({ x: f.x + (to.x - f.x) * u, y: f.y + (to.y - f.y) * u, a: f.a * (1 - u), k: 1 - 0.85 * u }, f.words);
    }
    if (sp && !st.sBehind && !st.sOver) this.drawSprite(g, st, sp, now);
    if (st.gift) this.drawGift(g, st.gift);
    for (const f of st.fx) if (!BACK.has(f[0])) this.drawFx(g, f, st, her, now);
    if (this.cfg.game) { this.drawGame(g, st, now, her, bub); this.drawBuzzer(g, now); }
    if (sp && st.sOver) this.drawSprite(g, st, sp, now);   // its fists on what the game draws (the chest's lid)
    if (bub) this.drawBubble(g, st.bubble, bub);
    g.restore();
    if (this.cfg.caption) this.drawCaption(g, st, now, px, py);
  }

  cell(name, set = POSE) {
    const f = set === POSE && this.strips?.[name];
    if (f) {
      const s = STRIP[name];
      if (s.ms) return f[Math.floor(this.clock / s.ms) % 4];
      const steps = s.loop || s.once, total = steps.reduce((a, [, ms]) => a + ms, 0);
      let t = s.loop ? this.clock % total : this.clock - (this.hv?.pose === name ? this.hv.since : this.clock);
      for (const [i, ms] of steps) { if (t < ms || !ms) return f[i]; t -= ms; }
      return f[steps.at(-1)[0]];
    }
    const [k, i] = set[name] || [name, 0]; return this.cells[k][i];
  }

  herBox(st, c = this.cell(st.pose)) {
    const k = H / c.ruler * st.s;
    return { x: st.x + (c.x - c.cx) * k, y: st.y + (c.y - c.ground) * k, w: c.w * k, h: c.h * k, k };
  }

  // In-between frames from pose a to pose b: their own strip; else [] where she simply switches (CUT, that direction);
  // else the other way's strip played backwards; null where there are none.
  hop(a, b) {
    const there = this.tweens[`${a}>${b}`], back = this.tweens[`${b}>${a}`];
    return there || (CUT.has(`${a}>${b}`) ? [] : null) || (back && [...back].reverse()) || null;
  }

  // An event can start, or take over a lesser one, whatever she is doing (humming, sitting bored, lying by her bike),
  // and most of those pairs have no in-betweens of their own. So she goes the shortest way through poses that have them
  // (at most five steps; standing is tried first, so it is the usual way through, and a movement played forwards before
  // one played backwards, so after a fall she gets up rather than the fall running back, and never through a change kept
  // to itself, NO_WAY_THROUGH), playing their frames one after another; null where there is no way (then the new pose just
  // comes in).
  route(a, b) {
    const memo = this.routes ??= {}, key = `${a}>${b}`;
    if (key in memo) return memo[key];
    const from = { [a]: null }, forwards = (p, n) => this.tweens[`${p}>${n}`] || CUT.has(`${p}>${n}`);
    const kept = (p, n) => `${p}>${n}` !== key && (NO_WAY_THROUGH.has(`${p}>${n}`) || NO_WAY_THROUGH.has(`${n}>${p}`));
    let ring = [a];
    for (let depth = 0; depth < 5 && ring.length && !(b in from); depth++) {
      const next = [];
      for (const back of [false, true]) for (const p of ring) for (const n of Object.keys(POSE)) {
        if (!(n in from) && this.hop(p, n) && !kept(p, n) && !forwards(p, n) === back) { from[n] = p; next.push(n); }
      }
      ring = next;
    }
    if (!(b in from)) return memo[key] = null;
    const path = [b];
    while (path[0] !== a) path.unshift(from[path[0]]);
    return memo[key] = path.slice(1).flatMap((m, i) => this.hop(path[i], m));
  }

  // A pose change is one movement, not a cut: she moves through in-between frames, the pair's own or a way through
  // others (route); where she simply switches (CUT) or there is no way at all, the new pose just comes in.
  drawHer(g, st, now) {
    const rt = performance.now(), el = t0 => (rt - t0) * this.cfg.speed;
    const hv = this.hv ??= { pose: st.pose, at: -1e9, since: this.clock, tween: null, fromX: st.x, fromY: st.y };
    if (st.pose !== hv.pose) Object.assign(hv, { tween: this.route(hv.pose, st.pose), ms: SLOW[`${hv.pose}>${st.pose}`] || 90, pose: st.pose, at: rt, since: this.clock, fromX: hv.x ?? st.x, fromY: hv.y ?? st.y });
    // she breathes in every pose, in-between frames too (breathing that stopped when she left her idle pose made her head
    // jump up to 3 px at the change): her drawing scaled at her feet, a touch taller and narrower, then shorter and wider
    // (SLOW may give each frame its own time: [frame 2, frame 3], then 90 ms for any further frames of a route)
    const e = el(hv.at), i = Array.isArray(hv.ms) ? (() => { let n = 0, acc = 0; while (e >= acc + (hv.ms[n] ?? 90)) acc += hv.ms[n++] ?? 90; return n; })() : Math.floor(e / (hv.ms || 90));
    const s = 1 + 0.012 * Math.sin(now / 600), c = hv.tween?.[i] || this.cell(hv.pose);
    // In the chest game her place goes with her pose (her fists on the ring, wherever each drawing has them): through the
    // in-betweens she moves from where the earlier pose stood to the later one's, a share at each frame (st.slide), not
    // all at once on the first of them.
    const slid = st.slide && hv.tween?.[i] ? 1 - (i + 1) / (hv.tween.length + 1) : 0;   // (the 火锅: down behind the table, she moves back too)
    const x = st.x + (hv.fromX - st.x) * slid, y = st.y + (hv.fromY - st.y) * slid, b = this.herBox({ ...st, x, y }, c);
    hv.x = st.x; hv.y = st.y;
    g.save(); g.translate(x, y); g.scale(st.sx / Math.sqrt(s), s); g.translate(-x, -y);
    g.drawImage(c.im, c.x, c.y, c.w, c.h, b.x, b.y, b.w, b.h);
    this.drawn = { c, b, x, y, sx: st.sx / Math.sqrt(s), sy: s };
    // her PK sign keeps its words while she lets it go, whatever made her (her show's end, a bigger show cutting in on
    // the in-betweens), and once it is out of her hands it flies back into her sprite (frame: signBack)
    this.signShown = !!c.sign;
    if (c.sign) { const words = this.signWords = st.sign || this.signWords || []; this.drawSignOn(g, c, b, words); this.signHeld = { ...this.signSpot({ ...st, x }, c), words }; }
    else if (this.signHeld) { if (!st.signFly) this.signBack = { ...this.signHeld, at: rt }; this.signHeld = null; }   // (signFly: her show carries it on)
    g.restore();
  }

  // Her drawing as drawHer last drew it, again, only inside rect, if it is one of hers at the hot-pot table (AT_PROP): cut out
  // above the tabletop, what of it lies on the table is what she holds over it (the chopsticks in the pot, her bowl).
  redrawHer(g, rect) {
    const d = this.drawn;
    if (d?.c.prop !== 'table') return;
    g.save(); g.beginPath(); g.rect(rect.x, rect.y, rect.w, rect.h); g.clip();
    g.translate(d.x, d.y); g.scale(d.sx, d.sy); g.translate(-d.x, -d.y);
    g.drawImage(d.c.im, d.c.x, d.c.y, d.c.w, d.c.h, d.b.x, d.b.y, d.b.w, d.b.h); g.restore();
  }

  // A prop the sprite brings and takes away (popped): drawn with its alpha a and scale s about its bottom middle (x, y).
  drawPopped(g, im, c) {
    if (!c.a) return;

  // st.sp: null (home), ['home', dx, dy] (home moved by), ['rel', fx, fy] (a point of her drawing's box, as fractions of
  // it), ['at', x, y] (a page point), ['tossed', hop] (over her head, hopping by hop of her height, and above bub, her

    // It is a little bigger on the near half, and drawSprite turns it by st.orbitA.
    // It joins the circle where it is and goes round from there (README 1.1): when a circle starts, its angle is the one of
    // its own place, on the near half in front of her; and when the circle's clock jumps (a show handing over to the happy

  // Her speech bubble's lines and box: over her head, or, where that runs off the top of the page (her on the 总督's deck, a
  // long nickname), beside her face on her roomier side from her eye line, clear of her hat and the emblem. One at a point
  // (the castle's gate) stays over it. side: 0 over her, 1 on her right, -1 on her left. Whether it fits over her head goes

  }

  // An impact shakes the whole corner for a moment, harder for bigger moments (st.shake: [from, px, ms]).

      const u = (st._t ?? now) - from;

    }

    const ask = (result, period, spend, profit) => () => {
      const opts = { result, period, spend, profit };
      this.note('弹幕：' + BILL.danmaku(this.billOf(opts, ''))); this.fire('盲盒查询', opts);
    };
    group('盲盒查询', [['今日·赚', ask('赚', '今日', 15, 4.5)], ['今日·回本', ask('回本', '今日', 15, 0)], ['今日·亏', ask('亏', '今日', 45, -12.5)],
      ['今日·没有记录', ask('没有记录', '今日')], ['本月·赚（大数字）', ask('赚', '本月', 131452, 8888.8)], ['今年·亏（大数字）', ask('亏', '今年', 1314520, -987654.3)]]);
    // B站 PK (README 15): the 对手情报卡 for each of lib/pk-intel.js's cases; one B站 answered nothing for is not shown
    const intel = c => () => { const L = PK_INTEL.layout(this.measureG ??= document.createElement('canvas').getContext('2d'), c);
      if (!L.front && !L.back) return this.note('PK·对手：什么都没查到，不演'); this.fire('PK·对手', { intel: c }); };
    group('PK 对手', [...Object.entries(PK_INTEL.SAMPLES).map(([k, c]) => [k, intel(c)]), ['什么都没查到', intel({ name: '星星点灯' })]]);
    group('整场 PK', [['快进（约 93 秒）', () => this.pkDemoStart(true)], ['真实时间（5 分 25 秒）', () => this.pkDemoStart(false)], ['停', () => { this.pkDemo = null; this.pkOn(false); this.note('整场 PK 停了'); }]]);
    group('PK 双倍挑战', [['挑战成功', () => this.fire('PK·挑战', { result: '成功' })], ['挑战失败', () => this.fire('PK·挑战', { result: '失败' })]]);
    // B站 PK's score while it is on: move it and see what she does (PK_GAP; 20 s between shows), or play each show
    const move = (o, t) => () => { if (!this.gm.pk) this.pkOn(true); const s = this.pkGap || PK_GAP.stand(0, 0); this.pkScore(Math.max(0, s.ours + o), Math.max(0, s.theirs + t)); };
    group('PK 比分', [['PK 开始（0 : 0）', () => { this.pkOn(true); this.pkGap = null; this.pkGapAt = null; this.note('PK 开始，比分 0 : 0'); }],
      ['我们 +300', move(300, 0)], ['对面 +300', move(0, 300)], ['我们 +3000', move(3000, 0)], ['对面 +3000', move(0, 3000)],
      ...EVENTS['PK·比分'].results.map(r => [`直接演：${r}`, () => this.fire('PK·比分', { result: r })])]);
    // B站 PK's result, each ending with a score that gives it; the ending is worked out from the score (PK_RESULT.of)
    group('PK 结果', Object.entries(PK_RESULT.samples).map(([k, [ours, theirs]]) => [`${k}（${ours} : ${theirs}）`, () => {
      const result = PK_RESULT.of(ours, theirs); this.note(`PK 结果：我们 ${ours} : 对面 ${theirs} → ${result}`); this.pkOn(false); this.pkGap = null; this.fire('PK·结果', { result, ours, theirs });
    }]));
    // B站 PK (README 15): her sign shows, each by itself; 双倍条件 with B站's own words (差10票翻倍, 差1人翻倍)
    group('PK 举牌', [['双倍条件·差10票', () => this.fire('PK·双倍条件', { text: '差10票翻倍' })], ['双倍条件·差1人', () => this.fire('PK·双倍条件', { text: '差1人翻倍' })],
      ['2倍加成中', () => this.fire('PK·2倍')], ['双倍还剩10秒', () => this.fire('PK·双倍还剩10秒', { left: 10000 })], ['最后10秒', () => this.fire('PK·最后10秒', { left: 10000 })]]);
    group('抽奖', [['报名开场', f('报名开场')], ['报名截止', f('报名截止')], ['奖池开场', f('奖池开场')], ['奖池点名', f('奖池点名')], ['奖池转动', f('奖池转动')],
      ['揭晓·大奖', f('揭晓·大奖')], ['揭晓·二奖', f('揭晓·二奖')], ['揭晓·三奖', f('揭晓·三奖')], ['没人报名', f('没人报名')], ['抽奖结束', f('抽奖结束')]]);
    const d = (kind, mishap) => () => this.fire('日常', { kind, mishap });
    group('日常', [['举哑铃', d('举哑铃', false)], ['砸到脚', d('举哑铃', true)], ['哼歌', d('哼歌', false)], ['破音', d('哼歌', true)],
      ['爬山', d('爬山', false)], ['摔屁股墩', d('爬山', true)], ['骑车', d('骑车', false)], ['骑车摔倒', d('骑车', true)],
      ['滑雪', d('滑雪', false)], ['滑雪摔跤', d('滑雪', true)], ['扭蛋', d('扭蛋', false)], ['扭蛋落空', d('扭蛋', true)],
      ['火锅', d('火锅', false)], ['火锅辣到', d('火锅', true)], ['手游', d('手游', false)], ['手游砸脸', d('手游', true)]]);
    // the cos daily (#418): each costume and its ending
    const dc = (costume, mishap) => () => this.fire('日常', { kind: 'cos', costume, mishap });
    group('cos', Object.keys(COS).flatMap(c => [[c, dc(c, false)], [c + '·出事', dc(c, true)]]));
    group('时间', [['快进 10 分钟', () => this.fastForward(10)], ['快进 30 分钟', () => this.fastForward(30)], ['回到刚有礼物', () => { this.lastGift = this.lastAny = this.now(); }]]);
    // the chest game (the board's game 开): the prankster comes at once; a danmaku and the gifts are the 事件 group's buttons
    // a 人气票 or 小花花 comes from one of the board's viewers, rather one on no side yet, so the avatars fill up; a danmaku
    // from one on no side (called out), one that says 1 or 2, or one already on a side (a paper ball)
    const side = (gift, n) => () => this.give([{ gift, price: 1, n, viewer: this.someone() }]), dm = (on, said) => () => this.heard(this.someone(on), said);
    // ×520 is a 秒杀 whatever the chest (each end is 300 to 500 票 away); the last stretch is a jump of
    // the fight's own clock to 10 s left, to see the dragging, the 0:00 wait and a 绝杀 without waiting the minute out
    const last10 = () => { const v = this.gm.visit; if (v?.phase === 'tug' && v.judge == null) v.left = Math.min(v.left, GAME.sprint + 400); };
    group('小游戏', [['捣蛋鬼来了', () => this.visit()], ['人气票', side('人气票', 1)], ['人气票 ×10', side('人气票', 10)], ['人气票 ×520', side('人气票', 520)],
      ['小花花', side('小花花', 1)], ['小花花 ×5', side('小花花', 5)], ['小花花 ×520', side('小花花', 520)], ['跳到最后 10 秒', last10],
      ['路人发弹幕', dm(false)], ['发「1」', dm(null, '1')], ['发「2」', dm(null, '2')], ['站了队的发弹幕', dm(true)], ['红方丢幸运纸团', () => this.lucky(1)], ['蓝方丢幸运纸团', () => this.lucky(-1)],
      ['别的礼物 100 电池', g([one('爱心抱枕', 100)])], ['别的礼物到中礼物', g([one('告白气球', 2000)])], ['PK 开始', () => this.pkOn(true)], ['PK 结束', () => this.pkOn(false)]]);
    const fit = () => { const r = document.getElementById('root'); if (r) r.style.zoom = Math.min(innerWidth / 1920, (innerHeight - bar.offsetHeight) / 1080); };
    addEventListener('resize', fit); setTimeout(fit, 50);
  }
}
</script>
