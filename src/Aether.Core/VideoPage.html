<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aether 视频页</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
video { width: 100%; height: 100%; object-fit: contain; visibility: hidden; }
</style>
<video playsinline></video>
<script>
const video = document.querySelector('video');
let active;
function clear() {
  if (!active) return;
  active.abort.abort();
  video.pause();
  video.removeAttribute('src');
  video.load();
  video.style.visibility = 'hidden';
  if (active.url) URL.revokeObjectURL(active.url);
  active = undefined;
}
async function finish(item, success, reason) {
  if (active !== item) return;
  clear();
  try {
    await fetch('/video/report', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: item.id, success, reason })
    });
  } catch { /* SSE reconnects; Core also expires an unreported playback. */ }
}
video.addEventListener('ended', () => { if (active) finish(active, true); });
video.addEventListener('error', () => {
  if (active) finish(active, false, '视频无法播放，请换成 H.264 编码的 MP4 或 VP9 WebM');
});
const events = new EventSource('/video/events');
events.onerror = clear;
events.onmessage = async event => {
  clear();
  const item = { ...JSON.parse(event.data), abort: new AbortController() };
  active = item;
  try {
    const response = await fetch('/video/files/' + item.id, { signal: item.abort.signal });
    if (!response.ok) throw new Error('视频读取失败：HTTP ' + response.status);
    const blob = await response.blob();
    if (active !== item) return;
    item.url = URL.createObjectURL(blob);
    video.src = item.url;
    await video.play();
    if (active === item) video.style.visibility = 'visible';
  } catch (error) {
    if (active === item) finish(item, false, String(error.message).slice(0, 300));
  }
};
</script>
</html>
