<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aether 抽奖页</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/lottery/style.css">
  <link rel="stylesheet" href="/lottery/mecha.css">
  <link rel="stylesheet" href="/lottery/gacha.css">
  <script src="/lottery/page.js" defer></script>
</head>
<body>
<main id="scene" data-theme="StarSummon" hidden>
  <section id="registration" hidden>
    <h1 id="registrationTitle"><span id="themeTitle" class="gold">星辰召唤</span><span id="registrationPhase">报名中</span></h1>
    <div id="entryBar">
      <div class="condition"><span id="joinLabel" class="label">召唤条件</span><span id="keyword"></span></div>
      <span class="divider"></span>
      <div id="entryCounter" class="count"><span id="capsuleDrop" aria-hidden="true"></span><span id="entryCount" class="gold"></span><span id="countLabel" class="countLabel">位召唤师已报名</span></div>
      <span class="divider"></span>
      <div class="latest"><span id="latestLabel" class="label">刚刚加入</span><div id="latestEntries"></div></div>
    </div>
    <aside id="awards"><div id="awardsTitle" class="gold">奖品</div><div id="awardRows"></div></aside>
  </section>
  <section id="summon" hidden>
    <div class="sky"></div>
    <div class="gachaSun gachaEffect" aria-hidden="true"></div>
    <div id="gachaMachine" aria-hidden="true">
      <div class="dome"><div id="capsules"></div></div><div class="neck"></div>
      <div class="machineBody"><div id="machineLabel"><span class="idle">等你来扭</span><span class="busy">扭扭扭…</span></div><div class="crank"></div><div class="coinSlot"></div><div class="outlet"></div></div>
      <div class="foot left"></div><div class="foot right"></div>
      <svg class="gachaStar" width="64" height="64" viewBox="0 0 24 24"><path d="M12 2l2.6 6.2 6.7.6-5.1 4.4 1.6 6.6L12 16.3l-5.8 3.5 1.6-6.6-5.1-4.4 6.7-.6z" fill="#ffd45e" stroke="#4b2a4f" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg class="gachaHeart" width="50" height="50" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.7 3 5 6.6 5c2.2 0 3.6 1.3 5.4 3.3C13.8 6.3 15.2 5 17.4 5 21 5 22.8 8.7 21.5 11.8 19.5 16.4 12 21 12 21z" fill="#ff7aae" stroke="#4b2a4f" stroke-width="1.6"/></svg>
    </div>
    <div class="mechaAlert" aria-hidden="true"></div>
    <svg class="mechaHud mechaEffect" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width=".6"><circle cx="100" cy="100" r="98" stroke-dasharray="1 3"/><circle cx="100" cy="100" r="74"/><circle cx="100" cy="100" r="50" stroke-dasharray="6 3"/><path d="M100 2v14M100 184v14M2 100h14M184 100h14M30.7 30.7l8 8M169.3 30.7l-8 8M30.7 169.3l8-8M169.3 169.3l-8-8"/></g>
    </svg>
    <div class="mechaRadar mechaEffect" aria-hidden="true"></div>
    <span class="mechaPulse mechaEffect" aria-hidden="true"></span><span class="mechaPulse echo mechaEffect" aria-hidden="true"></span>
    <div class="hazards"><div class="hazard top"><span id="warning"></span></div><div class="hazard bottom" aria-hidden="true"></div></div>
    <div class="circleSpace" aria-hidden="true"><div class="circlePlane">
      <svg class="circle" viewBox="0 0 400 400" width="900" height="900">
        <g fill="none" stroke="currentColor" stroke-width="2.4">
          <circle cx="200" cy="200" r="192"/><circle cx="200" cy="200" r="180" stroke-dasharray="3 7"/>
          <circle cx="200" cy="200" r="134"/><polygon points="200,66 316,267 84,267"/>
          <polygon points="200,334 84,133 316,133"/><circle cx="200" cy="200" r="46"/>
        </g>
      </svg>
      <svg class="circle reverse" viewBox="0 0 400 400" width="900" height="900">
        <g fill="none" stroke="currentColor" stroke-width="1.6" opacity=".7">
          <circle cx="200" cy="200" r="158" stroke-dasharray="18 10 4 10"/><circle cx="200" cy="200" r="88" stroke-dasharray="2 6"/>
        </g>
      </svg>
      <span class="shock effect"></span>
    </div></div>
    <div class="pillar effect" aria-hidden="true"></div><div class="rays effect" aria-hidden="true"></div>
    <div class="glow effect" aria-hidden="true"></div>
    <div class="focusLines starEffect" aria-hidden="true"></div>
    <span class="starRing starEffect" aria-hidden="true"></span><span class="starRing echo starEffect" aria-hidden="true"></span>
    <svg class="aura starEffect" viewBox="0 0 400 400" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="200" cy="200" r="196"/><circle cx="200" cy="200" r="184" stroke-dasharray="2 8"/><circle cx="200" cy="200" r="150"/>
        <polygon points="200,52 328,274 72,274"/><polygon points="200,348 72,126 328,126"/><circle cx="200" cy="200" r="118" stroke-dasharray="14 6 3 6"/>
      </g>
    </svg>
    <!-- Transparent video effects can be inserted here later, behind the cards. -->
    <div id="videoEffects" hidden></div>
    <canvas id="particles" width="1920" height="1080" aria-hidden="true"></canvas>
    <!-- The foreground shakes on a hit; the backdrop and canvas stay put. -->
    <div class="stage">
    <div class="gachaBall effect" aria-hidden="true"></div><div class="gachaRainbow effect" aria-hidden="true"></div>
    <div class="gachaBeams gachaEffect" aria-hidden="true"></div>
    <span class="gachaRing gachaEffect" aria-hidden="true"></span><span class="gachaRing echo gachaEffect" aria-hidden="true"></span>
    <div class="gachaGlow gachaEffect" aria-hidden="true"></div>
    <div class="gachaHalves effect" aria-hidden="true"><span></span><span></span></div>
    <div id="ringWrap"><div id="ring"></div><div class="lockFrame effect" aria-hidden="true"></div></div>
    <div id="banner" class="effect"></div>
    <div class="meteor effect" aria-hidden="true"></div>
    <div class="mechaReticleClip" aria-hidden="true"><svg class="reticle" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-width=".8"><circle cx="100" cy="100" r="96" stroke-dasharray="2 4"/><circle cx="100" cy="100" r="84"/><path d="M100 0v18M100 182v18M0 100h18M182 100h18"/></g>
      <g fill="none" stroke="#fff" stroke-width="1.2"><path d="M100 10a90 90 0 0 1 66 29M100 190a90 90 0 0 1-66-29"/></g>
    </svg></div>
    <div class="mechaLines mechaEffect" aria-hidden="true"></div>
    <div class="mechaClamp mechaEffect" aria-hidden="true"><i></i><i></i><i></i><i></i><span>TARGET LOCKED</span></div>
    <div id="result" class="effect" aria-live="polite">
      <div class="flip">
        <div class="cardBack">
          <svg width="240" height="240" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.7" aria-hidden="true">
            <circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="12" r="8" stroke-dasharray="0.6 1"/>
            <path d="M12 3.5l2 6.2h6.4l-5.2 3.8 2 6.1L12 15.8l-5.2 3.8 2-6.1-5.2-3.8H10z"/>
          </svg>
        </div>
        <div class="cardFace">
          <span class="mechaBeam mechaEffect" aria-hidden="true"></span>
          <div class="cardTop"><div id="rank" class="rank"></div><div id="stars" aria-hidden="true"></div></div>
          <div id="prize"></div><div id="viewer"></div>
        </div>
      </div>
    </div>
    <div class="gachaSparkles gachaEffect" aria-hidden="true">
      <svg viewBox="0 0 24 24"><defs><path id="gachaSparkleShape" d="M12 1.5c.9 5.3 3.2 7.6 8.5 8.5-5.3.9-7.6 3.2-8.5 8.5-.9-5.3-3.2-7.6-8.5-8.5 5.3-.9 7.6-3.2 8.5-8.5z"/></defs><use href="#gachaSparkleShape"/></svg>
      <svg viewBox="0 0 24 24"><use href="#gachaSparkleShape"/></svg>
      <svg viewBox="0 0 24 24"><use href="#gachaSparkleShape"/></svg>
      <svg viewBox="0 0 24 24"><use href="#gachaSparkleShape"/></svg>
      <svg viewBox="0 0 24 24"><use href="#gachaSparkleShape"/></svg>
    </div>
    <div class="gachaPopSticker gachaEffect" aria-hidden="true"></div>
    <div id="shout" class="gold effect"></div>
    <div class="flash effect" aria-hidden="true"></div>
    </div>
  </section>
  <section id="winners" hidden>
    <h1 id="winnerTitle" class="gold"></h1><div id="winnerCards"></div>
    <div id="remaining"></div><div id="pageNumber"></div>
  </section>
</main>
</body>
</html>
